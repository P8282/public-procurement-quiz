  // 두 기록을 문제 단위로 합친다(데이터 손실 방지). 같은 문제를 양쪽 다 풀었으면 로컬(이 기기) 것을 우선한다.
  // - 앱을 열 때마다 자동으로 실행되는 "조용한" 동기화라, 사용자에게 매번 물어보지 않고 안전하게 합치는 방식을 쓴다.
  // todayCount({date,total,num,weak,review}) 병합 전용 헬퍼. 같은 날짜면 필드별로 더 큰 값을,
  // 다르면 더 최근 날짜의 기록 전체를 채택한다(다른 날짜 값끼리 필드별로 섞으면 의미가 없으므로).
  function mergeTodayCount(a, b){
    const empty = { date: null, total: 0, num: 0, weak: 0, review: 0 };
    a = a || empty; b = b || empty;
    if(a.date === b.date){
      return {
        date: a.date,
        total: Math.max(a.total||0, b.total||0),
        num: Math.max(a.num||0, b.num||0),
        weak: Math.max(a.weak||0, b.weak||0),
        review: Math.max(a.review||0, b.review||0),
      };
    }
    if(!a.date) return b;
    if(!b.date) return a;
    return (a.date > b.date) ? a : b;
  }

  function mergeProgressData(local, cloud){
    const merged = {
      progress: {}, reviewCounts: {}, excluded: {}, wrongMastery: { pool:{}, streak:{} }, myReports: {}, bestAnswered: {}, roundArmed: {}, questionReviewCounts: {},
      questionCorrectCounts: {}, manualWeak: {}
    };
    const chapterKeys = new Set([...Object.keys(local.progress||{}), ...Object.keys(cloud.progress||{})]);
    chapterKeys.forEach(key=>{
      merged.progress[key] = Object.assign({}, cloud.progress && cloud.progress[key], local.progress && local.progress[key]);
    });
    const rcKeys = new Set([...Object.keys(local.reviewCounts||{}), ...Object.keys(cloud.reviewCounts||{})]);
    rcKeys.forEach(key=>{
      merged.reviewCounts[key] = Math.max((local.reviewCounts||{})[key]||0, (cloud.reviewCounts||{})[key]||0);
    });
    // 숫자 뽀개기 전체 회독수는 챕터별이 아닌 단일 값이라 그냥 더 큰 쪽을 채택한다.
    merged.numReviewRound = Math.max(local.numReviewRound||0, cloud.numReviewRound||0);
    // 오늘 학습 카운트: 날짜가 같으면 더 큰 값을, 다르면(기기 간 자정 넘김 등) 더 최근 날짜 쪽을 채택한다.
    merged.todayCount = mergeTodayCount(local.todayCount, cloud.todayCount);
    const baKeys = new Set([...Object.keys(local.bestAnswered||{}), ...Object.keys(cloud.bestAnswered||{})]);
    baKeys.forEach(key=>{
      merged.bestAnswered[key] = Math.max((local.bestAnswered||{})[key]||0, (cloud.bestAnswered||{})[key]||0);
    });
    // 문제별 누적 풀이 횟수: 챕터>문제 2단계 구조라, 각 문제마다 둘 중 더 큰 값을 취한다.
    const qrcChapterKeys = new Set([...Object.keys(local.questionReviewCounts||{}), ...Object.keys(cloud.questionReviewCounts||{})]);
    qrcChapterKeys.forEach(ckey=>{
      const localCh = (local.questionReviewCounts||{})[ckey] || {};
      const cloudCh = (cloud.questionReviewCounts||{})[ckey] || {};
      const qIdxKeys = new Set([...Object.keys(localCh), ...Object.keys(cloudCh)]);
      merged.questionReviewCounts[ckey] = {};
      qIdxKeys.forEach(qidx=>{
        merged.questionReviewCounts[ckey][qidx] = Math.max(localCh[qidx]||0, cloudCh[qidx]||0);
      });
    });
    // 문제별 누적 정답 횟수: questionReviewCounts와 동일한 2단계 구조·동일한 병합 방식(더 큰 값 채택).
    const qccChapterKeys = new Set([...Object.keys(local.questionCorrectCounts||{}), ...Object.keys(cloud.questionCorrectCounts||{})]);
    qccChapterKeys.forEach(ckey=>{
      const localCh = (local.questionCorrectCounts||{})[ckey] || {};
      const cloudCh = (cloud.questionCorrectCounts||{})[ckey] || {};
      const qIdxKeys = new Set([...Object.keys(localCh), ...Object.keys(cloudCh)]);
      merged.questionCorrectCounts[ckey] = {};
      qIdxKeys.forEach(qidx=>{
        merged.questionCorrectCounts[ckey][qidx] = Math.max(localCh[qidx]||0, cloudCh[qidx]||0);
      });
    });
    // 수동 취약 지정: 명시적으로 true/false를 저장해두었으므로(키를 지우지 않음),
    // 어느 한쪽이라도 true면 취약으로 본다(roundArmed의 "소진되면 소진" 원칙과 같은 안전 우선 방향 - 지정 자체가
    // 사용자의 명시적 의사표시라 함부로 무시하지 않되, 양쪽 다 false로 확정된 경우에만 해제로 합쳐진다).
    const mwChapterKeys = new Set([...Object.keys(local.manualWeak||{}), ...Object.keys(cloud.manualWeak||{})]);
    mwChapterKeys.forEach(ckey=>{
      const localCh = (local.manualWeak||{})[ckey] || {};
      const cloudCh = (cloud.manualWeak||{})[ckey] || {};
      const qIdxKeys = new Set([...Object.keys(localCh), ...Object.keys(cloudCh)]);
      merged.manualWeak[ckey] = {};
      qIdxKeys.forEach(qidx=>{
        merged.manualWeak[ckey][qidx] = !!(localCh[qidx] || cloudCh[qidx]);
      });
    });
    // 회독 자격: 어느 한쪽이라도 "소진(false)"이면 소진된 것으로 본다(이미 실제로 완주가 일어났다는 뜻이라 안전 우선).
    // 그게 아니고 어느 한쪽이 명시적으로 true(막 재충전됨)면 true. 둘 다 기록이 없으면 그대로 비워둬서
    // isRoundArmed()의 기본 판단(회독수 0일 때만 자격 있음)에 맡긴다.
    const raKeys = new Set([...Object.keys(local.roundArmed||{}), ...Object.keys(cloud.roundArmed||{})]);
    raKeys.forEach(key=>{
      const lv = (local.roundArmed||{})[key], cv = (cloud.roundArmed||{})[key];
      if(lv === false || cv === false) merged.roundArmed[key] = false;
      else if(lv === true || cv === true) merged.roundArmed[key] = true;
    });
    const exKeys = new Set([...Object.keys(local.excluded||{}), ...Object.keys(cloud.excluded||{})]);
    exKeys.forEach(key=>{
      merged.excluded[key] = Object.assign({}, cloud.excluded && cloud.excluded[key], local.excluded && local.excluded[key]);
    });
    const poolKeys = new Set([...Object.keys((local.wrongMastery||{}).pool||{}), ...Object.keys((cloud.wrongMastery||{}).pool||{})]);
    poolKeys.forEach(key=>{
      merged.wrongMastery.pool[key] = Object.assign({}, (cloud.wrongMastery||{}).pool && (cloud.wrongMastery||{}).pool[key], (local.wrongMastery||{}).pool && (local.wrongMastery||{}).pool[key]);
    });
    const streakKeys = new Set([...Object.keys((local.wrongMastery||{}).streak||{}), ...Object.keys((cloud.wrongMastery||{}).streak||{})]);
    streakKeys.forEach(key=>{
      merged.wrongMastery.streak[key] = Object.assign({}, (cloud.wrongMastery||{}).streak && (cloud.wrongMastery||{}).streak[key], (local.wrongMastery||{}).streak && (local.wrongMastery||{}).streak[key]);
    });
    // 신고 내역은 각자 고유 ID라 그냥 합집합(둘 다 유지) - 어느 한쪽에서 삭제된 건 자연히 그쪽엔 없으므로 상대쪽 값이 살아남을 수 있는데,
    // 이는 "신고 삭제"가 애초에 그 코드를 쓰는 모든 기기에 공통 적용되는 개념(같은 클라우드 필드)이라 실제로는 문제되지 않는다.
    const reportKeys = new Set([...Object.keys(local.myReports||{}), ...Object.keys(cloud.myReports||{})]);
    reportKeys.forEach(id=>{
      merged.myReports[id] = (cloud.myReports && cloud.myReports[id]) || (local.myReports && local.myReports[id]);
    });
    return merged;
  }

  function totalAnsweredOf(data){
    return Object.values(data.progress||{}).reduce((sum,ch)=> sum + Object.keys(ch).length, 0);
  }

  // 현재 기록을 클라우드에 올린다(문제 풀 때마다, 1회독 완료 시 호출됨). 코드가 연결 안 돼 있으면 아무것도 안 한다.
  // Cloudflare Worker의 /sync/push가 서버 쪽에서 devices 맵 안 이 기기 항목만 정확히 병합해준다(다른 기기 기록 유지).
  async function syncPush(){
    if(!syncEnabled() || !state.syncCode) return;
    try{
      const devId = await getDeviceId();
      const payload = collectLocalData();
      await cfPostJson(`${CF_API_BASE}/sync/push?code=${encodeURIComponent(state.syncCode)}`, {
        deviceId: devId, deviceType: deviceTypeLabel(), payload
      });
    }catch(e){ /* 오프라인 등으로 실패해도 기기 저장은 이미 됐으므로 조용히 넘어간다 */ }
  }

  // 동기화 연결을 끊는다("로그아웃"에 해당). 클라우드의 기록은 그대로 남아있고, 이 기기에서만 연결이 해제된다.
  async function stopSync(){
    if(!confirm('동기화를 해제할까요?\n이 기기의 학습기록은 그대로 남아있고, 코드를 다시 입력하면 언제든 재연결할 수 있습니다.')) return;
    // 이 기기 항목을 devices 맵에서 삭제해서, 기기 수 제한(5대)에 자리를 비워준다.
    if(syncEnabled() && state.syncCode){
      try{
        const devId = await getDeviceId();
        await cfPostJson(`${CF_API_BASE}/sync/logout?code=${encodeURIComponent(state.syncCode)}`, { deviceId: devId });
      }catch(e){ /* 실패해도 로그아웃 자체는 진행 - 다음에 다시 시도될 수 있음 */ }
    }
    state.syncCode = null;
    await window.storage.set('sync-code', '');
    render();
  }

  // 앱을 열 때마다(코드가 이미 연결된 상태라면) 자동으로 클라우드와 조용히 병합한다.
  async function syncPullOnOpen(){
    if(!syncEnabled() || !state.syncCode) return;
    try{
      const res = await cfFetchWithRetry(`${CF_API_BASE}/sync/pull?code=${encodeURIComponent(state.syncCode)}`);
      const cloudData = res && res.data;
      if(cloudData && Object.keys(cloudData).length){
        const merged = mergeProgressData(collectLocalData(), cloudData);
        applyCloudData(merged);
        await syncPush(); // 합친 결과를 다시 클라우드에도 반영
        if(state.view==='home') render(true);
      }
    }catch(e){ /* 오프라인이면 조용히 무시 */ }
  }

  // ====== 문제 오류 신고 ======
  // 2중 저장: ① reports 컬렉션(관리자용, 개인이 못 건드림) ② syncCodes/{내코드}.myReports(개인용, 삭제 가능)
  // 개인이 자기 기록에서 삭제해도 ①은 그대로 남아 관리자는 계속 볼 수 있다.

  function openReportModal(chapterKey, questionIndex, questionText){
    const overlay = document.createElement('div');
    overlay.id = 'reportOverlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(20,18,12,.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;';
    overlay.innerHTML = `
      <div style="background:var(--card);border-radius:16px;padding:20px;max-width:360px;width:100%;">
        <div style="font-weight:800;font-size:15px;color:var(--navy);margin-bottom:10px;">🚩 문제 오류 신고</div>
        <div style="font-size:12px;color:var(--ink-soft);margin-bottom:12px;line-height:1.6;">어떤 부분이 잘못됐는지 적어주세요.<br>(정답 오류, 오탈자, 해설 오류 등)</div>
        <textarea id="reportContentInput" rows="4" placeholder="예: 정답이 3번인데 2번으로 표시돼요"
          style="width:100%;padding:11px;border:1.4px solid var(--line-strong);border-radius:9px;font-size:13.5px;font-family:inherit;resize:vertical;box-sizing:border-box;margin-bottom:12px;background:var(--paper);color:var(--ink);"></textarea>
        <div style="display:flex;gap:8px;">
          <button id="reportCancelBtn" class="nav-btn" style="flex:1;">취소</button>
          <button id="reportSubmitBtn" class="nav-btn primary" style="flex:1;">제출</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const close = ()=> overlay.remove();
    overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });
    document.getElementById('reportCancelBtn').onclick = close;
    document.getElementById('reportSubmitBtn').onclick = async ()=>{
      const content = document.getElementById('reportContentInput').value.trim();
      if(!content){ alert('신고 내용을 입력해주세요.'); return; }
      await submitReport(chapterKey, questionIndex, questionText, content);
      close();
      alert('신고가 접수됐습니다. 감사합니다!');
    };
  }

  // 서버(/sync/report)가 reportId 발급, 관리자용 마스터 기록, 개인용 myReports 반영까지 한 번에 처리한다.
  async function submitReport(chapterKey, questionIndex, questionText, content){
    if(!syncEnabled() || !state.syncCode){
      alert('신고 기능을 사용하려면 동기화 코드가 필요합니다.');
      return;
    }
    try{
      const res = await cfPostJson(`${CF_API_BASE}/sync/report?code=${encodeURIComponent(state.syncCode)}`, {
        chapterKey, questionIndex, questionText: questionText || '', content
      });
      const reportId = res && res.reportId;
      const payload = {
        syncCode: state.syncCode,
        chapterKey, questionIndex, questionText: questionText || '',
        content, createdAt: Date.now(), status: 'open'
      };
      state.myReports = state.myReports || {};
      if(reportId) state.myReports[reportId] = payload;
    }catch(e){
      alert('신고 접수에 실패했습니다. 인터넷 연결을 확인해주세요.');
    }
  }

  // 개인 기록에서만 삭제(관리자 쪽 reports 컬렉션은 그대로 남음)
  async function deleteMyReport(reportId){
    if(!confirm('이 신고 내역을 내 목록에서 삭제할까요?\n(관리자에게 전달된 신고 자체는 계속 유지됩니다)')) return;
    try{
      await cfPostJson(`${CF_API_BASE}/sync/report/delete?code=${encodeURIComponent(state.syncCode)}`, { reportId });
      if(state.myReports) delete state.myReports[reportId];
      render(true);
    }catch(e){
      alert('삭제에 실패했습니다.');
    }
  }

  function myReportCount(){
    return state.myReports ? Object.keys(state.myReports).length : 0;
  }

  // 신고했던 그 문제로 바로 이동해서 다시 풀어볼 수 있게 한다.
  function goToReportedQuestion(chapterKey, questionIndex){
    if(!QUIZ[chapterKey] || !QUIZ[chapterKey][questionIndex]){
      alert('이 문제를 찾을 수 없습니다. (삭제되었거나 순서가 바뀌었을 수 있어요)');
      return;
    }
    closeMyReportsView();
    openChapter(chapterKey, false, [questionIndex], null);
  }

  // "내가 신고한 오류 모아보기" — admin 모아보기와 같은 방식으로, 한 번에 하나씩
  // 문제/보기(정답 표시)/해설/내 신고내용을 함께 보여주며 이전·다음으로 넘겨본다.
  let myReportsList = [];   // [ [reportId, reportObj], ... ] — 열 때 한 번 스냅샷
  let myReportsIndex = 0;

  function openMyReportsModal(){
    myReportsList = Object.entries(state.myReports || {}).sort((a,b)=> (b[1].createdAt||0) - (a[1].createdAt||0));
    if(!myReportsList.length){ alert('신고 내역이 없습니다.'); return; }
    myReportsIndex = 0;
    document.addEventListener('keydown', myReportsKeyHandler);
    renderMyReportsView();
  }

  function closeMyReportsView(){
    document.getElementById('myReportsOverlay')?.remove();
    document.removeEventListener('keydown', myReportsKeyHandler);
  }

  function myReportsKeyHandler(e){
    if(!document.getElementById('myReportsOverlay')) return;
    if(e.key === 'ArrowRight') myReportsNav(1);
    else if(e.key === 'ArrowLeft') myReportsNav(-1);
    else if(e.key === 'Escape') closeMyReportsView();
  }

  function myReportsNav(dir){
    const next = myReportsIndex + dir;
    if(next < 0 || next >= myReportsList.length) return;
    myReportsIndex = next;
    renderMyReportsView();
  }

  // 삭제 실제 처리는 기존 deleteMyReport(confirm+API 호출)를 그대로 재사용하고,
  // 이 화면(overlay)의 목록/인덱스만 갱신해 계속 이어서 볼 수 있게 한다.
  async function myReportsHandleDelete(id){
    const before = myReportCount();
    await deleteMyReport(id);
    if(myReportCount() === before) return; // 취소했거나 삭제 실패
    myReportsList = myReportsList.filter(([rid]) => rid !== id);
    if(!myReportsList.length){ closeMyReportsView(); return; }
    if(myReportsIndex >= myReportsList.length) myReportsIndex = myReportsList.length - 1;
    renderMyReportsView();
  }

  function renderMyReportsView(){
    const total = myReportsList.length;
    const [id, r] = myReportsList[myReportsIndex];
    const chapterQuiz = QUIZ[r.chapterKey] || [];
    let q = chapterQuiz[r.questionIndex];
    // 인덱스로 바로 못 찾으면(문제가 삭제됐거나 순서가 바뀜), 신고 당시 저장해둔 문제 텍스트로
    // 같은 챕터 안에서 다시 찾아본다 - 문제 자체는 남아있고 순서만 바뀐 경우 이걸로 복구된다.
    // 이렇게 안 하면, admin의 "오류 신고 모아보기"(텍스트 스냅샷을 그대로 보여줌)는 멀쩡히
    // 보이는데 여기(index.html)만 "찾을 수 없음"으로 뜨는 불일치가 생긴다(신고된 버그).
    if((!q || q.question !== r.questionText) && r.questionText){
      const found = chapterQuiz.find(item => item && item.question === r.questionText);
      if(found) q = found;
    }
    const dateStr = r.createdAt? new Date(r.createdAt).toLocaleString('ko-KR', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
    const statusLabel = r.status === 'resolved' ? '✅ 처리완료' : '🕓 접수됨';

    let questionBlockHtml;
    if(q){
      const letters = ['①','②','③','④'];
      const optionsHtml = q.options.map((opt,i)=>`
        <div class="option${i===q.answer-1? ' correct':' dim'}"><div class="num">${letters[i]}</div><div>${escapeHtml(opt)}</div></div>
      `).join('');
      const tocLabels = questionTocLabels(r.chapterKey, q);
      questionBlockHtml = `
        <div class="quiz-head"><div class="crumb"><b>${escapeHtml(tocLabels.group)}</b><br>${escapeHtml(tocLabels.sub)}</div></div>
        <div class="qcard"><div class="qtext">${escapeHtml(q.question)}</div></div>
        <div class="options">${optionsHtml}</div>
        <div class="sheet-inline-slot">
          <div class="sheet" style="position:static;max-width:none;width:100%;margin:14px 0 0;animation:none;box-shadow:var(--shadow);">
            <div class="sheet-head ok"><span>💡 해설</span></div>
            <div class="sheet-body">${escapeHtml((q.explanation || '해설이 제공되지 않았습니다.').trim())}${q.source? `<div class="sheet-src">§ 출처: ${escapeHtml(q.source)}</div>` : ''}</div>
          </div>
        </div>
      `;
    } else {
      // admin의 "오류 신고 모아보기"도 questionText(신고 당시 문제 텍스트) 하나만 저장/표시하고
      // 보기·정답·해설은 애초에 신고 데이터에 없어서 안 보여준다. 여기서도 그와 똑같이 문제
      // 텍스트만 담담히 보여준다 - 예전엔 "⚠️ 찾을 수 없습니다" 경고를 추가로 보여줘서 admin과
      // 다르게 놀라 보였는데(신고된 불일치), 이제 admin과 동일한 표시 방식으로 맞춘다.
      questionBlockHtml = `
        <div class="quiz-head"><div class="crumb"><b>${escapeHtml(META.names[r.chapterKey] || r.chapterKey)}</b></div></div>
        <div class="qcard"><div class="qtext">${escapeHtml(r.questionText || '(문제 내용 없음)')}</div></div>
      `;
    }

    const overlay = document.getElementById('myReportsOverlay') || document.createElement('div');
    overlay.id = 'myReportsOverlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:var(--paper);z-index:80;overflow-y:auto;';
    overlay.innerHTML = `
      <div class="topbar topbar-quiz" id="myReportsTopbar">
        <div class="brand">🚩 내가 신고한 오류</div>
        <div class="stats-chip">${myReportsIndex+1} / ${total}</div>
      </div>
      <div class="quiz-wrap">
        ${questionBlockHtml}
        <div class="qcard" style="background:var(--seal-tint);border-color:transparent;margin-top:16px;">
          <div style="font-size:11.5px;color:var(--ink-soft);margin-bottom:8px;">${statusLabel} · ${escapeHtml(dateStr)}</div>
          <div style="font-size:14px;color:var(--seal);line-height:1.75;white-space:pre-wrap;word-break:keep-all;">${escapeHtml(r.content)}</div>
        </div>
        <div class="nav-row">
          <button class="nav-btn" id="myReportsPrevBtn" ${myReportsIndex===0?'disabled':''}>← 이전</button>
          <button class="nav-btn" id="myReportsNextBtn" ${myReportsIndex===total-1?'disabled':''}>다음 →</button>
        </div>
        <div class="nav-row">
          ${q? `<button class="nav-btn" id="myReportsGotoBtn">문제로 이동</button>` : ''}
          <button class="nav-btn" id="myReportsDeleteBtn" style="color:var(--seal);">삭제</button>
          <button class="nav-btn primary" id="myReportsCloseBtn">닫기</button>
        </div>
        <div class="kbd-hint">←/→ 이전·다음 &nbsp; Esc 닫기</div>
      </div>
    `;
    if(!overlay.parentNode) document.body.appendChild(overlay);

    document.getElementById('myReportsTopbar').onclick = ()=> closeMyReportsView();
    document.getElementById('myReportsPrevBtn').onclick = (e)=>{ e.stopPropagation(); myReportsNav(-1); };
    document.getElementById('myReportsNextBtn').onclick = (e)=>{ e.stopPropagation(); myReportsNav(1); };
    document.getElementById('myReportsCloseBtn').onclick = (e)=>{ e.stopPropagation(); closeMyReportsView(); };
    document.getElementById('myReportsDeleteBtn').onclick = (e)=>{ e.stopPropagation(); myReportsHandleDelete(id); };
    if(q) document.getElementById('myReportsGotoBtn').onclick = (e)=>{ e.stopPropagation(); goToReportedQuestion(r.chapterKey, r.questionIndex); };
  }

  function chapterStats(key){
    const total = (QUIZ[key] || []).length;
    const currentAnswered = state.progress[key] ? Object.keys(state.progress[key]).length : 0;
    // "처음부터 다시 풀기"로 progress가 지워져도 학습완료 수가 사라져 보이지 않도록,
    // 지금까지 이 챕터에서 도달했던 역대 최고 학습완료 수 중 더 큰 값을 사용한다.
    if(currentAnswered > (state.bestAnswered[key] || 0)){
      state.bestAnswered[key] = currentAnswered;
      saveBestAnswered();
    }
    const answered = Math.max(currentAnswered, state.bestAnswered[key] || 0);
    const correct = state.progress[key] ? Object.values(state.progress[key]).filter(a=>a.correct).length : 0;
    return {total, answered, correct};
  }

  const MASTERY_TARGET = 7; // 오답노트에서 완전히 빠지려면 필요한 "연속 정답" 횟수

  function isExcludedFromWrong(key, idx){
    return !!(state.excluded[key] && state.excluded[key][idx]);
  }

  // 특정 문제의 현재 연속 정답 스트릭(0~10). 오답노트 화면의 숙달도 점 표시에 쓰인다.
  function masteryStreak(key, idx){
    return (state.wrongMastery.streak[key] && state.wrongMastery.streak[key][idx]) || 0;
  }

  // "오답노트 대상 풀"에 들어있고, 아직 연속 정답 10회를 못 채웠고, 수동 제외도 안 된 문제만 남긴다.
  // 풀에 들어가는 시점은 한 번이라도 틀렸을 때(selectAnswer에서 등록)이며,
  // 이후 맞히면 스트릭 +1, 틀리면 스트릭이 0으로 리셋된다(연속으로 10번 맞혀야 함).
  function wrongIndices(key){
    const pool = state.wrongMastery.pool[key] || {};
    return Object.keys(pool)
      .map(Number)
      .filter(i => !isExcludedFromWrong(key, i) && masteryStreak(key, i) < MASTERY_TARGET)
      .sort((a,b)=>a-b);
  }
  function wrongCount(key){ return wrongIndices(key).length; }

  // ====== 숙달도 중심 상태 판별 (단순 회독수 대신 "실질적 성취"를 보여주기 위한 보조 지표) ======
  // wrongIndices/wrongCount는 reviewOnlyIndices(복습 단계 판정)가 그대로 재사용하므로 건드리지 않는다.
  // 메인화면의 전체 복습 진입점은 "전체 취약 문제"(weakCount/startGlobalWeakReview)로 대체되었다.

  function isManualWeak(key, idx){
    return !!(state.manualWeak[key] && state.manualWeak[key][idx]);
  }
  function toggleManualWeak(key, idx){
    if(!state.manualWeak[key]) state.manualWeak[key] = {};
    state.manualWeak[key][idx] = !isManualWeak(key, idx);
    saveManualWeak();
    syncPush();
  }

  // 문제별 누적 정답률(%). 한 번도 안 풀었으면 null.
  function questionAccuracy(key, idx){
    const attempts = (state.questionReviewCounts[key] && state.questionReviewCounts[key][idx]) || 0;
    if(!attempts) return null;
    const corrects = (state.questionCorrectCounts[key] && state.questionCorrectCounts[key][idx]) || 0;
    return Math.round(corrects / attempts * 100);
  }

  // 🔴 취약 집중공략/🟡 복습 다시풀기/🔴 숫자 취약만에서, 이 문제를 "오늘" 다시 답했는지 확인한다.
  // 날짜가 바뀌었으면(자정을 넘겨서 다시 켬) 자동으로 예전 기록을 비운 걸로 친다 - 그래야
  // "오늘 학습한 분량"이라는 의미가 유지된다. 문제별로 기억하므로, 세션을 나갔다 오늘 중 다시
  // 들어와도(챕터별/전체 버튼 다시 클릭) 유지되고, "이전"/"다음"으로 다른 문제를 거쳐 왔다가
  // 되돌아와도 유지된다.
  function isReviewAnsweredToday(key, idx){
    if(state.reviewAnsweredDate !== todayDateStr()) return false;
    return state.reviewAnsweredKeys.has(key + ':' + idx);
  }
  // selectAnswer()에서, 🔴 취약 집중공략/🟡 복습 다시풀기/🔴 숫자 취약만 문제에 답을 고를 때마다 호출.
  function markReviewAnsweredToday(key, idx){
    const today = todayDateStr();
    if(state.reviewAnsweredDate !== today){
      state.reviewAnsweredDate = today;
      state.reviewAnsweredKeys = new Set();
    }
    state.reviewAnsweredKeys.add(key + ':' + idx);
    saveReviewAnswered();
  }
  async function saveReviewAnswered(){
    try{
      await window.storage.set('review-answered-today', JSON.stringify({
        date: state.reviewAnsweredDate,
        keys: Array.from(state.reviewAnsweredKeys),
      }));
    }catch(e){ /* best effort */ }
  }

  // 'none'(미풀이) | 'weak'(취약) | 'review'(복습) | 'mastered'(숙달)
  // 우선순위: 미풀이 → 수동지정 → (한 번도 안 틀림=숙달) → 스트릭10↑(숙달) → 낮은 정답률/낮은 스트릭(취약) → 나머지(복습)
  // "한 번도 안 틀린 문제"는 wrongMastery.pool에 아예 없어서 streak가 항상 0으로 잡히는데,
  // 이걸 streak 기준(0~2=취약)으로만 판단하면 정답률 100%인 문제가 취약으로 잘못 표시되므로
  // pool 소속 여부를 스트릭 판정보다 먼저 분기한다.
  function getQuestionStatus(key, idx){
    const attempts = (state.questionReviewCounts[key] && state.questionReviewCounts[key][idx]) || 0;
    if(!attempts) return 'none';
    if(isManualWeak(key, idx)) return 'weak';
    const inPool = !!(state.wrongMastery.pool[key] && state.wrongMastery.pool[key][idx]);
    if(!inPool) return 'mastered'; // 틀린 적이 없으므로 누적 정답률은 항상 100%
    const streak = masteryStreak(key, idx);
    if(streak >= MASTERY_TARGET) return 'mastered';
    const acc = questionAccuracy(key, idx);
    if(attempts >= 2 && acc !== null && acc < 50) return 'weak';
    if(streak <= 2) return 'weak';
    return 'review'; // pool에 있고 스트릭 3~9
  }

  const QUESTION_STATUS_META = {
    none:     { icon:'⚪', label:'미풀이',  color:'var(--ink-soft)',  bg:'var(--paper-deep)' },
    weak:     { icon:'🔴', label:'취약',    color:'var(--seal)',      bg:'var(--seal-tint)' },
    review:   { icon:'🟡', label:'복습',    color:'var(--gold-text)', bg:'var(--gold-tint)' },
    mastered: { icon:'🟢', label:'숙달',    color:'var(--correct)',   bg:'var(--correct-tint)' },
  };

  // getQuestionStatus가 '취약'으로 판정하는 문제만 모은다. wrongIndices(key)와 달리
  // "틀린 적은 없지만 수동으로 취약 지정한 문제"도 포함하고, 스트릭이 이미 3 이상(복습 단계)인
  // 문제는 제외한다 - QUIZ[key]의 전체 인덱스를 훑어야 하므로 별도 함수로 둔다.
  function weakIndices(key){
    const total = (QUIZ[key] || []).length;
    const idxs = [];
    for(let i=0;i<total;i++){
      // 수동 제외("이 문제는 취약문제에서 그만 보기")된 문제는 wrongIndices()와 마찬가지로
      // '취약' 목록에서 제외해야 한다. 이 필터가 없으면 제외한 문제가 계속 weakCount에 남아
      // 해당 챕터의 weakCount가 0이 되지 않고, "전체 취약 문제 복습" 큐가 그 챕터에서
      // 계속 다시 걸려 다음 챕터로 정상적으로 이어지지 않는다.
      if(getQuestionStatus(key, i) === 'weak' && !isExcludedFromWrong(key, i)) idxs.push(i);
    }
    return idxs;
  }
  function weakCount(key){ return weakIndices(key).length; }

  // 오답노트 대상(wrongIndices) 중 '취약'이 아닌(=복습 단계, 스트릭 3~9) 문제만 남긴다.
  // wrongCount(key) = weakCount(key) + reviewOnlyCount(key)가 항상 성립하지는 않는다(수동 지정으로
  // pool 밖의 문제가 weakIndices에 추가로 들어올 수 있어서) - 이는 의도된 동작이다.
  function reviewOnlyIndices(key){
    const weakSet = new Set(weakIndices(key));
    return wrongIndices(key).filter(i => !weakSet.has(i));
  }
  function reviewOnlyCount(key){ return reviewOnlyIndices(key).length; }

  // '숙달' 상태에 도달한 문제 수(홈 화면 "총 N문제 중 M문제 숙달" 표시용).
  function masteredCount(key){
    const total = (QUIZ[key] || []).length;
    let count = 0;
    for(let i=0;i<total;i++){
      if(getQuestionStatus(key, i) === 'mastered') count++;
    }
    return count;
  }

  // M열(NUM) 태그가 붙은 문제만 골라 인덱스 배열로 반환한다("⚡ 숫자 뽀개기.zip" 모아풀기용).
  // Cloudflare 모드에서는 문제 내용을 안 받아도 되는 /meta의 nums(챕터별 불리언 배열)로 판단하고,
  // 그 외(구글시트/내장 데이터)에서는 QUIZ[key] 항목에 직접 담긴 numTag로 판단한다.
  function numIndicesOf(key){
    const indices = [];
    if(cfEnabled() && CF_META[key]){
      (CF_META[key].nums || []).forEach((isNum, i)=>{ if(isNum) indices.push(i); });
    } else {
      // 정확히 "NUM"일 때만 인정(대소문자 무관) - M열에 다른 목적의 값이 남아있어도 오분류 방지.
      (QUIZ[key] || []).forEach((q, i)=>{ if(q && (q.numTag||'').toString().trim().toUpperCase()==='NUM') indices.push(i); });
    }
    return indices;
  }
  function numCount(key){ return numIndicesOf(key).length; }
  function totalNumCount(){ return allChapterKeys().reduce((sum,k)=> sum + numCount(k), 0); }
  // NUM 문제 중 현재 🔴 취약 상태(getQuestionStatus==='weak')인 것만 골라낸다
  // ("🔴 숫자 뽀개기.zip · 취약만" 모아풀기용). weakIndices()와 동일하게 수동 제외("그만 보기")된
  // 문제는 제외한다(안 그러면 제외한 문제가 계속 취약으로 남아 큐가 정상적으로 끝나지 않는다).
  function weakNumIndicesOf(key){
    return numIndicesOf(key).filter(i => getQuestionStatus(key, i) === 'weak' && !isExcludedFromWrong(key, i));
  }
  function weakNumCount(key){ return weakNumIndicesOf(key).length; }
  function totalWeakNumCount(){ return allChapterKeys().reduce((sum,k)=> sum + weakNumCount(k), 0); }
  // 이 챕터에 아직 안 푼 NUM 문제가 남아있는지(전체 NUM 복습을 챕터별로 이어갈 때 종료 조건 판단용).
  function hasUnansweredNum(key){
    return numIndicesOf(key).some(i => !(state.progress[key] && state.progress[key][i]));
  }
  // "⚡ 숫자 뽀개기.zip"가 챕터를 순서대로 이어갈 때, 주어진 챕터보다 앞선 챕터들에 있는
  // NUM 문제 수의 합계. 챕터가 바뀌어도 진행률 표시(예: 37/118)가 끊기지 않고 이어지도록 하는 데 쓰인다.
  function numPrecedingCount(key){
    let sum = 0;
    for(const k of allChapterKeys()){
      if(k === key) break;
      sum += numCount(k);
    }
    return sum;
  }
  // 챕터 구분 없이 전체 NUM 문제 기준 정답률(NUM 모아풀기 화면 하단 통계용).
  function numStats(){
    let total=0, answered=0, correct=0;
    allChapterKeys().forEach(k=>{
      numIndicesOf(k).forEach(i=>{
        total++;
        const a = state.progress[k] && state.progress[k][i];
        if(a){ answered++; if(a.correct) correct++; }
      });
    });
    return {total, answered, correct};
  }

  // 오답노트 대상에서 특정 문제를 수동으로 제외한다. 숙달도(연속 정답 횟수)와 무관하게,
  // 사용자가 "이제 이 문제는 그만 보고 싶다"고 판단했을 때 누르는 버튼용.
  // 이후 이 문제를 다시 틀리더라도 제외 상태는 풀리지 않는다(직접 해제하기 전까지 유지).
  function excludeFromWrong(key, idx){
    if(!state.excluded[key]) state.excluded[key] = {};
    state.excluded[key][idx] = true;
    saveExcluded();
  }

  // 챕터 안의 문제들을 세부항목(category1) > 세세항목(category2) 2단 구조로 묶는다.
  // 시트에 등장하는 순서가 아니라, 출제기준(TOC_BLUEPRINT)의 순서를 그대로 따른다.
  // 문제가 아직 하나도 없는 세세항목도 0/0으로 목차에 표시된다.
  // 반환 형식: [{ num:'1', name:'공공조달의 정의 및 목적', subs:[{ num:'1-1', name:'공공조달의 정의', total, answered }, ...] }, ...]
  function getChapterToc(key){
    const blueprint = TOC_BLUEPRINT[key] || [];

    // 문제들을 (세부항목, 세세항목) 이름 기준으로 미리 묶어둔다. 원본에 붙은 "1. " 같은 번호는
    // 출제기준 쪽과 표기가 다를 수 있어 매칭에서 제외하고, 순수 이름으로만 비교한다.
    const qMap = {}; // "세부항목||세세항목" -> {total, answered}
    if(cfEnabled() && CF_META[key]){
      // Cloudflare 모드: 문제 내용을 안 받아도 되는 가벼운 분류 메타데이터로 집계한다.
      // (QUIZ[key]를 직접 훑으면 아직 안 받아온 구멍이 있는 배열이라 forEach가 그 구멍들을 건너뛰어 버린다)
      CF_META[key].categories.forEach((cats, i)=>{
        const c1 = (cats[0] || '').trim().replace(/^\d+\.\s*/, '') || '(세부항목 없음)';
        const c2 = (cats[1] || '').trim().replace(/^\d+\.\s*/, '') || '(세세항목 없음)';
        const mk = c1 + '||' + c2;
        if(!qMap[mk]) qMap[mk] = { total: 0, answered: 0 };
        qMap[mk].total++;
        if(state.progress[key] && state.progress[key][i]) qMap[mk].answered++;
      });
    } else {
      const list = QUIZ[key] || [];
      list.forEach((q, i)=>{
        const c1 = (q.category1 || '').trim().replace(/^\d+\.\s*/, '') || '(세부항목 없음)';
        const c2 = (q.category2 || '').trim().replace(/^\d+\.\s*/, '') || '(세세항목 없음)';
        const mk = c1 + '||' + c2;
        if(!qMap[mk]) qMap[mk] = { total: 0, answered: 0 };
        qMap[mk].total++;
        if(state.progress[key] && state.progress[key][i]) qMap[mk].answered++;
      });
    }

    return blueprint.map((g, gi)=>{
      const subs = g.subs.map((subName, si)=>{
        const stat = qMap[g.name + '||' + subName] || { total: 0, answered: 0 };
        return {
          num: `${gi+1}-${si+1}`,
          name: subName,
          total: stat.total,
          answered: stat.answered
        };
      });
      // 세부항목(대분류) 단위 합계 - 그 아래 세세항목들의 total/answered를 모두 더한 값
      const groupTotal = subs.reduce((a,s)=>a+s.total, 0);
      const groupAnswered = subs.reduce((a,s)=>a+s.answered, 0);
      return { num: String(gi+1), name: g.name, total: groupTotal, answered: groupAnswered, subs };
    });
  }

  // 문제 풀이 화면 상단 breadcrumb(대분류/세부분류)에 "4. 계약종결 관리" / "4-2. 대금지급 절차"처럼
  // 정확한 번호를 매긴다. 문제 원본(q.category1/category2)에 붙어있는 번호는 구글시트 입력 실수 등으로
  // 출제기준(TOC_BLUEPRINT) 순서와 어긋날 수 있으므로, 번호는 무시하고 순수 이름만으로 다시 매칭해서
  // getChapterToc()와 동일한 기준으로 번호를 새로 매긴다. 매칭에 실패하면(출제기준에 없는 이름 등)
  // 원본 category1/category2 텍스트를 그대로 돌려준다(안전한 폴백).
  function questionTocLabels(key, q){
    const blueprint = TOC_BLUEPRINT[key] || [];
    const c1 = (q.category1 || '').trim().replace(/^\d+\.\s*/, '');
    const c2 = (q.category2 || '').trim().replace(/^\d+\.\s*/, '');
    const gi = blueprint.findIndex(g => g.name === c1);
    if(gi < 0) return { group: q.category1 || '', sub: q.category2 || '' };
    const group = `${gi+1}. ${blueprint[gi].name}`;
    const si = (blueprint[gi].subs || []).findIndex(s => s === c2);
    const sub = si >= 0 ? `${gi+1}-${si+1}. ${blueprint[gi].subs[si]}` : (q.category2 || '');
    return { group, sub };
  }

  function allChapterKeys(){
    return META.subjects.reduce((acc, subj)=>acc.concat(subj.chapters), []);
  }

  // QUIZ[key]의 0..length-1 전체 인덱스를 만든다. QUIZ[key].map((_,i)=>i)와 달리,
  // 아직 안 받아온 구멍(hole)이 있는 배열(Cloudflare 배치 로딩 중)에서도 구멍을 건너뛰지 않고 전부 포함한다.
  function allIndicesOf(key){
    return Array.from({length: (QUIZ[key]||[]).length}, (_,i)=>i);
  }

  // "이어서 학습" 카드 위치 캡션 계산용. openChapter()의 "일반 학습" 재개 로직(처음 만나는 안 푼
  // 문제를 찾는 방식)과 정확히 똑같이 계산해서, 카드에 적힌 숫자와 실제로 눌러서 들어갔을 때
  // 퀴즈 화면 우측 상단에 뜨는 숫자가 항상 일치하게 한다(전에는 "답변한 개수"를 보여줘서 순서를
  // 건너뛰며 풀었을 때 두 숫자가 달라 보이는 문제가 있었다).
  function resumePositionOf(key){
    const indices = allIndicesOf(key);
    const total = indices.length;
    if(!total) return { pos: 0, total: 0 };
    let pos = 0;
    for(let p=0; p<indices.length; p++){
      const answered = state.progress[key] && state.progress[key][indices[p]];
      if(!answered){ pos = p; break; }
      if(p === indices.length-1) pos = indices.length-1;
    }
    return { pos: pos+1, total };
  }

  // 챕터키의 "과목 안에서의" 순번(1부터 시작). 과목이 바뀌면 다시 1부터 매긴다.
  function chapterNumber(key){
    for(const subj of META.subjects){
      const idx = subj.chapters.indexOf(key);
      if(idx >= 0) return idx + 1;
    }
    return 1;
  }

  // 챕터키가 몇 과목(1/2/3과목) 소속인지 - META.subjects의 각 과목이 담고 있는 chapters 배열에서 찾는다.
  function subjectNumberOf(key){
    for(let i=0; i<META.subjects.length; i++){
      if((META.subjects[i].chapters || []).indexOf(key) >= 0) return i + 1;
    }
    return null;
  }

  // 문제 풀이 화면 상단처럼 "지금 몇 과목 몇 챕터를 풀고 있는지" 한눈에 보여줘야 하는 자리에서
  // "1과목-I. 공공조달 개요"처럼 과목 번호를 챕터명 앞에 붙인다.
  function chapterNameWithSubject(key){
    const num = subjectNumberOf(key);
    const name = META.names[key] || key;
    return num? `${num}과목-${name}` : name;
  }

  // 1~13 같은 숫자를 로마숫자 문자열로 변환한다(주요항목 말머리용).
  function toRoman(num){
    const table = [[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],
      [50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
    let n = num, out = '';
    for(const [v, s] of table){ while(n>=v){ out += s; n -= v; } }
    return out || String(num);
  }

  // META.names에는 "I. 공공조달 개요"처럼 로마숫자 접두사가 그대로 들어있다.
  // 홈 화면 카드처럼 옆에 번호 배지가 이미 따로 있는 자리에서는 이 접두사를 빼서
  // "Ⅰ  I. 공공조달 개요" 같은 중복 표기를 막는다(배지 없는 화면에서는 원문 그대로 사용).
  function stripLeadingNumber(str){
    return (str || '').replace(/^[IVXLCDM]+\.\s*/, '');
  }

  function overallStats(){
    let answered=0, correct=0;
    allChapterKeys().forEach(k=>{
      const s = chapterStats(k);
      answered += s.answered; correct += s.correct;
    });
    return {answered, correct, total: TOTAL_ALL};
  }

  function escapeHtml(str){
    if(str===null || str===undefined) return '';
    return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  // 숫자를 천단위 콤마로 표기한다(예: 1611 → "1,611"). 표시 형식만 바꿀 뿐 실제 값은 그대로다.
  function formatNum(n){ return (n||0).toLocaleString('ko-KR'); }

  // ---------- render router ----------
  // keepScroll이 true면 현재 스크롤 위치를 유지한다(해설 시트 토글 등 화면 전환이 아닌 경우).
  function render(keepScroll){
    const y = window.scrollY;
    if(state.view==='temp') renderTemp();
    else if(state.view==='home') renderHome();
    else if(state.view==='quiz') renderQuiz();
    else if(state.view==='complete') renderComplete();
    else if(state.view==='numComplete') renderNumComplete();
    if(keepScroll) window.scrollTo(0, y);
    else window.scrollTo(0,0);
  }

  // 임시 테스트 화면(?temp=1): 진행률 저장 없이 문제만 쭉 넘겨보는 가벼운 뷰어.

                <div class="sheet-body">${escapeHtml((q.explanation||'해설 없음').trim())}${q.source? `<div class="sheet-src">§ 출처: ${escapeHtml(q.source)}</div>` : ''}</div>

    document.getElementById('tempPrevBtn').onclick = ()=>{ state.tempIndex = Math.max(0, i-1); render(); };
    document.getElementById('tempNextBtn').onclick = ()=>{ state.tempIndex = Math.min(total-1, i+1); render(); };

    // 내부 구조(회독/진행률/숙달도/취약·복습 버튼/목차 펼치기)는 기존 그대로이며, 클릭 바인딩용

        </div>

        <div class="home-subjects">${subjectsHtml}</div>

        ${syncEnabled() && state.syncCode? `<div style="text-align:center;margin-top:14px;"><button id="myReportsBtn" style="background:none;border:none;color:var(--ink-soft);font-size:12px;text-decoration:underline;cursor:pointer;padding:6px;">🚩 내가 신고한 오류${myReportCount()>0? ` ${myReportCount()}개` : ''} 모아보기</button></div>` : ''}
      </div>
    `;

    const goResume = ()=>{
      let key = state.lastNormalChapter;
      if(!key || !QUIZ[key] || !QUIZ[key].length){
        key = allChapterKeys().find(k => QUIZ[k] && QUIZ[k].length) || null;
      }
      if(!key){ alert('아직 불러온 문제가 없습니다. 인터넷 연결을 확인한 뒤 새로고침해주세요.'); return; }
      openChapter(key, true);
    };
    document.getElementById('resumeBtn2').onclick = goResume; // "빠른 학습" 카드 - hero의 이어서 풀기 버튼은 삭제되어 이게 유일한 진입점
    const globalWeakBtn = document.getElementById('globalWeakBtn');
    if(globalWeakBtn) globalWeakBtn.onclick = ()=> startGlobalWeakReview();
    const globalReviewBtn = document.getElementById('globalReviewBtn');
    if(globalReviewBtn) globalReviewBtn.onclick = ()=> startGlobalReviewOnlyReview();
    const globalNumBtn = document.getElementById('globalNumBtn');
    if(globalNumBtn) globalNumBtn.onclick = ()=> startGlobalNumReview();
    const globalWeakNumBtn = document.getElementById('globalWeakNumBtn');
    if(globalWeakNumBtn) globalWeakNumBtn.onclick = ()=> startGlobalWeakNumReview();
    const myReportsBtn = document.getElementById('myReportsBtn');
    if(myReportsBtn) myReportsBtn.onclick = ()=> openMyReportsModal();

    const syncCopyBtn = document.getElementById('syncCopyBtn');
    if(syncCopyBtn) syncCopyBtn.onclick = ()=>{
      if(navigator.clipboard) navigator.clipboard.writeText(state.syncCode);
      syncCopyBtn.textContent = '✓ 복사됨';
      setTimeout(()=>{ syncCopyBtn.textContent = '복사'; }, 1500);
    };
    const syncLogoutBtn = document.getElementById('syncLogoutBtn');
    if(syncLogoutBtn) syncLogoutBtn.onclick = ()=> stopSync();
    document.querySelectorAll('.chapter-card').forEach(el=>{
      el.onclick = ()=>{
        const key = el.dataset.key;
        if(!QUIZ[key] || !QUIZ[key].length){
          alert('이 챕터는 아직 문제를 불러오지 못했습니다. 인터넷 연결을 확인하거나 잠시 후 다시 시도해주세요.');
          return;
        }
        openChapter(key, true);
      };
    });
    document.querySelectorAll('.weak-btn').forEach(el=>{
      // 챕터별 단독 집중공략이므로, 혹시 이전 "전체 취약 문제 복습"을 중간에 홈으로 나가면서
      // 못 끈 globalWeakReview 플래그가 남아있다면 여기서 확실히 꺼서(챕터 경계 자동 이어가기
      // 로직이 이 단독 세션에 잘못 적용되지 않도록) 이 챕터만 풀고 정상적으로 완료 화면을 보게 한다.
      el.onclick = (e)=>{ e.stopPropagation(); state.globalWeakReview = false; state.globalReviewOnlyReview = false; startWeakReview(el.dataset.key); };
    });
    document.querySelectorAll('.review-btn').forEach(el=>{
      el.onclick = (e)=>{ e.stopPropagation(); state.globalWeakReview = false; state.globalReviewOnlyReview = false; startReviewOnlyReview(el.dataset.key); };
    });
    document.querySelectorAll('.updated-btn').forEach(el=>{
      // 챕터별 단독 바로가기이므로, 남아있을 수 있는 전체세션 플래그(과목별 개정 업데이트 포함)를
      // 모두 꺼서 이 챕터만 정상적으로 풀고 완료 화면을 보게 한다(다른 4개 버튼과 동일한 방어 패턴).
      el.onclick = (e)=>{
        e.stopPropagation();
        state.globalWeakReview = false;
        state.globalReviewOnlyReview = false;
        state.globalWeakNumReview = false;
        state.globalNumReview = false;
        state.globalUpdatedReview = false;
        startUpdatedReview(el.dataset.key);
      };
    });
    document.querySelectorAll('.subject-updated-btn').forEach(el=>{
      el.onclick = (e)=>{
        e.stopPropagation();
        const subj = META.subjects[Number(el.dataset.subjIdx)];
        if(subj) startGlobalUpdatedReview(subj);
      };
    });
    document.querySelectorAll('.expand-btn').forEach(el=>{
      el.onclick = (e)=>{
        e.stopPropagation();
        const key = el.dataset.key;
        state.expandedChapter = (state.expandedChapter === key) ? null : key;
        render(true); // 펼침/접힘은 화면 전환이 아니므로 스크롤 위치 유지
      };
    });
    document.querySelectorAll('.subtopic-item[data-raw], .toc-group-title[data-raw]').forEach(el=>{
      el.onclick = (e)=>{
        e.stopPropagation();
        const key = el.dataset.key;
        const raw = el.dataset.raw;
        const level = el.dataset.level; // 'group'(세부항목) | 'sub'(세세항목)
        startSubTopic(key, raw, level);
      };
    });
  }

  // filterIndices를 넘기면 QUIZ[key] 중 해당 인덱스들만으로 구성된 '부분 학습' 세션이 시작된다.
  // 답변은 항상 진짜 인덱스(state.index)로 QUIZ[key]/state.progress[key]에 기록되므로,
  // 세세항목만 따로 풀어도 실제 챕터 진행률에 그대로 반영된다.
  function openChapter(key, resume, filterIndices, filterKind){
    state.chapter = key;
    state.filterIndices = filterIndices || null;
    state.filterKind = state.filterIndices ? (filterKind || null) : null;
    // 🔴 취약 집중공략 / 🟡 복습 다시풀기 / ⚡ 숫자 뽀개기(filterKind가 있는 세션)는 "이어서 학습"이
    // 끌려가면 안 되므로 여기서 갱신하지 않는다. filterKind가 없는 진짜 "일반 학습"일 때만 갱신한다.
    if(!state.filterKind) state.lastNormalChapter = key;
    const indices = state.filterIndices || allIndicesOf(key);
    // 🔴 취약 집중공략 / 🟡 복습 다시풀기 / 🔴 숫자 취약만(모두 대상 문제 전부가 "이미 한 번은 정식으로
    // 풀렸던" 문제들)은, "전체 기록 기준"으로 이미 푼 문제를 건너뛰면 모든 항목이 다 "이미 풀림"으로
    // 판정돼 맨 마지막 문제로 바로 건너뛰어버린다(전체 취약 복습이 일부만 도는 원인이었던 예전 버그).
    // 그래서 이 세션들만은 "오늘 다시 푼 기록"(isReviewAnsweredToday) 기준으로 건너뛴다 - 그래야
    // 오늘 이미 다시 풀어둔 만큼은 건너뛰고 이어서 시작하면서도, 오늘 아직 안 건드린 문제는 전체
    // 기록과 무관하게 "안 푼 문제"로 남아 처음부터(또는 그날 중단한 지점부터) 다시 보여준다.
    const isWeakLikeSession = state.filterKind === 'wrong' || state.filterKind === 'weaknum';
    if(resume){
      let pos = 0;
      let allDoneToday = true; // 취약형 세션에서만 의미 있음(아래 참고)
      for(let p=0; p<indices.length; p++){
        const realIdx = indices[p];
        const done = isWeakLikeSession
          ? isReviewAnsweredToday(key, realIdx)
          : !!(state.progress[key] && state.progress[key][realIdx]);
        if(!done){ pos = p; allDoneToday = false; break; }
        if(p === indices.length-1) pos = indices.length-1;
      }
      // 취약형 세션에서 "오늘 이 목록을 전부 다시 풀었음"이면, 마지막 문제(이미 오늘 답한 것)에
      // 멈추는 대신 이 목록의 "오늘 다시 푼" 표시를 지우고 처음부터 다시 풀 수 있게 한다.
      // 안 그러면 오늘 한 번 다 마친 뒤엔 "이어서 학습"이 항상 마지막(이미 답한) 문제에서 멈춰서,
      // 사실상 "처음부터 다시 풀기"를 할 방법이 없어 보이는 문제가 있었다(신고된 버그).
      if(isWeakLikeSession && allDoneToday && indices.length){
        indices.forEach(i => state.reviewAnsweredKeys.delete(key + ':' + i));
        saveReviewAnswered();
        pos = 0;
      }
      state.index = indices[pos];
    } else {
      state.index = indices[0];
    }
    state.view = 'quiz';
    state.sheetOpen = false;
    // (reviewAnsweredKeys는 여기서 초기화하지 않는다 - openChapter는 전체 세션이 챕터를 넘어갈 때도
    // 호출되는데, 여기서 지우면 방금 이전 챕터에서 답한 기록까지 사라진다. 진짜 "새 세션 시작"
    // 지점에서만 지운다 - 아래 startWeakReview/startGlobalWeakReview 등 참고.)
    saveProgress();
    render();
  }

  // 🔴 취약 집중공략 / 🟡 복습 다시풀기: 둘 다 filterKind('wrong')를 그대로 써서
  // 제외 버튼·숙달도 표시 등 기존 오답노트 화면 UI를 그대로 재사용한다. 대상 인덱스만 더 좁혀서 넘긴다.
  function startWeakReview(key){
    const idxs = weakIndices(key);
    if(!idxs.length) return;
    openChapter(key, true, idxs, 'wrong');
  }
  function startReviewOnlyReview(key){
    const idxs = reviewOnlyIndices(key);
    if(!idxs.length) return;
    openChapter(key, true, idxs, 'wrong');
  }

  // 전체 13개 챕터에 걸친 취약 문제 총 개수(메인화면 "전체 취약 문제 복습" UI에 표시).
  function totalWeakCount(){
    return allChapterKeys().reduce((sum, k) => sum + weakCount(k), 0);
  }
  // 전체 13개 챕터에 걸친 복습(🟡) 문제 총 개수 - 메인화면 "오늘 바로 복습" 정보 표시용.
  // 기존 reviewOnlyIndices(key)를 그대로 재사용하는 읽기 전용 집계이며, 새로운 전체 복습 세션/클릭
  // 로직은 만들지 않는다(챕터별 "🟡 복습 다시풀기" 버튼은 기존 그대로 동작).
  function totalReviewOnlyCount(){
    return allChapterKeys().reduce((sum, k) => sum + reviewOnlyIndices(k).length, 0);
  }

  // 메인화면 "🟡 복습 다시풀기" 진입점. startGlobalWeakReview()와 동일한 패턴 - 지금 시점에 복습
  // 문제가 있는 챕터들을 큐에 순서대로 담아두고, 완료 화면에서 다음 챕터로 자동으로 이어간다.
  function startGlobalReviewOnlyReview(){
    const queue = allChapterKeys().filter(k => reviewOnlyIndices(k).length > 0);
    if(!queue.length){ alert('현재 복습할 문제가 없습니다! 🎉'); return; }
    // 다른 전체 세션 도중에 이걸 시작하면 플래그가 여러 개 동시에 true로 남아 완료 시점에
    // goHomeOrContinueGlobalReview()가 엉뚱한 세션으로 이어가버릴 수 있으므로, 시작할 때
    // 나머지 3개 플래그를 전부 확실히 끈다.
    state.globalWeakReview = false;
    state.globalWeakNumReview = false;
    state.globalNumReview = false;
    state.globalUpdatedReview = false;
    state.globalReviewOnlyReview = true;
    state.globalReviewOnlyQueue = queue;
    state.globalReviewOnlyQueueIndex = 0;
    state.globalReviewOnlyCounts = queue.map(k => reviewOnlyIndices(k).length);
    startReviewOnlyReview(queue[0]); // 기존 startReviewOnlyReview 로직 그대로 재사용
  }
  // globalWeakPrecedingCount/globalWeakTotalCount와 동일한 역할, "복습 다시풀기" 전용.
  function globalReviewOnlyPrecedingCount(){
    let sum = 0;
    for(let i=0; i<state.globalReviewOnlyQueueIndex; i++) sum += (state.globalReviewOnlyCounts[i] || 0);
    return sum;
  }
  function globalReviewOnlyTotalCount(){
    return (state.globalReviewOnlyCounts || []).reduce((a, b) => a + b, 0);
  }

  // 메인화면에서 "전체 취약 문제 복습"을 눌렀을 때 진입점. 취약 문제가 있는 첫 챕터부터 시작하고,
  // 완료 화면에서 다음 챕터로 자동으로 이어간다(goHomeOrContinueGlobalReview 참고).
  // 기존 startWeakReview/openChapter 로직을 그대로 재사용할 뿐, 별도의 새 퀴즈 진행 로직은 만들지 않는다.
  function startGlobalWeakReview(){
    // 지금 시점에 취약 문제가 있는 챕터들을 순서대로 큐에 담아두고, 그 순서 그대로 한 챕터씩 이동한다.
    // (예전에는 "취약한 챕터를 아무거나 하나 찾기"를 매번 새로 하다 보니, 방금 본 챕터가 한 문제만
    //  맞혀서는 여전히 취약 상태로 남아있는 경우 계속 같은 챕터로만 되돌아가 다른 챕터로 넘어가지
    //  못하는 문제가 있었다 - "16개 복습하기가 안 됨" 버그의 원인)
    const queue = allChapterKeys().filter(k => weakCount(k) > 0);
    if(!queue.length){ alert('현재 취약 문제가 없습니다! 🎉'); return; }
    // 다른 전체 세션 도중에 이걸 시작하면 플래그가 여러 개 동시에 true로 남아 완료 시점에
    // goHomeOrContinueGlobalReview()가 엉뚱한 세션으로 이어가버릴 수 있으므로, 시작할 때
    // 나머지 3개 플래그를 전부 확실히 끈다.
    state.globalReviewOnlyReview = false;
    state.globalWeakNumReview = false;
    state.globalNumReview = false;
    state.globalUpdatedReview = false;
    state.globalWeakReview = true;
    state.globalWeakQueue = queue;
    state.globalWeakQueueIndex = 0;
    // 지금 이 순간의 챕터별 취약 문제 개수를 스냅샷으로 고정해둔다. 진행률 표시(예: "3/18")가
    // 챕터를 넘어갈 때마다 "이 챕터 안에서 몇 번째"로 되돌아가 보이지 않고(예: "3/18" 대신 "3/5"),
    // 세션 시작 시점 기준 전체 취약 문제 수 안에서 몇 번째인지 계속 이어서 보여주기 위함이다.
    state.globalWeakCounts = queue.map(k => weakCount(k));
    startWeakReview(queue[0]);
  }

  // globalWeakQueue 안에서 지금 챕터(globalWeakQueueIndex)보다 앞선 챕터들의 취약 문제 수 합계.
  function globalWeakPrecedingCount(){
    let sum = 0;
    for(let i=0; i<state.globalWeakQueueIndex; i++) sum += (state.globalWeakCounts[i] || 0);
    return sum;
  }
  // "전체 취약 문제 복습" 세션 전체의 총 문제 수(시작 시점 스냅샷 기준 - NUM 모아풀기의 totalNumCount와 같은 역할).
  function globalWeakTotalCount(){
    return (state.globalWeakCounts || []).reduce((a, b) => a + b, 0);
  }

  // 챕터 안의 NUM(숫자문제) 태그가 붙은 문제만 필터링해 이어서 풀도록 연다. wrongReview와 동일하게
  // 실제 챕터의 진짜 인덱스만 쓰므로, 여기서 푼 답은 그 챕터의 진짜 진행률에 그대로 반영·누적된다.
  function startNumReview(key){
    const idxs = numIndicesOf(key);
    if(!idxs.length) return;
    openChapter(key, true, idxs, 'num');
  }

  // 아직 안 푼 NUM 문제가 남아있는 챕터키를 찾는다("전체 NUM 복습"을 챕터별로 이어갈 때 사용).
  function nextNumChapterKey(){
    return allChapterKeys().find(k => hasUnansweredNum(k));
  }

  // "⚡ 숫자 뽀개기.zip"에서 뒤로("← 이전") 이동할 때 챕터 경계를 넘어가기 위한 대상 챕터.
  // nextNumChapterKey는 "아직 안 푼 문제가 남은" 챕터를 찾지만(다음 진행용), 이건 이미 푼 문제라도
  // 순서상 이전 문제로 돌아갈 수 있어야 하므로 NUM 문제가 하나라도 있는 챕터면 된다.
  function prevNumChapterKey(key){
    const keys = allChapterKeys();
    const i = keys.indexOf(key);
    for(let p = i - 1; p >= 0; p--){
      if(numCount(keys[p]) > 0) return keys[p];
    }
    return null;
  }

  // "⚡ 숫자 뽀개기.zip · 전체" 모드로 1번~마지막 번호까지 완주했을 때 호출한다(회독수 +1, 영구 저장).
  // 🔴 취약만 모드에서는 절대 호출하지 않는다 - 두 완료 전환 지점(goToNextUnanswered, keydown 핸들러)
  // 모두 filterKind==='num'(전체 모드 전용) 분기 안에서만 호출된다.
  function incrementNumReviewRound(){
    state.numReviewRound = (state.numReviewRound || 0) + 1;
    saveNumReviewRound();
  }

  // 메인화면 "⚡ 숫자 뽀개기.zip" 진입점. 안 푼 NUM 문제가 있는 첫 챕터부터 시작하고,
  // 완료 화면에서 다음 챕터로 자동으로 이어간다(goHomeOrContinueGlobalReview 참고).
  // 전부 이미 풀었으면(안 푼 게 없으면) NUM 문제가 하나라도 있는 챕터를 처음부터 다시 보여준다.
  function startGlobalNumReview(){
    // 다른 전체 세션 도중에 이걸 시작하면 플래그가 여러 개 동시에 true로 남아 완료 시점에
    // goHomeOrContinueGlobalReview()가 엉뚱한 세션으로 이어가버릴 수 있으므로, 시작할 때
    // 나머지 3개 플래그를 전부 확실히 끈다(이 함수는 원래 아예 초기화를 안 하고 있었다).
    state.globalWeakReview = false;
    state.globalReviewOnlyReview = false;
    state.globalWeakNumReview = false;
    state.globalUpdatedReview = false;
    const key = nextNumChapterKey();
    if(key){
      state.globalNumReview = true;
      startNumReview(key);
      return;
    }
    // 안 푼 NUM 문제가 하나도 없다(=이미 한 번 다 풀었다). 이 경우 startNumReview(=openChapter의
    // resume 로직)에 맡기면 "안 푼 문제를 찾다가 끝까지 못 찾음 → 마지막 문제로 이동"으로 해석되어
    // 첫 문제가 아니라 마지막(이미 푼) 문제부터 보여주는 어색한 상태가 된다. 그래서 이땐 resume 없이
    // NUM 문제가 있는 첫 챕터의 맨 처음부터 다시 보여준다(진짜 초기화는 완료 화면의 "처음부터 다시
    // 풀기"로 하고, 여기는 단지 "이미 다 푼 걸 다시 훑어보기 시작 위치"만 정상화하는 것).
    const fallbackKey = allChapterKeys().find(k => numCount(k) > 0);
    if(!fallbackKey){ alert('아직 등록된 숫자문제(NUM)가 없습니다.'); return; }
    state.globalNumReview = true;
    openChapter(fallbackKey, false, numIndicesOf(fallbackKey), 'num');
  }

  // 🔴 숫자 취약만 다시풀기: NUM 태그가 붙은 문제 중 취약한 것만 모아 푼다. filterKind를 'weaknum'으로
  // 넘겨, 🔴 취약 집중공략 / 🟡 복습 다시풀기와 동일한 "건너뛰지 않기·숙달도 표시·제외 버튼" UX를
  // 그대로 재사용한다(renderQuiz의 isWeakLikeSession 참고).
  function startWeakNumReview(key){
    const idxs = weakNumIndicesOf(key);
    if(!idxs.length) return;
    openChapter(key, true, idxs, 'weaknum');
  }

  // 메인화면 "🔴 숫자 뽀개기.zip · 취약만" 진입점. startGlobalWeakReview()와 동일한 패턴 - 지금
  // 시점에 취약 NUM이 있는 챕터들을 큐에 순서대로 담아두고, 완료 화면에서 다음 챕터로 자동으로
  // 이어간다(goHomeOrContinueGlobalReview 참고). 이미 취약을 벗어난 챕터는 건너뛴다.
  function startGlobalWeakNumReview(){
    const queue = allChapterKeys().filter(k => weakNumCount(k) > 0);
    if(!queue.length){ alert('현재 취약 숫자문제가 없습니다! 🎉'); return; }
    // 다른 전체 세션 도중에 이걸 시작하면 플래그가 여러 개 동시에 true로 남아 완료 시점에
    // goHomeOrContinueGlobalReview()가 엉뚱한 세션으로 이어가버릴 수 있으므로(신고된 버그: 숫자
    // 취약만을 다 마쳤는데 남아있던 globalNumReview 때문에 숫자 전체 세션으로 튕겨나감),
    // 시작할 때 나머지 3개 플래그를 전부 확실히 끈다.
    state.globalWeakReview = false;
    state.globalReviewOnlyReview = false;
    state.globalNumReview = false;
    state.globalUpdatedReview = false;
    state.globalWeakNumReview = true;
    state.globalWeakNumQueue = queue;
    state.globalWeakNumQueueIndex = 0;
    state.globalWeakNumCounts = queue.map(k => weakNumCount(k));
    startWeakNumReview(queue[0]);
  }
  // globalWeakPrecedingCount/globalWeakTotalCount와 동일한 역할, "숫자 취약만" 전용.
  function globalWeakNumPrecedingCount(){
    let sum = 0;
    for(let i=0; i<state.globalWeakNumQueueIndex; i++) sum += (state.globalWeakNumCounts[i] || 0);
    return sum;
  }
  function globalWeakNumTotalCount(){
    return (state.globalWeakNumCounts || []).reduce((a, b) => a + b, 0);
  }

  // 🆕 챕터별 "개정 업데이트" 바로가기: 이 챕터 안의 "개정일자 있고 아직 안 푼" 문제만 모아 연다.
  // 이미 다 정상 답변 취급이라(취약형이 아님) 재도전 게이트 없이 일반 학습처럼 바로 저장된다.
  function startUpdatedReview(key){
    const idxs = updatedUnansweredIndicesOf(key);
    if(!idxs.length) return;
    openChapter(key, true, idxs, 'updated');
  }
  // 🆕 과목별 "개정 업데이트" 바로가기: 그 과목에 속한 챕터들 중 개정 문제가 있는 것만 큐에 담아
  // 순서대로 이어간다(다른 전체 세션들과 동일한 패턴).
  function startGlobalUpdatedReview(subj){
    const queue = (subj.chapters || []).filter(k => chapterUpdateInfo(k));
    if(!queue.length) return;
    // 다른 전체 세션과 동시에 진행 중이면 완료 시점에 엉뚱한 세션으로 이어질 수 있으므로 정리한다.
    state.globalWeakReview = false;
    state.globalReviewOnlyReview = false;
    state.globalNumReview = false;
    state.globalWeakNumReview = false;
    state.globalUpdatedReview = true;
    state.globalUpdatedQueue = queue;
    state.globalUpdatedQueueIndex = 0;
    state.globalUpdatedCounts = queue.map(k => chapterUpdateInfo(k).count);
    startUpdatedReview(queue[0]);
  }
  function globalUpdatedPrecedingCount(){
    let sum = 0;
    for(let i=0; i<state.globalUpdatedQueueIndex; i++) sum += (state.globalUpdatedCounts[i] || 0);
    return sum;
  }
  function globalUpdatedTotalCount(){
    return (state.globalUpdatedCounts || []).reduce((a, b) => a + b, 0);
  }

  // 챕터 안에서 특정 세부항목(category1) 또는 세세항목(category2)에 해당하는 문제만 골라 이어서 풀도록 연다.
  // level: 'sub'(세세항목, 기존 방식) | 'group'(세부항목 - 그 아래 세세항목 전부 포함)
  // 번호("1. " 등) 접두사는 무시하고 순수 이름으로 매칭한다(출제기준 청사진과 표기 방식이 다를 수 있어서).
  // 별도의 가상 챕터를 만들지 않고 실제 key의 인덱스만 필터링하므로,
  // 여기서 푼 답은 그 챕터의 진짜 진행률(state.progress[key])에 그대로 기록·누적된다.
  function startSubTopic(key, topicName, level){
    const indices = [];
    if(cfEnabled() && CF_META[key]){
      CF_META[key].categories.forEach((cats, i)=>{
        const c1 = (cats[0] || '').trim().replace(/^\d+\.\s*/, '') || '(세부항목 없음)';
        const c2 = (cats[1] || '').trim().replace(/^\d+\.\s*/, '') || '(세세항목 없음)';
        if(level === 'group' ? c1===topicName : c2===topicName) indices.push(i);
      });
    } else {
      (QUIZ[key] || []).forEach((q, i)=>{
        if(level === 'group'){
          const c1 = (q.category1 || '').trim().replace(/^\d+\.\s*/, '') || '(세부항목 없음)';
          if(c1 === topicName) indices.push(i);
        } else {
          const c2 = (q.category2 || '').trim().replace(/^\d+\.\s*/, '') || '(세세항목 없음)';
          if(c2 === topicName) indices.push(i);
        }
      });
    }
    if(!indices.length){
      alert('이 항목은 아직 등록된 문제가 없습니다.\n출제기준에는 있지만 아직 문제가 추가되지 않은 상태예요.');
      return;
    }
    openChapter(key, true, indices, 'subtopic'); // resume=true: 이 항목 안에서 이미 푼 문제는 건너뛰고 이어서 시작
  }

  function renderQuiz(){
    const key = state.chapter;
    // filterIndices가 있으면 세세항목 등 '부분 학습' 세션이다. state.index는 항상 QUIZ[key] 안의 진짜 인덱스이고,
    // pos는 현재 세션(전체 또는 필터된 목록) 안에서의 표시 위치(1/N, 진행바 등)이다.
    const indices = state.filterIndices || allIndicesOf(key);
    const idx = state.index; // 진짜 배열 인덱스 (진행률 저장 키로 사용)
    const pos = indices.indexOf(idx); // 이 세션에서의 표시 순번
    const q = QUIZ[key][idx];

    // Cloudflare 배치 로딩 모드에서, 이 문제가 아직 안 왔으면(구멍) 잠깐 로딩 화면을 보여주고
    // 받아오는 대로 자동으로 다시 그린다. 일반 구글시트 모드에서는 항상 이미 다 있어서 여기 안 걸린다.
    if(!q){
      app.innerHTML = `
        <div class="topbar"><div class="brand">문제를 불러오는 중...</div></div>
        <div style="padding:60px 20px; text-align:center; color:var(--ink-soft); font-size:14px;">
          ${state.cfBurstWaiting
            ? '🚦 요청이 몰려 잠시 대기 중입니다...<br>화면이 멈춘 게 아니라, 곧 자동으로 다시 시도합니다.'
            : '⏳ 잠시만 기다려주세요'}<br>
          <button id="loadingHomeBtn" class="nav-btn" style="width:auto;margin-top:20px;padding:10px 20px;">홈으로 돌아가기</button>
        </div>
      `;
      document.getElementById('loadingHomeBtn').onclick = ()=>{ state.view='home'; render(); };
      cfEnsureLoaded(key, idx).then(()=>{ if(state.view==='quiz' && state.chapter===key && state.index===idx) render(); });
      return;
    }

    const total = indices.length;
    const os = overallStats();
    const isFiltered = !!state.filterIndices;
    const isWrongSession = state.filterKind === 'wrong';
    const isNumSession = state.filterKind === 'num';
    const isWeakNumSession = state.filterKind === 'weaknum';
    // 🔴 취약 집중공략 / 🟡 복습 다시풀기 / 🔴 숫자 취약만(모두 filterKind가 'wrong' 또는 'weaknum')은
    // 대상 문제 전부가 예전에 이미 한 번은 정식으로 풀렸던 문제라서, state.progress의 "옛날 기록"을
    // 그대로 saved로 취급하면 옵션이 처음부터 "이미 정답 표시된" 상태로 굳어버려 다시 답을 고를 수
    // 없게 된다(재풀이 비활성화 버그). 그래서 이 세션들은 "오늘 이 문제에 실제로 다시 답을
    // 골랐는지"(isReviewAnsweredToday, 문제별·날짜별로 영구 기억함)를 기준으로 삼아, 아직 오늘
    // 다시 안 골랐다면 옛날 기록이 있어도 "안 푼 문제"처럼 보여준다. 날짜가 바뀌면 자동으로 초기화된다.
    const isWeakLikeSession = isWrongSession || isWeakNumSession;
    const rawAnswered = state.progress[key] && state.progress[key][idx];
    const saved = isWeakLikeSession ? (isReviewAnsweredToday(key, idx) ? rawAnswered : null) : rawAnswered;
    // NUM 모아풀기 / "전체 취약 문제 복습" / "숫자 취약만"은 모두 챕터가 바뀌어도 전체를 하나로
    // 이어서 보여준다(진행률·회차 표시용). pos/total은 "이 챕터 안에서의" 위치이고,
    // 아래 두 값은 "전체 목록 안에서의" 위치다.
    const isGlobalWrongSession = isWrongSession && state.globalWeakReview;
    const isGlobalReviewOnlySession = isWrongSession && state.globalReviewOnlyReview;
    const isGlobalWeakNumSession = isWeakNumSession && state.globalWeakNumReview;
    const isUpdatedSession = state.filterKind === 'updated';
    const isGlobalUpdatedSession = isUpdatedSession && state.globalUpdatedReview;
    const globalPos = isNumSession? numPrecedingCount(key) + pos
      : (isGlobalWrongSession? globalWeakPrecedingCount() + pos
      : (isGlobalReviewOnlySession? globalReviewOnlyPrecedingCount() + pos
      : (isGlobalWeakNumSession? globalWeakNumPrecedingCount() + pos
      : (isGlobalUpdatedSession? globalUpdatedPrecedingCount() + pos : pos))));
    const globalTotal = isNumSession? totalNumCount()
      : (isGlobalWrongSession? globalWeakTotalCount()
      : (isGlobalReviewOnlySession? globalReviewOnlyTotalCount()
      : (isGlobalWeakNumSession? globalWeakNumTotalCount()
      : (isGlobalUpdatedSession? globalUpdatedTotalCount() : total))));
    // "학습 완료"/"단원 완료" 버튼은 이 세션 전체의 마지막 문제일 때만 보여야 한다. 일반 세션은 이
    // 챕터 안에서의 마지막(pos===total-1)이 곧 세션의 마지막이지만, "전체 취약 문제 복습"/
    // "복습 다시풀기"/"숫자 취약만"/"개정 업데이트(과목별)"는 여러 챕터를 끊김 없이 이어서 보여주므로
    // 챕터별 마지막이 아니라 전체 목록 기준 마지막(globalPos===globalTotal-1)이어야 한다 - 안 그러면
    // 챕터가 바뀔 때마다 "다음 문제" 대신 매번 "학습 완료"가 떠버린다.
    const isLast = (isGlobalWrongSession || isGlobalReviewOnlySession || isGlobalWeakNumSession || isGlobalUpdatedSession) ? (globalPos === globalTotal - 1) : (pos === total - 1);
    // "이전" 버튼 비활성화 여부 계산용 - 지금 챕터의 첫 문제(pos===0)라도, "전체" 세션에서 이전
    // 챕터로 넘어갈 수 있으면(goPrev 참고) 비활성화하면 안 된다.
    const hasPrevChapter = (isNumSession && !!prevNumChapterKey(key))
      || (isGlobalWrongSession && state.globalWeakQueueIndex > 0)
      || (isGlobalReviewOnlySession && state.globalReviewOnlyQueueIndex > 0)
      || (isGlobalWeakNumSession && state.globalWeakNumQueueIndex > 0)
      || (isGlobalUpdatedSession && state.globalUpdatedQueueIndex > 0);
    const streak = masteryStreak(key, idx);
    // 이 문제를 지금까지 몇 번 풀었는지(누적). 해설 시트 하단 통계("총 N회 풀이")에 쓰인다.
    const storedReviewCount = (state.questionReviewCounts[key] && state.questionReviewCounts[key][idx]) || 0;
    // 숙달도 상태 뱃지(⚪미풀이/🔴취약/🟡복습/🟢숙달) - crumb(대분류>세부분류) 영역 바로 위에 표시.
    const qStatus = getQuestionStatus(key, idx);
    const qsm = QUESTION_STATUS_META[qStatus];
    const statusBadgeHtml = `<span style="display:inline-block;font-size:10.5px;font-weight:700;color:${qsm.color};background:${qsm.bg};border-radius:999px;padding:2px 9px;margin-bottom:4px;">${qsm.icon} ${qsm.label}</span><br>`;
    const tocLabels = questionTocLabels(key, q); // crumb에 쓸 "4. 계약종결 관리" / "4-2. 대금지급 절차" 형식 라벨
    const isWeakNow = isManualWeak(key, idx);
    // 이미(수동이든 자동이든) '취약' 상태로 판정된 문제라면 "취약문제로 지정하기" 버튼은 보여주지 않는다.
    // 수동으로 지정한 경우에만 "지정 해제" 버튼을 보여주고, 자동으로만 취약 판정된 경우엔 버튼 자체를 숨긴다.
    const alreadyWeakStatus = qStatus === 'weak';

    const letters = ['①','②','③','④'];
    let optionsHtml = '';
    q.options.forEach((opt, i)=>{
      let cls = 'option selectable';
      if(saved){
        cls = 'option';
        if(i===q.answer-1) cls += ' correct';
        else if(i===saved.selected) cls += ' wrong';
        else cls += ' dim';
      }
      optionsHtml += `<div class="${cls}" data-i="${i}"><div class="num">${letters[i]}</div><div>${escapeHtml(opt)}</div></div>`;
    });

    // 해설은 모바일에서는 하단 시트(모달)로, 태블릿/PC(768px+)에서는 CSS로 우측 패널에 인라인 표시된다.
    // state.sheetOpen이 true일 때만 뜨며, 답을 고른 직후 자동으로 열린다.
    let sheetHtml = '';
    if(saved && state.sheetOpen){
      const ok = saved.correct;
      const justMastered = isWeakLikeSession && ok && streak>=MASTERY_TARGET;
      sheetHtml = `
        <div class="sheet-dim" id="sheetDim"></div>
        <div class="sheet" id="sheetPanel" role="dialog" aria-modal="true">
          <div class="grip"></div>
          <div class="sheet-head ${ok?'ok':'no'}">
            <span>${ok? '⭕ 정답입니다!' : '❌ 오답입니다'}</span>
            <button id="sheetCloseX" class="sheet-close-x" aria-label="닫기">✕</button>
          </div>
          <div class="sheet-tip">💡 이 패널을 누르면 다음 문제로 넘어가요</div>
          <div class="sheet-body">
            ${justMastered? `<div style="background:var(--correct-tint);color:#204636;border:1px solid #BFDBCB;border-radius:9px;padding:12px 14px;margin-bottom:14px;font-weight:700;font-size:13.5px;">🎉 연속 정답 ${MASTERY_TARGET}회 달성! 이 문제는 취약문제에서 제외됩니다.</div>` : ''}
            ${escapeHtml((q.explanation||'해설이 제공되지 않았습니다.').trim())}${q.source? `<div class="sheet-src">§ 출처: ${escapeHtml(q.source)}</div>` : ''}
            ${(isWeakNow || !alreadyWeakStatus)? `<button id="manualWeakBtn" style="margin-top:10px;width:100%;background:${isWeakNow? 'var(--correct-tint)':'var(--seal-tint)'};border:1px solid ${isWeakNow? '#BFDBCB':'#E9C2BC'};border-radius:9px;padding:9px;font-size:12.5px;color:${isWeakNow? '#204636':'var(--seal)'};font-weight:700;cursor:pointer;">${isWeakNow? '✔ 취약문제 지정 해제' : '🚨 취약문제로 지정하기'}</button>` : ''}
            ${isWeakLikeSession? `<button id="excludeBtn" style="margin-top:8px;width:100%;background:var(--paper-deep);border:1px solid var(--line-strong);border-radius:9px;padding:9px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;">✕ 이 문제는 취약문제에서 그만 보기</button>` : ''}
            <button id="reportErrorBtn" style="margin-top:8px;width:100%;background:transparent;border:1px dashed var(--line-strong);border-radius:9px;padding:8px;font-size:12px;color:var(--ink-soft);cursor:pointer;">🚩 문제 오류 신고</button>
            <div class="sheet-stats-row" style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--line-strong);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
              <span style="font-size:11.5px;color:var(--ink-soft);">총 ${storedReviewCount}회 풀이 · 정답률 ${questionAccuracy(key, idx) ?? 0}%</span>
              <span class="mastery-dots">${Array.from({length:MASTERY_TARGET},(_,di)=>`<span class="mastery-dot${di<streak?' filled':''}"></span>`).join('')}</span>
            </div>
          </div>
          <div class="sheet-foot">
            <button class="nav-btn" id="sheetClose">닫고 보기</button>
            <button class="nav-btn primary" id="sheetNext">${(isLast && !isNumSession)? (isFiltered? '학습 완료 →' : '단원 완료 →') : '다음 문제 →'}</button>
          </div>
        </div>`;
    }

    app.innerHTML = `
      <div class="quiz-header-sticky">
        <div class="topbar topbar-quiz" id="quizTopbar">
          <div class="brand"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#F5F1E7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v4h4"/><path d="M9 13l2 2 4-4"/></svg></span>공공조달관리사</div>
          <div class="stats-chip">${isNumSession? escapeHtml(chapterNameWithSubject(key)) : (isFiltered? `📎 ${escapeHtml(q.category2||'')}` : escapeHtml(chapterNameWithSubject(key)))}</div>
        </div>
        <div class="progress-bar-top"><div style="width:${(globalPos)/globalTotal*100}%"></div></div>
      </div>
      <div class="quiz-wrap">
        <div class="quiz-head">
          <div class="crumb">${statusBadgeHtml}<b>${escapeHtml(tocLabels.group)}</b><br>${escapeHtml(tocLabels.sub)}</div>
          <div class="qno">${globalPos+1} / ${globalTotal}</div>
        </div>
        ${isWeakLikeSession? `
        <div class="mastery-row">
          <span class="mastery-label">🔥 숙달도 ${streak}/${MASTERY_TARGET}${streak>=MASTERY_TARGET? ' · 완료!' : ''}</span>
          <span class="mastery-dots">${Array.from({length:MASTERY_TARGET},(_,di)=>`<span class="mastery-dot${di<streak?' filled':''}"></span>`).join('')}</span>
        </div>` : ''}
        <div class="quiz-split">
          <div class="qmain">
            <div class="qcard">
              <div class="qtext">${escapeHtml(q.question)}</div>
            </div>
            <div class="options">${optionsHtml}</div>
            ${saved? `<button class="nav-btn" id="showSheetBtn" style="width:100%;margin-top:18px;font-size:14px;padding:12px;">📖 해설 다시 보기</button>` : ''}
            <div class="kbd-hint"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd> 답 선택 &nbsp; <kbd>Enter</kbd>/<kbd>Space</kbd> 다음 &nbsp; <kbd>←</kbd>/<kbd>→</kbd> 이동 &nbsp; <kbd>↑</kbd> 해설</div>
          </div>
          <div class="qside">
            <div class="sheet-inline-slot">${sheetHtml}</div>
            ${(!saved || !state.sheetOpen)? `<div class="qside-placeholder">정답을 선택하면<br>여기에 해설이 표시됩니다.<br><span class="tip-line">💡 해설을 누르면 다음 문제로 넘어가요</span>${saved? `<button class="nav-btn" id="showSheetBtnSide">📖 해설 다시 보기</button>` : ''}</div>` : ''}
          </div>
          <div class="nav-row">
            <button class="nav-btn" id="prevBtn" ${(pos===0 && !hasPrevChapter)?'disabled':''}>← 이전</button>
            <button class="nav-btn primary" id="nextBtn" ${saved? '' : 'disabled'}>${(isLast && !isNumSession)? (isFiltered? '학습 완료 →' : '단원 완료 →') : '다음 →'}</button>
          </div>
        </div>
        <div class="inline-stats">
          <span>전체 진행 ${os.answered}/${os.total}</span>
          <span>${isNumSession? 'NUM 정답률' : '이 단원 정답률'} ${(()=>{const s=isNumSession? numStats() : chapterStats(key); return s.answered? Math.round(s.correct/s.answered*100):0;})()}%</span>
        </div>
      </div>
    `;

    document.getElementById('quizTopbar').onclick = ()=>{ state.view='home'; saveProgress(); render(); };

    document.getElementById('prevBtn').onclick = ()=> goPrev();

    // "다음"으로 이동할 때 이미 푼 문제는 건너뛰고, 처음 만나는 "안 푼 문제"로 간다.
    // 남은 문제가 전부 이미 풀려있으면(더 건너뛸 데가 없으면) 챕터 완료 화면으로 넘어간다.
    // 세세항목을 먼저 풀어서 순서가 뒤섞여 있거나(중간중간 이미 푼 문제), 문제 개정으로 기록이
    // 초기화된 경우에도 "이어서 풀기"가 매번 안 푼 것만 보여주도록 하기 위함.
    const goToNextUnanswered = ()=>{
      state.sheetOpen = false;
      let p = pos + 1;
      // 🔴 취약 집중공략 / 🟡 복습 다시풀기 / 🔴 숫자 취약만(isWeakLikeSession)은 목록의 모든 문제가
      // 이미 예전에 정식으로 풀렸던 문제라서, 아래 "이미 푼 문제는 건너뛰기" 로직을 적용하면 다음
      // 문제도 전부 "이미 풀림"으로 판정돼 곧장 맨 끝(완료 화면)까지 건너뛰어버린다. 그래서 이
      // 세션들은 건너뛰지 않고 목록 순서 그대로 바로 다음 한 문제로만 이동한다.
      if(!isWeakLikeSession){
        while(p < total){
          const realIdx = indices[p];
          const answered = state.progress[key] && state.progress[key][realIdx];
          if(!answered) break;
          p++;
        }
      }
      if(p >= total){
        if(isNumSession){
          // NUM 모아풀기는 챕터 단위로 안 끊기고 118문제를 하나로 이어서 푸는 게 목적이므로,
          // 이 챕터의 NUM 문제를 다 풀었다고 완료 화면을 보여주지 않고 다음 챕터로 바로 넘어간다.
          const nextKey = nextNumChapterKey();
          if(nextKey){ startNumReview(nextKey); return; }
          // 전체 NUM 문제를 다 풀었다. 예전엔 여기서 알림만 띄우고 곧장 홈으로 보내버려서, 다
          // 풀고 나서 처음부터 다시 연습하고 싶어도 초기화할 방법이 없었다(신고된 버그). 일반
          // 챕터 완료 화면(renderComplete)처럼 통계와 "처음부터 다시 풀기" 버튼이 있는 전용
          // 완료 화면(renderNumComplete)을 보여준다.
          state.globalNumReview = false;
          incrementNumReviewRound(); // "전체" 모드로 1~마지막 번호까지 완주했을 때만 +1회독(취약만 모드는 호출 안 함)
          state.view = 'numComplete';
          render();
          return;
        }
        if((isWrongSession && state.globalWeakReview) || (isWrongSession && state.globalReviewOnlyReview) || (isWeakNumSession && state.globalWeakNumReview) || (state.filterKind==='updated' && state.globalUpdatedReview)){
          // "전체 취약 문제 N개 복습하기" / "숫자 뽀개기.zip · 취약만"은 NUM 모아풀기(⚡ 숫자
          // 뽀개기.zip · 전체)와 마찬가지로 전체를 한 번에 이어서 푸는 게 목적이므로, 챕터
          // 경계마다 "단원 완료" 화면을 보여주고 사용자가 직접 다음으로 넘겨야 하게 만들면
          // "챕터별로 끊겨서 불러온다"고 느끼게 된다. 완료 화면 없이 goHomeOrContinueGlobalReview()가
          // 바로 다음 챕터로 이어가도록 한다(더 이상 넘어갈 챕터가 없으면 그 안에서 알아서 안내
          // 문구를 띄우고 홈으로 보낸다).
          goHomeOrContinueGlobalReview();
          return;
        }
        if(!isFiltered) markChapterCompleted(key);
        state.view = 'complete';
        render();
      } else {
        goto(p);
      }
    };

    document.getElementById('nextBtn').onclick = ()=> { if(saved) goToNextUnanswered(); };
    if(!saved){
      document.querySelectorAll('.option.selectable').forEach(el=>{
        el.onclick = ()=> selectAnswer(Number(el.dataset.i));
      });
    }

    // ----- 해설 시트 관련 -----
    const goNext = goToNextUnanswered;
    const showBtn = document.getElementById('showSheetBtn');
    if(showBtn) showBtn.onclick = ()=>{ state.sheetOpen = true; render(true); };
    const showBtnSide = document.getElementById('showSheetBtnSide');
    if(showBtnSide) showBtnSide.onclick = ()=>{ state.sheetOpen = true; render(true); };
    const sheetNext = document.getElementById('sheetNext');
    if(sheetNext) sheetNext.onclick = goNext;
    const sheetClose = document.getElementById('sheetClose');
    if(sheetClose) sheetClose.onclick = ()=>{ state.sheetOpen = false; render(true); };
    const sheetCloseX = document.getElementById('sheetCloseX');
    if(sheetCloseX) sheetCloseX.onclick = ()=>{ state.sheetOpen = false; render(true); };
    const sheetDim = document.getElementById('sheetDim');
    if(sheetDim) sheetDim.onclick = ()=>{ state.sheetOpen = false; render(true); };
    // 해설 패널(모바일 하단 시트 / 태블릿·PC 우측 인라인 패널)을 터치/클릭하면 바로 다음 문제로
    // 넘어간다(버튼 위 클릭은 제외 - 버튼 자체 동작이 우선). 모바일 시트 상단의 "이 패널을 누르면
    // 다음 문제로 넘어가요" 안내 문구와 동작을 일치시켰다.
    const sheetPanel = document.getElementById('sheetPanel');
    if(sheetPanel) sheetPanel.onclick = (e)=>{
      if(e.target.closest('button')) return; // 닫기(✕)·제외 버튼 등은 그대로 자기 동작 수행
      goNext();
    };
    const excludeBtn = document.getElementById('excludeBtn');
    if(excludeBtn) excludeBtn.onclick = ()=>{
      excludeFromWrong(key, idx);
      goNext(); // 제외 후 바로 다음 문제로 넘어간다
    };
    const manualWeakBtn = document.getElementById('manualWeakBtn');
    if(manualWeakBtn) manualWeakBtn.onclick = ()=>{
      toggleManualWeak(key, idx);
      render(true); // 다음 문제로 넘어가지 않고 같은 화면에서 뱃지·버튼 라벨만 갱신
    };
    const reportErrorBtn = document.getElementById('reportErrorBtn');
    if(reportErrorBtn) reportErrorBtn.onclick = ()=>{
      openReportModal(key, idx, q.question);
    };
  }

  // newPos는 '이 세션 안에서의 표시 순번'이다(필터 세션이면 필터 목록 안 순번, 아니면 챕터 내 순번).
  function goto(newPos){
    const key = state.chapter;
    const indices = state.filterIndices || allIndicesOf(key);
    if(newPos<0 || newPos>=indices.length) return;
    const targetIdx = indices[newPos];
    state.index = targetIdx;
    // 🔴 취약 집중공략 / 🟡 복습 다시풀기 / 🔴 숫자 취약만은 "이번 방문에서 다시 답을 골라야" saved로
    // 치는 재도전 설계라, 여기서 자동으로 열어버리면 다시 못 풀게 막아버린다. 그 외(일반 학습, ⚡ 숫자
    // 뽀개기.zip · 전체)는 ← 이전 / → 한 단계 이동으로 이미 답변한 문제에 다시 왔을 때, PC/태블릿
    // 7:3 레이아웃(quiz-split, 820px+)에서 매번 "해설 다시 보기"를 눌러야 하는 게 불편하다는 신고가
    // 있어 해설을 자동으로 펼쳐서 보여준다. 모바일(820px 미만)은 7:3 분할이 아니라 해설이 하단
    // 시트로 문제/보기를 가리며 올라오는 구조라, 자동으로 열리면 오히려 방해가 되므로 제외한다.
    const isWeakLikeSession = state.filterKind === 'wrong' || state.filterKind === 'weaknum';
    const isDesktopSplit = window.innerWidth >= 820;
    const alreadyAnswered = isDesktopSplit && !isWeakLikeSession && !!(state.progress[key] && state.progress[key][targetIdx]);
    state.sheetOpen = alreadyAnswered;
    render();
  }

  // "← 이전" 이동 전용. 보통은 goto(pos-1)과 같지만, 여러 챕터를 하나로 이어서 보여주는 "전체" 세션
  // (⚡ 숫자 뽀개기.zip · 전체, 🔴 전체 취약 문제 복습, 🟡 복습 다시풀기, 🔴 숫자 취약만)은 지금
  // 챕터의 첫 문제(pos===0)에서 더 뒤로 가려 하면 goto가 범위를 벗어나 아무 동작도 안 하는 문제가
  // 있었다("이전 버튼이 되다 안 되다 함" - 챕터 경계에서만 막히는 게 원인, 신고된 버그).
  // "다음"이 챕터 경계에서 다음 챕터로 자동으로 넘어가는 것과 대칭되게, 여기서도
  // 이전 챕터(해당 세션 큐 기준)의 마지막 문제로 건너간다.
  function goPrev(){
    const key = state.chapter;
    const indices = state.filterIndices || allIndicesOf(key);
    const pos = indices.indexOf(state.index);
    if(state.filterKind === 'num' && pos <= 0){
      const prevKey = prevNumChapterKey(key);
      if(!prevKey) return; // 전체 NUM 목록의 첫 문제 - 더 갈 곳 없음
      const prevIdxs = numIndicesOf(prevKey);
      state.chapter = prevKey;
      state.filterIndices = prevIdxs;
      state.filterKind = 'num';
      const lastIdx = prevIdxs[prevIdxs.length - 1];
      state.index = lastIdx;
      state.sheetOpen = window.innerWidth >= 820 && !!(state.progress[prevKey] && state.progress[prevKey][lastIdx]); // 이미 답변한 문제면 PC/태블릿에서만 해설 자동 표시
      saveProgress();
      render();
      return;
    }
    if(state.filterKind === 'wrong' && state.globalWeakReview && pos <= 0){
      if(state.globalWeakQueueIndex > 0){
        const prevKey = state.globalWeakQueue[state.globalWeakQueueIndex - 1];
        const prevIdxs = weakIndices(prevKey);
        if(prevIdxs.length){
          state.globalWeakQueueIndex--;
          state.chapter = prevKey;
          state.filterIndices = prevIdxs;
          state.filterKind = 'wrong';
          state.index = prevIdxs[prevIdxs.length - 1];
          state.sheetOpen = false;
          saveProgress();
          render();
          return;
        }
      }
      return; // 전체 취약 문제 목록의 첫 문제 - 더 갈 곳 없음
    }
    if(state.filterKind === 'wrong' && state.globalReviewOnlyReview && pos <= 0){
      if(state.globalReviewOnlyQueueIndex > 0){
        const prevKey = state.globalReviewOnlyQueue[state.globalReviewOnlyQueueIndex - 1];
        const prevIdxs = reviewOnlyIndices(prevKey);
        if(prevIdxs.length){
          state.globalReviewOnlyQueueIndex--;
          state.chapter = prevKey;
          state.filterIndices = prevIdxs;
          state.filterKind = 'wrong';
          state.index = prevIdxs[prevIdxs.length - 1];
          state.sheetOpen = false;
          saveProgress();
          render();
          return;
        }
      }
      return; // 전체 복습 목록의 첫 문제 - 더 갈 곳 없음
    }
    if(state.filterKind === 'weaknum' && state.globalWeakNumReview && pos <= 0){
      if(state.globalWeakNumQueueIndex > 0){
        const prevKey = state.globalWeakNumQueue[state.globalWeakNumQueueIndex - 1];
        const prevIdxs = weakNumIndicesOf(prevKey);
        if(prevIdxs.length){
          state.globalWeakNumQueueIndex--;
          state.chapter = prevKey;
          state.filterIndices = prevIdxs;
          state.filterKind = 'weaknum';
          state.index = prevIdxs[prevIdxs.length - 1];
          state.sheetOpen = false;
          saveProgress();
          render();
          return;
        }
      }
      return; // 전체 숫자 취약만 목록의 첫 문제 - 더 갈 곳 없음
    }
    if(state.filterKind === 'updated' && state.globalUpdatedReview && pos <= 0){
      if(state.globalUpdatedQueueIndex > 0){
        const prevKey = state.globalUpdatedQueue[state.globalUpdatedQueueIndex - 1];
        const prevIdxs = updatedUnansweredIndicesOf(prevKey);
        if(prevIdxs.length){
          state.globalUpdatedQueueIndex--;
          state.chapter = prevKey;
          state.filterIndices = prevIdxs;
          state.filterKind = 'updated';
          const lastIdx = prevIdxs[prevIdxs.length - 1];
          state.index = lastIdx;
          state.sheetOpen = window.innerWidth >= 820 && !!(state.progress[prevKey] && state.progress[prevKey][lastIdx]); // 개정 업데이트는 취약형이 아니라 일반 문제 취급이므로 NUM과 동일하게 처리
          saveProgress();
          render();
          return;
        }
      }
      return; // 전체 개정 업데이트 목록의 첫 문제 - 더 갈 곳 없음
    }
    goto(pos - 1);
  }

  function selectAnswer(i){
    const key = state.chapter, idx = state.index;
    const q = QUIZ[key][idx];
    // 오늘 학습 카운트용: 이 답을 반영하기 "직전"의 상태를 먼저 캡처해둔다. state.progress 등을
    // 먼저 바꿔버리면 getQuestionStatus가 이미 이번 답이 반영된 이후 상태를 돌려주게 되어,
    // "오늘 취약/복습 문제를 몇 개 다시 풀었는지"를 정확히 셀 수 없다.
    const statusBeforeAnswer = getQuestionStatus(key, idx);
    const isNumQuestion = numIndicesOf(key).includes(idx);
    const correct = (i === q.answer-1);
    if(!state.progress[key]) state.progress[key] = {};
    state.progress[key][idx] = {selected:i, correct, rev: q.rev || null};
    // 🔴 취약 집중공략 / 🟡 복습 다시풀기 / 🔴 숫자 취약만 화면에서 "오늘 이 문제에 다시 답을
    // 골랐다"는 표시. isReviewAnsweredToday()가 이 값으로 saved 여부를 판단해, 예전 기록 때문에
    // 옵션이 클릭 불가능한 상태로 굳어있지 않고 실제로 다시 풀 수 있게 한다. 문제별·날짜별로
    // 영구 저장하므로, 오늘 중이면 세션을 나갔다 다시 들어와도 "오늘 다시 푼 문제"로 남는다.
    markReviewAnsweredToday(key, idx);
    // 홈 화면 "오늘 학습" 표시용 - 답을 고를 때마다(재도전 포함) 전체/숫자/취약/복습 카테고리별로 +1
    bumpTodayCount({ isNum: isNumQuestion, statusBefore: statusBeforeAnswer });

    // 문제별 누적 풀이 횟수 - "다시 풀기"를 해도 안 지워지는 별도 카운터
    if(!state.questionReviewCounts[key]) state.questionReviewCounts[key] = {};
    state.questionReviewCounts[key][idx] = (state.questionReviewCounts[key][idx] || 0) + 1;
    saveQuestionReviewCounts();

    // 문제별 누적 정답 횟수 - 위 풀이 횟수와 짝을 이뤄 정답률(getQuestionStatus/questionAccuracy) 산출에 쓰인다.
    if(correct){
      if(!state.questionCorrectCounts[key]) state.questionCorrectCounts[key] = {};
      state.questionCorrectCounts[key][idx] = (state.questionCorrectCounts[key][idx] || 0) + 1;
      saveQuestionCorrectCounts();
    }

    // 오답노트 숙달도 갱신: 틀리면 풀에 등록하고 스트릭 리셋, 이미 풀에 있는 문제를 맞히면 스트릭 +1.
    // (어느 화면에서 풀든 동일하게 적용 — 전체 챕터 풀이 중에 맞혀도 숙달도에 반영된다)
    if(!state.wrongMastery.pool[key]) state.wrongMastery.pool[key] = {};
    if(!state.wrongMastery.streak[key]) state.wrongMastery.streak[key] = {};
    if(correct){
      if(state.wrongMastery.pool[key][idx]){
        state.wrongMastery.streak[key][idx] = (state.wrongMastery.streak[key][idx] || 0) + 1;
      }
    } else {
      state.wrongMastery.pool[key][idx] = true;
      state.wrongMastery.streak[key][idx] = 0;
    }
    saveWrongMastery();

    state.sheetOpen = true; // 정답/오답 상관없이 해설 시트를 띄운다
    saveProgress();
    syncPush(); // 동기화 연결돼 있으면 클라우드에도 즉시 반영(연결 안 돼 있으면 아무 동작 안 함)
    render(true);
  }

      let answered=0, correct=0;

    document.getElementById('backHomeBtn').onclick = ()=>{ goHomeOrContinueGlobalReview(); };

      if(filtered){

        filtered.forEach(i=>{ if(state.progress[key]) delete state.progress[key][i]; });
      } else {
        delete state.progress[key];
        state.roundArmed[key] = true; // 챕터를 진짜 처음부터 다시 시작하는 것이므로 회독 자격을 재충전한다.

  // "⚡ 숫자 뽀개기.zip" 전체를 다 풀었을 때 보여주는 전용 완료 화면. renderComplete는 챕터 하나
  // 기준이라 그대로 못 쓰고(NUM 문제는 여러 챕터에 흩어져 있음), 전체 NUM 문제 범위를 기준으로
  // 통계를 내고 "처음부터 다시 풀기"도 그 전체 범위(모든 챕터의 NUM 문제)를 초기화한다.
  function renderNumComplete(){
    const map = {}; // { chapterKey: [NUM 인덱스, ...] }
    allChapterKeys().forEach(k=>{
      const idxs = numIndicesOf(k);
      if(idxs.length) map[k] = idxs;
    });

        <div class="score-row">

        <button class="btn btn-primary" id="retryBtn">처음부터 다시 풀기</button>
        <div style="height:10px"></div>

      </div>

    document.getElementById('homeBtn2').onclick = ()=>{ state.view='home'; render(); };
    document.getElementById('backHomeBtn').onclick = ()=>{ state.view='home'; render(); };
    document.getElementById('retryBtn').onclick = ()=>{
      // 모든 챕터의 NUM 문제 기록만 지운다(같은 챕터 안의 NUM 아닌 문제 기록은 안 건드림).
      Object.keys(map).forEach(k=>{
        map[k].forEach(i=>{ if(state.progress[k]) delete state.progress[k][i]; });
      });
      saveProgress();
      startGlobalNumReview();
