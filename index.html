칙", "행정 절차를 규율하는 공정·투명의 원칙", "상호 신뢰를 바탕으로 한 신의성실의 원칙"], "answer": 3, "explanation": "* 정답 (③): '공정·투명의 원칙'은 조달 행정 및 공법상의 원칙이며, 계약 당사자 관계를 규율하는 민법상(사법상) 원칙에 해당하지 않습니다.", "source": null}, {"num": 5, "category1": "1. 공공계약 관련 민법 규정의 이해", "category2": "1. 계약의 성립 관련 규정", "question": "국가계약법령상 정부계약의 의의와 법적 성질에 대한 설명으로 가장 올바르지 않은 것은?", "options": ["행정 목적을 위한 사법상 계약이다.", "대가적 의미를 지니는 쌍무계약이다.", "우월적 지위에서 맺는 편무계약이다.", "예산 범위 내의 공법적 제약을 받는다."], "answer": 3, "explanation": "* 정답 (③): 정부계약은 당사자가 서로 대가적 의미를 지니는 의무를 부담하는 '쌍무계약'이며, 공권력을 통한 '편무계약'이 아닙니다.", "source": null}, {"num": 6, "category1": "1. 공공계약 관련 민법 규정의 이해", "category2": "2. 계약의 효력 관련 규정", "question": "[상황] 계약 상대방을 착각해 잘못된 상대와 계약을 체결하거나, 상대방의 협박에 못 이겨 계약서에 서명한 경우가 있다. 이러한 사례들이 공통적으로 속하는 민법상 개념은?", "options": ["계약의 해제", "채무불이행", "의사표시의 하자", "부당이득"], "answer": 3, "explanation": "* 정답 (③): 착오, 사기·강박에 의한 의사표시는 비진의 의사표시·통정허위표시와 함께 민법상 의사표시의 하자에 해당함.", "source": "민법 제107조~제110조"}, {"num": 7, "category1": "1. 공공계약 관련 민법 규정의 이해", "category2": "3. 계약의 해제·해지에 관한 규정", "question": "[상황] 임대차 계약을 중도에 끝내는 경우와, 매매계약을 처음부터 없었던 것으로 되돌리는 경우가 있다. 전자와 후자에 각각 해당하는 개념을 옳게 짝지은 것은?", "options": ["전자=해지, 후자=해제", "전자=해제, 후자=해지", "전자·후자 모두 해지", "전자·후자 모두 해제"], "answer": 1, "explanation": "* 정답 (①): 임대차처럼 계속적 계약을 장래에 향해 끝내는 것은 해지, 매매처럼 계약을 소급해 처음부터 무효화하는 것은 해제임.", "source": "민법 제543조~제550조"}, {"num": 8, "category1": "1. 공공계약 관련 민법 규정의 이해", "category2": "4. 도급·위임에 관한 규정", "question": "[상황] 건설사가 건물 완공을 목표로 계약을 체결했고, 완공 후 하자가 발견되면 보수 책임을 진다는 조항이 있다. 이 계약의 유형으로 가장 적절한 것은?", "options": ["임치", "화해", "위임", "도급"], "answer": 4, "explanation": "* 정답 (④): 일의 완성을 목적으로 하고 완성물의 하자에 대해 담보책임을 지는 계약은 도급이며, 사무처리 자체를 목적으로 하는 위임과 구분됨.", "source": "민법 제664조·제667조"}, {"num": 9, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "1. 추정가격 및 예정가격 결정", "question": "[상황] 담당자가 개찰이 끝나기 전 낙찰 예정업체에게 '예정가격을 미리 알려달라'는 요청을 받았다. 이 요청에 응해도 되는지에 대한 설명으로 가장 적절한 것은?", "options": ["응해도 된다. 예정가격은 추정가격과 달리 사전 공개가 원칙이다", "예정가격은 부가가치세를 제외해 산정하므로 공개해도 무방하다", "응해도 된다. 예정가격은 낙찰자 결정과 무관한 참고자료일 뿐이다", "응하면 안 된다. 예정가격은 개찰 전까지 공개되지 않으며 낙찰자·계약금액 결정의 기준이 되므로 사전 유출은 부정행위이다"], "answer": 4, "explanation": "* 정답 (④): 예정가격은 개찰 전까지 비공개이며 낙찰자·계약금액 결정의 기준이 되므로, 사전 유출 요청에 응하는 것은 부정행위에 해당함.", "source": "국가계약법 시행령 제2조·제7조의2"}, {"num": 10, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "1. 추정가격 및 예정가격 결정", "question": "[상황] 한 담당자가 복수예비가격 제도의 목적을 '절차를 빠르게 끝내기 위한 것'이라고 설명했다. 이 설명에 대한 평가로 가장 적절한 것은?", "options": ["이 제도는 목적 자체가 정해져 있지 않다", "옳지 않다. 이 제도는 특정인이 사전에 예정가격을 알 수 없도록 해 입찰의 공정성을 확보하는 데 주된 목적이 있다", "옳다. 신속성과 공정성은 동일한 개념이다", "옳다. 신속성이 유일한 목적이다"], "answer": 2, "explanation": "* 정답 (②): 복수예비가격 제도는 신속성보다 예정가격 사전 유출을 막아 공정성을 확보하는 데 주된 목적이 있음.", "source": "국가계약법 시행령 제7조의2"}, {"num": 11, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "1. 추정가격 및 예정가격 결정", "question": "예정가격 결정 전, 예산에 계상된 금액 등을 기준으로 부가세 및 관급자재 대금을 제외하고 산정한 가격은?", "options": ["고시금액", "기초금액", "예정가격", "추정가격"], "answer": 4, "explanation": "* 정답 (④): 부가세 등을 제외한 순수 사업 예산 기준액은 '추정가격'입니다. (기초금액, 예정가격 등과 엄격히 구별됨)", "source": null}, {"num": 12, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "1. 추정가격 및 예정가격 결정", "question": "국가계약법령상 입찰 및 계약방법을 결정하는 '추정가격' 기준에 대한 설명으로 올바르지 않은 것은?", "options": ["국제입찰 의무 대상은 추정가격이 고시금액 이상인 경우이다.", "지역제한경쟁입찰은 추정가격이 고시금액 미만일 때 적용된다.", "일반적인 물품 소액수의계약 한도는 추정가격 1억 원 이하이다.", "물품 제조·구매 지명경쟁입찰은 추정가격 1억 원 미만으로 제한된다."], "answer": 4, "explanation": "* 정답 (④): 특수물품 제조 및 구매에 대한 지명경쟁입찰은 추정가격 1억 원 미만이 아니라 '1억 원 이하'인 경우에 가능합니다.", "source": null}, {"num": 13, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "1. 추정가격 및 예정가격 결정", "question": "전자입찰의 전체 진행 절차 중, 기초금액을 바탕으로 생성된 '예정가격'이 실질적인 효력을 발휘하여 결정되는 단계는?", "options": ["개찰 단계", "공고 단계", "투찰 단계", "계약 단계"], "answer": 1, "explanation": "* 정답 (①): 투찰 시점에는 업체와 발주기관 모두 최종 예정가격을 알 수 없으며, 투찰 마감 후 '개찰'을 진행할 때 난수 추첨 등을 통해 예정가격이 확정되어 낙찰 기준이 됩니다.", "source": null}, {"num": 14, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "1. 추정가격 및 예정가격 결정", "question": "예산을 확정하기 어렵거나 긴급한 사유로 1인 견적구매, 계산계약, 기술제안입찰, 일괄입찰 등을 진행할 때 예외적으로 적용하는 예정가격 결정 방식은?", "options": ["시스템 난수 추첨을 통해 결정하는 복수예가", "가장 낮은 견적서를 제출한 업체의 최저가격", "기초금액 자체를 예가로 확정 짓는 단일예가", "예정가격을 아예 작성하지 않고 진행하는 비예가"], "answer": 4, "explanation": "* 정답 (④): 일괄입찰(턴키), 대안입찰, 협상에 의한 계약 등 업체가 가격과 기술을 자율적으로 제안해야 하는 특수한 형태의 계약에서는 예정가격을 생략하는 '비예가' 방식을 씁니다.", "source": null}, {"num": 15, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "1. 추정가격 및 예정가격 결정", "question": "입찰 참가 업체들이 투찰 금액을 결정하는 절대적 기준이 되는 '기초금액'의 법정 공개 시점으로 가장 원칙적이고 올바른 것은?", "options": ["업체의 철저한 비밀 유지를 위해 개찰이 완료되기 전까지는 시스템상 절대 공개하지 않는다.", "투찰의 기준이 되므로 입찰공고와 동시에, 또는 늦어도 입찰서 접수 개시일 5일 전까지는 공개해야 한다.", "입찰의 공정성을 확보하기 위해 개찰을 완료하고 낙찰예정자를 선정한 직후에 즉시 공개한다.", "개찰 후 적격심사 대상자로 선정된 1~3순위 업체가 심사 서류를 제출할 때에만 한정하여 공개한다."], "answer": 2, "explanation": "* 정답 (②): 기초금액은 업체들이 예가를 유추하고 투찰 금액을 산정하는 기준표이므로, 투찰 시작 전(접수 개시일 5일 전)에 미리 공개하여 분석할 시간을 주어야 합니다.", "source": "조달청 내자구매업무 처리규정 제30조"}, {"num": 16, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "1. 추정가격 및 예정가격 결정", "question": "기초금액이 1억 원으로 산정된 일반용역 입찰에서, 해당 기관의 복수예비가격 산출 범위가 '98% ~ 102%'로 설정되었다면 복수예비가격이 생성되는 최소값과 최대값은?", "options": ["9,900만 원 / 1억 1백만 원", "1억 원 / 1억 2백만 원", "9,000만 원 / 1억 1천만 원", "9,800만 원 / 1억 2백만 원"], "answer": 4, "explanation": "* 정답 (④): 1억 원의 98%는 9,800만 원, 102%는 1억 200만 원(1억 2백만 원)이므로 이 범위 내에서 15개의 복수예비가격이 무작위로 생성됩니다.", "source": null}, {"num": 17, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "1. 추정가격 및 예정가격 결정", "question": "국가계약법령상 공공조달 계약 업무에 적용되는 여러 금액 기준 중, '추정가격'에 대한 올바른 법적·실무적 정의는?", "options": ["낙찰자 및 계약금액 결정의 기준으로 삼기 위해 발주기관이 사전에 미리 산정하여 비치해 두는 금액", "복수예비가격을 산정하기 위한 기준이 되며 입찰서 접수 개시 전에 전자조달시스템에 공개하는 금액", "국제입찰 대상 여부 판단 등의 기준으로 삼기 위해 예정가격 결정 전에 산정하는 부가가치세 제외 금액", "계약 목적물 완성에 필요한 총 사업비로서 산정된 금액에 부가가치세와 관급자재대가를 모두 합산한 금액"], "answer": 3, "explanation": "* 정답 (③): 「국가를 당사자로 하는 계약에 관한 법률 시행령」 제2조 제1호 및 제7조에 따라 '추정가격'은 국제입찰 대상 여부를 판단하는 기준 등으로 삼기 위해 산정된 가격을 말하며, 실무적으로 부가가치세와 관급자재대가를 제외한 순수 금액을 의미합니다. (①은 예정가격, ②는 기초금액, ④는 추정금액에 대한 설명입니다.)", "source": null}, {"num": 18, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "1. 추정가격 및 예정가격 결정", "question": "국가계약 및 지방계약 주요 용어 정의에 대한 설명으로 가장 옳은 것은?", "options": ["예정가격 결정 이후에 비로소 산정되는 기준 금액을 추정가격이라 칭한다.", "국제입찰 적용 대상 기준 금액은 조달청장이 단독으로 정하여 고시한다.", "지방계약법상 교육·과학·체육 사항은 행안부장관을 교육부장관으로 간주한다.", "계약체결 전 전체 예산 규모를 뜻하는 예산액은 예정가격과 항상 동일하다."], "answer": 3, "explanation": "정답 (③) 지방계약법 제3조에 따라 교육 등은 교육부장관 소관임 / ① 추정가격은 예가 결정 전 가격임 / ② 재경부·행안부장관 고시", "source": "지방계약법"}, {"num": 19, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "1. 추정가격 및 예정가격 결정", "question": "원가계산 시 일반관리비 산정 기준 금액에 대한 설명으로 가장 옳은 것은?", "options": ["일반관리비를 산정하기 위한 기준 합계 금액에는 이윤 비목도 포함된다.", "일반관리비는 재료비, 노무비, 경비 합계액을 기준으로 일정 비율을 곱한다.", "계약목적물 제조에 소요되는 직접 노무비는 일반관리비 기준에서 제외된다.", "계약목적물 제조에 소요되는 모든 제반 경비는 일반관리비 대상이 아니다."], "answer": 2, "explanation": "정답 (②) 일반관리비는 (재료비+노무비+경비) 합계에 요율을 곱함 / ① 이윤은 제외됨", "source": "예정가격작성"}, {"num": 20, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "1. 추정가격 및 예정가격 결정", "question": "예정가격 결정을 위해 우선적으로 적용하는 가격 산정 기준 순서로 가장 옳은 것은?", "options": ["원가계산가격 - 거래실례가격 - 표준시장단가 - 견적가격 - 감정가격", "감정가격 - 유사 거래실례가격 - 견적가격 - 거래실례가격 - 원가계산", "거래실례가격 - 원가계산가격 - 감정가격 및 유사 거래실례가격 - 견적가격", "거래실례가격 - 감정가격 - 원가계산가격 - 유사 거래실례가격 - 견적가격"], "answer": 3, "explanation": "정답 (③) 1. 거래실례, 2. 원가계산, 3. 감정가·유사거래·견적가 순임", "source": "국가계약법 시행령 제9조"}, {"num": 21, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "1. 추정가격 및 예정가격 결정", "question": "공공계약 예정가격 결정 시 원칙적인 산출 기준 단위로 가장 적절한 것은?", "options": ["계약목적물 전체 단가 평균", "월별 단위 환산 납품 가액", "계약목적물 전체에 대한 총액", "시장 표준 기준 시중 실례 단가"], "answer": 3, "explanation": "정답 (③) 원칙적으로 계약목적물 가격의 '총액'에 대하여 예정가격을 결정함", "source": "국가계약법 시행령 제8조"}, {"num": 22, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "1. 추정가격 및 예정가격 결정", "question": "일정 기간 계속하여 제조·구매하는 계약의 경우, 예정가격 결정 시 예외적으로 적용할 수 있는 산출 기준은?", "options": ["총사업비의 합산 금액", "계약목적물의 단가", "분기별 산정 추정가격", "조달청장의 고시 금액"], "answer": 2, "explanation": "정답 (②) 국가계약법 제8조 단서에 따라 일정 기간 계속되는 제조·공사·수리·가공·매매·공급·임차 등 계약은 예외적으로 '단가'에 대해 예정가격을 결정할 수 있음(단가계약)", "source": "국가계약법 시행령 제8조"}, {"num": 23, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "1. 추정가격 및 예정가격 결정", "question": "다음 중 국가계약법령상 예정가격의 작성을 생략할 수 있는 경우로 가장 옳지 않은 것은?", "options": ["국가기관이나 지방자치단체와 계약을 체결하는 경우", "협상에 의한 계약이나 경쟁적 대화에 의한 계약", "원가계산이 곤란하여 개산계약을 체결하는 경우", "전자조달시스템을 통해 견적서를 제출받는 수의계약"], "answer": 4, "explanation": "정답 (④) 견적서를 제출하게 하는 수의계약은 예정가격 생략 대상에서 제외되므로 원칙대로 작성해야 함 / ①·②·③은 모두 예정가격 작성 생략 가능 사유임", "source": "국가계약법 시행령 제7조의2"}, {"num": 24, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "2. 계약의 방법에 관한 규정", "question": "[상황] 지방자치단체가 지역경제 활성화를 위해 관내 업체에 입찰 참가 우대 조건을 부여했다. 이 조치가 가능한 근거로 가장 적절한 것은?", "options": ["지역업체 우대는 모든 공공기관에 동일하게 적용되는 국가계약법 조항이다", "국가계약법과 지방계약법은 완전히 동일해 이런 우대가 불가능하다", "지방자치단체는 어떠한 법령의 적용도 받지 않는다", "지방계약법은 국가계약법과 기본 골격은 유사하되, 지역제한입찰 등 지역업체 우대 규정을 별도로 두고 있다"], "answer": 4, "explanation": "* 정답 (④): 지방계약법은 국가계약법과 기본 골격은 유사하지만, 지역경제 활성화를 위한 지역제한입찰 등 지역업체 우대 규정을 별도로 두고 있음.", "source": "국가계약법, 지방계약법 비교"}, {"num": 25, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "2. 계약의 방법에 관한 규정", "question": "[상황] 발주기관이 차세대 정보시스템 구축 용역을 발주하면서, 가격뿐 아니라 시스템 성능·안정성·개발사의 기술력 등을 종합 평가해 계약상대자를 정하려 한다. 가장 적합한 계약방법은?", "options": ["일반 물품 구매 방식의 지명경쟁", "협상에 의한 계약", "단순 최저가 경쟁입찰", "단순 수의계약"], "answer": 2, "explanation": "* 정답 (②): 협상에 의한 계약은 기술성·전문성 평가가 중요한 계약에 적용되며, 정보시스템 구축처럼 비가격적 요소가 중요한 사업에 적합함.", "source": null}, {"num": 26, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "2. 계약의 방법에 관한 규정", "question": "정부계약의 실무적·학술적 분류 기준에 해당하지 않는 것은?", "options": ["재정의 수입 또는 지출 여부에 따른 분류", "조달 목적물이 무엇인가에 따른 세부 분류", "입찰 전 계약금액의 확정 여부에 따른 분류", "조달청 내부의 전자 결재 방식에 따른 분류"], "answer": 4, "explanation": "* 정답 (④): 기관 내부의 전자 결재 방식이나 문서 양식 등은 정부계약을 구분하는 학술적·법적 분류 기준이 아닙니다.", "source": null}, {"num": 27, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "2. 계약의 방법에 관한 규정", "question": "정부계약을 다양한 실무적 기준에 따라 분류할 때, 오직 '계약체결의 형태'에 속하는 항목으로만 올바르게 나열된 것은?", "options": ["사전에 금액을 고정하는 확정계약, 여러 업체가 참여하는 공동계약, 수년간 이행하는 장기계속계약", "미리 단가만 정해두는 단가계약, 전체 대가를 고정하는 총액계약, 무형의 기술을 제공받는 용역계약", "사후에 실비를 정산하는 개산계약, 단일 업체가 수행하는 단독계약, 참가 자격을 제한하는 제한경쟁", "국회 의결을 받아두는 계속비계약, 경쟁을 배제하고 맺는 수의계약, 건축물을 신축하는 시설공사계약"], "answer": 1, "explanation": "* 정답 (①): 계약체결 형태에는 금액(확정/개산), 수량(총액/단가), 당사자 수(단독/공동), 이행 기간(장기계속/계속비) 기준이 모두 포함됩니다. 반면 용역계약과 시설공사는 '목적물', 제한경쟁과 수의계약은 '계약(입찰) 방법'에 해당하여 오답입니다.", "source": null}, {"num": 28, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "2. 계약의 방법에 관한 규정", "question": "계약 대상이 되는 '목적물의 성질'에 따른 공공계약의 분류로 볼 수 없는 것은?", "options": ["무형의 가치를 제공받는 각종 용역계약", "유형의 재화를 획득하는 물품구매계약", "수년에 걸쳐 예산을 나누는 장기계속계약", "건축물이나 토목을 수행하는 시설공사계약"], "answer": 3, "explanation": "* 정답 (③): 장기계속계약은 조달 목적물이 아니라 '계약체결 형태(기간 장단 및 예산 확보 방식)'에 따른 분류입니다.", "source": null}, {"num": 29, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "2. 계약의 방법에 관한 규정", "question": "공공계약을 실무적으로 분류하는 정식 체계 중에서, 일반적으로 통용되지 않는 분류 기준은?", "options": ["최종 계약금액이 사전에 확정적으로 결정되어 있는지에 따른 금액 확정 여부 분류", "최종 납품 및 인도가 이루어지는 지리적 장소가 결정되었는지에 따른 장소 확정 여부 분류", "목적물의 납품 수량이 체결 시점에 미리 특정되어 있는지에 따른 물량 확정 여부 분류", "사업 이행에 필요한 시일이 회계 연도를 넘기는지에 따른 이행 기간 장단 여부 분류"], "answer": 2, "explanation": "* 정답 (②): 계약의 금액, 수량, 이행기간 확정 여부는 공식적인 정부계약 분류 기준이나, '장소의 물리적 확정 여부'는 정식 분류 체계가 아닙니다.", "source": null}, {"num": 30, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "2. 계약의 방법에 관한 규정", "question": "상용화되지 않은 개발시제품 제조나 긴급한 재난 복구 등 사전에 원가를 정확히 계산할 수 없을 때 적용하는 계약은?", "options": ["낙찰 금액을 사전에 고정하는 확정계약", "이행 후 실비를 사후 정산하는 개산계약", "단가만 합의하여 계속 수급하는 단가계약", "일부 비목별로만 사후 정산하는 조건부계약"], "answer": 2, "explanation": "* 정답 (②): 긴급복구나 개발시제품 등 사전에 예정가격을 도저히 정할 수 없는 경우에는 정산조건부인 '개산계약' 방식으로 우선 추진합니다.", "source": null}, {"num": 31, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "2. 계약의 방법에 관한 규정", "question": "'계약 목적물에 대한 수량의 확정 여부'를 기준으로 한 계약 분류 체계에 속하지 않는 제도는 무엇인가?", "options": ["품질이 유사한 다수 업체를 등록시켜 선택권을 부여하는 다수공급자계약", "연도별로 예산을 분할하여 차수계약 형식으로 맺는 장기계속계약", "공통 규격 품목을 대상으로 단가만 미리 정해두는 제3자를 위한 단가계약", "소모성 물품에 대해 수량을 고정하지 않고 개별 단가만 합의하는 단가계약"], "answer": 2, "explanation": "* 정답 (②): 장기계속계약은 수량의 확정 여부가 아니라 '계약이행기간의 장단' 및 당해 연도 예산 반영 방식에 따른 분류입니다.", "source": null}, {"num": 32, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "2. 계약의 방법에 관한 규정", "question": "수년에 걸쳐 이행되는 대규모 국가 사업에 적용되는 '장기계속계약'과 '계속비계약'의 차이점으로 가장 바른 것은?", "options": ["두 계약 모두 사업 완료 마지막 연도에 대금을 일괄 지급하는 공통점이 있다.", "계속비계약은 예산 한도 내에서만 차수별로 계약하는 매우 유연한 방식이다.", "장기계속계약은 당해 연도 예산으로 차수계약하고, 계속비는 총액으로 연속 이행한다.", "장기계속계약은 사업 총액과 연부액을 국회의 의결을 거쳐 미리 엄격히 확정한다."], "answer": 3, "explanation": "* 정답 (③): 장기계속계약은 당해 연도 확보 예산만으로 연도별 차수계약을 맺지만, 계속비계약은 국회 의결을 받아 연부액에 따라 끊김 없이 이행합니다.", "source": null}, {"num": 33, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "2. 계약의 방법에 관한 규정", "question": "다수의 업체가 상호 협력하여 대형 조달 사업을 수행하는 '공동계약' 제도에 대한 설명 중 사실과 명백히 다른 것은?", "options": ["계약 목적물 성질상 부적절한 경우 외에는 중소기업 보호를 위해 원칙적으로 허용한다.", "분담이행방식은 각자의 출자비율에 따라 자본을 섞어 연대하여 이행하는 방식을 말한다.", "책임 소재를 명확히 하기 위해 공동이행방식의 공동수급체 구성원은 5인 이하로 제한된다.", "공동계약의 유형은 크게 자본을 섞는 공동이행방식과 과업(공종)을 분담하는 분담이행이 있다."], "answer": 2, "explanation": "* 정답 (②): 출자비율에 따라 '연대하여' 이행하는 방식은 '공동이행방식'입니다. '분담이행방식'은 면허나 공종에 따라 각자 과업을 분담하여 독립적으로 책임지는 방식입니다.", "source": null}, {"num": 34, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "2. 계약의 방법에 관한 규정", "question": "대형 사업을 다수가 수행하는 공동계약 유형 중 '공동이행방식'과 '분담이행방식'의 차이를 명확히 구분한 것은?", "options": ["공동이행은 공사 구역을 엄격히 나누고, 분담이행은 지분율에 따라 손익을 연대 책임지는 방식이다.", "공동이행은 대표사가 모든 하도급 책임을 지고, 분담이행은 구성원 전원이 직접 시공하는 방식이다.", "공동이행은 대표사 1인만 무한 책임을 지고, 분담이행은 각 지분율로 발주처와 개별 계약하는 방식이다.", "공동이행은 자본을 섞어 출자비율로 연대 이행하며, 분담이행은 분담 내용을 각자 독립 이행하는 방식이다."], "answer": 4, "explanation": "* 정답 (④): 공동이행은 구성원 전원이 출자비율에 따라 '연대책임'을 지는 방식이며, 분담이행은 각자가 맡은 공종만 독립적으로 책임지고 이행하여 연대책임이 없는 방식입니다.", "source": null}, {"num": 35, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "2. 계약의 방법에 관한 규정", "question": "공공계약을 실무적으로 세분화할 때, '계약금액의 사전 확정 여부'를 기준으로 분류하는 방식에 해당하지 않는 것은?", "options": ["원가 계산을 통해 예정가격 내에서 낙찰 금액을 확정 지어 체결하는 가장 통상적인 확정계약", "정확한 원가 산정이 불가능하여 대략 체결 후 이행 완료 시점에 실비로 사후 정산하는 개산계약", "기술 능력과 가격을 종합 심층 평가하여 가장 유리한 조건을 제시한 자와 맺는 협상에 의한 계약", "일부 비목별 금액을 결정할 수 없어 일단 체결 후 이행 뒤 해당 비목만 정산하는 조건부계약"], "answer": 3, "explanation": "* 정답 (③): 확정, 개산, 조건부계약은 '금액의 확정 여부'에 따른 분류이나, '협상에 의한 계약'은 계약 체결 형태가 아닌 '낙찰자를 선정하는 방식(결정 기준)'의 종류입니다.", "source": null}, {"num": 36, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "2. 계약의 방법에 관한 규정", "question": "정부계약의 유형 및 회계연도 예산 집행 특성에 대한 설명으로 가장 올바른 것은?", "options": ["장기계속계약은 사업 총액으로 입찰하는 것이 불가능하므로, 각 회계연도 예산 범위 내에서 매년 별도의 새로운 단가 입찰을 실시해야 한다.", "단일공사로서 설계서 등에 의해 전체 사업내용이 확정된 공사는 지역 업체 참여 확대를 위해 가급적 잘게 분할하여 계약하는 것이 원칙이다.", "성질상 중단할 수 없는 상시 용역 계약이라도 예산 배정 문제로 반드시 해당 회계연도가 공식 시작된 이후에만 계약을 체결해야 한다.", "'개산계약(槪算契約)'은 계약 체결 시점에 목적물의 금액을 확정할 수 없을 때 맺는 방식이며, 이행 완료 후 반드시 사후정산 절차를 거쳐야 한다."], "answer": 4, "explanation": "* 정답 (④): 개발 시제품 제작 등 사전에 원가를 확정할 수 없는 경우 개산계약을 체결하며, 이는 사후 원가 검토를 통한 정산이 필수적입니다. (오답 노트: ① 장기계속계약은 총액으로 입찰 집행, ② 단일공사 분할계약 금지 원칙(시행령 제68조), ③ 임차·운송 등 성질상 중단할 수 없는 계약은 회계연도 개시 전이라도 미리 체결 가능(법 제20조))", "source": "「국가계약법」 제23조 및 동법 시행령 제70조"}, {"num": 37, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "2. 계약의 방법에 관한 규정", "question": "공동수급체를 구성하여 입찰에 참여하는 공동계약 제도에 대한 설명으로 가장 올바른 것은?", "options": ["공동수급체의 구성원은 계약 이행에 필요한 면허, 등록 등의 자격요건을 대표사 1인만 갖추고 있으면 나머지 구성원은 자격이 없어도 무방하다.", "건설업 등의 균형발전을 위해 공동계약을 체결할 때, 담합 방지를 위해 반드시 공사현장 관할 구역 외의 업체를 대표사로 지정해야 한다.", "국가계약법령상 공동계약은 강제 규정이 아니며, 발주기관이 목적과 성질을 고려하여 필요하다고 인정할 때 재량으로 채택할 수 있다.", "광역시·도는 관할구역 내 기관의 공통 필요 물자에 대해 타 지자체와의 형평성을 이유로 제3자를 위한 단가계약을 체결할 권한이 없다."], "answer": 3, "explanation": "* 정답 (③): 법령상 \"공동계약에 의할 수 있다\"라고 규정되어 있어, 목적과 성질상 부적합한 경우 단독 계약으로 진행할 수 있는 발주기관의 재량 사항입니다. (① 구성원 각자가 요건 충족 필요)", "source": "「국가계약법」 제25조"}, {"num": 38, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "2. 계약의 방법에 관한 규정", "question": "정부는 계속적인 제조, 수리, 공급 등을 요하는 물품에 대하여 일정 기간 동안 단가만을 정하여 계약을 맺고, 납품 요구 시마다 수량에 따라 대금을 지급하는 형태의 계약을 체결할 수 있습니다. 이 계약 방식의 명칭으로 올바른 것은?", "options": ["개산계약", "희망수량경쟁계약", "단가계약", "사후정산조건부계약"], "answer": 3, "explanation": "* 정답 (③): 일정 기간 계속하여 제조나 공급이 필요한 경우 총 수량을 확정하지 않고 '단가(Unit Price)'에 대해서만 경쟁하여 체결하는 방식을 단가계약이라 합니다. 다수공급자계약(MAS)의 기본 형태입니다.", "source": "「국가계약법」 제22조"}, {"num": 39, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "2. 계약의 방법에 관한 규정", "question": "입찰 전에 예정가격을 구성하는 일부 비목별 금액을 명확히 결정할 수 없는 경우 예외적으로 채택하는 ( ㉮ )계약 방식과, 계약 이행 완료 후 실제 투입된 비용을 검토하여 최종 금액을 ( ㉯ )하는 후속 절차를 바르게 짝지은 것은?", "options": ["㉮ 총액계약 - ㉯ 감액", "㉮ 사후원가검토조건부계약(개산계약) - ㉯ 정산", "㉮ 단가계약 - ㉯ 설계변경", "㉮ 희망수량계약 - ㉯ 확정"], "answer": 2, "explanation": "* 정답 (②): 신제품 개발 등 사전에 원가 산정이 곤란한 경우 일부 비목을 사후에 원가검토 조건으로 맺는 '개산계약(사후원가검토조건부계약)'을 체결하며, 완료 후 원가계산기관의 검토를 거쳐 대금을 '정산'해야 합니다.", "source": "「국가계약법 시행령」 제9조 및 제73조"}, {"num": 40, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "3. 입찰 및 낙찰 절차 규정", "question": "[상황] A기관이 B기업을 낙찰자로 통지했으나, B기업이 사정을 이유로 계약체결을 거부했다. B기업이 주장할 수 없는 것으로 가장 적절한 것은?", "options": ["낙찰자 결정은 본계약의 예약 성립으로 볼 수 있다는 이해", "정당한 이유 없이 거부했으므로 입찰보증금이 귀속될 수 있다는 점에 대한 이의", "아직 본계약이 성립하지 않았으므로 이행을 강제당하지 않는다는 주장", "예약상 채무불이행에 대한 책임을 질 수 있다는 점"], "answer": 2, "explanation": "* 정답 (②): B기업 입장에서는 오히려 입찰보증금 귀속에 이의를 제기하기 어려우며, 정당한 이유 없는 계약체결 거부는 예약상 채무불이행이 되어 입찰보증금이 귀속될 수 있음.", "source": null}, {"num": 41, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "3. 입찰 및 낙찰 절차 규정", "question": "[상황] 신입 직원이 '적격심사낙찰제는 기술제안서를 평가해 순위를 매기는 방식이 핵심'이라고 잘못 이해하고 있었다. 올바른 설명은?", "options": ["입찰가격 점수만으로 결정하는 방식이다", "최저가 입찰자부터 순서대로 계약이행능력을 심사해 종합평점이 기준 이상인 최초 통과자를 낙찰자로 정하는 방식이다", "기술제안서 평가가 핵심이다", "모든 공공계약에 예외 없이 적용되는 유일한 방식이다"], "answer": 2, "explanation": "* 정답 (②): 적격심사낙찰제는 최저가 입찰자부터 순차적으로 계약이행능력(시공경험·재무상태 등)을 심사해 기준 이상인 최초 통과자를 낙찰자로 정하는 방식임.", "source": null}, {"num": 42, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "3. 입찰 및 낙찰 절차 규정", "question": "[상황] 신입 직원이 경쟁입찰 흐름을 '낙찰자결정 → 입찰공고 → 예정가격결정 → 입찰서제출' 순서로 잘못 외우고 있었다. 올바른 순서는?", "options": ["입찰공고 → 입찰서제출 → 예정가격결정 → 낙찰자결정", "입찰서제출 → 입찰공고 → 예정가격결정 → 낙찰자결정", "낙찰자결정 → 예정가격결정 → 입찰공고 → 입찰서제출", "예정가격결정 → 입찰공고 → 입찰서제출 → 낙찰자결정"], "answer": 1, "explanation": "* 정답 (①): 일반적인 경쟁입찰은 입찰공고 → 입찰서 제출 → 예정가격 결정 → 낙찰자 결정 순으로 진행됨.", "source": null}, {"num": 43, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "4. 계약의 체결 및 이행 규정", "question": "[상황] 계약담당공무원과 계약상대자가 계약서 초안까지 주고받았지만 아직 서로 기명·날인하지 않았다. 국가계약법상 이 시점에서 계약이 성립했다고 볼 수 있는가?", "options": ["성립했다. 낙찰자 결정 통지 시점에 이미 확정되었다", "성립 여부는 계약보증금 납부 시점에 좌우된다", "성립하지 않았다. 계약은 계약서에 양 당사자가 기명·날인함으로써 확정된다", "성립했다. 초안 송부만으로 계약이 확정된다"], "answer": 3, "explanation": "* 정답 (③): 국가계약법은 계약담당공무원과 계약상대자가 계약서를 작성하고 기명·날인함으로써 계약이 확정된다고 규정함.", "source": "국가계약법 제11조"}, {"num": 44, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "4. 계약의 체결 및 이행 규정", "question": "[상황] 계약상대자가 '계약보증금은 입찰 참가를 위해 내는 돈 아니냐'고 물었다. 올바른 설명은?", "options": ["아니다. 그것은 입찰보증금이며, 계약보증금은 계약금액의 10% 이상을 계약체결 시 납부해 이행을 담보하는 것으로 정상 이행 시 반환된다", "맞다. 계약을 이행해도 반환되지 않는다", "아니다. 계약보증금은 5% 이상만 내면 된다", "맞다. 입찰 참가 시 납부하는 것이다"], "answer": 1, "explanation": "* 정답 (①): 계약보증금은 계약체결 시 계약이행을 담보하기 위해 납부하는 것(계약금액 10% 이상)으로, 입찰 참가를 위한 입찰보증금과 구분되며 정상 이행 시 반환됨.", "source": "국가계약법 시행령 제50조·제51조"}, {"num": 45, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "4. 계약의 체결 및 이행 규정", "question": "[상황] 계약체결 후 65일이 지난 시점에 원자재 가격이 4% 상승해, 계약상대자가 물가변동에 따른 계약금액 조정을 신청했다. 이 신청의 인정 여부로 가장 적절한 것은?", "options": ["물가변동 조정 신청은 애초에 법령상 허용되지 않는다", "등락률 요건은 충족했으나 기간 요건(90일 이상)을 충족하지 못해 조정 대상이 아니다", "기간과 무관하게 등락률만 넘으면 항상 인정된다", "기간과 등락률 요건을 모두 충족했으므로 인정된다"], "answer": 2, "explanation": "* 정답 (②): 물가변동으로 인한 계약금액 조정은 계약체결 후 90일 이상 경과와 등락률(품목조정률·지수조정률) 3% 이상을 모두 충족해야 하므로, 65일 경과만으로는 요건 미충족임.", "source": "국가계약법 시행령 제64조"}, {"num": 46, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "4. 계약의 체결 및 이행 규정", "question": "[상황] 담당자가 건축물 주요구조체(기둥·보·내력벽 등)의 하자담보책임기간을 5년으로 잘못 기재했다. 올바른 기간은?", "options": ["10년", "1년", "3년", "5년"], "answer": 1, "explanation": "* 정답 (①): 건축물 주요구조체의 하자담보책임기간은 5년이 아니라 10년임(부위별로 1~10년 범위에서 차등 적용).", "source": "건설산업기본법 시행령 [별표4]"}, {"num": 47, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "4. 계약의 체결 및 이행 규정", "question": "[상황] 담당자가 지체상금 산정 원리를 '천재지변으로 지연되었어도 예외 없이 부과해야 한다'고 잘못 설명했다. 옳게 고친 설명은?", "options": ["천재지변 등 불가항력적 사유로 인한 지체에는 지체상금을 부과하지 않는다", "지체상금은 손해배상과 전혀 무관한 별개의 벌금이다", "지체상금은 지체일수와 관계없이 정액으로 부과된다", "천재지변 여부와 무관하게 항상 지체상금을 부과한다"], "answer": 1, "explanation": "* 정답 (①): 천재지변 등 불가항력적 사유로 인한 이행지체는 정당한 사유로 인정되어 지체상금이 부과되지 않음.", "source": "국가계약법 시행령 제74조"}, {"num": 48, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "4. 계약의 체결 및 이행 규정", "question": "정부계약의 체결 과정 및 계약보증금 제도에 대한 설명으로 가장 올바른 것은?", "options": ["장기계속공사 등은 당해 연도의 1차 계약금액이 아닌 사업 전체 규모인 총공사금액을 기준으로 계약보증금을 산정해야 한다.", "지방자치단체는 시스템 장애 대비를 위해 수기 문서로 계약서를 작성하는 것을 원칙으로 한다.", "계약보증금 납부를 예외적으로 면제할 때에는 별도 서류 없이 구두 지급각서로 갈음할 수 있다.", "계약담당자와 계약상대자가 구두로 최종 합의한 시점에 즉각적으로 계약이 확정된다."], "answer": 1, "explanation": "* 정답 (①): 장기계속계약은 전체 사업 규모에 대한 책임을 담보하기 위해, 1차 계약 체결 시 해당 연도 계약액이 아닌 '총공사(계약)금액'의 10% 이상을 보증금으로 납부해야 합니다. (오답 노트: ④ 서명/날인 필수, ② 전자문서 원칙, ③ 서면 지급각서 필수)", "source": "「국가계약법 시행령」 제50조"}, {"num": 49, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "4. 계약의 체결 및 이행 규정", "question": "정부 공사계약에 있어서 계약상대자의 이행보증 방법에 대한 설명으로 가장 올바른 것은?", "options": ["공사계약의 이행보증 방법은 현금 등을 납부하는 계약보증금 납부 방식 한 가지로만 엄격히 제한된다.", "발주기관은 계약상대자가 계약이행보증방법의 변경을 요청하는 경우, 관련 법령에 따라 1회에 한하여 이를 변경하게 할 수 있다.", "발주기관은 공사계약의 특성과 무관하게 항상 계약상대자가 두 가지 이행보증 방법 중 하나를 자유롭게 선택하도록 보장해야 한다.", "계약이행 보증 후 계약상대자가 계약이행보증방법의 변경을 요청하는 경우, 발주기관은 정당한 사유만 있다면 횟수 제한 없이 여러 번 변경하게 할 수 있다."], "answer": 2, "explanation": "* 정답 (②): 「국가계약법 시행령」 제52조 제2항에 따라, 계약이행보증방법의 변경 요청이 있는 경우 발주기관은 '1회에 한하여' 변경하게 할 수 있습니다. (오답 노트: ① 보증금 납부와 이행보증서 제출 두 가지가 있음, ③ 동조 제1항 단서에 따라 공사 특성상 필요한 경우 보증서 제출 방식으로 한정할 수 있으므로 항상 자유로운 것은 아님, ④ 1회 제한 규정 존재)", "source": "「국가계약법 시행령」 제52조"}, {"num": 50, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "5. 이의신청과 분쟁조정", "question": "[상황] 계약상대자가 '분쟁조정위원회의 조정안은 그 자체로 법원 판결과 동일하다'고 알고 있었다. 이 이해에 대한 평가로 가장 적절한 것은?", "options": ["정확하다. 조정안 자체가 확정판결과 동일한 효력을 갖는다", "정확하다. 조정 신청만으로 곧바로 확정된다", "이 위원회의 조정안은 어떤 경우에도 법적 효력이 없다", "부정확하다. 조정안은 권고적 효력을 가지며, 당사자가 수락하거나 일정 기간 이의를 제기하지 않을 때 비로소 재판상 화해와 같은 효력이 발생한다"], "answer": 4, "explanation": "* 정답 (④): 조정안 자체는 권고적 효력을 가질 뿐이며, 당사자 수락 또는 일정 기간 이의 미제기 시 재판상 화해와 동일한 효력이 발생함.", "source": "국가계약법 제29조"}, {"num": 51, "category1": "2. 공공계약(국가 및 지방) 법령의 이해", "category2": "5. 이의신청과 분쟁조정", "question": "[상황] 어느 업체가 국가에 대해 계약대금 채권을 보유했으나 4년째 청구하지 않고 방치했다. 앞으로 1년 안에 반드시 청구해야 하는 이유로 가장 적절한 것은?", "options": ["국가에 대한 금전채권은 3년간 행사하지 않으면 소멸하기 때문", "청구 기한에는 아무 제한이 없기 때문", "국가에 대한 금전채권은 5년간 행사하지 않으면 시효로 소멸하기 때문", "국가에 대한 채권은 10년까지 유효하기 때문"], "answer": 3, "explanation": "* 정답 (③): 국가재정법 제96조에 따라 금전급부를 목적으로 하는 국가에 대한 권리는 5년간 행사하지 않으면 시효로 소멸함.", "source": "국가재정법 제96조"}, {"num": 52, "category1": "3. 조달사업법령의 이해", "category2": "3. 대금지급 규정", "question": "[상황] 계약상대자가 '선금은 최대한 많이 받을수록 좋으니 계약금액 전액을 요청해도 된다'고 생각했다. 이 이해에 대한 평가로 가장 적절한 것은?", "options": ["옳다. 선금은 계약금액 100%까지 지급 가능하다", "옳다. 선금은 기성대가와 무관하게 별도로 지급된다", "옳지 않다. 선금은 계약금액의 일정 상한(통상 100분의 70 이내) 범위에서 지급되며, 기성대가 지급 시 정산된다", "옳지 않다. 선금 제도 자체가 존재하지 않는다"], "answer": 3, "explanation": "* 정답 (③): 선금은 계약금액 전액이 아니라 일정 상한(계약예규상 100분의 70 이내) 범위에서 지급되며, 기성대가 지급 시마다 정산됨.", "source": "계약예규(정부 입찰·계약 집행기준)"}, {"num": 53, "category1": "3. 조달사업법령의 이해", "category2": "3. 대금지급 규정", "question": "조달청이 사업을 대행하며 수요기관으로부터 징수하는 '구매수수료'에 대한 법적 설명으로 가장 옳지 않은 것은?", "options": ["징수되는 수수료 및 감면 비율은 납품 대금 총액의 100분의 20을 초과할 수 없다.", "수수료의 감면 및 세부 요율은 조달청장이 단독으로 임의 결정하여 즉시 고시한다.", "미리 대금을 지급받은 등 특정 요건 충족 시 조달청 내부 기준에 따라 감면할 수 있다.", "조달수수료는 조달특별회계의 세입으로 편입되며 재정경제부 장관과 협의하여 고시한다."], "answer": 2, "explanation": "* 정답 (②): 조달수수료율 및 감면 사항은 조달청장이 단독으로 결정하는 것이 아니라, 반드시 재정경제부 장관과 사전 협의를 거쳐야 합니다. (2026년 조직 개편에 따른 소관 부처 변경 반영)", "source": null}, {"num": 54, "category1": "3. 조달사업법령의 이해", "category2": "3. 대금지급 규정", "question": "조달청 총액계약 및 단가계약의 금액 구간별 '조달수수료율 산정 방식'으로 올바르게 연결된 것은?", "options": ["5천만 원 초과 1억 원 이하 총액계약: 일괄적으로 75만 원의 정액 수수료 고정 부과", "1억 원을 초과하는 대형 총액계약: 납품 금액이 클수록 수수료율이 높아지는 할증제 적용", "5천만 원 이하의 소액 총액계약: 계약 금액의 1.07%를 일괄 적용하는 세밀한 정률제 방식", "10억 원 이하의 단가계약: 0.54%의 정률제 적용 후 금액이 커질수록 초과분 체감 방식 적용"], "answer": 4, "explanation": "* 정답 (④): 단가계약은 10억 원까지 0.54%의 정률제를 적용하며, 그 이상은 '초과분 체감방식(예: 10억 초과~100억까지 0.47%)'을 적용합니다. [오답노트] ① 5천만 원 초과 1억 원 이하 총액계약은 정액제가 아닌 '1.07% 정률제'를 적용합니다. ② 1억 원을 초과하는 총액계약은 할증제가 아니라, 반대로 납품 금액 ion": "* 정답 (④): 계약보증금의 국고 귀속은 '계약 해제/해지' 사유가 발생하여 해당 행정 조치를 취할 때 수반되는 것이므로, 원인이 되는 해제·해지 조치 없이는 보증금만 따로 귀속시킬 수 없습니다. (오답 노트: ① 법 제5조의3에 따라 청렴서약서 위반 시 계약 해제·해지 가능, ② 시행령 제51조에 따라 계약보증금을 '추가로 납부'하게 해야 함, ③ 재경부 계약예규 및 지방계약법 제30조의2 제1항 제3호에 따라 거짓 서류 제출 시 계약 체결 후라도 명백한 해제·해지 사유임)", "source": "「국가계약법」 제5조의3 및 동법 시행령 제51조, 제75조, 지방계약법 제30조의2"}, {"num": 22, "category1": "2. 법규 위반시 제재", "category2": "2. 부정당업자 제재", "question": "공정경쟁 질서 확립을 위한 부정당업자의 입찰참가자격 제한 제도에 대한 설명으로 가장 올바른 것은?", "options": ["사용인(직원)이 부정행위를 저지른 경우, 대표자가 위반행위를 방지하기 위해 상당한 주의와 감독을 기울였음을 입증하더라도 대표자의 자격을 무조건 제한해야 한다.", "부정당업자 제재 처분을 받아 입찰참가자격이 제한된 업체는 경쟁입찰뿐만 아니라 예외적인 수의계약 체결 대상에서도 원천적으로 배제된다.", "국가기관이 부정당업자의 입찰참가자격을 제한할 때는 신속한 행정 처리를 위해 계약심의위원회의 자문 절차를 전면 생략하는 것이 원칙이다.", "담합이나 뇌물 제공 등 중대한 부정행위라도 처분 시효 규정에 따라 해당 행위 종료 후 3년만 경과하면 입찰 참가자격을 제한할 수 없다."], "answer": 2, "explanation": "* 정답 (②): 부정당업자로 지정되어 제재 기간 중에 있는 업체는 경쟁입찰 참가 자격이 박탈될 뿐만 아니라, 국가계약법령상 예외적인 '수의계약' 대상자에서도 제외되어 공공조달 시장 진입이 전면 차단됩니다. (오답 노트: ① 법 제27조 제1항 단서에 따라 상당한 주의와 감독을 게을리하지 않은 경우 양벌규정에서 면책됨, ③ 자문(심의)을 생략하는 것이 아니라 원칙적으로 계약심의위원회의 심의를 거쳐야 함, ④ 처분 제척기간은 원칙적으로 5년이며 담합 및 뇌물 제공 등은 7년임)", "source": "「국가계약법」 제27조 및 동법 시행령 제76조"}, {"num": 23, "category1": "2. 법규 위반시 제재", "category2": "2. 부정당업자 제재", "question": "부정당업자 제재 처분의 효력 범위 및 절차에 대한 설명으로 가장 올바른 것은?", "options": ["부정당업자 제재 처분은 처분청의 관할과 무관하게 통합되어, 다른 모든 중앙관서 및 지방자치단체 등 공공부문 전체에 그 효력이 미친다.", "발주기관이 특정 업체의 입찰참가자격을 제한한 경우, 해당 제한 내용은 별도 전산망이 아닌 기관 내부 게시판에만 15일간 공지하면 된다.", "공동계약에 참여한 공동수급체 중 1인이 제재 사유를 유발한 경우, 연대책임을 물어 원인 제공 여부와 무관하게 구성원 전원의 자격을 즉시 제한해야 한다.", "법인이 공공조달 입찰 과정에서 부정당업자 제재를 받은 경우, 그 처분의 법적 효력은 법인에만 미치며 해당 행위를 직접 지시한 대표자 개인에게는 적용되지 않는다."], "answer": 1, "explanation": "* 정답 (①): A라는 중앙관서나 지자체에서 부정당업자 제재를 내리더라도 그 처분은 통합시스템을 통해 연계되어, 전국 모든 공공기관, 지자체, 공기업 및 준정부기관의 입찰에 참여할 수 없게 됩니다.", "source": "「국가계약법 시행령」 제76조"}, {"num": 24, "category1": "2. 법규 위반시 제재", "category2": "2. 부정당업자 제재", "question": "입찰참가자격 제한 처분에 갈음하여 부과되는 과징금 제도에 대한 설명으로 가장 올바른 것은?", "options": ["부과된 과징금을 납부 기한까지 미납할 경우, 발주기관의 장은 국세징수법이 아닌 별도의 민사소송을 통해서만 체납액을 강제 회수할 수 있다.", "입찰참가자격 제한에 갈음하여 부과된 과징금은 업체의 자금 경색 등 어떠한 사유로도 납부 기한을 연장하거나 분할하여 납부할 수 없다.", "과징금은 단순히 계약금액의 10%로 일괄 부과되는 것이 아니라, 위반 행위의 경중에 따라 계약금액의 100분의 30 이내에서 세부 기준에 맞추어 산정된다.", "부정당업자가 대체 부과된 과징금을 성실히 전액 납부하더라도, 원래 부과받은 입찰참가자격 제한 기간은 취소되지 않고 중복 적용된다."], "answer": 3, "explanation": "* 정답 (③): 과징금은 위반 행위의 종류와 경중에 따라 계약금액의 10% 단위로 고정되는 것이 아니라, 법정 산정 기준에 따라 계약금액의 100분의 30 이하(최대 한도) 내에서 차등 산정하여 부과됩니다. (오답 노트: ① 과징금 미납 시 별도 민사소송이 아닌 '국세 체납처분의 예'에 따라 강제 징수함(법 제27조의2), ② 재해나 자금 경색 등 일정 요건 충족 시 납부기한 연장 및 분할납부가 가능함(시행령 제76조의2), ④ 과징금은 입찰참가자격 제한 처분에 '갈음하여(대신하여)' 부과하는 것이므로 자격 제한과 중복 적용되지 않음)", "source": "「국가계약법」 제27조의2 및 동법 시행령 제76조의2"}], "2-1_공공조달계획": [{"num": 1, "category1": "1. 공공조달 수요 분석 및 계획", "category2": "1. 공급 대상물 수요정보 식별", "question": "과거 데이터 없이 전문가의 주관적 판단이나 의견에 의존하는 수요예측 기법에 해당하지 않는 것은?", "options": ["회귀분석", "델파이 기법", "시장 조사법", "전문가 의견법"], "answer": 1, "explanation": "* 정답 (①): 회귀분석은 과거 데이터의 인과관계를 통계적으로 분석하는 정량적 예측기법이며, 나머지는 전문가의 주관적 판단에 의존하는 정성적 기법임.", "source": null}, {"num": 2, "category1": "1. 공공조달 수요 분석 및 계획", "category2": "1. 공급 대상물 수요정보 식별", "question": "[상황] 과거 3년간 월별 수요 데이터가 풍부하고 계절적 패턴이 안정적인 소모품이 있다. 이 품목의 수요예측에 가장 적합한 기법은?", "options": ["이동평균법", "델파이 기법", "시나리오 분석법", "전문가 의견법"], "answer": 1, "explanation": "* 정답 (①): 데이터가 풍부하고 패턴이 안정적인 경우 시계열 분석 기법인 이동평균법 등 정량적 기법이 적합함.", "source": null}, {"num": 3, "category1": "1. 공공조달 수요 분석 및 계획", "category2": "3. 공급계획 및 일정 수립", "question": "조달전략계획에 통상 포함되는 주제로 가장 거리가 먼 것은?", "options": ["위험 관리 방안", "조달 배경 및 목적", "경쟁 업체의 내부 경영전략", "시장조사 결과"], "answer": 3, "explanation": "* 정답 (③): 조달전략계획은 배경·범위·일정·예산·계약유형·시장조사·평가기준·위험관리 등을 포함하나, 경쟁업체의 내부 경영전략처럼 외부에서 알 수 없는 정보는 포함 대상이 아님.", "source": null}, {"num": 4, "category1": "1. 공공조달 수요 분석 및 계획", "category2": "3. 공급계획 및 일정 수립", "question": "국가계약법령에 따라 발주기관이 해당 연도 초에 업체들에게 미리 공개해야 하는 연간 '발주계획' 내역에 포함되지 않는 항목은?", "options": ["특정 조달 건을 수주할 1순위 낙찰예정자의 상호 및 주소", "조달 사업의 공식 명칭 및 전체 예상 발주 물량", "해당 사업을 진행할 구체적인 입찰 방식 및 계약 방법", "분기별 등 대략적으로 예정된 조달 사업의 발주 시기"], "answer": 1, "explanation": "* 정답 (①): 발주계획은 '앞으로 이런 사업을 공고할 예정이니 미리 준비하라'는 취지이므로, 아직 입찰도 진행되지 않은 시점이라 낙찰자 정보를 알 수 없습니다.", "source": null}, {"num": 5, "category1": "1. 공공조달 수요 분석 및 계획", "category2": "3. 공급계획 및 일정 수립", "question": "연초에 수요기관이 조달청 및 나라장터를 통해 공고하는 연간 '발주계획'을 조회하기 위한 올바른 나라장터 메뉴 이동 경로는?", "options": ["입찰 → 입찰공고 → 발주계획", "발주 → 발주목록 → 발주계획", "공고 → 발주목록 → 발주계획", "이용자관리 → 발주관리 → 발주계획"], "answer": 2, "explanation": "* 정답 (②): 나라장터 조달 프로세스 흐름에 따라 수요기관의 연간 발주 내역을 조회하려면, 메인 메뉴인 [발주] 탭을 클릭한 후 하위 메뉴인 [발주목록] → [발주계획] 순으로 진입해야 합니다.", "source": null}, {"num": 6, "category1": "2. 공공조달 적정성 분석", "category2": "1. 공급방법 적정성 분석", "question": "다음 중 다수공급자계약(MAS)에 대한 설명으로 옳은 것은?", "options": ["수요기관은 납품업체를 선정할 때 반드시 최저가로 응찰한 업체를 선택해야 한다.", "공공기관의 수요를 충족시키기 위해 오직 단일 공급업체와 독점 계약을 체결하는 방식이다.", "2단계경쟁 제도를 통해 가격 외에도 품질, 납기, 사후관리 등을 종합적으로 평가하여 업체를 선정할 수 있다.", "수요기관은 종합쇼핑몰을 통하지 않고 각 업체와 개별적으로 수의계약을 맺어야 한다."], "answer": 3, "explanation": "* 정답 (③): MAS 계약은 다수의 공급업체와 계약을 체결(② 틀림)하고, 수요기관은 종합쇼핑몰에서 규격 및 가격을 비교(④ 틀림)할 수 있습니다. 또한, 가격 외에 품질이나 납기 등을 종합적으로 고려하여 업체를 선택할 수 있으므로 반드시 최저가 업체를 선택해야 하는 것은 아닙니다(① 틀림).", "source": "물품 다수공급자계약 업무처리규정"}, {"num": 7, "category1": "2. 공공조달 적정성 분석", "category2": "1. 공급방법 적정성 분석", "question": "다수공급자계약(MAS)을 통해 물품을 구매하려는 수요기관 담당자의 판단으로 가장 적절한 것은?", "options": ["\"여러 업체의 물품을 비교해보고 싶지만, MAS 제도는 한 가지 물품당 하나의 업체만 등록되어 있어 비교할 수 없겠군.\"", "\"우리 기관은 예산 절감이 최우선이니, 종합쇼핑몰에 등록된 업체 중 품질과 상관없이 무조건 최저가 업체에 납품을 요구해야겠어.\"", "\"구매하려는 품목이 일정 금액 이상이니, 등록된 업체들을 대상으로 2단계경쟁을 실시하여 추가적인 조건 협상을 진행해봐야겠군.\"", "\"MAS 계약 품목은 종합쇼핑몰에 이미 단가가 고정되어 있으므로, 어떠한 경우에도 추가적인 가격 협상이나 경쟁은 불가능해.\""], "answer": 3, "explanation": "* 정답 (③): MAS 제도는 수요기관이 종합쇼핑몰에서 여러 업체의 동종·유사 물품을 비교할 수 있으며(① 틀림), 2단계경쟁을 통해 추가적인 가격 협상이 가능합니다(④ 틀림). 또한 최저가 업체만 고집할 필요 없이 납기나 사후관리 등 종합적인 조건을 고려할 수 있습니다(② 틀림).", "source": "물품 다수공급자계약 업무처리규정"}, {"num": 8, "category1": "2. 공공조달 적정성 분석", "category2": "1. 공급방법 적정성 분석", "question": "다음 빈칸 (A), (B)에 들어갈 말로 가장 바르게 짝지어진 것은? \n\"다수공급자계약(MAS)은 공공기관의 다양한 수요를 충족하기 위하여 \n품질, 성능, 효율 등에서 ( A ) 물품에 대해 ( B ) 공급업체와 계약을 체결하여 종합쇼핑몰을 통해 공급하는 제도이다.\"", "options": ["(A) 완전히 동일한 - (B) 1개의 지정된", "(A) 동종·유사 - (B) 1개의 지정된", "(A) 완전히 동일한 - (B) 다수의", "(A) 동종·유사 - (B) 다수의"], "answer": 4, "explanation": "* 정답 (④): MAS(Multiple Award Schedule)라는 명칭에서 알 수 있듯이, 수요기관의 선택권을 넓히기 위해 '동종·유사' 물품에 대해 '다수'의 공급업체와 계약을 체결하는 것이 이 제도의 핵심입니다.", "source": "물품 다수공급자계약 업무처리규정"}, {"num": 9, "category1": "2. 공공조달 적정성 분석", "category2": "1. 공급방법 적정성 분석", "question": "다음 중 공공기관의 우선(의무)구매 제도에 대한 설명으로 가장 옳지 않은 것은?", "options": ["중소기업제품의 구매목표비율은 해당 기관 구매총액의 50% 이상이어야 한다.", "장애인기업제품은 해당 기관 구매총액의 1% 이상을 구매해야 한다.", "여성기업제품은 공사 구매액의 경우 3% 이상을 구매해야 한다.", "중소기업 기술개발제품은 중소기업 물품 구매액의 50% 이상을 의무적으로 구매해야 한다."], "answer": 4, "explanation": "* 정답 (④): 중소기업 기술개발제품의 의무구매비율은 중소기업 물품 구매액의 15% 이상(과거 10%에서 상향)입니다. 50%는 중소기업제품 전체에 대한 의무구매비율입니다. (※ 여성기업제품: 물품/용역 5%, 공사 3%)", "source": "판로지원법 시행령 제4조, 12조, 여성기업법 시행령 제7조, 장애인기업법 시행령 제7조의2"}, {"num": 10, "category1": "2. 공공조달 적정성 분석", "category2": "1. 공급방법 적정성 분석", "question": "현행 법령상 공공기관의 '중소기업제품 구매목표비율'은 해당 기관이 해당 연도에 구매할 제품의 구매총액 대비 최소 얼마 이상으로 의무 규정되어 있는가?", "options": ["15%", "30%", "50%", "70%"], "answer": 3, "explanation": "* 정답 (③): 관련 법령에 따라 공공기관은 당해 연도 제품 구매총액의 50% 이상을 중소기업제품으로 의무 구매해야 합니다.", "source": "판로지원법 시행령 제4조"}, {"num": 11, "category1": "2. 공공조달 적정성 분석", "category2": "3. 공급 대상물 조달시장 분석", "question": "ABC 분석에서 A등급 품목의 특성으로 옳은 것은?", "options": ["품목 수와 구매금액 비중이 모두 낮다", "품목 수는 전체의 10~20% 수준이지만 구매금액 비중은 70~80%에 이른다", "품목 수와 구매금액 비중이 모두 중간 수준이다", "품목 수가 가장 많고 구매금액 비중은 가장 낮다"], "answer": 2, "explanation": "* 정답 (②): ABC 분석의 A등급은 소수의 품목(약 10~20%)이 전체 구매금액의 대부분(약 70~80%)을 차지하는 핵심 관리대상 품목임.", "source": null}, {"num": 12, "category1": "2. 공공조달 적정성 분석", "category2": "3. 공급 대상물 조달시장 분석", "question": "시장조사 절차에서 가장 먼저 수행해야 하는 단계는?", "options": ["기존 자료 검토", "가격 정보 수집", "잠재적 공급업체 식별", "조사의 목적과 범위 설정"], "answer": 4, "explanation": "* 정답 (④): 시장조사는 먼저 조사의 목적과 범위를 명확히 설정한 뒤, 기존 정보 검토·시장구조 분석·업체 식별 등의 순서로 진행하는 것이 원칙임.", "source": null}, {"num": 13, "category1": "3. 공공조달 비용 적정성 분석", "category2": "1. 공급 의사결정을 위한 비용분석", "question": "다음 중 조달절차에서의 '경제성 평가'에 대한 설명으로 가장 옳지 않은 것은?", "options": ["경제성 평가 항목에는 가격뿐만 아니라 운송비, 운영비, 초기 비용, 총소유비용(TCO) 등 다양한 요소를 포함할 수 있다.", "서비스나 공사의 계약에서는 입찰자의 자유로운 서식 작성을 위해 물량내역서(BOQ) 등 비용내역서 제출 양식(템플릿)을 제공하지 않는다.", "경제적 측면에서 입찰서 등의 내용이 해당 조달사업에서 확보한 예산 범위 내에 있는지 여부를 반드시 확인해야 한다.", "경제성 평가 측면에서 검토·평가한 결과는 보고서에 정리해야 하며, 조달 담당자 또는 평가위원회가 이에 서명해야 한다."], "answer": 2, "explanation": "* 정답 (②): 서비스나 공사의 경우, 공사별 물량내역서(BOQ)와 같이 비용내역서를 제공하는 양식(템플릿)을 반드시 제공하여야 합니다.", "source": "표준교재 2권 p.76"}, {"num": 14, "category1": "3. 공공조달 비용 적정성 분석", "category2": "1. 공급 의사결정을 위한 비용분석", "question": "조달사업의 '경제성 평가'를 수행할 때 고려해야 할 사항으로 가장 적절하지 않은 것은?", "options": ["입찰공고 문서에 평가요소로 포함될 경제성 평가 항목과 평가기준을 명확하게 제시해야 한다.", "시장 상황을 고려하여 경제성 측면에서 적정성을 분석하고, 가격 및 비용 요소가 합리적인지 검토해야 한다.", "재정 기준의 가중치는 모든 조달 사업에서 변함없이 고정된 비율로 일정하게 적용해야 한다.", "제안서의 재무평가는 입찰공고문에 명시된 재무적, 상업적 요건과 제안서를 비교하는 방식을 포함한다."], "answer": 3, "explanation": "* 정답 (③): 재정제안은 중요한 평가기준이지만, 재정 기준의 가중치는 고정된 것이 아니라 선택한 평가 방법에 따라 달라질 수 있습니다.", "source": "표준교재 2권 p.76"}, {"num": 15, "category1": "3. 공공조달 비용 적정성 분석", "category2": "2. 적정 공급비용 산정", "question": "추정가격과 예정가격을 비교한 설명으로 가장 옳은 것은?", "options": ["두 개념은 동일하며 구분할 실익이 없다", "예정가격은 계획 단계에서, 추정가격은 입찰 직전에 산정한다", "추정가격은 조달계획 단계의 개략적 추정치이고, 예정가격은 입찰 전 정밀 산정을 거쳐 법적 구속력을 갖는다", "추정가격이 예정가격보다 법적 구속력이 강하다"], "answer": 3, "explanation": "* 정답 (③): 추정가격은 계획 단계의 개략적 추정(부가가치세 미포함)이고, 예정가격은 입찰 전 정밀하게 산정(부가가치세 포함)해 낙찰자·계약금액 결정의 법적 기준이 됨.", "source": "국가계약법 시행령 제2조·제7조의2"}, {"num": 16, "category1": "3. 공공조달 비용 적정성 분석", "category2": "2. 적정 공급비용 산정", "question": "예정가격 작성 시 원가계산 방식에서 '이윤'을 산정하기 위한 기준 금액 요소로 가장 옳은 것은?", "options": ["재료비 + 노무비 + 경비", "노무비 + 경비 + 일반관리비", "재료비 + 일반관리비", "재료비 + 노무비 + 경비 + 일반관리비"], "answer": 2, "explanation": "* 정답 (②): 원가계산 시 이윤은 (노무비 + 경비 + 일반관리비)의 합계액에 정해진 이윤율을 곱하여 산정합니다. 기술적·원가적 특성상 '재료비'는 이윤 산정 대상 금액에서 제외됩니다.", "source": "예정가격작성기준 제14조, 제21조"}, {"num": 17, "category1": "3. 공공조달 비용 적정성 분석", "category2": "2. 적정 공급비용 산정", "question": "정부계약 원가계산 방식의 각 비목별 산정 기준에 대한 설명으로 가장 옳지 않은 것은?", "options": ["순원가(제조원가)는 재료비, 노무비, 경비의 합계액으로 구성된다.", "일반관리비는 순원가(재료비·노무비·경비 합계액)에 일반관리비율을 곱하여 산정한다.", "이윤은 재료비를 포함한 총원가 전체 금액에 이윤율을 곱하여 산정한다.", "원가계산에 의한 예정가격 산정 시 관련 법령에서 정한 비목별 승율(비율) 상한을 초과할 수 없다."], "answer": 3, "explanation": "* 정답 (③): 이윤 산정 시 '재료비'는 포함되지 않습니다. 이윤은 총원가가 아닌 (노무비 + 경비 + 일반관리비)의 합계액을 기준으로 계산합니다.", "source": "예정가격작성기준 제14조, 제21조"}, {"num": 18, "category1": "3. 공공조달 비용 적정성 분석", "category2": "2. 적정 공급비용 산정", "question": "원가계산에 의한 예정가격 산정 구조에서 재료비, 노무비, 경비를 모두 합한 금액을 의미하는 용어는?", "options": ["총원가", "일반관리비", "순제조원가", "추정가격"], "answer": 3, "explanation": "* 정답 (③): 재료비, 노무비, 경비의 합계는 '순제조원가'에 해당합니다. 여기에 일반관리비를 더하면 '총원가', 총원가에 이윤과 부가가치세를 더하면 최종 원가계산 가격이 산출됩니다.", "source": "표준교재 2권 p.121"}, {"num": 19, "category1": "4. 기타 적정성 분석", "category2": "3. 공급관리 및 위험분석", "question": "다음 중 조달 과정에서 발생할 수 있는 납품 지연(Late delivery) 위험의 '발생 가능성 완화 방안'에 해당하는 것은?", "options": ["지연배상금(Liquidated damage) 부과", "비상계획(Contingency plan) 수립", "적정한 계획(Proper planning) 마련", "여유분(버퍼) 및 비상재고 유지"], "answer": 1, "explanation": "* 정답 (①): 지연배상금과 선제적 계약관리는 납품 지연의 '발생 가능성을 완화'하기 위한 사전 방안입니다. 반면 ②, ③, ④는 납품 지연 사태가 발생했을 때 그 '결과나 영향을 완화'하기 위한 방안에 해당합니다.", "source": "표준교재 2권 p.263"}, {"num": 20, "category1": "4. 기타 적정성 분석", "category2": "3. 공급관리 및 위험분석", "question": "[상황] 계약담당자가 계약상대자의 이행 실패 위험에 대비해, 그 손실 부담을 보험사 등 제3자가 나누어 지도록 하는 조치를 취했다. 이러한 위험 대응 전략은?", "options": ["위험 수용(별도 조치 없이 감수)", "위험 전가(이행보증보험 가입 요구)", "위험 분산(공급선 다변화)", "위험 회피(사업 자체 취소)"], "answer": 2, "explanation": "* 정답 (②): 이행보증보험 가입 요구처럼 위험의 재무적 결과를 제3자(보험사)에게 이전하는 전략을 위험의 전가(Transfer)라 함.", "source": "표준교재 2권 p.262"}, {"num": 21, "category1": "4. 기타 적정성 분석", "category2": "3. 공급관리 및 위험분석", "question": "위험관리매트릭스에서 발생 확률과 영향도가 모두 높게 평가된 위험의 등급으로 옳은 것은?", "options": ["낮음", "결정적", "높음", "중간"], "answer": 2, "explanation": "* 정답 (②): 발생확률·영향도가 모두 높은 위험은 결정적(Critical)으로 분류", "source": "표준교재 2권 p.260"}], "2-2_조달요구응대및제안": [{"num": 1, "category1": "1. 조달요구 대처 절차", "category2": "1. 경쟁입찰참가자격 등록", "question": "공공입찰 참여를 위해 가장 먼저 해야 할 절차는?", "options": ["사전규격공개 의견 제출", "입찰보증금 납부", "제안서 작성", "나라장터 경쟁입찰참가자격 등록"], "answer": 4, "explanation": "* 정답 (④): 공공입찰 참여를 위해서는 먼저 나라장터(KONEPS)에 경쟁입찰참가자격을 등록해야 함.", "source": null}, {"num": 2, "category1": "1. 조달요구 대처 절차", "category2": "1. 경쟁입찰참가자격 등록", "question": "[상황] A사는 특정 물품의 '공급업체'로만 나라장터에 등록되어 있다. 해당 물품 입찰이 '제조입찰'로 참가자격이 제한된 경우 A사의 참가 가능 여부는?", "options": ["참가 가능", "참가 불가", "발주기관 승인 시 참가 가능", "조건부 참가 가능"], "answer": 2, "explanation": "* 정답 (②): 제조입찰로 참가자격이 제한된 경우 해당 물품의 제조업체로 등록해야만 참가 가능함.", "source": null}, {"num": 3, "category1": "1. 조달요구 대처 절차", "category2": "1. 경쟁입찰참가자격 등록", "question": "나라장터 등록정보(대표자 등) 변경 후 갱신하지 않고 입찰에 참가한 경우 발생할 수 있는 불이익은?", "options": ["해당 입찰의 무효 처리", "과태료 부과", "형사처벌", "영업정지"], "answer": 1, "explanation": "* 정답 (①): 등록정보 변경신고 없이 입찰서를 제출한 입찰은 무효 사유에 해당함.", "source": null}, {"num": 4, "category1": "1. 조달요구 대처 절차", "category2": "1. 경쟁입찰참가자격 등록", "question": "중소기업자간 경쟁제품에 해당하는 물품 입찰에 참가하기 위해 반드시 갖춰야 하는 것을 모두 고르면? (ㄱ.중소기업확인서 ㄴ.직접생산확인증명서 ㄷ.우수조달물품 지정서)", "options": ["ㄱ,ㄴ", "ㄱ,ㄴ,ㄷ", "ㄱ", "ㄴ,ㄷ"], "answer": 1, "explanation": "* 정답 (①): 중소기업자간 경쟁제품 입찰 참가에는 중소기업확인서와 직접생산확인증명서가 필요하며, 우수조달물품 지정서는 별도 제도로 필수 요건이 아님.", "source": null}, {"num": 5, "category1": "1. 조달요구 대처 절차", "category2": "1. 경쟁입찰참가자격 등록", "question": "공동수급체에 대한 설명으로 옳지 않은 것은?", "options": ["공동수급협정서는 입찰마감 전일까지 제출해야 한다", "분담이행방식도 구성원 전원이 전체 계약에 연대책임을 진다", "공동이행방식은 구성원 전원이 연대책임을 진다", "2개 이상 사업자가 공동입찰을 위해 결성한 조직이다"], "answer": 2, "explanation": "* 정답 (②): 분담이행방식은 각 구성원이 분담 내용에 따라 자기 책임하에 이행하며, 전체 계약에 대한 연대책임은 공동이행방식의 특징임.", "source": "공동계약 운용요령"}, {"num": 6, "category1": "1. 조달요구 대처 절차", "category2": "1. 경쟁입찰참가자격 등록", "question": "공동이행방식 공동수급체에 대한 설명으로 옳은 것은?", "options": ["각 구성원이 분담한 부분만 책임진다", "주로 복합공종 사업에 활용된다", "구성원이 공동으로 자본·인력을 투자해 계약을 이행하고 손익도 공동 계산한다", "대표사 출자비율에 최소요건이 없다"], "answer": 3, "explanation": "* 정답 (③): 공동이행방식은 구성원이 공동으로 자본·인력을 투자해 이행하고 손익도 공동 계산함. ①④는 분담이행방식의 특징.", "source": "공동계약 운용요령"}, {"num": 7, "category1": "1. 조달요구 대처 절차", "category2": "1. 경쟁입찰참가자격 등록", "question": "나라장터 등록정보 중 대표자가 변경됐음에도 갱신하지 않고 입찰서를 제출한 경우의 효력은?", "options": ["발주기관 재량으로 결정된다", "계약체결 시 갱신하면 유효하다", "입찰 무효 사유에 해당한다", "과태료만 부과되고 입찰은 유효하다"], "answer": 3, "explanation": "* 정답 (③): 등록사항 변경신고를 하지 않고 한 입찰은 무효 사유에 해당함.", "source": "국가계약법 시행규칙 제44조제1항제5호"}, {"num": 8, "category1": "1. 조달요구 대처 절차", "category2": "1. 경쟁입찰참가자격 등록", "question": "공동수급체 구성원 중 1인이 입찰참가자격을 갖추지 못한 경우에 대한 설명으로 옳은 것은?", "options": ["해당 구성원만 제외하고 나머지로 진행 가능하다", "구성원 전원이 자격을 갖춰야 하므로, 전체 입찰이 무효 처리될 수 있다", "대표사만 자격을 갖췄으면 유효하다", "출자비율만 조정하면 된다"], "answer": 2, "explanation": "* 정답 (②): 공동수급체의 모든 구성원은 각각 입찰참가자격을 갖추어야 하며, 한 구성원이라도 미달이면 전체 입찰이 무효 처리될 수 있음.", "source": "국가계약법 시행규칙 제44조"}, {"num": 9, "category1": "1. 조달요구 대처 절차", "category2": "1. 경쟁입찰참가자격 등록", "question": "「국가를 당사자로 하는 계약에 관한 법률」상 계약 체결 방식에 대한 설명으로 가장 옳지 않은 것은?", "options": ["공공계약은 원칙적으로 일반경쟁입찰에 붙여야 한다.", "제한경쟁입찰, 지명경쟁입찰, 수의계약은 법령이 정한 특별한 사유가 있는 경우에만 예외적으로 허용된다.", "계약담당공무원은 업무 편의성을 위해 법령 규정과 상관없이 수의계약을 원칙으로 채택할 수 있다.", "경쟁입찰에 부칠 때 입찰 참가 자격을 특정한 기준(실적, 기술 등)으로 제한하는 것은 제한경쟁입찰에 해당한다."], "answer": 3, "explanation": "* 정답 (③): 국가계약법 제7조에 따라 공공조달은 일반경쟁이 원칙입니다. 계약담당공무원이 임의로 수의계약을 원칙으로 채택할 수 없으며, 수의계약은 법령에 명시된 특수 사유(소액, 천재지변, 국가안보 등)에 한해서만 제한적으로 적용됩니다.", "source": "국가계약법 제7조"}, {"num": 10, "category1": "1. 조달요구 대처 절차", "category2": "1. 경쟁입찰참가자격 등록", "question": "공공계약 방식 중 법률에 명시된 예외적 사유(천재지변, 국가안보, 재공고입찰 유찰, 소액계약 등)가 발생했을 때 경쟁 입찰 절차를 거치지 않고 특정 공급자와 직접 계약을 체결하는 방식은?", "options": ["일반경쟁", "수의계약", "지명경쟁", "제한경쟁"], "answer": 2, "explanation": "* 정답 (②): 수의계약은 경쟁을 거치지 않고 특정한 자를 지정하여 계약을 체결하는 예외적 방식입니다.", "source": "국가계약법 제7조 및 시행령 제26조"}, {"num": 11, "category1": "1. 조달요구 대처 절차", "category2": "1. 경쟁입찰참가자격 등록", "question": "「국가계약법」상 경쟁입찰의 종류 및 계약 방식에 관한 설명으로 가장 옳은 것은?", "options": ["지명경쟁은 불특정 다수의 모든 업체가 제한 없이 자유롭게 참여하는 기본 방식이다.", "수의계약은 공공조달 계약에서 가장 우선적으로 적용해야 하는 원칙적인 방식이다.", "제한경쟁은 시공능력, 유사실적, 기술자격 등 법령이 정한 요건을 갖춘 자로 입찰 자격을 제한하여 경쟁시키는 방식이다.", "일반경쟁은 특정한 신용이나 실적을 갖춘 특정 인원만을 지정하여 입찰에 참가시키는 방식이다."], "answer": 3, "explanation": "* 정답 (③): 제한경쟁은 사업장 소재지, 실적, 기술 자격 등으로 입찰 참가 자격을 제한하는 경쟁 방식입니다. ①은 일반경쟁, ②는 수의계약이 아닌 일반경쟁이 원칙, ④는 지명경쟁에 대한 설명입니다.", "source": "국가계약법 제7조"}, {"num": 12, "category1": "1. 조달요구 대처 절차", "category2": "1. 경쟁입찰참가자격 등록", "question": "입찰참가자격 등록 절차 및 필요 서류에 관한 설명으로 가장 옳은 것은?", "options": ["매각 등 세입 원인이 되는 계약에 입찰 참가 시에는 조달청 자격 등록이 면제된다.", "물품 제조 입찰에서는 참가자격을 증명하기 위해 공장등록증이나 직접생산증명서가 필요하다.", "지정정보처리장치를 통한 전자입찰 등록 시 인감증명서는 모든 업종에서 필수 제출서류이다.", "공사 입찰과 용역 입찰에서 참가자격을 증명하기 위해 요구되는 기본 면허 서류는 동일하다."], "answer": 2, "explanation": "정답 (②) 제조업체 확인을 위해 필수임 / ① 세입 원인도 등록 필요 / ③ 인감증명서는 본인서명사실확인서 등으로 대체 가능하여 모든 업종 필수는 아님 / ④ 업종별 면허 서류가 다름", "source": "입찰등록규정"}, {"num": 13, "category1": "1. 조달요구 대처 절차", "category2": "2. 수요기관의 정보요청(규격, 과업 및 예산 등)에 대한 문서 작성 및 제출", "question": "RFI(정보제공요청서)에 대한 설명으로 옳지 않은 것은?", "options": ["시장 기술수준·가격동향 파악이 목적이다", "공급자가 자사 역량을 알릴 기회가 된다", "사업 기획 초기 단계에 활용된다", "응답업체에 계약체결 의무가 발생한다"], "answer": 4, "explanation": "* 정답 (④): RFI는 비구속적 문서로 응답업체에 계약체결 의무를 부과하지 않음.", "source": null}, {"num": 14, "category1": "1. 조달요구 대처 절차", "category2": "2. 수요기관의 정보요청(규격, 과업 및 예산 등)에 대한 문서 작성 및 제출", "question": "사업 진행 순서로 옳은 것은?", "options": ["RFI→RFQ→RFP", "RFP→RFI→RFQ", "RFQ→RFI→RFP", "RFI→RFP→RFQ"], "answer": 1, "explanation": "* 정답 (①): 시장정보수집(RFI)→가격확인(RFQ)→종합제안요청(RFP) 순으로 진행됨.", "source": null}, {"num": 15, "category1": "1. 조달요구 대처 절차", "category2": "2. 수요기관의 정보요청(규격, 과업 및 예산 등)에 대한 문서 작성 및 제출", "question": "발주기관이 조달 초기 단계에서 시장 정보를 수집하기 위해 활용하는 문서로, 응답업체에 입찰참가 의무를 부과하지 않는 것은?", "options": ["RFP(제안요청서)", "RFI(정보요청서)", "입찰공고문", "RFQ(견적요청서)"], "answer": 2, "explanation": "* 정답 (②): RFI(Request for Information)는 사업 초기 시장 동향·기술 수준·예산 추정 등을 파악하기 위해 활용되는 비구속적 문서로, 응답업체에 입찰참가 의무를 부여하지 않습니다.", "source": "표준교재 2권 p.17"}, {"num": 16, "category1": "1. 조달요구 대처 절차", "category2": "2. 수요기관의 정보요청(규격, 과업 및 예산 등)에 대한 문서 작성 및 제출", "question": "조달청에 계약 체결을 위탁하는 '중앙조달요청' 문서를 새롭게 작성하기 위해 나라장터(수요기관용) 시스템에서 거쳐야 하는 올바른 메뉴 이동 경로는?", "options": ["계약 → 계약서작성 → 신규", "공고 → 입찰공고 → 신규", "발주 → 발주목록 → 신규", "물품 → 견적요청 → 신규"], "answer": 3, "explanation": "* 정답 (③): 수요기관이 조달청에 계약을 의뢰(발주)하는 것이므로, 나라장터 메인 메뉴의 [발주] → [발주목록] → [신규] 순으로 진입하여 작성해야 합니다.", "source": null}, {"num": 17, "category1": "1. 조달요구 대처 절차", "category2": "3. 조달관련 입법·행정예고 검색 및 의견제시", "question": "조달 관련 법령(시행령·시행규칙 등)의 제·개정에 대해 의견을 제시하려 할 때, 관련 법제업무 운영규정상 입법예고 기간의 원칙으로 옳은 것은?", "options": ["30일 이상", "60일 이상", "20일 이상", "40일 이상"], "answer": 4, "explanation": "* 정답 (④): 조달담당자는 관련 법령의 입법예고 내용을 검색해 필요시 의견을 제시할 수 있으며, 법제업무 운영규정상 입법예고 기간은 원칙적으로 40일 이상(행정예고는 20일 이상)임.", "source": "법제업무 운영규정 제18조"}, {"num": 18, "category1": "2. 사전규격공개 분석", "category2": "1. 과업내용 적정성 검토", "question": "사전규격 검토 시 확인하는 핵심사항이 아닌 것은?", "options": ["예산 적정성", "관련 법규 준수 여부", "입찰참가 예정업체의 재무상태", "특정 상표·규격으로 인한 경쟁제한 여부"], "answer": 3, "explanation": "* 정답 (③): 입찰참가 예정업체의 재무상태는 적격심사 단계에서 확인하는 사항으로, 사전규격 검토 사항이 아님.", "source": null}, {"num": 19, "category1": "2. 사전규격공개 분석", "category2": "1. 과업내용 적정성 검토", "question": "사전규격공개 제도의 주된 목적으로 가장 적절한 것은?", "options": ["특정 업체에 대한 사전 통보", "예산 절감", "입찰 절차의 신속한 진행", "경쟁 제한 방지 및 다양한 의견 반영을 통한 공정한 규격 확정"], "answer": 4, "explanation": "* 정답 (④): 사전규격공개는 경쟁 제한 방지와 다양한 공급자 의견 반영을 통해 공정한 규격을 확정하는 것이 목적임.", "source": null}, {"num": 20, "category1": "2. 사전규격공개 분석", "category2": "1. 과업내용 적정성 검토", "question": "규격서 작성 방식 중, 제품이 어떻게 만들어져야 하는지가 아니라 달성해야 할 결과와 기능을 중심으로 기술하는 방식은?", "options": ["상표규격(특정 업체 기술표준 기준)", "모델규격(특정 모델·사양 명시)", "성능규격(Performance Specification)", "설계규격(제조방법 상세 지정)"], "answer": 3, "explanation": "* 정답 (③): 성능규격은 '무엇을' 달성해야 하는지, 즉 요구되는 성능·기능을 결과 중심으로 기술하는 방식으로, 다양한 업체의 참여와 혁신적 대안을 유도함.", "source": null}, {"num": 21, "category1": "2. 사전규격공개 분석", "category2": "1. 과업내용 적정성 검토", "question": "다음 중 구매사양서 작성의 SMART 원칙에 대한 설명으로 가장 옳지 않은 것은?", "options": ["S (Specific): 요구하는 물품이나 서비스의 특성을 구체적이고 명확하게 기술해야 한다.", "M (Measurable): 검수 및 평가가 가능하도록 정량적 지표나 측정 가능한 기준을 제시해야 한다.", "A (Achievable): 시장의 기술 수준과 관계없이 발주기관이 원하는 최상의 성능만을 무조건 요구해야 한다.", "T (Time-bound): 납기, 이행 일정 또는 추적 가능성(Traceable)을 명확히 설정해야 한다."], "answer": 3, "explanation": "* 정답 (③): A는 Achievable(달성가능성)로, 해당 산업 및 시장에서 기술적으로 실행 가능한 요구사항을 제시해야 함을 의미합니다. 현실적으로 이행 불가능한 과도한 사양 설정은 유찰이나 부실 이행을 초래할 수 있습니다.", "source": "표준교재 2권 p.24"}, {"num": 22, "category1": "2. 사전규격공개 분석", "category2": "1. 과업내용 적정성 검토", "question": "구매사양서 작성 시 \"납품된 물품의 성능이나 품질이 계약 기준에 부합하는지 정량적으로 검증 및 평가할 수 있도록 객관적 기준을 제시해야 한다\"는 SMART 원칙 요소는?", "options": ["S (Specific)", "M (Measurable)", "R (Relevant)", "T (Time-bound)"], "answer": 2, "explanation": "* 정답 (②): 정량적 수치나 객관적 측정 기준을 제시하여 납품 후 검수 및 평가를 가능하게 하는 것은 M(Measurable, 측정가능성)에 해당합니다.", "source": "표준교재 2권 p.24"}, {"num": 23, "category1": "2. 사전규격공개 분석", "category2": "1. 과업내용 적정성 검토", "question": "구매사양서 작성의 SMART 원칙 구성 요소와 영문 구성의 연결이 올바르지 않은 것은?", "options": ["S - Specific (구체성)", "M - Measurable (측정가능성)", "R - Reasonable (합리적인 가격)", "T - Time-bound (기한성)"], "answer": 3, "explanation": "* 정답 (③): SMART 원칙에서 R은 Realistic(현실성)을 의미합니다. 해당 조달 사업의 목적과 직접 연관되고 현실적이어야 함을 뜻하며, 합리적인 가격(Reasonable)을 의미하지 않습니다.", "source": "표준교재 2권 p.24"}, {"num": 24, "category1": "2. 사전규격공개 분석", "category2": "1. 과업내용 적정성 검토", "question": "조달 요구사항(Procurement Requirement) 정의 및 과업명세서 작성 시 고려하는 항목과 세부 질문의 연결로 가장 옳지 않은 것은?", "options": ["조달 배경 및 목표 - 상품, 서비스 및 공사가 필요한 이유는 무엇인가?", "이행 장소 및 방법 - 배송지(수행/시공장소)는 어디이며 어떻게 수행되는가?", "의사결정 체계 - 제안서 평가위원회의 개별 평가위원 명단은 누구인가?", "스펙 및 요구량 - 어떤 구체적인 품질 또는 수량 요구 사항을 고려해야 하는가?"], "answer": 3, "explanation": "* 정답 (③): 조달 요구사항 정의 시 승인 요소(8번)는 '조달요구 실행을 위해 필요한 주요 승인 및 승인권자(내부 의사결정 절차)'를 의미합니다. 평가위원 명단은 보안 사항이자 별도 평가 절차 관리 항목으로 조달 요구사항 정의 및 SOW 항목에 해당하지 않습니다.", "source": "표준교재 2권 p.23"}, {"num": 25, "category1": "2. 사전규격공개 분석", "category2": "1. 과업내용 적정성 검토", "question": "다음 중 조달 요구사항을 분석하고 명확히 하기 위한 주요 확인 항목에 대한 설명으로 가장 적절하지 않은 것은?", "options": ["조달 대상이 충족해야 하는 핵심 기능을 정의하여 불필요한 과도한 스펙 설정을 방지한다.", "구체적인 품질 및 수량 요구사항은 계약 이행 후 정산 단계에서 결정하므로 초기 작성 시 생략할 수 있다.", "배송지, 수행 장소, 배송 방식을 사전에 명확히 하여 물류 및 이행상의 차질을 예방한다.", "구매에 영향을 미치는 외부·내부 요인 및 필요한 승인권자를 식별하여 조달 위험을 관리한다."], "answer": 2, "explanation": "* 정답 (②): 어떤 구체적인 품질 또는 수량 요구사항을 고려해야 하는지(9번)는 계약 체결 전 조달 요구사항 정의 단계에서 반드시 명확히 검토되어 반영되어야 적정한 예산 산정 및 검수가 가능해집니다.", "source": "표준교재 2권 p.23"}, {"num": 26, "category1": "2. 사전규격공개 분석", "category2": "3. 당해 규격공개 관련 법규 준수 및 부합여부 검토", "question": "사전규격공개의 일반적인 공개 기간에 대한 설명으로 가장 적절한 것은?", "options": ["통상 수일(3~7일 수준)이며, 긴급 시 더 짧게, 대형 SW사업은 더 길게 운영된다", "예외 없이 항상 10일이다", "공개 기간이라는 개념 자체가 없다", "30일이 원칙이다"], "answer": 1, "explanation": "* 정답 (①): 사전규격공개 기간은 기관·사업유형별로 상이하며 통상 수일 수준으로 운영됨.", "source": null}, {"num": 27, "category1": "2. 사전규격공개 분석", "category2": "3. 당해 규격공개 관련 법규 준수 및 부합여부 검토", "question": "조달청 소프트웨어사업(사업규모 5억원 이상)의 사전규격공개 기간에 대한 설명으로 가장 적절한 것은?", "options": ["긴급 시에도 동일하게 운영된다", "공개 자체가 면제된다", "일반 물품과 동일하게 운영된다", "일반 규격보다 더 긴 기간(10일 수준)으로 운영된다"], "answer": 4, "explanation": "* 정답 (④): 조달청 SW사업(5억원 이상)은 일반 규격보다 더 긴 기간(10일 수준)으로 사전규격을 공개함.", "source": null}, {"num": 28, "category1": "2. 사전규격공개 분석", "category2": "3. 당해 규격공개 관련 법규 준수 및 부합여부 검토", "question": "규격을 외부에 투명하게 검증받기 위한 '구매규격 사전공개' 절차의 예외적 생략 사유로 어긋나는 것은?", "options": ["구매 예상 예산이 1억 원 이하인 내자 물품 소액 구매의 경우 전면 생략할 수 있다.", "안보와 직결된 비밀물자나 수요가 매우 긴급한 구매 건의 경우 생략할 수 있다.", "당해 연도에 이미 1회 이상 동일한 규격으로 사전공개를 실시한 경우 생략할 수 있다.", "시급한 재난 복구 등 특정 목적 달성을 위한 수의계약 대상 물품인 경우 생략할 수 있다."], "answer": 1, "explanation": "* 정답 (①): 내자 물품 소액 구매의 경우, 규격 사전공개를 생략할 수 있는 예산 기준은 1억 원 '이하'가 아니라 '미만'으로 엄격히 규정되어 있습니다.", "source": null}, {"num": 29, "category1": "2. 사전규격공개 분석", "category2": "3. 당해 규격공개 관련 법규 준수 및 부합여부 검토", "question": "입찰 공고를 내기 전, 수요기관이 구매하려는 물품의 세부 규격이나 과업지시서를 나라장터에 미리 '사전규격공개' 하는 가장 주된 이유는?", "options": ["행정 절차 지연 시 입찰서 제출 기한을 합법적으로 연장할 수 있는 근거를 마련하기 위해", "특정 업체에 유리한 독소 조항이 있는지 미리 의견을 수렴하여 공정성 논란을 줄이기 위해", "입찰 경쟁률을 낮추기 위해 불특정 다수의 접근을 막고 제한된 업체에만 정보를 제공하기 위해", "사전 공개 기간 동안 업체들이 제출한 단가 정보를 취합하여 예정가격을 낮게 산정하기 위해"], "answer": 2, "explanation": "* 정답 (②): 발주기관이 특정 규격을 '알박기'하여 특정 업체에 특혜를 주는 것을 방지하고, 입찰 참여 희망 업체들의 이의제기 및 의견을 미리 수렴하여 조달 행정의 투명성과 공정성을 확보하기 위한 제도입니다.", "source": "정부 입찰·계약 집행기준 제77조"}, {"num": 30, "category1": "2. 사전규격공개 분석", "category2": "3. 당해 규격공개 관련 법규 준수 및 부합여부 검토", "question": "정식 입찰 공고를 내기 전에, 국가종합전자조달시스템을 통해 구매하려는 품목의 세부 사양이나 과업지시서를 일정 기간 동안 업체들에게 미리 공개하여 이의를 제기할 수 있게 하는 제도는?", "options": ["실적증명 사전발급", "입찰참가자격 사전심사(PQ)", "구매 규격 사전공개", "지명경쟁 대상자 사전예고"], "answer": 3, "explanation": "* 정답 (③): 특정 업체에 유리한 스펙(규격 알박기)이 포함되는 것을 막고, 다수 업체의 의견을 들어 공정한 경쟁을 유도하기 위해 필수적으로 거쳐야 하는 '사전규격공개' 제도입니다.", "source": "정부 입찰·계약 집행기준 제77조"}, {"num": 31, "category1": "2. 사전규격공개 분석", "category2": "4. 개선보완 필요사항에 대한 의견 제시 및 처리", "question": "사전규격공개 후 의견이 접수된 경우 계약담당자의 대응으로 가장 옳은 것은?", "options": ["조달사업의 목적을 저해하지 않는 한 적극적으로 검토해 반영 여부를 결정한다", "제출자에게 통보할 의무는 없다", "의견을 무시해도 무방하다", "모든 의견을 반드시 수용해야 한다"], "answer": 1, "explanation": "* 정답 (①): 계약담당자는 조달사업의 목적·취지를 저해하지 않는 한 적극적으로 의견을 수렴해 구매규격에 반영 여부를 결정해야 함.", "source": null}, {"num": 32, "category1": "2. 사전규격공개 분석", "category2": "3. 당해 규격공개 관련 법규 준수 및 부합여부 검토", "question": "사전규격공개 면제 대상에 해당하지 않는 것은?", "options": ["비밀 구매가 필요한 용역", "추정가격 1억원 이상 물품", "해당 연도 1회 이상 사전공개 실시 물품", "추정가격 5천만원 미만 물품"], "answer": 2, "explanation": "* 정답 (②): 추정가격 1억원 이상 물품은 면제 대상이 아니라 오히려 사전규격공개가 필요한 대상임.", "source": null}, {"num": 33, "category1": "3. 입찰공고문 분석", "category2": "1. 공고 내용 중 오류 및 법령 위반 사안으로 정정 필요성 검토", "question": "입찰공고 내용에 법령위반 사항이 발견되어 정정공고를 하는 경우, 남은 공고기간에 추가로 확보해야 하는 최소 기간은?", "options": ["3일 이상", "7일 이상", "추가 기간 없이 즉시 정정 가능", "5일 이상"], "answer": 4, "explanation": "* 정답 (④): 입찰공고 내용에 오류·법령위반이 있어 정정이 필요한 경우, 남은 공고기간에 5일 이상을 더하여 공고해야 함.", "source": "국가계약법 시행령 제33조제2항"}, {"num": 34, "category1": "3. 입찰공고문 분석", "category2": "1. 공고 내용 중 오류 및 법령 위반 사안으로 정정 필요성 검토", "question": "입찰공고 및 정정 절차에 대한 설명으로 가장 옳은 것은?", "options": ["국가계약법 시행령상 입찰공고 내용에 오류나 법령위반사항이 발견되어 정정공고할 경우 남은 공고기간에 5일 이상을 더한다.", "물품 및 용역의 구매규격은 특정 업체와의 유착을 방지하기 위해 입찰공고 전 사전공개가 원칙적으로 금지된다.", "입찰공고는 긴급한 재해예방·복구 등 특별한 사유가 있더라도 예외 없이 반드시 입찰서 제출마감일 전일부터 7일 전에 공고해야 한다.", "지정정보처리장치의 게시 내용과 첨부된 입찰공고문 내용이 다르면 게시된 내용이 우선한다."], "answer": 1, "explanation": "정답 (①) 국가계약법 시행령 제33조제2항: 오류·법령위반 시 남은 공고기간에 5일 이상  과거 매출액은 공동수급협정서 필수 기재사항이 아님.", "source": "공동계약 운용요령"}, {"num": 52, "category1": "4. 입찰·제안요청 설명", "category2": "2. 입찰 및 제안준비에 필요한 정보 식별 및 요청", "question": "입찰 준비 시 식별할 핵심 정보 중 '계약·법적 측면'에 해당하는 것은?", "options": ["사업기간·상세일정", "요구 기술사양·성능수준", "평가항목 및 배점", "지체상금률 및 하자보수 책임"], "answer": 4, "explanation": "* 정답 (④): 지체상금률·하자보수 책임은 계약·법적 측면 정보이며, ①은 기술적 측면, ②는 사업관리 측면, ④는 평가 측면임.", "source": null}, {"num": 53, "category1": "4. 입찰·제안요청 설명", "category2": "2. 입찰 및 제안준비에 필요한 정보 식별 및 요청", "question": "제안요청(RFP)에 의한 입찰에서 기술평가와 가격평가의 일반적 비중으로 가장 적절한 것은?", "options": ["기술 7~9 : 가격 1~3 수준(기술평가에 더 높은 가중치)", "기술3:가격7", "기술1:가격9", "기술5:가격5"], "answer": 1, "explanation": "* 정답 (①): 일반적으로 기술 7~9 : 가격 1~3 수준으로 기술평가에 더 높은 가중치를 부여함.", "source": null}, {"num": 54, "category1": "4. 입찰·제안요청 설명", "category2": "2. 입찰 및 제안준비에 필요한 정보 식별 및 요청", "question": "견적요청(RFQ)에 의한 입찰의 특징으로 옳은 것은?", "options": ["제안서평가와 가격평가를 종합해 낙찰자를 정한다", "기술역량을 중점 심사한다", "가격 비중이 절대적이며(원칙적으로 100%), 최저가 투찰자가 낙찰된다", "주로 전문용역·SW사업에 적용된다"], "answer": 3, "explanation": "* 정답 (③): RFQ는 규격이 확정된 물품 등에 대한 가격 견적 요청으로, 가격 비중이 절대적이며 최저가 투찰자가 낙찰됨. ①③은 RFP, ④는 ITB의 특징.", "source": null}, {"num": 55, "category1": "5. 입찰서 제출 및 개찰", "category2": "1. 입찰서 제출 방법", "question": "입찰보증금에 대한 설명으로 옳은 것은?", "options": ["계약 미체결 시에도 반환된다", "전자입찰에서는 납부이행각서로 갈음할 수 있다", "입찰금액의 10% 이상 납부", "현금으로만 납부 가능"], "answer": 2, "explanation": "* 정답 (②): 입찰보증금은 입찰금액의 5% 이상이며, 전자입찰에서는 납부이행각서로 갈음할 수 있음.", "source": "국가계약법 시행령 제37조"}, {"num": 56, "category1": "5. 입찰서 제출 및 개찰", "category2": "1. 입찰서 제출 방법", "question": "공동계약 허용 입찰에서 공동수급협정서 제출 시한으로 가장 적절한 것은?", "options": ["계약체결 시", "입찰마감일 당일", "개찰일 이후", "입찰마감 전일까지(사전 제출)"], "answer": 4, "explanation": "* 정답 (④): 공동수급협정서는 통상 입찰마감 전일까지 사전에 제출해야 함.", "source": "※ 공동계약 운용요령(기획재정부 계약예규)"}, {"num": 57, "category1": "5. 입찰서 제출 및 개찰", "category2": "1. 입찰서 제출 방법", "question": "[상황] 입찰마감 10분을 앞두고 나라장터 시스템 접속 장애가 발생해 B사가 입찰서를 제출하지 못했다. B사가 발주기관에 마감시간 이후 제출을 요청할 경우 인정 여부로 가장 옳은 것은?", "options": ["시스템 오류는 정당한 사유이므로 항상 인정된다", "유선으로 사전 통보했다면 인정된다", "전자입찰은 마감시간이 지나면 시스템 오류 등 사유와 무관하게 제출이 불가능한 것이 원칙이다", "발주기관 재량으로 자유롭게 연장해줄 수 있다"], "answer": 3, "explanation": "* 정답 (③): 전자입찰은 마감시간 이후에는 시스템 오류·인터넷 장애 등 어떠한 사유로도 제출이 불가능한 것이 원칙이므로, 여유를 두고 제출해야 함.", "source": null}, {"num": 58, "category1": "5. 입찰서 제출 및 개찰", "category2": "1. 입찰서 제출 방법", "question": "제출된 입찰서의 취소가 예외적으로 허용되는 경우로 가장 옳은 것은?", "options": ["계약담당자가 임의로 취소해주는 경우", "입찰보증금을 포기하겠다고 밝히면 언제든지", "입찰자가 중요부분의 오기를 이유로 개찰현장에서 취소의사를 표시하고, 발주기관이 이를 인정하는 경우", "입찰자가 마감 전 아무 때나 변경을 요청하는 경우"], "answer": 3, "explanation": "* 정답 (③): 제출된 입찰서는 원칙적으로 교환·변경·취소가 불가하나, 중요부분의 오기를 이유로 개찰현장에서 입찰자가 취소의사를 표시하고 발주기관이 이를 인정하는 경우에 한해 예외적으로 취소가 가능함.", "source": "국가계약법 시행령 제39조제4항"}, {"num": 59, "category1": "5. 입찰서 제출 및 개찰", "category2": "1. 입찰서 제출 방법", "question": "입찰보증금의 금액 기준으로 옳은 것은?", "options": ["입찰금액의 5% 이상", "추정가격의 3% 이상", "계약금액의 5% 이상", "예정가격의 10% 이상"], "answer": 1, "explanation": "* 정답 (①): 입찰보증금은 입찰금액의 100분의 5 이상을 납부하는 것이 원칙임.", "source": "국가계약법 시행령 제37조"}, {"num": 60, "category1": "5. 입찰서 제출 및 개찰", "category2": "1. 입찰서 제출 방법", "question": "입찰참가 신청 절차 및 보증금 규정에 대한 설명으로 가장 옳은 것은?", "options": ["참가자격등록자는 입찰보증금 납부 여부와 무관하게 모든 관련 신청 서류를 제출해야 한다.", "입찰참가자의 서류 접수마감일은 평가 공정성을 위해 통상 입찰서 제출마감일 3일 전이다.", "정부 공공입찰에서의 입찰보증금은 공고상 추정가격을 기준으로 최소 100분의 10 이상이다.", "입찰공고에 따라 지급확약서를 제출하면 특정 요건 하에 입찰보증금을 현금 납부하지 않을 수 있다."], "answer": 4, "explanation": "정답 (④) 신용 상태 등에 따라 보증서나 지급각서로 대체 허용 / ① 서류 생략 가능 / ② 전일 마감 / ③ 통상 5/100", "source": "국가계약법 시행령"}, {"num": 61, "category1": "5. 입찰서 제출 및 개찰", "category2": "2. 무효입찰 사유", "question": "입찰보증금이 국고에 귀속되는 사유로 옳은 것은?", "options": ["낙찰자가 정당한 이유 없이 계약을 체결하지 않은 경우", "입찰가격이 예정가격을 초과한 경우", "비낙찰자인 경우", "단순 입찰 불참"], "answer": 1, "explanation": "* 정답 (①): 낙찰자가 정당한 이유 없이 계약을 체결하지 않으면 입찰보증금이 국고에 귀속됨.", "source": "국가계약법 시행령 제37조"}, {"num": 62, "category1": "5. 입찰서 제출 및 개찰", "category2": "2. 무효입찰 사유", "question": "허위 정보로 입찰에 참여해 낙찰·계약체결 후 그 사실이 확인된 경우 받을 수 있는 제재를 모두 고르면? (ㄱ.계약해제·해지 ㄴ.손해배상 ㄷ.부정당업자제재)", "options": ["ㄱ,ㄴ,ㄷ", "ㄱ,ㄴ", "ㄱ,ㄷ", "ㄴ,ㄷ"], "answer": 1,  지급 시마다 일정 비율씩 순차적으로 정산됨.", "source": null}, {"num": 42, "category1": "4. 낙찰자 결정방법", "category2": "1. 적격심사 절차 및 낙찰자 결정", "question": "[상황] 계약금액 5억원인 공사계약에서 계약상대자가 납부해야 할 계약보증금의 최소 금액을 계산하려 한다. 계약보증금 요율(계약금액의 10% 이상)을 적용할 때 최소 납부액은?", "options": ["5,000만원", "1억원", "2,500만원", "7,500만원"], "answer": 1, "explanation": "* 정답 (①): 계약보증금은 계약금액의 10% 이상이므로, 5억원의 10%인 5,000만원 이상을 납부해야 함.", "source": "국가계약법 시행령 제50조"}, {"num": 43, "category1": "4. 낙찰자 결정방법", "category2": "1. 적격심사 절차 및 낙찰자 결정", "question": "계약의 해제와 해지에 대한 설명으로 옳은 것은?", "options": ["해제·해지 모두 장래에 향해서만 효력을 소멸시킨다", "해제와 해지는 법적 효과가 동일하다", "해제는 계약의 효력을 소급하여 소멸시키고, 해지는 장래에 향하여만 효력을 소멸시킨다", "해제·해지 모두 계약의 효력을 소급하여 소멸시킨다"], "answer": 3, "explanation": "* 정답 (③): 해제는 소급효(처음부터 무효), 해지는 장래효(그때부터만 무효)라는 점에서 구분됨.", "source": "국가계약법 시행령 제75조"}, {"num": 44, "category1": "4. 낙찰자 결정방법", "category2": "1. 적격심사 절차 및 낙찰자 결정", "question": "공사계약에서 정당한 사유 없이 이행이 지체된 경우 적용되는 1일당 지체상금률로 옳은 것은?", "options": ["계약금액의 0.5%", "계약금액의 0.1%", "계약금액의 0.01%", "계약금액의 0.05%"], "answer": 4, "explanation": "* 정답 (④): 공사계약의 지체상금률은 1일당 계약금액의 0.05%임.", "source": "국가계약법 시행규칙 제75조"}, {"num": 45, "category1": "4. 낙찰자 결정방법", "category2": "1. 적격심사 절차 및 낙찰자 결정", "question": "계약상대자가 검사에 합격한 후 대가 지급을 청구한 경우, 발주기관이 대가를 지급해야 하는 기한으로 옳은 것은?", "options": ["청구일로부터 10일 이내", "청구일로부터 5일 이내", "청구일로부터 3일 이내", "청구일로부터 14일 이내"], "answer": 2, "explanation": "* 정답 (②): 검사에 합격한 후 청구를 받은 날로부터 5일 이내에 대가를 지급해야 함.", "source": "국가계약법 시행령 제58조"}, {"num": 46, "category1": "4. 낙찰자 결정방법", "category2": "1. 적격심사 절차 및 낙찰자 결정", "question": "계약금액이 일정 금액 이하인 경우 계약서 작성을 생략할 수 있는데, 그 기준 금액으로 옳은 것은?", "options": ["1억원 이하", "3,000만원 이하", "1,000만원 이하", "5,000만원 이하"], "answer": 2, "explanation": "* 정답 (②): 계약금액이 3,000만원 이하인 경우 등 일정 사유에 해당하면 계약서 작성을 생략할 수 있음.", "source": "국가계약법 시행령 제49조"}, {"num": 47, "category1": "4. 낙찰자 결정방법", "category2": "1. 적격심사 절차 및 낙찰자 결정", "question": "[상황] 물품 적격심사 대상 입찰에서 낙찰하한율 미만으로 투찰한 업체가 있었다. 물품 계약의 낙찰하한율이 예정가격 대비 약 88% 수준이라 할 때, 이 업체가 받게 되는 처리로 가장 적절한 것은?", "options": ["낙찰하한율과 무관하게 자동으로 낙찰된다", "낙찰하한율 미만이므로 심사 대상에서 제외될 수 있다", "낙찰하한율은 공사에만 적용되므로 이 사례와 무관하다", "낙찰하한율 미만이라도 가산점을 받아 우대된다"], "answer": 2, "explanation": "* 정답 (②): 낙찰하한율 미만으로 투찰한 업체는 적격심사 대상에서 제외되는 것이 원칙임.", "source": null}, {"num": 48, "category1": "4. 낙찰자 결정방법", "category2": "1. 적격심사 절차 및 낙찰자 결정", "question": "낙찰자로 선정된 업체가 정당한 이유 없이 계약을 체결하지 않는 경우 받게 되는 조치로 옳은 것은?", "options": ["아무런 불이익이 없다", "형사처벌만 이루어진다", "단순 과태료만 부과된다", "입찰보증금이 국고에 귀속되고 부정당업자로 제재될 수 있다"], "answer": 4, "explanation": "* 정답 (④): 정당한 이유 없이 계약을 체결하지 않으면 입찰보증금이 국고에 귀속되고 부정당업자 제재 대상이 될 수 있음.", "source": "국가계약법 시행령 제37조·제76조"}, {"num": 49, "category1": "4. 낙찰자 결정방법", "category2": "1. 적격심사 절차 및 낙찰자 결정", "question": "[상황] 재공고 입찰을 실시했음에도 유효한 입찰자가 1인뿐이었다. 발주기관이 취할 수 있는 조치로 가장 적절한 것은?", "options": ["해당 입찰을 취소할 수밖에 없다", "추정가격을 인상해 재공고해야 한다", "반드시 다시 재공고 입찰을 실시해야 한다", "예외적으로 그 1인과 수의계약을 체결할 수 있다"], "answer": 4, "explanation": "* 정답 (④): 재공고 입찰에서도 1인만 입찰한 경우에는 예외적으로 그 1인과 수의계약을 체결할 수 있음.", "source": "국가계약법 시행령 제27조"}, {"num": 50, "category1": "4. 낙찰자 결정방법", "category2": "1. 적격심사 절차 및 낙찰자 결정", "question": "물품의 제조·구매 계약에서 정당한 사유 없이 이행이 지체된 경우 적용되는 1일당 지체상금률로 옳은 것은?", "options": ["계약금액의 0.05%", "계약금액의 0.1%", "계약금액의 0.125%", "계약금액의 0.075%"], "answer": 4, "explanation": "* 정답 (④): 물품 제조·구매 계약의 지체상금률은 1일당 계약금액의 0.075%임(공사는 0.05%).", "source": "국가계약법 시행규칙 제75조"}, {"num": 51, "category1": "4. 낙찰자 결정방법", "category2": "1. 적격심사 절차 및 낙찰자 결정", "question": "예정가격에 대한 설명으로 옳지 않은 것은?", "options": ["입찰이 끝난 후 낙찰자의 투찰금액을 기준으로 산정한다", "입찰 전에 미리 작성하여 비치해야 한다", "낙찰자 및 계약금액 결정의 기준이 된다", "예산 낭비를 방지하는 기준금액이 된다"], "answer": 1, "explanation": "* 정답 (①): 예정가격은 입찰 전에 미리 작성·비치되어야 하며 입찰 후에는 변경될 수 없다. 입찰 후 결정되는 것은 계약금액이지 예정가격이 아님.", "source": "국가계약법 시행령 제7조의2"}, {"num": 52, "category1": "4. 낙찰자 결정방법", "category2": "1. 적격심사 절차 및 낙찰자 결정", "question": "계약금액 결정 유형 중 공급자(계약상대자)의 위험 부담이 가장 큰 것은?", "options": ["원가상환계약", "개산계약", "확정가격계약", "단가계약"], "answer": 3, "explanation": "* 정답 (③): 확정가격계약은 계약체결 시 가격이 확정되어 이행해야 하므로 원가상승 등의 위험을 공급자가 부담하며, 원가상환계약·개산계약은 상대적으로 수요기관의 위험 부담이 큼.", "source": null}, {"num": 53, "category1": "4. 낙찰자 결정방법", "category2": "1. 적격심사 절차 및 낙찰자 결정", "question": "계약보증금의 금액 기준으로 옳은 것은?", "options": ["계약금액의 5% 이상", "계약금액의 15% 이상", "계약금액의 20% 이상", "계약금액의 10% 이상"], "answer": 4, "explanation": "* 정답 (④): 계약보증금은 계약상대자의 계약이행을 담보하기 위해 계약금액의 100분의 10 이상을 납부하는 것이 원칙임.", "source": "국가계약법 시행령 제50조"}, {"num": 54, "category1": "4. 낙찰자 결정방법", "category2": "1. 적격심사 절차 및 낙찰자 결정", "question": "입찰자 중 가장 적합한 자를 고르기 위한 '낙찰자 선정 방법(결정 기준)'이 아닌 것은?", "options": ["이행 능력을 정밀 심사하는 적격심사 낙찰제", "기술력과 가격을 합산하는 협상에 의한 낙찰제", "품질과 성능을 계량화하는 종합심사 낙찰제", "입찰 경쟁을 임의로 배제하는 수의계약 제도"], "answer": 4, "explanation": "* 정답 (④): 수의계약은 다수 업체의 경쟁 후 '낙찰자를 선정하는 방식'이 아니라, 경쟁입찰 자체를 배제하는 '계약 체결 방법'의 종류입니다.", "source": null}, {"num": 55, "category1": "4. 낙찰자 결정방법", "category2": "1. 적격심사 절차 및 낙찰자 결정", "question": "입찰 참여 업체 중 가장 적합한 최종 계약상대자를 고르기 위한 '낙찰자 선정 방법(결정 기준)'에 해당하지 않는 것은?", "options": ["이행 능력을 정밀하게 종합 심사하는 적격심사 낙찰제도", "특정 자격으로 입찰 참여 문턱을 높이는 제한경쟁입찰 제도", "최저가부터 순차적으로 수요물량을 배정하는 희망수량 경쟁입찰", "가격과 품질을 모두 계량화하여 합산하는 종합낙찰제도"], "answer": 2, "explanation": "* 정답 (②): '제한경쟁입찰'은 참가 자격을 한정하는 '입찰 방식'이며, 그 안에서 최종 승자를 가리는 '낙찰자 선정 결정 기준' 자체를 의미하지 않습니다.", "source": null}, {"num": 56, "category1": "4. 낙찰자 결정방법", "category2": "1. 적격심사 절차 및 낙찰자 결정", "question": "물품구매 적격심사 세부기준에 명시된 낙찰자 선정을 위한 '심사항목 대분류'에 원칙적으로 해당하지 않는 것은?", "options": ["윤리경영, 품질관리 등 거래 상대방으로서의 신뢰 정도를 평가하는 신인도 분야", "기한 내에 차질 없이 목적물을 공급할 수 있는지를 평가하는 당해물품 납품이행능력", "입찰자가 제출한 투찰 금액의 적정성과 예산 절감 효과를 평가하는 입찰가격 분야", "과거 국가기관에 유사한 물품을 성공적으로 납품한 이력을 따지는 단독 납품실적 분야"], "answer": 4, "explanation": "* 정답 (④): '납품실적'은 독립된 대분류가 아니라, '당해물품 납품이행능력' 대분류에 포함되는 하위 세부 심사 항목(경영상태, 기술능력 등과 병존)입니다.", "source": null}, {"num": 57, "category1": "4. 낙찰자 결정방법", "category2": "1. 적격심사 절차 및 낙찰자 결정", "question": "추정가격 고시금액 이상 10억 원 미만 물품제조 입찰 적격심사의 '항목별 배점 한도' 설명으로 올바른 것은?", "options": ["경영상태는 신용평가등급으로 엄격히 평가하며 배점 한도는 고정 30점이다.", "신인도의 품질관리 등 신뢰 정도는 각 세부 항목 해당 시 최대 -5점 감점한다.", "신인도의 품질관리 등 신뢰 정도는 각 세부 항목 해당 시 최대 +5점 가산한다.", "가격 경쟁력을 평가하기 위한 입찰가격 분야의 배점 한도는 고정 60점이다."], "answer": 1, "explanation": "* 정답 (①): 고시금액 이상 10억 원 미만 제조 입찰의 경영상태 배점은 30점이며, 입찰가격 배점은 70점입니다. 신인도는 보통 +3점~-2점 범위 내에서 적용됩니다.", "source": null}, {"num": 58, "category1": "4. 낙찰자 결정방법", "category2": "1. 적격심사 절차 및 낙찰자 결정", "question": "조달청 적격심사 기준에 따른 '기간 계산 등 항목별 심사 기준일'의 적용 시점으로 가장 타당한 것은?", "options": ["경영상태 및 신인도 심사 기준일은 원칙적으로 입찰공고일을 명확한 기준으로 삼는다.", "납품이행능력의 결격 여부를 판단하는 심사 기준일은 서류제출 마감일을 엄격히 적용한다.", "공고일 이후 수정된 자료는 서류제출 마감일 전 보완되었다면 예외 없이 평가에 반영한다.", "납품실적 등 기술능력 심사 기준일은 행정 편의를 위해 통상 입찰일 전일로 유연하게 적용한다."], "answer": 1, "explanation": "* 정답 (①): 적격심사 기준일은 원칙적으로 입찰공고일입니다. 공고일 이후 수정된 자료는 평가되지 않으며, 결격 여부 심사 기준일은 '낙찰자 결정일'입니다.", "source": null}, {"num": 59, "category1": "4. 낙찰자 결정방법", "category2": "1. 적격심사 절차 및 낙찰자 결정", "question": "추정가격 10억 원 이상으로서 제조자로 한정하는 물품제조 입찰 적격심사의 '분야별 배점 한도'가 틀린 것은?", "options": ["재무적 안정성을 정밀하게 평가하는 경영상태 분야의 배점 한도는 30점이다.", "투찰 금액의 적정성을 공정하게 평가하는 입찰가격 분야의 배점 한도는 70점이다.", "과거 목적물을 성공적으로 납품한 이력을 따지는 납품실적 분야 배점 한도는 5점이다.", "생산 시설 및 전문 기술 인력 등을 종합적으로 평가하는 기술능력 분야 배점 한도는 10점이다."], "answer": 2, "explanation": "* 정답 (②): 추정가격 10억 원 이상 제조 입찰의 입찰가격 배점은 '55점'입니다(실적 5 + 기술 10 + 경영 30 + 가격 55). 70점은 고시금액 이상 10억 미만 구간 적용치입니다.", "source": null}, {"num": 60, "category1": "4. 낙찰자 결정방법", "category2": "1. 적격심사 절차 및 낙찰자 결정", "question": "입찰 방식별 낙찰자 결정 기준에 대한 설명으로 가장 옳은 것은?", "options": ["2단계 경쟁입찰 방식은 기술과 가격을 동시에 평가하여 최고 득점자를 최종 낙찰자로 한다.", "규격가격동시 입찰은 규격 입찰 개찰 결과 합격자(적격자)가 단 1인이어도 가격 개찰을 실시한다.", "100억 원 이상 대형 공사는 공사수행능력 등을 종합 심사하여 최종 낙찰자를 종합심사낙찰제로 결정한다.", "재정지출 부담이 되는 입찰은 계약이행 능력을 무시하고 최저가격을 제시한 자를 무조건 낙찰한다."], "answer": 3, "explanation": "정답 (③) 대형 공사는 종심제 적용 / ① 규격 통과자 중 최저가 낙찰 / ② 적격자 2인 이상이어야 진행 / ④ 이행능력 심사 필요", "source": "국가계약법 시행령 제42조"}, {"num": 61, "category1": "4. 낙찰자 결정방법", "category2": "2. 협상계약 절차 및 낙찰자 결정", "question": "'2단계 경쟁 등의 입찰' 및 '규격·가격 동시입찰' 제도에 대한 법적·실무적 설명으로 가장 올바르지 않은 것은?", "options": ["2단계 경쟁입찰은 1단계 규격 심사에서 적격자로 확정된 자에 한하여 2단계 가격입찰서 제출 자격을 부여한다.", "규격·가격 동시입찰 시 규격적격자가 1인이면 가격 개찰이 가능하나, 예정가격을 초과할 경우 재입찰을  아니며, 자격·대금 적정성·범위·지급조건 등이 핵심 점검사항임.", "source": "건설산업기본법 제29조·제31조"}, {"num": 31, "category1": "2. 계약변경 관리", "category2": "1. 변경계약 관리 일반절차", "question": "계약금액 조정 등 계약내용을 변경할 때 일반적으로 따르는 절차 순서로 옳은 것은?", "options": ["변경사유 확인 → 변경내용 협의·산정 → 변경계약서 작성·체결 → 이행 반영", "계약해지 → 재입찰 → 신규계약", "대금지급 → 검사 → 변경사유 확인", "하자보수 → 변경계약"], "answer": 1, "explanation": "* 정답 (①): 변경계약은 사유 확인부터 이행 반영까지 순차적으로 이루어짐.", "source": "국가계약법 시행령 제64조~제66조"}, {"num": 32, "category1": "2. 계약변경 관리", "category2": "1. 변경계약 관리 일반절차", "question": "계약내용 변경의 대표적 사유가 아닌 것은?", "options": ["설계변경", "단순한 발주기관 해당 기관의 과거 관행 및 내부 지침을 우선 적용한다", "물가변동", "기타 계약내용의 변경(공사기간·운반거리 등)"], "answer": 2, "explanation": "* 정답 (②): 과거 관행이나 부적절한 재량는 계약금액·내용 조정의 법적 사유가 될 수 없음.", "source": "국가계약법 시행령 제64조~제66조"}, {"num": 33, "category1": "2. 계약변경 관리", "category2": "1. 변경계약 관리 일반절차", "question": "계약금액 조정 시 일반적으로 우선 확인해야 할 사항은?", "options": ["경쟁사의 가격", "계약상대자의 재무제표", "발주기관 내부 일상감사 결과", "관련 법령·계약조건상의 조정요건 충족 여부"], "answer": 4, "explanation": "* 정답 (④): 조정요건(기간·비율 등) 충족 여부를 먼저 확인하는 것이 원칙임.", "source": "국가계약법 시행령 제64조~제66조"}, {"num": 34, "category1": "2. 계약변경 관리", "category2": "1. 변경계약 관리 일반절차", "question": "변경계약 관리절차에서 요구되지 않는 것은?", "options": ["변경 없이 구두로만 처리", "변경사유 및 근거 문서화", "변경 전후 계약금액·기간 등 비교", "관련 서류(변경계약서 등) 준비"], "answer": 1, "explanation": "* 정답 (①): 구두 처리만으로는 계약변경의 근거를 남길 수 없어 부적절함.", "source": "국가계약법 시행령 제64조~제66조"}, {"num": 35, "category1": "2. 계약변경 관리", "category2": "1. 변경계약 관리 일반절차", "question": "[상황] 설계변경 사유가 발생했으나 계약담당자가 별도 절차 없이 구두로만 변경을 지시했다. 문제점으로 가장 적절한 것은?", "options": ["변경계약 절차(문서화·계약금액조정 등)를 거치지 않아 분쟁의 소지가 있다", "해당 계약은 해제되며, 기이행분에 대한 정산 절차만 남게 된다", "법적으로 전혀 문제없다", "변경계약 미체결을 사유로 지연된 기간은 지체상금 산정에서 제외된다"], "answer": 1, "explanation": "* 정답 (①): 절차를 거치지 않은 구두 변경은 추후 분쟁 시 근거자료 부족으로 이어질 수 있음.", "source": "국가계약법 시행령 제64조~제66조"}, {"num": 36, "category1": "2. 계약변경 관리", "category2": "1. 변경계약 관리 일반절차", "question": "물가변동으로 인한 계약금액 조정을 신청하기 위해 충족해야 하는 기간·등락률 요건으로 옳은 것은?", "options": ["계약체결일로부터 90일 이상 경과하고, 등락률이 3% 이상일 것", "계약체결일로부터 60일 이상 경과하고, 등락률이 5% 이상일 것", "기간 요건 없이 등락률 1%만 넘으면 조정 가능", "계약체결일로부터 30일 이상 경과하면 등락률과 무관하게 조정 가능"], "answer": 1, "explanation": "* 정답 (①): 물가변동으로 인한 계약금액 조정은 계약체결일(또는 직전 조정기준일)로부터 90일 이상 경과하고, 동시에 품목조정률 또는 지수조정률이 3% 이상 증감해야 신청할 수 있음.", "source": "국가계약법 시행령 제64조"}, {"num": 37, "category1": "2. 계약변경 관리", "category2": "1. 변경계약 관리 일반절차", "question": "물가변동 조정 요건 중 '기간 요건'과 '등락률 요건'의 관계에 대한 설명으로 가장 옳은 것은?", "options": ["두 요건은 각각 별도로 충족되어도 무방하며, 하나만 충족하면 조정이 가능하다", "두 요건을 동시에 충족한 날을 '조정기준일'로 보며, 둘 다 충족해야 조정이 가능하다", "등락률 요건만 있으면 충분하고 기간 요건은 폐지되었다", "기간 요건과 등락률 요건은 담당 공무원의 재량으로 생략할 수 있다"], "answer": 2, "explanation": "* 정답 (②): 기간 요건(90일 이상 경과)과 등락률 요건(3% 이상 증감)은 동시에 충족되어야 하며, 두 요건이 모두 충족된 날을 조정기준일로 봄. 어느 하나만으로는 조정 대상이 되지 않음.", "source": "국가계약법 시행령 제64조"}, {"num": 38, "category1": "2. 계약변경 관리", "category2": "1. 변경계약 관리 일반절차", "question": "물가변동 조정 방법 중 '품목조정률' 방식에 대한 설명으로 가장 적절한 것은?", "options": ["계약금액을 구성하는 모든 품목 또는 비목의 실제 가격 변동을 조사하여 등락률을 산정하는 방식이다", "비목군을 편성하고 각 비목군의 지수 변동만을 반영하는 방식이다", "발주기관이 등락률과 무관하게 임의로 정하는 방식이다", "한국은행 생산자물가지수만을 그대로 적용하는 방식이다"], "answer": 1, "explanation": "* 정답 (①): 품목조정률 방식은 계약금액을 구성하는 개별 품목·비목의 실제 가격 등락을 각각 조사하여 산정하는 방식으로, 비목군별 지수를 활용하는 지수조정률 방식과 구별됨.", "source": "국가계약법 시행령 제64조"}, {"num": 39, "category1": "2. 계약변경 관리", "category2": "1. 변경계약 관리 일반절차", "question": "정부 계약 이행 중 물가변동에 따른 계약금액 조정(Escalation)에 대한 설명으로 가장 올바른 것은?", "options": ["계약 체결 후 90일이 경과하고 통계청이 발표하는 단순 소비자물가지수 변동률이 3% 이상 증감하면 즉시 계약금액을 일괄 조정한다.", "계약금액을 조정하기 위해서는 원칙적으로 계약 체결일로부터 90일 이상 경과하고, 법정 품목조정률 또는 지수조정률이 3% 이상 증감해야 한다.", "계약금액 조정 방식은 원칙적으로 품목조정률을 우선 적용하며, 발주기관이 동의하는 경우에만 지수조정률을 예외적으로 적용한다.", "특정 원자재 가격이 단기간에 비정상적으로 급등하더라도 계약체결 후 90일 이내에는 계약금액을 조정할 수 있는 예외 조항이 없다."], "answer": 2, "explanation": "* 정답 (②): 물가변동에 의한 계약금액 조정은 '계약 체결일로부터 90일 이상 경과'와 '품목/지수조정률 3% 이상 증감'이라는 두 가지 법정 요건을 동시에 충족해야 합니다. (오답 노트: ① 단순 소비자물가지수가 아닌 산출내역서 비목 기준의 품목/지수조정률 적용, ③ 발주기관 동의와 무관하게 '계약상대자가 원하는 경우' 지수조정률 적용, ④ 특정 원자재 급등 시 단품슬라이딩 제도를 통해 예외적 조정 가능)", "source": "「국가계약법 시행령」 제64조"}, {"num": 40, "category1": "2. 계약변경 관리", "category2": "2. 변경계약 절차 실행", "question": "변경계약 절차 실행 단계에서 계약담당자가 준비해야 할 서류로 가장 거리가 먼 것은?", "options": ["변경된 내역서(설계변경 등)", "타 계약 건의 영업비밀 서류", "변경 사유를 증명하는 서류", "변경계약서(또는 변경 합의서)"], "answer": 2, "explanation": "* 정답 (②): 타 계약의 영업비밀 서류는 해당 변경계약과 무관함.", "source": "국가계약법 시행령 제65조"}, {"num": 41, "category1": "2. 계약변경 관리", "category2": "2. 변경계약 절차 실행", "question": "계약금액이 변경되는 경우 일반관리비·이윤의 적용 원칙은?", "options": ["산출내역서상의 비율을 적용하되 법정 요율을 초과할 수 없다", "적용하지 않는다", "발주기관이 임의로 정한다", "항상 법정 최고요율을 적용한다"], "answer": 1, "explanation": "* 정답 (①): 기존 계약의 산출내역서상 비율을 따르되 법정 요율 상한을 넘을 수 없음.", "source": "국가계약법 시행령 제65조"}, {"num": 42, "category1": "2. 계약변경 관리", "category2": "2. 변경계약 절차 실행", "question": "변경계약 체결 후 이행 단계에서 해야 할 조치로 옳은 것은?", "options": ["기존 계약대로만 이행한다", "변경사항을 계약상대자에게만 알리지 않는다", "변경된 계약조건을 계약당사자에게 명확히 설명하고 이행에 반영한다", "아무 조치도 필요 없다"], "answer": 3, "explanation": "* 정답 (③): 변경된 조건이 실제 이행에 반영되도록 관리해야 함.", "source": "국가계약법 시행령 제65조"}, {"num": 43, "category1": "2. 계약변경 관리", "category2": "2. 변경계약 절차 실행", "question": "변경계약 절차 실행 시 유의사항이 아닌 것은?", "options": ["변경 전후 내용을 문서로 남김", "계약상대자의 동의 없이 임의로 확정 통보", "계약금액 증액의 경우 예산 범위 내인지 확인", "일정 규모 이상 증액 시 내부 승인절차 확인"], "answer": 2, "explanation": "* 정답 (②): 계약변경은 원칙적으로 계약상대자와의 협의·동의 절차를 거쳐야 함.", "source": "국가계약법 시행령 제65조"}, {"num": 44, "category1": "2. 계약변경 관리", "category2": "2. 변경계약 절차 실행", "question": "[상황] 설계변경으로 계약금액이 10% 이상 증액되는데 내부 승인절차 없이 계약담당자가 단독으로 처리했다. 이에 대한 평가로 가장 옳은 것은?", "options": ["해당 계약은 취소할 수 있으나 기이행 부분에 대한 대가는 지급해야 한다", "반드시 재입찰해야 한다", "대규모 증액에 대한 내부 통제(소속 중앙관서의 장 승인 등) 절차를 누락한 것으로 볼 수 있다", "아무 문제 없다"], "answer": 3, "explanation": "* 정답 (③): 일정 비율 이상의 증액은 내부 통제 절차를 거치는 것이 원칙임.", "source": "국가계약법 시행령 제65조"}, {"num": 45, "category1": "2. 계약변경 관리", "category2": "2. 변경계약 절차 실행", "question": "설계변경으로 계약서에 없던 신규 비목이 발생했고 그 사유가 계약상대자의 책임이 아닌 경우, 해당 비목의 단가 산정 방법으로 옳은 것은?", "options": ["계약상대자가 제시하는 금액을 그대로 인정한다", "설계변경 당시를 기준으로 산정한 단가에 낙찰률을 곱한 금액으로 한다", "예정가격 산정 당시의 단가를 그대로 적용한다", "단가 산정 없이 발주기관이 일방적으로 금액을 정한다"], "answer": 2, "explanation": "* 정답 (②): 계약서에 없는 신규 비목의 단가는 설계변경 당시를 기준으로 산정한 단가에 낙찰률을 곱한 금액으로 하는 것이 원칙임.", "source": "국가계약법 시행령 제65조"}, {"num": 46, "category1": "2. 계약변경 관리", "category2": "2. 변경계약 절차 실행", "question": "공사 및 용역 장기 계약 이행 중, 국가계약법령에 따라 물가 변동의 사유로 '계약금액 조정(Escalation, 에스컬레이션)'을 신청할 수 있는 최소 법정 요건은?", "options": ["계약체결일로부터 60일 이상 경과 및 지수조정률 2% 이상 증감", "계약체결일로부터 120일 이상 경과 및 지수조정률 5% 이상 증감", "계약체결일로부터 180일 이상 경과 및 지수조정률 1% 이상 증감", "계약체결일로부터 90일 이상 경과 및 지수조정률 3% 이상 증감"], "answer": 4, "explanation": "* 정답 (④): 시중 물가가 급격히 올라 업체의 손실이 커지는 것을 막기 위해, 원칙적으로 계약체결일 기준 '90일'이 지나고, 품목(지수)조정률이 '3%' 이상 오르거나 내린 경우 계약 금액을 조정할 수 있습니다.", "source": null}, {"num": 47, "category1": "2. 계약변경 관리", "category2": "2. 변경계약 절차 실행", "question": "설계변경으로 인한 계약금액 조정 및 단가 산정 방식에 대한 설명으로 가장 올바른 것은?", "options": ["계약상대자의 새로운 기술 사용으로 공사비가 현저히 절감된 경우, 그 절감액의 30%를 계약상대자에게 보상금 성격으로 지급(또는 감액 면제)한다.", "설계변경으로 물량이 증가한 경우, 원래의 계약단가가 발주기관의 예정가격단가보다 높더라도 무조건 기존 계약단가를 적용해야 한다.", "계약상대자가 물량내역서를 직접 작성한 경우, 본인의 누락이나 오류를 이유로 언제든지 설계변경과 그에 따른 계약금액 증액 조정을 요구할 수 있다.", "설계변경 당시를 기준으로 산정한 신규 비목의 단가는 낙찰률을 고려하지 않고 100% 전액을 계약금액에 그대로 반영해야 한다."], "answer": 1, "explanation": "* 정답 (①): 신기술 도입으로 공사비가 절감되었을 때 발주기관이 절감액을 100% 감액하는 것이 아니라, 신기술 개발을 장려하기 위해 절감액의 30%를 계약상대자에게 인센티브로 보상합니다. (오답 노트: ② 계약단가가 예정가격단가보다 높은 경우 증가된 물량은 '예정가격단가'를 적용, ③ 내역입찰 등 계약상대자가 내역서를 작성한 경우 본인 오류로 인한 증액 불가, ④ 신규 비목은 원칙적으로 설계변경 당시 단가에 '낙찰률'을 곱하여 산정)", "source": "「국가계약법 시행령」 제65조"}, {"num": 48, "category1": "2. 계약변경 관리", "category2": "3. 계약해제·해지 절차 및 사후조치", "question": "[상황] A계약은 이행 도중 해제되었고, B계약은 이행 도중 해지되었다. 두 계약의 법적 효과 차이로 가장 옳은 것은?", "options": ["A계약은 소급하여 계약의 효력이 소멸되어 원상회복 문제가 발생할 수 있고, B계약은 장래에 대해서만 효력이 소멸되어 이미 이행된 부분은 그대로 유효하다", "두 계약 모두 장래에 대해서만 효력이 소멸된다는 점에서 동일하다", "A계약은 장래효, B계약은 소급효를 가진다", "두 계약 모두 소급하여 효력이 소멸된다는 점에서 동일하다"], "answer": 1, "explanation": "* 정답 (①): 해제는 소급효를 가져 원상회복 문제가 발생할 수 있고, 해지는 장래효만 가져 이미 이행된 부분의 효력은 유지됨.", "source": "국가계약법 시행령 제75조"}, {"num": 49, "category1": "2. 계약변경 관리", "category2": "3. 계약해제·해지 절차 및 사후조치", "quest 차이며, 그 결과에 이의가 있는 경우 국가계약분쟁조정위원회에 조정을 청구하는 것으로 이어지는 단계별 구조를 가짐.", "source": "국가계약법 제28조·제29조"}, {"num": 66, "category1": "2. 계약변경 관리", "category2": "5. 분쟁해결 절차", "question": "정부조달계약 과정에서 불이익을 받은 업체의 권리 구제를 위한 이의신청 제도에 대한 설명으로 가장 올바른 것은?", "options": ["이의신청을 공식적으로 접수한 기관의 장은 추가적인 심층 조사를 위해 접수일로부터 60일 이내에 심사 결과를 신청인에게 통지해야 한다.", "조달계약 과정에서 불이익을 받은 업체는 금액 규모와 상관없이 추정가격 1천만 원 미만의 모든 소액 수의계약 건에 대해서도 이의신청을 제기할 수 있다.", "해당 중앙관서에 제기한 이의신청 결과에 불복하는 자는 조달정책심의위원회가 아닌 감사원에 직접 재심을 청구하는 방법 외에는 구제 수단이 없다.", "국가계약법령상 이의신청은 불이익의 원인이 되는 행위가 있었던 날부터 15일, 또는 그 행위가 있음을 안 날부터 10일 이내에 해당 중앙관서의 장에게 제기해야 한다."], "answer": 4, "explanation": "정답 (④) 국가계약법 제28조에 따라 안 날부터 10일, 있었던 날부터 15일 이내 제기 / ① 접수일로부터 15일 이내 심사·통지 / ② 소액 수의계약 등은 대상 제외 / ③ 재경부 장관 소속 국가계약분쟁조정위원회에 재심 청구 가능", "source": "「국가계약법」 제28조 및 동법 시행령 제31조의2"}, {"num": 67, "category1": "2. 계약변경 관리", "category2": "5. 분쟁해결 절차", "question": "국가계약 분쟁 발생 시 효율적인 구제를 위해 국가계약분쟁조정위원회 등의 행정적 이의신청 및 조정 절차 외에, 계약체결 시점부터 당사자 간 합의(조항 명시)를 통해 정할 수 있는 사법적 성격의 대안적 분쟁 해결 방식은?", "options": ["「중재법」에 따른 중재", "「행정심판법」에 따른 행정심판", "「국가배상법」에 따른 손해배상 청구", "「하도급법」에 따른 대금 직불 청구"], "answer": 1, "explanation": "* 정답 (①): 정부계약은 사법상 계약의 성격을 가지므로, 당사자 간의 합의가 있다면 소송으로 가기 전 법적 구속력을 가지는 「중재법」에 따른 중재(대한상사중재원 등)를 통해 분쟁을 해결할 수 있습니다.", "source": "「국가계약법」 제28조의2"}, {"num": 68, "category1": "2. 계약변경 관리", "category2": "5. 분쟁해결 절차", "question": "공공조달 계약 과정에서 불이익을 받은 자가 해당 중앙관서의 장(발주기관)에게 이의신청을 제기하였으나, 그 심사 결과에 불복하여 재정경제부 산하에 독립적으로 설치된 위원회에 재심을 청구하고자 할 때 접수해야 하는 공식 기구의 명칭은?", "options": ["조달정책심의위원회", "국가계약분쟁조정위원회", "공정거래위원회", "감사원"], "answer": 2, "explanation": "* 정답 (②): 이의신청에 대한 중앙관서의 장의 조치 결과에 이의가 있는 자는 기획재정부 장관 소속으로 설치된 '국가계약분쟁조정위원회'에 분쟁의 조정(재심)을 청구할 수 있습니다.", "source": "「국가계약법」 제29조"}, {"num": 69, "category1": "3. 계약이행 관리", "category2": "1. 계약 대상물 공급(납품, 과업이행 및 시공 등) 일반절차", "question": "계약이행(납품·시공 등) 일반절차의 기본 흐름으로 옳은 것은?", "options": ["착수 → 이행(생산·시공 등) → 검사 → 인도(납품)·인수", "인도 → 착수 → 검사 → 계약체결", "검사 → 착수 → 이행 → 계약체결", "계약해지 → 이행 → 검사"], "answer": 1, "explanation": "* 정답 (①): 계약이행 tion": "* 정답 (①): 위험도가 낮으면 수용·모니터링 위주로, 높으면 회피·완화 등 적극적 대응을 우선하는 것이 자원 배분상 합리적임.", "source": "※ 프로젝트관리 방법론(리스크 관리) 참고 개념(특정 법령 조문 없음)"}, {"num": 102, "category1": "3. 계약이행 관리", "category2": "5. 계약상 위험 관리", "question": "계약상 위험 관리 활동이 아닌 것은?", "options": ["위험 발생 후에도 아무 기록을 남기지 않음", "대응계획 수립 및 모니터링", "위험도(발생확률·영향) 평가", "위험 식별 및 분류"], "answer": 1, "explanation": "* 정답 (①): 위험 발생 이력을 기록하지 않으면 향후 유사 위험 대응에 활용할 수 없어 관리활동으로 볼 수 없음.", "source": "※ 프로젝트관리 방법론(리스크 관리) 참고 개념(특정 법령 조문 없음)"}, {"num": 103, "category1": "3. 계약이행 관리", "category2": "5. 계약상 위험 관리", "question": "[상황] 특정 자재의 공급 지연 위험이 사전에 식별되었으나 별도 대응계획 없이 방치되었고, 실제로 지연이 발생했다. 이 사례가 주는 교훈으로 가장 적절한 것은?", "options": ["식별된 위험에 대해서는 사전에 대응계획을 수립해 실제 발생에 대비해야 한다", "위험은 항상 발주기관이 전부 부담한다", "위험 관리는 계약과 무관하다", "위험은 식별만 하면 충분하다"], "answer": 1, "explanation": "* 정답 (①): 위험은 식별에 그치지 않고 구체적 대응계획으로 이어져야 실효성이 있음.", "source": "※ 프로젝트관리 방법론(리스크 관리) 참고 개념(특정 법령 조문 없음)"}, {"num": 104, "category1": "3. 계약이행 관리", "category2": "5. 계약상 위험 관리", "question": "계약이행 과정의 위험관리에서, 위험 요인을 찾아내는 단계 다음으로 이어지는 일반적인 절차의 순서로 가장 옳은 것은?", "options": ["평가부터 하고 이후 원인을 식별한다", "위험의 원인과 특성을 분석한 뒤, 그 심각도를 평가하고, 대응방안을 마련해 지속적으로 관찰한다", "곧바로 대응방안부터 마련한 뒤 원인을 분석한다", "식별과 동시에 바로 계약을 해지한다"], "answer": 2, "explanation": "* 정답 (②): 일반적인 위험관리 절차는 식별 → 분석 → 평가 → 대응 → 모니터링의 흐름을 따름.", "source": null}, {"num": 105, "category1": "3. 계약이행 관리", "category2": "5. 계약상 위험 관리", "question": "계약 이행 중 발생 가능한 손해에 대비해 보험에 가입함으로써, 그 재무적 부담을 보험사 등 제3자가 나누어 지도록 하는 위험 대응방식을 무엇이라 하는가?", "options": ["위험의 무시", "위험의 회피", "위험의 전가", "위험의 확대"], "answer": 3, "explanation": "* 정답 (③): 보험 가입처럼 위험의 재무적 영향을 제3자에게 이전시키는 방식을 위험의 전가(Transfer)라 함.", "source": "※ 프로젝트관리 방법론(리스크 관리) 참고 개념(특정 법령 조문 없음)"}, {"num": 106, "category1": "3. 계약이행 관리", "category2": "5. 계약상 위험 관리", "question": "검증되지 않은 신기술 대신 이미 안정성이 확인된 공법을 채택하여, 애초에 위험이 발생할 여지 자체를 없애는 대응방식은?", "options": ["위험의 회피", "위험의 수용", "위험의 완화", "위험의 전가"], "answer": 1, "explanation": "* 정답 (①): 위험의 원인 자체를 제거해 위험이 발생하지 않도록 하는 방식은 회피(Avoidance)에 해당함. 검증된 기술 채택이 대표적 가계약법 시행령 제62조"}, {"num": 132, "category1": "4. 계약종결 관리", "category2": "4. 하자보증 및 사후관리 이행", "question": "[상황] 하자보수기간 중 하자가 발생했으나 계약상대자가 보수를 거부하고 있다. 발주기관이 취할 수 있는 조치는?", "options": ["계약보증금을 즉시 몰취한다", "아무 조치도 할 수 없다", "하자보수보증금을 사용하여 직접 보수하거나 필요한 조치를 취할 수 있다", "경찰에 고발 조치하고 민사 소송을 청구한다"], "answer": 3, "explanation": "* 정답 (③): 계약상대자가 하자보수를 거부하는 경우, 발주기관은 하자보수보증금을 활용해 필요한 조치를 취할 수 있음.", "source": "국가계약법 시행령 제62조·제63조"}, {"num": 133, "category1": "4. 계약종결 관리", "category2": "4. 하자보증 및 사후관리 이행", "question": "건축물의 기둥·보·내력벽 등 주요구조부에 대한 하자담보책임기간으로 옳은 것은?", "options": ["10년", "5년", "1년", "3년"], "answer": 1, "explanation": "* 정답 (①): 건축물의 주요구조부(기둥, 보, 내력벽, 기초 등)에 대한 하자담보책임기간은 다른 부위보다 길게 10년으로 정해져 있음.", "source": "건설산업기본법 시행령 [별표4] 등"}, {"num": 134, "category1": "4. 계약종결 관리", "category2": "4. 하자보증 및 사후관리 이행", "question": "공공 공사계약에 적용되는 하자보수 및 하자담보책임기간에 대한 설명으로 가장 올바른 것은?", "options": ["하자담보책임 기간 동안 하자보수를 위해 보증금을 사용하고 남은 금액은 계약상대자에게 반환하지 않고 전액 국고에 귀속시킨다.", "하자의 보수를 위해 하자보수보증금을 직접 사용할 때에는 이를 반드시 해당 회계연도의 세입으로 편성하여 회계처리해야 한다.", "장기계속공사의 하자담보책임기간은 연차별로 완료되어 발주기관이 인수한 부분별로 기산하여 따로 정해야 한다.", "정부의 공사계약에서는 부실시공 방지를 위해 어떠한 예외적인 경우에도 하자보수보증금 납부를 면제할 수 없다."], "answer": 3, "explanation": "* 정답 (③): 장기계속공사의 하자담보책임기간은 전체 총공사를 기준으로 일괄 기산하는 것이 아니라, 연차별로 완료되어 발주기관이 최종 인수한 '연차계약 부분별'로 기산하여 각각 따로 정해야 합니다. (오답 노트: ① 사용하고 남은 금액은 계약상대자에게 반환, ② 세입으로 납입하지 아니하고 세입·세출 외로 구분하여 회계처리, ④ 계약금액 3천만 원 이하 공사 등 일정 요건 충족 시 보증금 납부 면제 가능)", "source": "「국가계약법 시행령」 제60조 및 제62조"}, {"num": 135, "category1": "4. 계약종결 관리", "category2": "5. 입찰보증금, 계약보증금, 선급금보증금, 하자보수보증금, 매입채권 및 보험 관리", "question": "낙찰 후 정당한 이유 없이 계약을 체결하지 않을 경우 처리되는 보증금은?", "options": ["하자보수보증금", "입찰보증금", "선금보증금", "계약보증금"], "answer": 2, "explanation": "* 정답 (②): 낙찰자가 정당한 이유 없이 계약을 체결하지 않으면 입찰보증금(또는 그 지급각서에 따른 상당액)이 국고 등에 귀속됨.", "source": "국가계약법 시행령 제38조"}, {"num": 136, "category1": "4. 계약종결 관리", "category2": "5. 입찰보증금, 계약보증금, 선급금보증금, 하자보수보증금, 매입채권 및 보험 관리", "question": "계약상대자가 정당한 이유 없이 계약을 이행하지 않을 때 계약보증금 처리는?", "options": ["이월한다", "국고에 귀속한다", "기부한다", "반환한
