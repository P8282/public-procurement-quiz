  }

  // 전체 취약 문제 복습(state.globalWeakReview) 중일 때만 다음 챕터의 취약 문제로 자동 이어간다.
  // 일반 완료 화면(단일 챕터/세세항목)에서는 기존 그대로 홈으로 이동한다.
  function goHomeOrContinueGlobalReview(){
    if(state.globalWeakReview){
      // startGlobalWeakReview()가 시작할 때 정해둔 큐(state.globalWeakQueue)를 순서대로 한 칸씩
      // 전진한다 - 매번 "취약한 챕터 아무거나 찾기"를 다시 하면, 방금 본 챕터가 한 번 맞혔다고
      // 바로 취약 상태를 벗어나지는 않으므로(연속 3회 이상 맞혀야 함) 계속 같은 챕터로 되돌아와
      // 다른 챕터로 못 넘어가는 문제가 있었다. 다만 큐에 담긴 챕터가 그 사이 이미 다 극복됐다면
      // (weakCount 0) 그 챕터는 건너뛰고 다음 챕터를 찾는다.
      let nextKey = null;
      while(state.globalWeakQueueIndex + 1 < state.globalWeakQueue.length){
        state.globalWeakQueueIndex++;
        const cand = state.globalWeakQueue[state.globalWeakQueueIndex];
        if(weakCount(cand) > 0){ nextKey = cand; break; }
      }
      if(nextKey){
        startWeakReview(nextKey); // 기존 startWeakReview 로직 그대로 재사용
        return;
      }
      state.globalWeakReview = false;
      state.globalWeakQueue = [];
      alert('🎉 전체 취약 문제 복습을 모두 마쳤습니다!');
    }
    if(state.globalNumReview){
      const nextKey = nextNumChapterKey();
      if(nextKey){
        startNumReview(nextKey); // 기존 startNumReview 로직 그대로 재사용
        return;
      }
      state.globalNumReview = false;
      alert('🎉 숫자문제(NUM) 복습을 모두 마쳤습니다!');
    }
    if(state.globalWeakNumReview){
      // globalWeakReview 분기와 동일한 패턴: 큐를 한 칸씩 전진하며, 그 사이 이미 취약을 벗어난
      // (weakNumCount 0) 챕터는 건너뛰고 다음 챕터를 찾는다.
      let nextKey = null;
      while(state.globalWeakNumQueueIndex + 1 < state.globalWeakNumQueue.length){
        state.globalWeakNumQueueIndex++;
        const cand = state.globalWeakNumQueue[state.globalWeakNumQueueIndex];
        if(weakNumCount(cand) > 0){ nextKey = cand; break; }
      }
      if(nextKey){
        startWeakNumReview(nextKey); // 기존 startWeakNumReview 로직 그대로 재사용
        return;
      }
      state.globalWeakNumReview = false;
      state.globalWeakNumQueue = [];
      alert('🎉 취약 숫자문제 복습을 모두 마쳤습니다!');
    }
    if(state.globalReviewOnlyReview){
      // globalWeakReview 분기와 동일한 패턴: 큐를 한 칸씩 전진하며, 그 사이 이미 복습을 벗어난
      // (reviewOnlyIndices 0) 챕터는 건너뛰고 다음 챕터를 찾는다.
      let nextKey = null;
      while(state.globalReviewOnlyQueueIndex + 1 < state.globalReviewOnlyQueue.length){
        state.globalReviewOnlyQueueIndex++;
        const cand = state.globalReviewOnlyQueue[state.globalReviewOnlyQueueIndex];
        if(reviewOnlyIndices(cand).length > 0){ nextKey = cand; break; }
      }
      if(nextKey){
        startReviewOnlyReview(nextKey); // 기존 startReviewOnlyReview 로직 그대로 재사용
        return;
      }
      state.globalReviewOnlyReview = false;
      state.globalReviewOnlyQueue = [];
      alert('🎉 복습 문제를 모두 마쳤습니다!');
    }
    if(state.globalUpdatedReview){
      // globalWeakReview 분기와 동일한 패턴: 큐를 한 칸씩 전진하며, 그 사이 이미 다 풀어버린
      // (chapterUpdateInfo가 null인) 챕터는 건너뛰고 다음 챕터를 찾는다.
      let nextKey = null;
      while(state.globalUpdatedQueueIndex + 1 < state.globalUpdatedQueue.length){
        state.globalUpdatedQueueIndex++;
        const cand = state.globalUpdatedQueue[state.globalUpdatedQueueIndex];
        if(chapterUpdateInfo(cand)){ nextKey = cand; break; }
      }
      if(nextKey){
        startUpdatedReview(nextKey); // 기존 startUpdatedReview 로직 그대로 재사용
        return;
      }
      state.globalUpdatedReview = false;
      state.globalUpdatedQueue = [];
      alert('🎉 이번 개정 업데이트 문제를 모두 확인했습니다!');
    }
    state.view = 'home';
    render();
  }

  // ---------- keyboard shortcuts (mirrors original VBA quiz mode) ----------
  document.addEventListener('keydown', (e)=>{
    // 🚩 문제 오류 신고 입력창처럼, 텍스트를 입력하는 <input>/<textarea>에 포커스가 있을 때는
    // 단축키를 전부 건너뛴다. 안 그러면 신고 내용에 스페이스바를 치는 순간 "다음 문제로 이동"
    // 단축키가 같이 발동해서 타이핑을 방해한다(신고된 버그).
    const activeTag = document.activeElement && document.activeElement.tagName;
    if(activeTag === 'INPUT' || activeTag === 'TEXTAREA') return;
    if(state.view==='temp'){
      const total = TEMP_QUIZ.length;
      if(!total) return;
      const i = Math.min(state.tempIndex, total-1);
      if(e.key==='ArrowRight' || e.key==='Enter' || e.key===' '){
        e.preventDefault();
        if(i < total-1){ state.tempIndex = i+1; render(); }
      } else if(e.key==='ArrowLeft'){
        if(i > 0){ state.tempIndex = i-1; render(); }
      }
      return;
    }
    if(state.view!=='quiz') return;
    const key = state.chapter, idx = state.index;
    const indices = state.filterIndices || allIndicesOf(key);
    const pos = indices.indexOf(idx);
    const total = indices.length;
    const isWrongSession = state.filterKind === 'wrong';
    const isWeakNumSession = state.filterKind === 'weaknum';
    const isWeakLikeSession = isWrongSession || isWeakNumSession;
    // 🔴 취약 집중공략 / 🟡 복습 다시풀기 / 🔴 숫자 취약만 화면은 renderQuiz()와 동일하게, 예전 정답
    // 기록이 아니라 "오늘 이 문제에 다시 답을 골랐는지"(isReviewAnsweredToday)를 기준으로
    // saved를 판단해야 한다. 이 처리가 없으면 옛날 정답 기록 때문에 숫자키(1~4)로 답을 다시 고를
    // 수 없게 굳어버린다.
    const rawAnswered = state.progress[key] && state.progress[key][idx];
    const saved = isWeakLikeSession ? (isReviewAnsweredToday(key, idx) ? rawAnswered : null) : rawAnswered;
    if(['1','2','3','4'].includes(e.key) && !saved){
      selectAnswer(Number(e.key)-1);
    } else if(e.key==='Escape' && state.sheetOpen){
      state.sheetOpen = false; render(true);
    } else if(e.key==='ArrowRight' && saved){
      // ←(goPrev)와 대칭 - 안 푼 문제를 찾는 건너뛰기 없이 항상 딱 한 문제만 이동한다.
      // Enter/Space는 "안 푼 문제로 건너뛰기"를 유지하고, 방향키만 1단계 이동으로 분리한다.
      e.preventDefault();
      state.sheetOpen = false;
      let p = pos + 1;
      if(p >= total){
        if(state.filterKind === 'num'){
          const nextKey = nextNumChapterKey();
          if(nextKey){ startNumReview(nextKey); return; }
          state.globalNumReview = false;
          incrementNumReviewRound();
          state.view = 'numComplete';
          render();
          return;
        }
        if((isWrongSession && state.globalWeakReview) || (isWrongSession && state.globalReviewOnlyReview) || (isWeakNumSession && state.globalWeakNumReview) || (state.filterKind==='updated' && state.globalUpdatedReview)){
          goHomeOrContinueGlobalReview();
          return;
        }
        if(!state.filterIndices) markChapterCompleted(key);
        state.view='complete'; render();
      } else {
        goto(p);
      }
    } else if((e.key==='Enter' || e.key===' ') && saved){
      // 포커스가 버튼(다음/다음 문제 등)에 남아있으면 브라우저가 Enter/Space를 "버튼 클릭"으로도
      // 자동 처리해서, 아래 로직과 중복으로 두 번 실행(예: 회독수 2씩 증가)되는 문제가 있었다.
      // preventDefault로 그 기본 동작을 막아 여기 로직만 정확히 한 번 실행되게 한다.
      e.preventDefault();
      state.sheetOpen = false;
      // 이미 푼 문제는 건너뛰고 처음 만나는 안 푼 문제로 이동 (nextBtn 등과 동일한 규칙).
      // 단, 🔴 취약 집중공략 / 🟡 복습 다시풀기 / 🔴 숫자 취약만(isWeakLikeSession)은
      // goToNextUnanswered()와 동일하게 목록 전체가 이미 예전에 풀렸던 문제라서 이 건너뛰기를
      // 적용하면 곧장 맨 끝(완료 화면)까지 건너뛰어버린다. 그래서 이 세션들만은 건너뛰지 않고
      // 바로 다음 한 문제로만 이동한다.
      let p = pos + 1;
      if(!isWeakLikeSession){
        while(p < total){
          const realIdx = indices[p];
          const answered = state.progress[key] && state.progress[key][realIdx];
          if(!answered) break;
          p++;
        }
      }
      if(p >= total){
        if(state.filterKind === 'num'){
          // 키보드 단축키로 넘길 때도 nextBtn/sheetNext와 동일하게 챕터 경계에서 끊지 않고 이어간다.
          const nextKey = nextNumChapterKey();
          if(nextKey){ startNumReview(nextKey); return; }
          // 전체 NUM 문제를 다 풀었을 때도 nextBtn/sheetNext와 동일하게 "처음부터 다시 풀기"가
          // 가능한 전용 완료 화면(numComplete)을 보여준다(마우스 클릭 경로와 동작을 통일).
          state.globalNumReview = false;
          incrementNumReviewRound(); // "전체" 모드로 1~마지막 번호까지 완주했을 때만 +1회독(취약만 모드는 호출 안 함)
          state.view = 'numComplete';
          render();
          return;
        }
        if((isWrongSession && state.globalWeakReview) || (isWrongSession && state.globalReviewOnlyReview) || (isWeakNumSession && state.globalWeakNumReview) || (state.filterKind==='updated' && state.globalUpdatedReview)){
          // goToNextUnanswered()와 동일하게, "전체 취약 문제 복습" / "숫자 취약만"은 완료 화면 없이
          // 바로 다음 챕터로 이어간다(마우스 클릭 경로와 동작을 통일).
          goHomeOrContinueGlobalReview();
          return;
        }
        if(!state.filterIndices) markChapterCompleted(key);
        state.view='complete'; render();
      } else {
        goto(p);
      }
    } else if(e.key==='ArrowLeft'){
      goPrev();
    } else if(e.key==='ArrowUp' && saved){
      // 해설 보기/가리기 토글. 답을 아직 안 고른 문제는 애초에 해설이 없으므로(showBtn과 동일하게)
      // saved일 때만 동작한다.
      e.preventDefault();
      state.sheetOpen = !state.sheetOpen;
      render(true);
    }
  });

  // ====== 비밀번호 게이트 ======
  async function fetchExpectedPassword(){
    const res = await fetch(PASSWORD_CSV_URL, {cache:'no-store'});
    if(!res.ok) throw new Error('fetch failed');
    const text = await res.text();
    const rows = parseCSV(text);
    const first = rows[0] && rows[0][0] ? rows[0][0].trim() : '';
    return first;
  }

  function renderLock(errorMsg){
    app.innerHTML = `
      <div class="hero">
        <div class="kicker">비공개 학습 자료</div>
        <h1>비밀번호를<br>입력해주세요</h1>
        <p class="sub">공유받은 비밀번호를 입력하면 계속 이용하실 수 있습니다.</p>
        <div style="max-width:280px;margin:0 auto;">
          <input id="pwInput" type="password" inputmode="text" placeholder="비밀번호"
            style="width:100%;padding:13px 14px;border:1.4px solid var(--line-strong);border-radius:11px;font-size:15px;margin-bottom:10px;box-sizing:border-box;">
          ${errorMsg? `<div style="color:var(--wrong);font-size:12.5px;margin-bottom:10px;">${escapeHtml(errorMsg)}</div>` : ''}
          <button class="btn btn-primary" id="pwSubmit" style="width:100%;">확인</button>
        </div>
      </div>
    `;
    const submit = async ()=>{
      const val = document.getElementById('pwInput').value.trim();
      const btn = document.getElementById('pwSubmit');
      btn.textContent = '확인 중...'; btn.disabled = true;
      try{
        const expected = await fetchExpectedPassword();
        if(expected && val === expected){
          await window.storage.set(PASSWORD_STORAGE_KEY, '1', false);
          boot(true);
        } else {
          renderLock('비밀번호가 올바르지 않습니다.');

        <div style="max-width:280px;margin:0 auto;">

            style="width:100%;padding:13px 14px;border:1.4px solid var(--line-strong);border-radius:11px;font-size:15px;margin-bottom:10px;box-sizing:border-box;text-align:center;letter-spacing:.05em;">
          ${errorMsg? `<div style="color:var(--wrong);font-size:12.5px;margin-bottom:10px;line-height:1.6;">${escapeHtml(errorMsg).replace(/\n/g,'<br>')}</div>` : ''}

    const submit = async ()=>{
      const val = document.getElementById('gateCodeInput').value.trim().toUpperCase();
      const btn = document.getElementById('gateSubmit');
      if(!val){ renderSyncGate('코드를 입력해주세요.'); return; }
      btn.textContent = '확인 중...'; btn.disabled = true;
      try{
        // /sync/pull은 코드 자체가 유효한지(isValidSyncCode)까지 서버에서 검증한다 - 존재하지 않는 코드면
        // 여기서 이미 404를 던지므로 별도의 "문서 존재 여부" 체크가 필요 없다.
        let cloudData;
        try{
          const res = await cfFetchWithRetry(`${CF_API_BASE}/sync/pull?code=${encodeURIComponent(val)}`, 0);
          cloudData = (res && res.data) || {};
        }catch(fetchErr){
          renderSyncGate('존재하지 않는 코드입니다. 코드를 다시 확인해주세요.');
          return;
        }
        // 기기 수 제한(최대 5대): 이 기기가 이미 연결된 적 있는 기기면 몇 대든 통과, 완전히 새 기기인데
        // 이미 5대가 연결돼 있으면 막는다. (관리자는 이 코드 게이트 자체를 안 거치므로 자동으로 제외됨)
        const devices = cloudData.devices || {};
        const deviceIds = Object.keys(devices);
        const thisDeviceId = await getDeviceId();
        const isKnownDevice = deviceIds.includes(thisDeviceId);
        if(!isKnownDevice && deviceIds.length >= 5){
          const typeCounts = {};
          deviceIds.forEach(id=>{ const t = devices[id].type || '기타'; typeCounts[t] = (typeCounts[t]||0)+1; });

          renderSyncGate(
            `이 코드는 이미 최대 5대까지 기기가 연결되어 있습니다 (${summary}).\n` +

          );

        const merged = mergeProgressData(collectLocalData(), cloudData);
        applyCloudData(merged);
        state.syncCode = val;
        await window.storage.set('sync-code', val);
        await syncPush();
        loadProgress(); // 이제 정상적으로 앱 진입(퀴즈 데이터 로드 등 나머지 부팅 절차 계속)
      }catch(e){
        renderSyncGate('확인 중 오류가 발생했습니다. 인터넷 연결을 확인해주세요.');
      }
    };
    document.getElementById('gateSubmit').onclick = submit;
    document.getElementById('gateCodeInput').addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
    document.getElementById('gateCodeInput').focus();

    // 코드 입력 전이라도, 인증이 필요 없는 공개 엔드포인트로 실제 문제 수를 조용히 받아와 갱신한다.
    // 실패해도(오프라인 등) 그냥 기존 고정값("870제")이 그대로 남아있으니 안전하다.
    if(cfEnabled()){
      cfFetchWithRetry(`${CF_API_BASE}/publiccount`).then(data=>{
        const el = document.getElementById('gateTotalText');
        if(el && data && data.total){
          el.innerHTML = `공공조달관리사<br><em>${data.total}제</em> 2주 완성`;
        }
      }).catch(()=>{ /* 실패해도 고정값 유지 */ });
    }
  }

  async function boot(alreadyUnlocked){
    if(isTempMode()){
      // Temp 모드는 게이트 화면 자체는 건너뛰지만, /temp가 이제 동기화 코드 인증을 쓰기 때문에
      // 이 기기에 이미 저장된 코드가 있으면 조용히 불러와서 인증에 사용한다.
      try{
        const sc = await window.storage.get('sync-code');
        if(sc && sc.value) state.syncCode = sc.value;
      }catch(e){ /* 저장된 코드 없음 - 이 경우 /temp 인증이 실패하고 빈 목록으로 표시됨 */ }
      state.view = 'temp';
      render();
      await loadTempQuiz();
      render();
      return;
    }
    if(!PASSWORD_CSV_URL){ await proceedPastPasswordGate(); return; } // 비밀번호 미설정 시 바로 다음 단계
    if(alreadyUnlocked){ await proceedPastPasswordGate(); return; }
    try{
      const saved = await window.storage.get(PASSWORD_STORAGE_KEY);
      if(saved && saved.value === '1'){ await proceedPastPasswordGate(); return; }
    }catch(e){ /* 저장 기록 없으면 잠금화면 표시 */ }
    renderLock();
  }

  // 비밀번호 관문을 통과한 뒤(또는 비밀번호가 아예 설정 안 됐을 때) 다음으로 동기화 코드 관문을 확인한다.
  // syncEnabled()가 false(CF_API_BASE 미설정 등)면 코드 요구 자체를 건너뛰어 앱이 완전히 막히지 않게 한다.
  async function proceedPastPasswordGate(){
    if(!syncEnabled()){ loadProgress(); return; }
    try{
      const sc = await window.storage.get('sync-code');
      if(sc && sc.value){ state.syncCode = sc.value; loadProgress(); return; }
    }catch(e){ /* 저장된 코드 없음 */ }
    renderSyncGate();
  }

  boot(false);

  // ---------- 자동/수동 새로고침 (Cloudflare 문제 데이터 갱신 + 앱 코드 업데이트 감지) ----------
  const AUTO_REFRESH_INTERVAL = 60 * 60 * 1000; // 1시간
  let lastAutoRefresh = Date.now();
  let appSourceBaseline = null; // 최초 로드 시점의 원본 HTML 텍스트(코드 변경 비교 기준)

  // 지금 배포된 index.html 원문을 받아와 최초 로드 시점과 다른지 비교한다.
  // (라이브 DOM은 JS가 계속 바꾸므로 비교 기준이 될 수 없어, 서버의 "원본 파일 텍스트"끼리 비교한다)
  async function checkForAppUpdate(){
    try{
      const res = await fetch(location.href, {cache:'no-store'});
      const latest = await res.text();
      if(appSourceBaseline === null){ appSourceBaseline = latest; return; } // 최초 1회는 기준값만 저장
      if(latest !== appSourceBaseline){ state.updateAvailable = true; }
    }catch(e){ /* 오프라인 등으로 실패하면 조용히 무시 */ }
  }

  // 문제 데이터(개수/분류 메타) + 앱 코드 업데이트를 함께 확인한다.
  // force=true면 1시간 쓰로틀을 무시하고 즉시 실행한다(수동 새로고침 버튼용).
  async function refreshAll(force){
    const now = Date.now();
    if(!force && now - lastAutoRefresh < AUTO_REFRESH_INTERVAL) return;
    lastAutoRefresh = now;
    const tasks = [checkForAppUpdate()];
    if(cfEnabled()) tasks.push(cfLoadMeta());
    await Promise.all(tasks);
    TOTAL_ALL = allChapterKeys().reduce((sum,k)=> sum + (QUIZ[k] ? QUIZ[k].length : 0), 0);
    document.title = `공공조달관리사 ${TOTAL_ALL}제 · 2주 완성 퀴즈`;
    // 문제를 푸는 도중에는 화면을 건드리지 않는다(스크롤/시트 상태 방해 방지). 홈 화면에서만 다시 그린다.
    if(state.view === 'home') render(true);
  }

  // 홈화면 추가 앱(스탠드얼론)은 접었다 펼쳐도 페이지가 다시 로드되지 않아 자동 재조회가 안 일어난다.
  // visibilitychange는 사파리 일반 탭/홈화면 앱 모두에서 동작하는 표준 이벤트라 여기서 보완하고,
  // 앱을 계속 켜놓고 있는 경우까지 커버하기 위해 setInterval도 함께 둔다. 둘 다 1시간 쓰로틀을 공유한다.
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible') refreshAll(false);
  });
  setInterval(()=> refreshAll(false), AUTO_REFRESH_INTERVAL);

  // 홈 화면 상단 🔄 버튼: 새 버전이 있는지 확인하지 않고, 누르면 무조건 지금 배포된 index.html을
  // 다시 받아온다. location.reload()만 쓰면 브라우저가 캐시된 옛 버전을 그대로 보여줄 수 있어서,
  // 매번 다른 쿼리스트링을 붙여 확실히 새로 받아오게 한다.
  document.addEventListener('click', (e)=>{
    if(e.target && e.target.id === 'manualRefreshBtn'){
      location.href = location.pathname + '?_=' + Date.now();
    }
    if(e.target && e.target.id === 'reloadAppBtn'){
      location.href = location.pathname + '?_=' + Date.now();
    }
  });
})();
</script>
