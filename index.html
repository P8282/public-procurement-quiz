<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>공공조달관리사 870제 · 2주 완성 퀴즈</title>
<link rel="icon" type="image/png" href="icons/icon260825.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon260825.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<meta name="theme-color" content="#1B2A47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="공공조달관리사">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F1E7;
    --paper-deep:#EDE7D6;
    --card:#FFFFFF;
    --ink:#232017;
    --ink-soft:#453F2E;
    --navy:#1B2A47;
    --navy-2:#2C3E63;
    --seal:#AE342A;
    --seal-deep:#8B2A22;
    --seal-tint:#F6E4E1;
    --gold:#B08A3E;
    --correct:#2E6B4F;
    --correct-tint:#E1EDE5;
    --wrong:#AE342A;
    --wrong-tint:#F6E4E1;
    --line:#D9D0B8;
    --line-strong:#C6BA97;
    --shadow: 0 1px 2px rgba(35,32,23,.06), 0 8px 24px -12px rgba(35,32,23,.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 10% -10%, #FBF8EF 0%, transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .bg-rule{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image: repeating-linear-gradient(180deg, transparent, transparent 37px, rgba(199,190,157,.35) 38px);
    opacity:.22;
  }
  #app{position:relative; z-index:1; max-width:560px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}

  /* ---------- Header ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 18px; position:sticky; top:0; z-index:20;
    background:rgba(245,241,231,.92); backdrop-filter:blur(6px);
  }
  /* 퀴즈 화면은 topbar+진행률바를 한 덩어리로 스크롤 고정한다(진행바가 topbar 아래 경계선처럼 항상 붙어있도록) */
  .quiz-header-sticky{ position:sticky; top:0; z-index:20; }
  .quiz-header-sticky .topbar{ position:static; z-index:auto; }
  .topbar-quiz{
    cursor:pointer; border-bottom:none; /* 진행률 바가 하단 경계선 역할을 대신한다 */
  }
  .topbar-quiz:active{ opacity:.8; }
  .topbar:not(.topbar-quiz){ border-bottom:1px solid var(--line); }
  .topbar .brand{
    display:flex; align-items:center; gap:8px; cursor:pointer;
    font-family:'Noto Serif KR', serif; font-weight:900; font-size:15px; color:var(--navy);
    letter-spacing:.2px;
  }
  .brand .mark{
    width:26px; height:26px; border-radius:8px; background:#1B2A47;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .brand .mark svg{ width:16px; height:16px; }
  .topbar .stats-chip{
    font-size:11.5px; color:var(--ink-soft); font-variant-numeric:tabular-nums;
    border:1px solid var(--line-strong); border-radius:999px; padding:4px 10px;
    background:var(--card);
  }
  /* 모바일: 퀴즈 화면 상단바는 앱 제목/로고를 숨기고 현재 챕터명만 표기해 세로 공간을 아낀다 */
  @media (max-width:767px){
    .topbar-quiz .brand{ display:none; }
    .topbar-quiz{ justify-content:center; }
    .topbar-quiz .stats-chip{ font-size:12.5px; font-weight:700; }
  }

  /* ---------- Hero / Cover ---------- */
  .hero{ padding:34px 24px 22px; text-align:center; }
  .hero .kicker{
    font-size:11.5px; letter-spacing:.16em; color:var(--seal); font-weight:700;
    margin-bottom:10px; text-transform:uppercase;
  }
  .hero h1{
    font-family:'Noto Serif KR', serif; font-weight:900; font-size:29px; line-height:1.28;
    margin:0 0 12px; color:var(--navy);
  }
  .hero h1 em{ font-style:normal; color:var(--seal); }
  .hero p.sub{ color:var(--ink-soft); font-size:14px; line-height:1.6; margin:0 auto 22px; max-width:340px; }

  .stamp{
    width:104px; height:104px; margin:6px auto 24px; position:relative;
    border:3px solid var(--seal); border-radius:50%;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    transform:rotate(-8deg); color:var(--seal);
    font-family:'Noto Serif KR', serif;
    box-shadow: inset 0 0 0 3px rgba(174,52,42,.12);
  }
  .stamp::before{
    content:""; position:absolute; inset:8px; border:1px solid var(--seal); border-radius:50%; opacity:.55;
  }
  .stamp b{ font-size:22px; font-weight:900; line-height:1; }
  .stamp span{ font-size:9.5px; letter-spacing:.08em; margin-top:3px; font-weight:700; }

  .cover-facts{ display:flex; justify-content:center; gap:22px; margin-bottom:26px; }
  .cover-facts div{ text-align:center; }
  .cover-facts b{ display:block; font-family:'Noto Serif KR',serif; font-size:20px; color:var(--navy); font-weight:900; }
  .cover-facts span{ font-size:10.5px; color:var(--ink-soft); }

  .btn{
    appearance:none; border:none; cursor:pointer; font-family:'Noto Sans KR', sans-serif;
    font-weight:700; border-radius:10px; transition:transform .12s ease, opacity .12s ease, background .15s ease;
  }
  .btn:active{ transform:scale(.98); }
  .btn-primary{
    background:var(--navy); color:#F5F1E7; font-size:15px; padding:15px 22px; width:100%;
    box-shadow:var(--shadow); letter-spacing:.02em;
  }
  .btn-primary:hover{ background:var(--navy-2); }
  .btn-ghost{
    background:transparent; color:var(--navy); border:1.4px solid var(--line-strong);
    font-size:13px; padding:10px 16px;
  }
  .btn-ghost:hover{ border-color:var(--navy); }
  .btn-review{
    background:var(--seal-tint); color:var(--seal); font-size:13.5px; padding:12px 18px; width:100%;
    border:1.4px solid #E9C2BC; margin-top:10px; letter-spacing:.01em;
  }
  .btn-review:hover{ background:#F0D3CE; }

  /* ---------- Chapter list ---------- */
  .section-wrap{ padding:6px 18px 100px; }
  .section-title{
    font-family:'Noto Serif KR', serif; font-weight:700; font-size:13.5px; color:var(--navy);
    margin:26px 2px 10px; padding-bottom:8px; border-bottom:1px solid var(--line-strong);
    display:flex; align-items:baseline; justify-content:space-between;
  }
  .section-title .cnt{ font-family:'Noto Sans KR',sans-serif; font-weight:500; font-size:11px; color:var(--ink-soft); }

  .chapter-card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; margin-bottom:9px; box-shadow:var(--shadow); cursor:pointer;
    display:flex; align-items:flex-start; gap:12px; text-align:left;
  }
  .chapter-card:active{ transform:scale(.99); }
  .chapter-num{
    font-family:'Noto Serif KR', serif; font-weight:900; font-size:12px; color:var(--navy);
    background:var(--paper-deep); border-radius:8px; min-width:40px; height:40px;
    padding:0 6px; display:flex; align-items:center; justify-content:center; flex-shrink:0; text-align:center;
    letter-spacing:.3px;
  }
  .chapter-info{ flex:1; min-width:0; }
  .chapter-info .name-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
  .chapter-info .name{ font-weight:700; font-size:15px; color:var(--ink); letter-spacing:-.1px; min-width:0; }
  .expand-btn{
    flex-shrink:0; width:22px; height:22px; border-radius:50%; border:1.4px solid var(--line-strong);
    background:var(--card); color:var(--navy); font-size:14px; font-weight:900; line-height:1;
    display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;
  }
  .expand-btn:active{ transform:scale(.9); }
  .chapter-info .progress-row{ display:flex; align-items:center; gap:8px; }
  .progress-track{ flex:1; height:5px; border-radius:3px; background:var(--paper-deep); overflow:hidden; }
  .progress-fill{ height:100%; background:linear-gradient(90deg, var(--gold), var(--seal)); border-radius:3px; }
  .progress-fill.done{ background:var(--correct); }
  .chapter-info .pct{ font-size:10.5px; color:var(--ink-soft); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .chapter-badge{
    font-size:9.5px; font-weight:700; color:var(--correct); background:var(--correct-tint);
    border-radius:999px; padding:3px 8px; flex-shrink:0;
  }
  .subtopic-list{ margin-top:10px; display:flex; flex-direction:column; gap:6px; }
  .subtopic-item{
    display:flex; align-items:center; justify-content:space-between; gap:9px;
    background:var(--paper-deep); border:1px solid var(--line); border-radius:8px;
    padding:9px 11px; text-align:left; cursor:pointer;
  }
  .subtopic-item:active{ transform:scale(.98); }
  .subtopic-item.empty{ opacity:.55; }
  .subtopic-item.empty .subtopic-count{ color:var(--seal); font-weight:700; }
  .subtopic-name{ font-size:12.5px; color:var(--ink); word-break:keep-all; flex:1; min-width:0; }
  .subtopic-count{ font-size:11px; color:var(--ink-soft); white-space:nowrap; font-variant-numeric:tabular-nums; flex-shrink:0; }
  .toc-group{ margin-bottom:16px; }
  .toc-group:last-child{ margin-bottom:4px; }
  .toc-group-title{
    font-weight:800; font-size:13.5px; color:var(--navy);
    margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid var(--line);
  }

  /* ---------- Quiz screen ---------- */
  .quiz-wrap{ padding:10px 18px calc(40px + env(safe-area-inset-bottom)); flex:1; }
  .quiz-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .quiz-head .crumb{ font-size:12px; color:var(--ink-soft); line-height:1.6; word-break:keep-all; }
  .quiz-head .crumb b{ color:var(--navy); font-size:12.5px; }
  .quiz-head .qno{
    font-family:'Noto Serif KR', serif; font-weight:900; font-size:15px; color:var(--seal);
    white-space:nowrap; margin-left:10px;
  }

  /* 진행률 바: 상단바(topbar) 바로 아래 붙어 하단 경계선처럼 보이도록 한다. 모바일은 얇게, PC(768px+)는 굵게. */
  .progress-bar-top{
    height:3px; background:var(--paper-deep); overflow:hidden; margin:0;
  }
  .progress-bar-top > div{ height:100%; background:var(--seal); transition:width .25s ease; }

  .mastery-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:8px 0 18px; }
  .mastery-label{ font-size:11.5px; font-weight:700; color:var(--seal); white-space:nowrap; }
  .mastery-dots{ display:flex; gap:3.5px; }
  .mastery-dot{ width:8px; height:8px; border-radius:50%; background:var(--line-strong); flex-shrink:0; }
  .mastery-dot.filled{ background:var(--seal); }

  .quiz-split{ display:flex; flex-direction:column; }
  .qmain{ display:flex; flex-direction:column; }
  .qside{ display:flex; flex-direction:column; }
  .qside-placeholder{ display:none; } /* 모바일은 팝업 시트를 쓰므로 자리 표시자가 필요 없다 */
  .qcard{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    box-shadow:var(--shadow); padding:24px 20px 22px; margin-bottom:16px; position:relative;
  }
  .qcard::before{
    content:""; position:absolute; left:0; top:18px; bottom:18px; width:3px; border-radius:3px;
    background:var(--gold); opacity:.55;
  }
  .qtext{
    font-size:17.5px; line-height:1.78; font-weight:500; color:var(--ink);
    white-space:pre-wrap; letter-spacing:-.1px; word-break:keep-all;
  }

  .options{ display:flex; flex-direction:column; gap:12px; margin-top:22px; }
  .option{
    display:flex; align-items:flex-start; gap:12px; text-align:left;
    background:var(--card); border:1.4px solid var(--line-strong); border-radius:11px;
    padding:15px 15px; cursor:pointer; font-size:15.5px; line-height:1.66; color:var(--ink);
    letter-spacing:-.1px; word-break:keep-all;
    transition:border-color .12s ease, background .12s ease, transform .1s ease;
  }
  .option:active{ transform:scale(.96); } /* 요구4: 눌림 효과 강조 */
  .option .num{
    flex-shrink:0; width:24px; height:24px; border-radius:50%; border:1.4px solid var(--line-strong);
    display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; color:var(--ink-soft);
    font-family:'Noto Serif KR',serif; margin-top:1px; position:relative;
  }
  .option.selectable:hover{ border-color:var(--navy); }
  .option.correct{ border-color:var(--correct); background:var(--correct-tint); }
  .option.correct .num{ border-color:var(--correct); background:var(--correct); color:#fff; }
  /* 요구4: 정답 표시에 체크(✔) 가상요소 추가 */
  .option.correct .num::after{
    content:"✔"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:12px; color:#fff; background:var(--correct); border-radius:50%;
  }
  .option.wrong{ border-color:var(--wrong); background:var(--wrong-tint); }
  .option.wrong .num{ border-color:var(--wrong); background:var(--wrong); color:#fff; }
  .option.dim{ opacity:.62; }

  .feedback{
    margin-top:18px; border-radius:11px; padding:16px 16px; font-size:14.5px; line-height:1.8;
    display:none; animation:fadeIn .2s ease; letter-spacing:-.1px; word-break:keep-all;
  }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(-3px);} to{opacity:1; transform:translateY(0);} }
  .feedback.show{ display:block; }
  .feedback.ok{ background:var(--correct-tint); color:#204636; border:1px solid #BFDBCB; }
  .feedback.no{ background:var(--wrong-tint); color:#6E211A; border:1px solid #E9C2BC; }
  .feedback .fb-head{ font-weight:800; font-size:14px; margin-bottom:9px; display:flex; align-items:center; gap:6px; }
  .feedback .fb-body{ color:var(--ink); opacity:1; white-space:pre-wrap; }
  .feedback .fb-source{ margin-top:11px; font-size:12.5px; color:var(--ink-soft); border-top:1px dashed var(--line-strong); padding-top:9px; }

  .nav-row{ display:flex; gap:10px; margin-top:22px; }
  .nav-btn{
    flex:1; background:var(--card); border:1.4px solid var(--line-strong); border-radius:10px;
    padding:15px; font-size:15px; font-weight:700; color:var(--navy); cursor:pointer;
  }
  .nav-btn:disabled{ opacity:.35; cursor:default; }
  .nav-btn.primary{ background:var(--navy); color:#F5F1E7; border-color:var(--navy); }
  .nav-btn.primary:not(:disabled){ box-shadow:0 2px 10px -2px rgba(27,42,71,.45); }

  .inline-stats{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:16px; font-size:11.5px; color:var(--ink-soft); white-space:nowrap;
  }

  .keyhint{ text-align:center; font-size:10.5px; color:var(--ink-soft); margin-top:12px; letter-spacing:.02em; }

  /* ---------- 해설 하단 시트 ---------- */
  .sheet-dim{
    position:fixed; inset:0; z-index:40; background:rgba(35,32,23,.42);
    animation:dimIn .18s ease;
  }
  @keyframes dimIn{ from{opacity:0;} to{opacity:1;} }
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:41; max-width:560px; margin:0 auto;
    background:var(--card); border-top-left-radius:20px; border-top-right-radius:20px;
    box-shadow:0 -8px 30px -8px rgba(35,32,23,.35);
    display:flex; flex-direction:column; max-height:82vh;
    animation:sheetUp .22s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes sheetUp{ from{transform:translateY(100%);} to{transform:translateY(0);} }
  .sheet .grip{
    width:38px; height:4px; border-radius:3px; background:var(--line-strong);
    margin:9px auto 4px; flex-shrink:0;
  }
  .sheet .sheet-head{
    display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 14px 12px 20px;
    font-weight:800; font-size:18px; flex-shrink:0;
    border-bottom:1px solid var(--line);
  }
  .sheet .sheet-head.ok{ color:var(--correct); }
  .sheet .sheet-head.no{ color:var(--wrong); }
  /* 요구4: 모바일 해설 시트 우측 상단 ✕ 닫기 버튼 */
  .sheet-close-x{
    appearance:none; border:none; background:var(--paper-deep); color:var(--ink-soft);
    width:30px; height:30px; border-radius:50%; font-size:14px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .sheet-close-x:active{ transform:scale(.9); }
  .sheet .sheet-body{
    padding:16px 20px 6px; overflow-y:auto; -webkit-overflow-scrolling:touch;
    font-size:17px; line-height:1.9; color:var(--ink);
    white-space:pre-wrap; word-break:keep-all; letter-spacing:-.1px;
  }
  .sheet .sheet-src{
    margin-top:12px; padding-top:10px; font-size:13.5px; color:var(--ink-soft);
    border-top:1px dashed var(--line-strong);
  }
  .sheet .sheet-foot{
    padding:12px 20px calc(16px + env(safe-area-inset-bottom));
    flex-shrink:0; display:flex; gap:10px; border-top:1px solid var(--line);
    background:var(--card);
  }
  .sheet .sheet-foot .nav-btn{ margin-top:0; }

  /* ---------- Complete screen ---------- */
  .complete-wrap{ padding:40px 24px 60px; text-align:center; }
  .complete-wrap .stamp{ margin-bottom:22px; }
  .complete-wrap h2{ font-family:'Noto Serif KR',serif; font-weight:900; font-size:22px; color:var(--navy); margin:0 0 8px; }
  .complete-wrap p{ color:var(--ink-soft); font-size:13.5px; margin:0 0 26px; }
  .score-row{ display:flex; justify-content:center; gap:26px; margin-bottom:30px; }
  .score-row div{ text-align:center; }
  .score-row b{ display:block; font-family:'Noto Serif KR',serif; font-size:26px; font-weight:900; color:var(--navy); }
  .score-row span{ font-size:10.5px; color:var(--ink-soft); }
  .score-row.wrong-num b{ color:var(--seal); }
  .score-row.correct-num b{ color:var(--correct); }

  ::selection{ background:#E7C9C4; }

  /* ---------- 태블릿/큰 화면: 본문 폭과 글자 크기 소폭 확대 ---------- */
  @media (min-width:768px){
    #app{ max-width:960px; }
    .qtext{ font-size:19px; line-height:1.82; }
    .sheet-body{ font-size:17.5px; }
    .chapter-info .name{ font-size:16px; }

    /* 진행률 바를 더 굵게 */
    .progress-bar-top{ height:6px; }

    /* 태블릿/PC 듀얼 패널 — 좌(문제+선택지) 60% : 우(해설 전용) 40% */
    .quiz-split{
      display:grid; grid-template-columns:6fr 4fr; gap:24px; align-items:start;
    }
    .qmain{ display:flex; flex-direction:column; }

    /* 선택지는 태블릿/PC에서도 항상 1열(세로 나열) 유지 — 절대 2×2로 쪼개지 않는다 */
    .options{ display:flex; flex-direction:column; gap:12px; margin-top:22px; }
    .option{ font-size:16px; padding:16px 17px; }

    /* 해설 전용 우측 사이드 패널: 화면을 가리는 모달 대신 항상 열려있는 고정 패널 형태 */
    .qside{
      position:sticky; top:76px; /* quiz-header-sticky(topbar+진행바) 높이만큼 여백 */
      max-height:calc(100vh - 96px);
    }
    .sheet-dim{ display:none !important; } /* 뒷배경 딤처리 없음 */
    .sheet-inline-slot .sheet{
      position:static; max-width:none; width:100%; margin:0; border-radius:14px;
      box-shadow:var(--shadow); max-height:calc(100vh - 96px); animation:none; transform:none;
    }
    .sheet-inline-slot .grip{ display:none; }
    .sheet-close-x{ display:none; } /* 사이드 패널은 늘 보이므로 ✕는 불필요 */

    /* 아직 답을 안 골랐을 때, 우측 패널에 보여줄 안내 문구 */
    .qside-placeholder{

 "2. 공공조달의 목적", "question": "현대 국가 운영에 있어 공공조달 시스템이 지니는 본질적 중요성을 가장 정확하게 짚어낸 설명은?", "options": ["민간 시장 내에서 발생하는 불공정 거래 행위를 국가가 직접 규제하고 자국 산업의 피해를 구제하기 위한 법적 장치이다.", "조달청을 비롯한 중앙행정기관의 업무 부담을 경감하고 행정 처리의 편의성과 효율성을 제고하기 위한 내부적 수단이다.", "국가의 예산을 시장에 투입하여 정부의 정책 의지를 실물 경제 단위에서 구체적으로 집행하는 가장 핵심적인 정책 수단이다.", "세계무역기구(WTO) 체제하에서 체결된 자유무역협정(FTA)을 이행하고 국제 사회와의 교역 규모를 확대하기 위한 외교 채널이다."], "answer": 3, "explanation": "* 정답 (③): 공공조달은 단순한 물품 구매를 넘어, 세금을 재원으로 국가 정책을 실현하고 재정을 집행하는 중추적 역할을 수행합니다.", "source": null}, {"num": 9, "category1": "1. 공공조달의 정의 및 목적", "category2": "2. 공공조달의 목적", "question": "공공조달이 지향하는 다면적 목표 중, '정책적 측면(거시적 측면)'의 목표와 거리가 먼 것은?", "options": ["공공 사업에 참여하는 공급자 간의 기회 균등을 보장하고 절차적 투명성을 엄격히 유지하는 시스템 운영상의 공정성 확보", "사회적 약자 기업에 대한 배려와 지역 경제 활성화를 도모하여 양극화를 해소하고자 하는 사회적 책임성(Social Responsibility) 강화", "민간 부문의 신기술 및 신제품 개발 투자를 유도하고 궁극적으로 대국민 공공서비스의 질적 수준을 끌어올리는 혁신(Innovation) 촉진", "제한된 자원의 효율적 사용과 탄소 중립 실현 등 미래 세대의 환경 보호를 종합적으로 고려하는 지속 가능성(Sustainability)의 유지"], "answer": 1, "explanation": "* 정답 (①): 공정성, 투명성, 경쟁성, 비용대비 가치 등은 조달 시스템 자체를 굴러가게 하는 '운영적(미시적) 측면'의 목표입니다.", "source": null}, {"num": 10, "category1": "1. 공공조달의 정의 및 목적", "category2": "2. 공공조달의 목적", "question": "조달 행정이 국가 체계에서 지니는 '개념적 중요성'에 대한 철학적·행정적 설명으로 적절하지 않은 것은?", "options": ["조달 과정에서 획득된 공공서비스 및 인프라의 질적 수준은 국가 정책 목표의 최종 달성 여부와 국민 삶의 질 향상에 절대적이고 직접적인 영향을 미친다.", "비효율적이고 방만한 조달 운영은 단순한 행정 절차의 지연을 넘어 심각한 국가 예산의 낭비 및 거시적인 재정적 손실로 직결되는 중대한 문제를 낳는다.", "현대 국가에서 공공조달은 정부의 본질적 기능을 단순히 보조하는 후선 업무가 아니라, 국가의 존립과 원활한 운영을 뒷받침하는 핵심 기능으로 격상되었다.", "공공조달은 단순히 필요한 물건을 시장에서 사 오는 행위를 넘어, 국민의 세금을 재원으로 국가의 거시적 정책을 실물 경제에 투입하는 고도의 행정 수단이다."], "answer": 2, "explanation": "* 정답 (②): 예산 낭비나 금전적 손실에 대한 설명은 조달의 '개념적 중요성'이라기보다는 '재정적 중요성'을 구체적으로 설명한 것입니다.", "source": null}, {"num": 11, "category1": "1. 공공조달의 정의 및 목적", "category2": "2. 공공조달의 목적", "question": "복잡다단한 법령과 규제에도 불구하고 국가 단위의 공공조달 제도가 지속적으로 존재해야 하는 가장 일차적이고 본질적인 목적은 무엇인가?", "options": ["대규모 공공 발주 사업에 참여하는 다수의 민간 조달기업들에게 안정적인 일감을 제공하여 그들의 매출 및 영업 이익 극대화를 지원하기 위함이다.", "국가가 국민에게 마땅히 category2": "1. 공공조달 수요자", "question": "[상황] 공공조달의 수요기관 유형(국가기관, 지방자치단체, 공기업, 기타 공공기관 등)별 등록 현황을 살펴볼 때 일반적으로 나타나는 경향으로 가장 적절한 것은?", "options": ["전체 수요기관 중에서 국가기관이 압도적으로 높은 비중을 차지한다.", "다양한 공공기관이 포함되며, 유형별 비중은 조사 시점마다 달라진다.", "공공조달 수요기관으로 등록할 수 있는 자격은 공기업으로만 제한된다.", "공공조달에 참여할 수 있는 수요기관의 유형은 국가기관으로 한정된다."], "answer": 2, "explanation": "* 정답 (②): 수요기관에는 국가기관·지방자치단체·공기업·기타 공공기관 등 다양한 유형이 포함되며, 유형별 정확한 등록 비중은 조사 시점의 통계에 따라 달라질 수 있어 최신 자료 확인이 필요함.", "source": null}, {"num": 26, "category1": "2. 공공조달 참여자, 이해관계자", "category2": "2. 공공조달 공급자", "question": "[상황] 나라장터에 등록된 조달기업 전체 중 상당수가 중소기업이라는 통계가 발표되었다. 이 통계가 시사하는 바로 가장 적절한 것은?", "options": ["해당 통계는 공공조달시장 내 실제 공급자의 기업 규모별 구성 비율과는 전혀 무관한 정보이다.", "중소기업이 조달시장의 대다수를 차지하여, 공공조달이 중소기업 판로 지원에 실질적으로 기여하고 있다.", "현재 공공조달시장의 주요 공급망과 계약은 대부분 대기업을 위주로 집중되어 편향적으로 운영되고 있다.", "자본력 등의 현실적 한계로 인하여 일반 중소기업은 공공조달시장에 원천적으로 참여할 수 없다."], "answer": 2, "explanation": "* 정답 (②): 나라장터 등록기업의 상당수가 중소기업이라는 점은 공공조달이 중소기업 판로 지원 수단으로 실질적으로 기능할 수 있음을 보여줌(정확한 등록업체 수·비율은 조달청 최신 통계로 확인 필요).", "source": null}, {"num": 27, "category1": "2. 공공조달 참여자, 이해관계자", "category2": "2. 공공조달 공급자", "question": "공공조달 계약에 참여하여 사업을 수행하는 '계약상대자(조달기업)'가 지켜야 할 권리와 의무에 대한 법리적 설명으로 명백히 틀린 것은?", "options": ["입찰 담합을 모의하거나 허위 서류 위변조 등 중대한 부정행위 발생 시, 국가계약법 등 관련 법령에 따라 최장 2년까지 향후 모든 공공 입찰 참가 자격이 제한(부정당업자 제재)될 수 있다.", "적법한 절차를 거쳐 낙찰자로 선정되어 정식 계약을 체결한 이후에는, 천재지변 등 불가항력의 사유가 없는 한 계약서 및 과업지시서에 명시된 납품 조건과 기한을 엄격히 준수할 책임을 진다.", "국가 조달 계약에서는 예산 집행 주체인 수요기관이 절대적인 우월적 지위를 가지므로, 계약상대자는 설령 부당한 과업 지시나 설계 변경 요구라 할지라도 이에 무조건적으로 복종할 법적 의무가 있다.", "납품하는 재화나 제공하는 용역이 사전에 약정된 규격과 품질 기준을 완벽히 충족해야 하며, 납품 이후 일정 기간 내에 계약 목적물에 하자가 발생할 경우 법령이 정한 바에 따라 사후관리(A/S) 책임을 진다."], "answer": 3, "explanation": "* 정답 (③): 국가계약법의 대원칙(제5조)에 따라 국가와 계약상대자는 '서로 대등한 입장에서 합의에 따라' 계약을 체결하고 신의성실의 원칙에 따라 이를 이행해야 하므로 무조건 복종할 의무는 없습니다.", "source": null}, {"num": 28, "category1": "2. 공공조달 참여자, 이해관계자", "category2": "2. 공공조달 공급자", "question": "공공조달 시장에 진입하여 국가기관과 지속적인 파트너십을 맺고자 하는 공급자(조달기업)에게 가장 기본적이자 최우선적으로 요구되는 핵심 윤리 요소는?", "options": [ 주처와 계약상대자는 사업 완수라는 측면에서는 파트너십을 맺은 '협력자'이지만, 비용 정산이나 하자 책임 소재 등 상업적·경제적 측면에서는 서로의 이익이 상충하는 '대립자'의 이중적 위치에 놓입니다.", "source": null}, {"num": 32, "category1": "3. 공공조달의 특성", "category2": "1. 상업적 구매행위 특성", "question": "[상황] 발주기관이 두 제품 중 초기가는 더 비싸지만 유지보수 비용이 훨씬 적게 드는 제품을 선택하며, '장기적으로 더 경제적'이라고 설명했다. 이 판단 기준이 되는 원칙은?", "options": ["경쟁성(Competition)", "지속가능성(Sustainability)만을 의미하는 개념", "비용 대비 가치(Value for Money)", "윤리성(Ethics)"], "answer": 3, "explanation": "* 정답 (③): 초기가격뿐 아니라 유지보수 등 총소유비용을 고려해 장기적으로 유리한 선택을 하는 것은 비용 대비 가치(VFM) 원칙의 적용임.", "source": null}, {"num": 33, "category1": "3. 공공조달의 특성", "category2": "1. 상업적 구매행위 특성", "question": "[상황] 구매관리 강의에서 강사가 '적정 시기, 적정 수량, 적정 고객'을 언급하며 상업적 구매행위의 원칙을 설명했다. 이 원칙의 틀에 일반적으로 포함되지 않는 요소는?", "options": ["적정 규정(Right Regulation)", "적정 시기(Right Time)", "적정 수량(Right Quantity)", "적정 장소(Right Place)"], "answer": 1, "explanation": "* 정답 (①): 상업적 구매의 적정요소 원칙은 통상 제품·가격·시기·품질·수량·고객·장소를 다루며, 'Right Regulation'은 이 틀에 포함되지 않음.", "source": null}, {"num": 34, "category1": "3. 공공조달의 특성", "category2": "1. 상업적 구매행위 특성", "question": "공공조달 행위가 순수한 민간 부문의 상업적 구매(Private Purchasing) 활동과 뚜렷하게 구별되는 가장 핵심적인 특징은?", "options": ["재화 획득의 궁극적인 목적이 사적 이윤 창출이 아니라 국민의 세금을 재원으로 한 공공서비스의 제공이라는 공익성", "거래 당사자 간의 자유로운 의사 합치를 최우선적인 가치로 삼는 민법상의 계약 자유의 원칙에 대한 전면적인 적용", "복잡한 행정 규제와 심사 절차를 과감히 생략하여 필요 물자를 가장 신속하고 효율적으로 확보할 수 있는 절차적 유연성", "시장의 수요와 공급 변화에 기민하게 대응하여 단기적인 재무 수익을 극대화하기 위한 최고경영자의 빠른 의사결정력"], "answer": 1, "explanation": "* 정답 (①): 공공조달의 본질적 존재 이유는 이윤 추구가 아닌 '공공서비스 제공'이라는 공익적 목적 달성에 있습니다.", "source": null}, {"num": 35, "category1": "3. 공공조달의 특성", "category2": "1. 상업적 구매행위 특성", "question": "국가기관이 주도하는 '공공조달'과 일반 기업이 주도하는 '민간 구매' 간에 존재하는 가장 근본적인 목적의 차이를 바르게 짚어낸 것은?", "options": ["공공조달은 특정 기업의 독점적 이익을 우선적으로 보장하지만, 민간 구매는 산업 생태계 전체의 공익 실현을 최우선으로 삼는다.", "공공조달은 관계 법령에 부여된 공익 실현이 궁극적 목적이지만, 민간 구매는 특정 기업의 사적 이윤 창출과 필요 충족이 목적이다.", "공공조달은 공급자의 혁신적인 신기술 개발 유도에 집중하지만, 민간 구매는 수요자의 단순하고 맹목적인 소비 욕구 충족에만 몰두한다.", "공공조달은 오로지 공무원의 행정 편의주의를 목적으로 운영되지만, 민간 구매는 상법에 정해진 엄격한 법적 절차 준수를 목적으로 한다."], "answer": 2, "explanation": "* 정답 (②): 공공조달의 존재 이유는 공공서비스 제공과 국가 정책(공익) 실현이며, 민간 구매의 존재 이유는 사적 이윤과 효용의 극대화입니다.", "source": null}, {"num": 36, "category1": "3. 공공조달의 특성", "category2": "2. 공공조달의 조달행위 특성", "question": "[상황] 한 신입 직원이 '공공조달과 민간구매는 재원·책임 구조가 다르지만, 결국 계약 상대방을 정해 물건을 사는 행위라는 점은 같다'고 말했다. 이 발언에서 놓치고 있는 점으로 가장 적절한 것은?", "options": ["공공조달과 민간구매는 모두 조직의 경제적 이윤 극대화를 최우선적인 공통 목적으로 삼고 운영된다는 점.", "공공조달과 민간구매는 계약 체결 및 이행 과정에서 모두 완전히 동일한 관련 법령의 적용을 받는다는 점.", "공공조달은 세금을 기반으로 국민에게 책임을 지지만, 민간구매는 주로 주주와 경영진에게 책임을 진다는 점.", "공공조달과 민간구매는 필요한 물품이나 용역을 구매할 때 활용하는 재원의 근본적인 성격에 차이가 없다는 점."], "answer": 3, "explanation": "* 정답 (③): 공공조달은 세금을 재원으로 국민·국회·감사원 등에 대한 다차원적 책임을, 민간구매는 주주·경영진에 대한 책임을 진다는 점에서 근본적으로 구분됨.", "source": null}, {"num": 37, "category1": "3. 공공조달의 특성", "category2": "2. 공공조달의 조달행위 특성", "question": "다음 중 공공조달의 운영적 측면 목표로 명시적으로 다뤄지지 않는 개념은?", "options": ["경쟁성(Competition)", "책임성(Accountability)", "효율성(Efficiency)", "수익성(Profitability)"], "answer": 4, "explanation": "* 정답 (④): 수익성은 민간구매의 목표이며, 공공조달의 운영적 측면 목표(VFM·공정성·투명성·책임성·효율성·경쟁성)에는 포함되지 않음.", "source": null}, {"num": 38, "category1": "3. 공공조달의 특성", "category2": "2. 공공조달의 조달행위 특성", "question": "[상황] 한 보고서에서 'GPP', 'SRPP'라는 약칭을 사용하며 각각 다른 정책 목표를 설명했다. 이 두 약칭이 각각 가리키는 정책으로 옳게 짝지어진 것은?", "options": ["GPP=지속가능조달, SRPP=혁신조달", "GPP=혁신조달, SRPP=녹색조달", "GPP=녹색조달, SRPP=사회책임조달", "GPP=사회책임조달, SRPP=지속가능조달"], "answer": 3, "explanation": "* 정답 (③): GPP(Green Public Procurement)는 녹색조달, SRPP(Socially Responsible Public Procurement)는 사회책임조달을 가리킴.", "source": null}, {"num": 39, "category1": "3. 공공조달의 특성", "category2": "2. 공공조달의 조달행위 특성", "question": "[상황] 한 담당자가 '공공조달은 원래 수의계약이 기본이고 경쟁입찰은 예외적으로만 쓰인다'고 설명했다. 이 설명에 대한 평가로 가장 적절한 것은?", "options": ["틀린 설명이다. 공공조달에서 경쟁입찰과 수의계약 중 어느 것을 원칙으로 삼아야 하는지 법적으로 명확히 정해져 있지 않다.", "틀린 설명이다. 공공조달 업무에서는 공급자 선정 및 계약 방법에 대해 사전에 규정된 명확한 원칙 자체가 존재하지 않는다.", "틀린 설명이다. 공급자 선정은 경쟁입찰이 원칙이며, 수의계약은 관련 법령에서 정한 예외적인 사유가 있을 때만 허용된다.", "옳은 설명이다. 공공조달에서는 신속한 행정 처리와 효율성 확보를 위해 수의계약을 기본적인 계약 원칙으로 채택하고 있다."], "answer": 3, "explanation": "* 정답 (③): 공공조달의 공급자 선정은 경쟁입찰이 원칙이며, 수의계약은 법령이 정한 예외적 사유가 있을 때만 허용됨.", "source": null}, {"num": 40, "category1": "3. 공공조달의 특성", "category2": "2. 공공조달의 조달행위 특성", "question": "[상황] 한 조달청 주무관이 신규 담당자들에게 공공계약 체결 시 준수해야 할 기본 원칙을 설명하고 있다. 이 중 적절하지 않은 발언은?", "options": ["발주기관과 조달업체는 어느 한쪽으로 치우침 없이 상호 동등하고 평등한 지위에서 공정하게 계약을 맺어야 합니다.", "계약 관계가 성립된 이후 양 당사자는 굳건한 신뢰를 바탕으로 합의된 내용을 성실하고 투명하게 이행해야 합니다.", "공공사업의 원활한 추진을 위해 불가피한 상황이라면 업체의 정당한 이익을 일부 제한하는 특약을 설정해도 무방합니다.", "계약의 성립과 세부 조건의 결정은 우월적 지위를 이용한 강요가 아닌 양측의 자율적이고 충분한 합의를 거쳐야 합니다."], "answer": 3, "explanation": "* 정답 (③): 국가계약법상 발주기관은 어떠한 경우라도 계약상대자의 정당한 이익을 부당하게 제한하거나 침해하는 부당한 특약 및 조건을 설정할 수 없음.", "source": "국가계약법 제5조"}, {"num": 41, "category1": "3. 공공조달의 특성", "category2": "2. 공공조달의 조달행위 특성", "question": "[상황] 한 발표자가 공공조달의 핵심원칙을 나열하며 '경쟁, 공정성, 지속가능성'을 언급했다. 다음 중 이 핵심원칙 목록에 함께 포함되기 어려운 것은?", "options": ["수익성(Profitability)", "책임성(Accountability)", "투명성(Transparency)", "효율성(Efficiency)"], "answer": 1, "explanation": "* 정답 (①): 수익성은 민간기업의 목표이며, 공공조달의 핵심원칙(경쟁·투명성·공정성·효율성·책임성·윤리성·VFM·지속가능성)에는 포함되지 않음.", "source": null}, {"num": 42, "category1": "3. 공공조달의 특성", "category2": "2. 공공조달의 조달행위 특성", "question": "[상황] 어느 학자가 \"공공조달은 단순 물품 조달에서 시작해 법령 준수, 예산의 효율적 사용, 책임성 확보를 거쳐 궁극적으로 비용 대비 가치(VFM) 실현으로 발전한다\"는 단계적 발전 모델을 제시했다. 이 모델이 강조하는 핵심 내용으로 가장 적절한 것은?", "options": ["공공조달의 핵심 목적은 기초적인 관련 법령과 규정을 준수하는 단계에 확고히 도달한 이후에는, 질적으로 더 이상 진화하거나 새로운 차원으로 발전하지 않고 정체된다.", "공공조달의 목적은 발전 단계가 거듭될수록 점차 확대 및 심화되며, 궁극적으로는 비용 대비 가치(VFM) 실현이라는 가장 고도화된 정책적 목표를 향해 지속 나아간다.", "해당 모델은 민간 기업의 단순 구매 관행을 설명하는 고전 이론으로, 복합적인 공공성을 지닌 정부의 공공조달 시스템이나 정책적 발전 과정과는 사실상 전혀 무관하다.", "공공조달 시스템은 제도의 도입 초기부터 성숙 단계에 이르기까지, 어떠한 외부 환경 변화에도 항상 동일한 수준의 기초적인 단순 물품 확보 목적만을 지속적으로 추구한다."], "answer": 2, "explanation": "* 정답 (②): 공공조달의 목적과 역할은 고정되어 있는 것이 아니라, 단순한 물품 확보라는 기초적 수준에서 출발해 규정 준수, 효율성, 책임성을 거쳐 최종적으로 '비용 대비 가치(VFM)'를 창출하는 심화된 수준으로 끊임없이 발전해 나간다는 점을 시사함.", "source": null}, {"num": 43, "category1": "3. 공공조달의 특성", "category2": "2. 공공조달의 조달행위 특성", "question": "사기업의 구매 부서와 달리, 국가나 공공기관의 조달 업무 담당자에게 고도의 윤리의식과 공공성, 그리고 무거운 책임성이 그 무엇보다 강하게 요구되는 가장 근본적인 이유는?", "options": ["조달 사업에 투입되어 지출되는 모든 자금의 원천이 전적으로 국민이 피땀 흘려 납부한 신성한 세금(Tax)으로 조성된 공적 자금이기 때문이다.", "공공조달 시장에서 연간 집행되는 전체 예산의 절대적인 규모와 그에 따른 경제적 파급력이 국가 거시 경제 지표에 막대한 영향을 미치기 때문이다.", "세계무역기구 정부조달협정(WTO GPA) 가입국으로서 국제 사회가 요구하는 엄격하고 글로벌한 투명성 기준을 의무적으로 준수해야 하기 때문이다.", "수요 파악부터 입찰 공고, 적격심사, 낙찰, 그리고 계약 해제 및 지체상금 부과에 이르는 관련 법령과 행정 절차가 사기업에 비해 매우 복잡하기 때문이다."], "answer": 1, "explanation": "* 정답 (①): 조달 절차의 복잡성이나 경제적 파급력도 이유가 되지만, 조달 공무원에게 요구되는 청렴과 책임성의 가장 근원적인 잣대는 사용처의 재원이 '국민의 혈세'라는 점에 있습니다.", "source": null}, {"num": 44, "category1": "3. 공공조달의 특성", "category2": "2. 공공조달의 조달행위 특성", "question": "조달 업무의 실무적 흐름을 보여주는 전체 라이프사이클을 6단계로 도식화할 때, 다음 빈칸에 들어갈 가장 알맞은 단계 명칭은? \n[조달계획 수립] → [조달 실행(입찰/계약)] → [계약 이행(납품) 관리] \n→ [ 빈칸 ] → [공급자 성과 평가] → [차기 계획 피드백]", "options": ["외부 민간 시장에 해당 조달 건의 세부 과업 내역을 널리 알리고 역량 있는 다수 업체의 경쟁적 참여를 유도하는 입찰 공고 단계", "참여 업체의 재무 건전성, 과거 납품 실적, 기술 인력 보유 현황 등 적합한 기준을 갖추었는지 꼼꼼히 검증하는 적격 자격 심사 단계", "물품의 획득이나 서비스 제공 중 예기치 않게 발생하는 각종 하자에 대해 책임 소재를 명확히 묻고 이를 무상으로 보완하는 사후 보증 단계", "계약상대자의 최종 납품 검수를 무사히 통과하고 사전에 약정된 대금을 관계 법령에 따라 정산하여 지급을 완료하는 계약 완료 단계"], "answer": 4, "explanation": "* 정답 (④): 계약 이행(물품 납품 및 용역 수행)이 마무리되면, 검사/검수를 거쳐 대금을 지급하는 '계약 완료(종결)' 단계로 이어집니다. 이후 해당 업체의 성과를 평가하여 다음 계획에 피드백합니다.", "source": null}, {"num": 45, "category1": "3. 공공조달의 특성", "category2": "2. 공공조달의 조달행위 특성", "question": "막대한 예산이 투입되는 공공조달 업무를 성공적으로 완수하고 예산 낭비를 막기 위해, 발주처인 조달기관이 가장 중점을 두고 통제 및 관리해야 할 핵심 사항은?", "options": ["수요 부서의 최초 조달 요구사항 분석 및 기획부터 시작하여, 입찰 공고, 낙찰자 선정, 물품 납품(이행), 그리고 사후 하자 평가에 이르기까지 구매 전·중·후의 전 과정을 유기적인 생애주기로 묶어 총체적으로 관리한다.", "공급자의 물품 납품 및 최초 설치가 정상적으로 완료된 이후에 발생하는 시스템 오류 및 유지보수 등 사후 영역은 전적으로 해당 물품을 쓰는 사용 부서의 책임이므로 조달 부서의 관리 대상에서 엄격히 제외한다.", "국가 예산 절감이 그 무엇보다 가장 중요한 가치이므로, 초기 서류 심사나 입찰 단계를 대폭 간소화하고 오로지 낙찰자와의 최종 가격 협상 과정에만 기관의 행정력을 집중적으로 투입하여 가격을 깎는 데 주력한다.", "계약이 최종적으로 체결되고 도장이 찍히는 시점의 법적 하자가 없는지가 향후 감사에서 가장 중요하게 다뤄지므로, 실제 이행 과정보다는 구매 및 계약이 성립하는 단일 행정 시점만을 중점적으로 서류상 관리한다."], "answer": 1, "explanation": "* 정답 (①): 현대적 공공조달 관리는 특정 시점의 단편적인 구매 행위 중심에서 벗어나, 사업의 기획 단계부터 계약 종결 및 폐기/사후 평가에 이르는 전체 생애주기(Life-Cycle)를 통합 관리하는 것을 핵심으로 합니다.", "source": null}, {"num": 46, "category1": "3. 공공조달의 특성", "category2": "2. 공공조달의 조달행위 특성", "question": "국민의 세금을 재원으로 하는 공공계약의 고유한 행정적 특징으로 가장 올바른 것은?", "options": ["규정 위반 시 대외적 효력이 전면 무효화된다.", "최종 결과보다는 합법적 절차와 과정을 중시한다.", "상업적 이윤을 투명성보다 우선시하는 경향이 있다.", "법령의 모든 조문은 재량권이 배제된 강행규정이다."], "answer": 2, "explanation": "* 정답 (②): 공공조달은 세금을 집행하므로 절차적 정당성(과정)을 매우 중시합니다. 훈시규정 위반 시 무조건 무효화되는 것은 아니며 재량규정도 존재합니다.", "source": null}, {"num": 47, "category1": "4. 공공조달의 구성체계", "category2": "1. 조직적 구성체계", "question": "[상황] 공공조달의 구성요소를 '법적 근거', '이를 운영하는 조직', '실제 업무가 처리되는 수단'으로 나눠 설명하려 한다. 이 중 '실제 업무가 처리되는 수단'에 해당하는 것은?", "options": ["국가 공공조달 업무의 실무적 집행을 총괄하는 중앙행정기관인 조달청", "국가계약제도의 핵심 정책 수립을 총괄 담당하는 재정경제부 계약정책과", "공공조달 제도의 기본적 법적 근거인 '국가를 당사자로 하는 계약에 관한 법률'", "실제 조달 업무가 전산상으로 처리되는 국가종합전자조달시스템(나라장터)"], "answer": 4, "explanation": "* 정답 (④): 나라장터는 실제 조달 업무가 처리되는 운영적 수단이며, 국가계약법은 법적 근거, 재정경제부·조달청은 이를 운영하는 조직에 해당함.", "source": null}, {"num": 48, "category1": "4. 공공조달의 구성체계", "category2": "1. 조직적 구성체계", "question": "[상황] 신임 실무자가 신규 사업 추진을 위해 공공조달 업무 프로세스를 정리하고 있다. 다음 중 공공조달의 표준적인 계약 추진 절차를 시간 흐름에 따라 가장 올바르게 나열한 것은?", "options": ["[개찰 및 심사] → [공식 입찰공고] → [사업 수요제기] → [낙찰자 선정] → [사전규격공개] → [입찰서류 제출] → [최종 계약체결]", "[공식 입찰공고] → [사업 수요제기] → [최종 계약체결] → [사전규격공개] → [입찰서류 제출] → [개찰 및 심사] → [낙찰자 선정]", "[사전규격공개] → [사업 수요제기] → [입찰서류 제출] → [개찰 및 심사] → [최종 계약체결] → [공식 입찰공고] → [낙찰자 선정]", "[사업 수요제기] → [사전규격공개] → [공식 입찰공고] → [입찰서류 제출] → [개찰 및 심사] → [낙찰자 선정] → [최종 계약체결]"], "answer": 4, "explanation": "* 정답 (④): 공공조달은 발주기관의 '수요제기'를 시작으로, 업계 의견 수렴을 위한 '사전규격공개'와 '입찰공고'를 거쳐, '입찰서 제출 및 개찰', 적격심사 등을 통한 '낙찰자 선정' 후 최종적으로 '계약 체결'에 이르는 일련의 흐름을 따릅니다.", "source": null}, {"num": 49, "category1": "4. 공공조달의 구성체계", "category2": "1. 조직적 구성체계", "question": "[상황] 조달 담당자가 공급업체를 탐색해 적합한 후보군을 추리는 '소싱(Sourcing)' 단계를 막 끝냈다. 다음으로 진행해야 할 업무 단계로 가장 적절한 것은?", "options": ["내부 조달수요를 다시 식별하는 단계로 되돌아간다", "곧바로 낙찰자를 선정하는 단계로 건너뛴다", "제출된 입찰서를 평가하는 단계로 곧바로 넘어간다(권유 절차 없이)", "추린 후보군에게 입찰 참여를 권유하는 단계로 넘어간다"], "answer": 4, "explanation": "* 정답 (④): 조달업무는 수요식별 → 공급업체탐색 → 소싱 → 입찰권유 → 입찰평가 순으로 이어지므로, 소싱 직후에는 입찰권유가 이루어짐.", "source": null}, {"num": 50, "category1": "4. 공공조달의 구성체계", "category2": "1. 조직적 구성체계", "question": "[상황] 해외 선진 조달 행정 체계 벤치마킹을 위해 관련 자료를 수집하던 중, 각국의 조달 전담기관 운영 현황에 대해 실무자들이 나눈 대화 내용이다. 이 중 가장 타당한 설명은 무엇인가?", "options": ["미국의 GSA나 영국의 CCS처럼 주요 선진국들은 대체로 국가 조달 정책을 수립하고 대규모 공동구매 사업을 총괄적으로 관리하는 별도의 전담 조달기관을 체계적으로 운영하고 있습니다.", "조달 업무의 특수성으로 인해 해외 선진국들조차 정부 조달만을 전담하는 별도의 독립적인 국가 기관을 설립하여 운영하는 사례는 전 세계적으로 사실상 전혀 존재하지 않는 것으로 파악됩니다.", "해외의 주요 조달기관들은 각 부처의 요구에 따라 단순한 물품 구매 대행 업무만을 기계적으로 수행할 뿐, 거시적인 조달 정책을 기획하거나 제도를 개선하는 권한은 전혀 보유하지 않습니다.", "글로벌 공공행정 개혁의 흐름에 따라 주요 선진국들의 국가 조달 전담기관들은 모두 동일한 특정 연도에 일괄적으로 설립되어 완벽히 똑같은 행정 기능과 조직적 역할을 수행하고 있습니다."], "answer": 1, "explanation": "* 정답 (①): 미국 GSA, 영국 CCS 등 주요 선진국은 범정부 차원의 조달 정책 수립 및 공동구매를 총괄하는 전담기관을 두고 있음. 단, 각 기관의 구체적인 설립 시기나 세부 기능은 국가별 행정 환경에 따라 상이함.", "source": null}, {"num": 51, "category1": "4. 공공조달의 구성체계", "category2": "1. 조직적 구성체계", "question": "대한민국 공공조달의 뼈대를 이루는 대표적인 계약 관련 법령인 「국가계약법」과 「지방계약법」을 실무적으로 구분하여 적용하는 가장 명확하고 절대적인 기준은?", "options": ["수의계약, 일반경쟁입찰, 다수공급자계약(MAS), 협상에 의한 계약 등 해당 조달 목적을 구체적으로 달성하기 위해 발주처가 채택한 계약 체결 방식의 종류", "최초 과업 납품 요구 지시로부터 최종 검수 완료 및 대금 지급 시점까지 소요되는 전체 조달 사업의 물리적 계약 기간과 장기계속계약 여부", "조달청 나라장터 등에 입찰 공고를 내고 최종적으로 계약서에 날인하여 해당 사업 자금을 집행하고 책임을 지는 핵심 계약 주체(발주기관)의 행정적 성격", "해당 조달 건을 통해 집행되는 전체 사업 예산 규모가 기획재정부장관이 고시하는 특정 고시 금액을 초과하는지 여부 및 최종 계약 금액의 크기"], "answer": 3, "explanation": "* 정답 (③): 중앙행정기관(국가기관)이 주체가 되면 국가계약법을, 지방자치단체나 지방교육행정기관이 주체가 되면 지방계약법을 우선 적용합니다. 즉, 계약 주체의 성격이 법령 적용의 기준입니다.", "source": null}, {"num": 52, "category1": "4. 공공조달의 구성체계", "category2": "2. 감독 및 기능적 책임", "question": "[상황] 조달 업무 신임 실무자가 공공계약의 법적 체계를 이루는 법령과 소관 부처를 다음과 같이 정리하였다. \n[ㄱ. 국가계약법-재정경제부, ㄴ. 지방계약법-행정안전부, ㄷ. 판로지원법-중소벤처기업부, ㄹ. 민법-법무부] 이에 대한 평가로 가장 적절한 것은?", "options": ["제시된 ㄱ, ㄴ, ㄷ, ㄹ의 조달 관련 주요 법령 및 계약의 일반법에 대한 각 소관 부처의 연결은 모두 법적으로 올바른 설명이다.", "제시된 항목 중에서 ㄴ(지방계약법)과 ㄹ(민법)의 소관 중앙부처를 서로 연결하여 정리한 실무자의 설명은 현행 법령상 옳지 않다.", "제시된 항목 중에서 ㄷ(판로지원법)과 ㄹ(민법)의 소관 중앙부처를 서로 연결하여 정리한 실무자의 설명은 현행 법령상 옳지 않다.", "제시된 항목 중에서 ㄱ(국가계약법)과 ㄷ(판로지원법)의 소관 중앙부처를 서로 연결하여 정리한 실무자의 설명은 현행 법령상 옳지 않다."], "answer": 1, "explanation": "* 정답 (①): 국가계약법은 재정경제부, 지방계약법은 행정안전부, 중소기업 제품 구매를 다루는 판로지원법은 중소벤처기업부, 공공계약의 기본 원리가 되는 민법은 법무부 소관으로 제시된 설명은 모두 옳음.", "source": null}, {"num": 53, "category1": "4. 공공조달의 구성체계", "category2": "2. 감독 및 기능적 책임", "question": "공공계약 관련 법규 및 제정 배경에 대한 설명으로 가장 옳은 것은?", "options": ["지방계약법 하위 규정엔 시행령과 규칙만 있으며 별도 행안부 예규는 없다.", "조달시장 개방 및 국제 규범 대응을 위해 국가계약법이 별도로 제정되었다.", "국가계약법 하위 규정엔 시행령 등만 존재하며 재경부 계약예규는 제외된다.", "공공계약은 사법상 계약이므로 특별법인 계약법보다 민법이 항상 우선된다."], "answer": 2, "explanation": "정답 (②) 1995년 GPA 가입 등에 대응해 예산회계법에서 분리 제정됨 / ①·③ 각종 예규 존재함 / ④ 특별법이 우선함", "source": "「국가계약법(1995.1.5., 법률 제4868호)」 제정·개정이유"}, {"num": 54, "category1": "4. 공공조달의 구성체계", "category2": "2. 감독 및 기능적 책임", "question": "계약사무 위임 및 위탁에 대한 설명으로 가장 옳은 것은?", "options": ["지자체의 장은 계약사무를 다른 지방자치단체나 전문기관에 위탁하는 것이 전면 금지된다.", "지방계약법령상 계약사무를 위탁할 수 있는 전문기관에는 공기업과 준정부기관이 포함된다.", "각 중앙관서의 장이나 지자체장은 소속 기관의 특정 관직 지정 방식으로 계약사무를 위임할 수 없다.", "지자체가 국가기관에 계약사무를 위탁할 경우 수탁기관인 국가기관의 법령이 아닌 무조건 지방계약법을 적용한다."], "answer": 2, "explanation": "정답 (②) 지방계약법 시행령 제6조제2항제1호에 따라 공기업과 준정부기관이 전문기관에 명시적으로 포함됨 / ① 위임·위탁 자체는 허용됨 / ③ 관직 지정 방식의 위임 가능 / ④ 국가기관 위탁 시 국가계약법령을 따르는 것이 원칙", "source": "지방계약법"}], "1-2_원칙및방법": [{"num": 1, "category1": "1. 공공조달 원칙", "category2": "1. 공공조달 기본 원칙", "question": "[상황] 한 강사가 공공조달의 5대 기본원칙을 설명하며 '투명성, 비용대비가치, 경쟁성, 차별금지 및 동등대우, 책임성'을 언급했다. 다음 중 이 목록에 포함될 가능성이 가장 낮은 개념은?", "options": ["투명성(Transparency)", "책임성(Accountability)", "경쟁성(Competitiveness)", "수익성(Profitability)"], "answer": 4, "explanation": "* 정답 (④): 수익성은 민간구매의 최우선 목표이며, 공공조달의 5대 기본원칙(투명성·VFM·경쟁성·차별금지동등대우·책임성)에는 포함되지 않음.", "source": null}, {"num": 2, "category1": "1. 공공조달 원칙", "category2": "1. 공공조달 기본 원칙", "question": "[상황] 발주기관이 사무기기를 구매하면서 구매가격뿐 아니라 유지보수 비용, 소모품 비용, 폐기 비용까지 함께 비교해 선정했다. 이러한 접근방식이 구현하는 원칙은?", "options": ["차별금지 및 동등대우", "비용 대비 가치(VFM)", "책임성", "경쟁성"], "answer": 2, "explanation": "* 정답 (②): 구매가격 외에 유지보수·폐기 등 총소유비용까지 종합 고려하는 것은 비용 대비 가치(VFM) 원칙의 구현임.", "source": null}, {"num": 3, "category1": "1. 공공조달 원칙", "category2": "1. 공공조달 기본 원칙", "question": "[상황] 한 공공기관의 조달 담당자가 신규 장비 도입을 위해 TCO(총소유비용)를 산정하면서, '장비의 최초 취득부터 운영, 그리고 최종 폐기까지 우리 기관이 실제로 지출하게 될 모든 비용'을 합산하여 집계했다. 이러한 산정 방식에 대한 평가로 가장 적절한 것은?", "options": ["틀린 산정 방식이다. TCO는 장비의 최초 취득과 운영 기간의 유지보수 비용만을 합산하는 재무 지표이므로, 수명이 종료된 이후의 최종 폐기 단계에서 발생하는 각종 처리 비용은 원칙적으로 전면 제외하고 계산해야 한다.", "올바른 산정 방식이다. 하지만 향후 감사에 대비해 객관성을 완벽히 입증하려면, 우리 기관의 실제 지출 비용 외에 입찰에 참여했던 타 경쟁업체들의 평균 제시 가격까지도 TCO 산출 내역에 반드시 포함시켜야만 한다.", "올바른 산정 방식이다. TCO(총소유비용)는 자산의 최초 취득 단계부터 정비 등의 운영 기간을 거쳐 최종 폐기에 이르기까지, 해당 자산과 관련해 실질적으로 발생하는 모든 비용을 온전히 포괄하는 개념이기 때문이다.", "틀린 산정 방식이다. 공공조달에서 TCO는 당해 예산 집행을 위해 장비를 최초 도입할 때 지급하는 초기 구매 가격만을 의미하므로, 향후에 지속적으로 발생하게 될 장기적인 운영 비용 및 폐기 비용은 제외해야 한다."], "answer": 3, "explanation": "* 정답 (③): TCO(Total Cost of Ownership, 총소유비용)는 자산을 획득하고 유지·보수하며 최종적으로 폐기하는 전체 수명 주기 동안 실제 발생하는 모든 지출 비용을 합산한 포괄적 개념임. 경쟁업체의 가격을 억지로 포함시킬 필요가 없으며, 단순 초기 구매 비용만을 의미하지도 않음.", "source": null}, {"num": 4, "category1": "1. 공공조달 원칙", "category2": "1. 공공조달 기본 원칙", "question": "[상황] 한 공공기관의 계약담당자가 입찰 공고가 정식으로 게시되기 전에, 평소 친분이 있던 특정 업체에게만 과업지시서 등 입찰 관련 핵심 정보를 미리 제공했다. 이러한 담당자의 행위가 위반하고 있는 공공조달의 기본 원칙으로 가장 적절한 것은?", "options": ["특정 업체에 유리한 입찰 환경을 조성했으므로 '경쟁성 원칙'만을 단편적으로 위반한 것이며, 공공조달의 다른 핵심적인 기본 원칙들과는 직접적인 연관성이 없다.", "계약 공고 이전의 단순한 절차적 하자에 해당할 뿐이므로, 공공 예산 집행에 대해 국민에게 엄중히 책임을 져야 한다는 '책임성 원칙'과는 사실상 전혀 무관하다.", "예산을 절감하여 경제적 효율성을 달성해야 한다는 '비용 대비 가치 원칙'만을 단독으로 훼손한 것이며, 공공조달의 절차적 공정성 문제로 치부하기는 매우 어렵다.", "잠재적 입찰자 모두에게 동등하게 정보를 공개해야 한다는 '투명성 원칙' 및 특정 업체를 부당하게 우대해서는 안 되는 '차별금지·동등대우 원칙'에 정면으로 반한다."], "answer": 4, "explanation": "* 정답 (④): 특정 업체에만 사전 정보를 제공하는 행위는 입찰 관련 정보를 모든 이해관계자에게 투명하게 공개해야 한다는 '투명성 원칙'과 특정인을 유리하게 대우하지 않아야 한다는 '차별금지 및 동등대우 원칙'을 심각하게 훼손하는 부정행위임.", "source": null}, {"num": 5, "category1": "1. 공공조달 원칙", "category2": "1. 공공조달 기본 원칙", "question": "[상황] 한 신임 계약담당자가 \"향후 감사를 대비하여 공공조달의 책임성을 확보하려면, 무조건 가장 낮은 입찰 가격을 제시한 최저가 업체를 낙찰자로 선정하는 것이 가장 확실한 방법이다\"라고 주장했다. 이 주장의 핵심적인 문제점은 무엇인가?", "options": ["단순 가격 중심의 무조건적인 최저가 낙찰 방식은 오히려 조달 목적물의 품질 저하를 초래하여 '비용 대비 가치(VFM)' 원칙을 심각하게 훼손할 우려가 크므로, 진정한 의미의 책임성 확보 방안이 될 수 없다.", "책임성 원칙은 예산 집행 과정의 경제성과는 전혀 무관한 독립적 개념이므로, 입찰 업체의 가격 제안 수준이나 구체적인 낙찰자 선정 방식 등 재무적인 요소들을 억지로 결부시켜 책임성을 논의하는 것은 잘못된 접근이다.", "공공조달에서 의미하는 책임성이란 사후 감사 기관의 지적 사항을 회피하기 위한 소극적인 방어 기제에만 전적으로 국한되므로, 초기 입찰 단계에서의 가격 산정 문제나 낙찰자 결정 방식과는 근본적으로 아무런 관련성이 없다.", "해당 주장은 아무런 문제가 없다. 국민의 혈세를 집행하는 공공조달의 특성상, 예산을 최대한 절감할 수 있는 무조건적 최저가 선정이 곧 투명하고 공정한 업무 처리이자 책임성을 완벽하게 입증하는 가장 핵심적인 지표이다."], "answer": 1, "explanation": "* 정답 (①): 무조건적인 최저가 선정은 장기적인 품질과 효율성을 따지는 VFM(비용 대비 가치) 원칙을 훼손할 수 있음. 공공조달의 책임성은 단순한 가격 인하가 아니라 합리적 의사결정 과정, 꼼꼼한 기록 보관, 투명한 성과평가 등을 통해 확보됨.", "source": null}, {"num": 6, "category1": "1. 공공조달 원칙", "category2": "1. 공공조달 기본 원칙", "question": "[상황] 신입 직원이 '공공조달은 수의계약을 기본으로 하고 경쟁입찰은 특별한 경우에만 쓰는 것 아니냐'고 물었다. 이에 대한 올바른 답변은?", "options": ["아니다. 제한경쟁이 원칙이며 나머지가 예외이다", "아니다. 일반경쟁이 원칙이며, 제한경쟁·지명경쟁·수의계약이 예외적으로 허용된다", "맞다. 지명경쟁이 원칙이고 나머지가 보조수단이다", "맞다. 수의계약이 원칙이고 경쟁입찰이 예외이다"], "answer": 2, "explanation": "* 정답 (②): 국가계약법 제7조는 일반경쟁을 원칙으로 규정하며, 제한경쟁·지명경쟁·수의계약은 예외적 방법임.", "source": "국가계약법 제7조"}, {"num": 7, "category1": "1. 공공조달 원칙", "category2": "1. 공공조달 기본 원칙", "question": "[상황] 적격심사제도를 처음 접한 직원이 '결국 가격만 보고 낙찰자를 정하는 것 아니냐'고 물었다. 이 질문에 대한 올바른 답변은?", "options": ["아니다. 입찰가격과 함께 계약이행능력(수행능력·재무상태·신인도 등)을 종합 심사한다", "아니다. 오직 재무상태만으로 결정한다", "맞다. 수행능력만 보고 가격은 보지 않는다", "맞다. 오직 가격만으로 결정한다"], "answer": 1, "explanation": "* 정답 (①): 적격심사제도는 가격뿐 아니라 수행능력·재무상태·신인도 등 계약이행능력을 종합적으로 심사하는 제도임.", "source": null}, {"num": 8, "category1": "1. 공공조달 원칙", "category2": "1. 공공조달 기본 원칙", "question": "국가계약법령 및 조달사업법령의 취지에 비추어 볼 때, 공공조달 업무 수행 시 요구되는 핵심 기본원칙에 해당하지 않는 것은?", "options": ["조달 절차와 심사 기준을 외부로 투명하게 공개하여 조달 행정에 대한 국민적 신뢰를 확보하는 투명성 유지의 원칙", "다수의 유효한 공급자에게 입찰에 참여할 수 있는 동등한 기회를 부여하여 시장의 활력을 높이는 경쟁성 확보의 원칙", "특정 ": ["지자체가 지역 경제 활성화를 위해 1억 원 이상의 물품을 구매하는 경우", "조달청 종합쇼핑몰에 제3자를 위한 단가계약으로 이미 등록되어 있는 물품", "국가기관이 구매하는 물품 중 중앙조달이 곤란하다고 명백히 승인된 규격품", "지자체가 지역 소상공인 보호를 위해 고시금액 미만의 자재를 구매하는 경우"], "answer": 2, "explanation": "* 정답 (②): 종합쇼핑몰에 단가계약이나 다수공급자계약으로 이미 등록된 물품은 예외 없이 조달청을 통해 의무적으로 구매해야 합니다.", "source": null}, {"num": 20, "category1": "2. 공공조달 유형", "category2": "2. 분산형 공공조달", "question": "조달청장이 수요기관의 요청 물품을 해당 수요기관이 '직접 구매하도록 위임'할 수 있는 사유로 틀린 것은?", "options": ["긴급한 재난 복구로 인해 조달청을 거치면 적기에 수요를 충족하기 어려운 경우", "조달청 내부 행정 절차상 수의계약을 체결하는 것이 매우 번거롭고 까다로운 경우", "시중 거래가 없는 신규 개발품으로 수요기관의 특수 기술과 전문성이 요구되는 경우", "국방·안보상의 사정 등으로 수요기관이 직접 구매하는 것이 국가에 명백히 유리한 경우"], "answer": 2, "explanation": "* 정답 (②): 조달 위임은 긴급성, 안보 등 법적 사유가 있어야 하며, 단순히 조달청 입장에서 '수의계약 체결이 번거롭다'는 사유로 위임할 수 없습니다.", "source": null}, {"num": 21, "category1": "3. 경쟁적 공공조달 방법", "category2": "1. 일반경쟁", "question": "[상황] 한 교육생이 '지명경쟁입찰이 국가계약법상 원칙적인 계약방법이고, 참가자격 제한이 없는 방식이 오히려 예외'라고 잘못 이해하고 있었다. 이 오해를 바로잡는 설명으로 가장 적절한 것은?", "options": ["수의계약이 원칙이며 나머지가 예외이다", "그 이해가 맞다. 지명경쟁이 원칙이다", "참가자격 제한 없는 일반경쟁이 원칙이며, 지명경쟁은 예외적으로만 허용된다", "제한경쟁이 원칙이며 나머지가 예외이다"], "answer": 3, "explanation": "* 정답 (③): 국가계약법상 원칙은 참가자격 제한이 없는 일반경쟁이며, 지명경쟁은 예외적 방법에 불과함.", "source": "국가계약법 제7조"}, {"num": 22, "category1": "3. 경쟁적 공공조달 방법", "category2": "1. 일반경쟁", "question": "[상황] 발주기관이 인공위성 시스템처럼 기술적으로 매우 복잡해 사전에 완벽한 규격을 정하기 어려운 사업을 발주하려 한다. 먼저 가격을 제외한 기술제안서만 평가하고, 기술 적합 판정을 받은 업체만을 대상으로 이후 가격입찰을 실시해 낙찰자를 정하는 방식을 무엇이라 하는가?", "options": ["적격심사낙찰제", "지명경쟁입찰", "협상에 의한 계약", "2단계 경쟁입찰"], "answer": 4, "explanation": "* 정답 (④): 기술평가와 가격입찰을 단계적으로 분리해 진행하는 방식은 2단계 경쟁입찰이며, 기술 요구가 복잡해 사전 규격 확정이 어려운 사업에 활용됨.", "source": null}, {"num": 23, "category1": "3. 경쟁적 공공조달 방법", "category2": "1. 일반경쟁", "question": "[상황] 발주기관이 대량의 표준 사무용품 구매에 2단계 경쟁입찰(기술평가+가격입찰 분리) 방식을 적용하려 한다. 이 선택에 대한 평가로 가장 적절한 것은?", "options": ["적절하다. 표준화된 소모품 구매에도 항상 2단계 경쟁입찰을 적용해야 한다", "적절하다. 모든 물품 구매는 2단계 경쟁입찰이 원칙이다", "적절하지 않다. 표준 사무용품은 반드시 수의계약으로만 구매해야 한다", "적절하지 않다. 2단계 경쟁입찰은 기술적으로 복잡해 사전 규격 확정이 어려운 사업에 적합하며, 표준화된 사무용품에는 불필요한 절차 부담을 줄 수 있다"], "answer": 4, "explanation": "* 정답 (④): 2단계 경쟁입찰은 기술 요구가 복잡해 사전 규격 확정이 어려운 사업에 적합하며, 표준화된 사무용품처럼 단순한 구매에는 오히려 불필요한 절차 부담을 줄 수 있음.", "source": null}, {"num": 24, "category1": "3. 경쟁적 공공조달 방법", "category2": "1. 일반경쟁", "question": "[상황] 협상에 의한 계약에서 1순위 협상대상자와의 협상이 결렬되었다. 발주기관의 다음 조치로 가장 적절한 것은?", "options": ["모든 절차를 처음부터 새로 시작해 재공고한다", "동일한 기준·절차에 따라 차순위 협상적격자와 협상을 이어간다", "1순위 업체와 가격만 다시 협상한다", "해당 사업을 자동으로 취소한다"], "answer": 2, "explanation": "* 정답 (②): 협상에 의한 계약은 고득점자 순으로 순차 협상(연속협상)을 진행하며, 1순위와 결렬되면 차순위와 협상을 이어감.", "source": null}, {"num": 25, "category1": "3. 경쟁적 공공조달 방법", "category2": "1. 일반경쟁", "question": "[상황] 전자역경매(ERA)를 도입한 기관에서 공급업체들의 납품 품질이 이전보다 다소 낮아졌다는 지적이 나왔다. 이 현상의 원인으로 가장 적절한 것은?", "options": ["전자역경매는 담합을 조장하는 구조이기 때문이다", "전자역경매는 특정 업체에 대한 특혜를 유발하기 때문이다", "실시간 최저가 경쟁이 과열되면서 공급업체가 수익성 확보를 위해 품질을 낮출 유인이 생기기 때문이다", "전자역경매는 절차가 지나치게 복잡해 품질 관리가 어려워지기 때문이다"], "answer": 3, "explanation": "* 정답 (③): 전자역경매는 실시간 최저가 발굴에는 효율적이지만, 과도한 가격 경쟁이 공급업체의 품질 저하·수익성 악화로 이어질 수 있다는 단점이 있음.", "source": null}, {"num": 26, "category1": "3. 경쟁적 공공조달 방법", "category2": "1. 일반경쟁", "question": "다수의 업체를 참여시키는 '경쟁입찰(Competitive Bidding)' 방식이 내포하고 있는 행정적 단점 또는 한계로 가장 적절한 것은?", "options": ["까다로운 입찰 참가 자격 요건으로 인해 혁신적인 기술력을 갖춘 신생 조달기업의 입찰 참여 기회가 원천적으로 완벽히 차단된다.", "법령에 정해진 표준화된 공개 절차와 공고 기간을 엄격히 준수해야 하므로 조달 물자의 최종 획득 완료까지 상당한 시간이 지연될 수 있다.", "계약 체결 과정의 세부 평가 기준과 심사위원 명단 등 핵심 정보가 투명하게 공개되지 않아 절차적 공정성을 확보하기가 매우 어려워진다.", "다수의 영세 업체가 무분별하게 참여함에 따라 업체 간의 기술 경쟁성이 과도하게 약화되어 최종 납품되는 대상물의 품질이 심각하게 저하된다."], "answer": 2, "explanation": "* 정답 (②): 경쟁입찰은 공정성과 투명성을 담보하기 위해 사전 규격 공개, 공고 기간 준수, 서류 심사 등 엄격한 절차를 거치므로 필연적으로 조달 리드타임이 길어집니다.", "source": null}, {"num": 27, "category1": "3. 경쟁적 공공조달 방법", "category2": "1. 일반경쟁", "question": "우리나라의 국가계약법령 체계에서 명시적으로 규정하여 운영 중인 '3대 경쟁입찰 방식'을 가장 올바르게 묶은 것은?", "options": ["불특정 다수를 대상으로 하는 공개경쟁입찰, 협상을 통해 낙찰자를 정하는 협상경쟁입찰, 종합 심사를 거치는 종합경쟁입찰", "가장 널리 쓰이는 일반경쟁입찰, 특정 조건을 갖춘 자로 제한하는 제한경쟁입찰, 발주자가 직접 업체를 지정하는 지명경쟁입찰", "특정 지역 업체로 한정하는 지역경쟁입찰, 지식재산권을 보호하기 위한 특허경쟁입찰, 다수의 공급자를 등록하는 다수공급자경쟁입찰", "예산 절감을 최우선으로 하는 최저가경쟁입찰, 물품의 규격을 심사하는 규격경쟁입찰, 협상 절차를 포함하는 복합경쟁입찰"], "answer": 2, "explanation": "* 정답 (②): 법령상 경쟁입찰의 기본 형태는 참가 자격을 제한하지 않는 '일반경쟁'을 원칙으로 하며, 예외적인 요건을 충족할 경우 '제한경쟁' 및 '지명경쟁'을 허용하고 있습니다.", "source": null}, {"num": 28, "category1": "3. 경쟁적 공공조달 방법", "category2": "1. 일반경쟁", "question": "공공기관의 계약담당자가 특정 업체와의 수의계약 유혹을 뿌리치고 원칙에 따라 '경쟁입찰' 방식을 채택했을 때 실무적으로 얻을 수 있는 기대 효과와 가장 거리가 먼 것은?", "options": ["발주기관의 재량권이 대폭 확대되어, 계약 체결 이후 상황 변화에 따라 과업지시서를 임의로 변경하거나 계약 조건을 발주자에게 유리하게 수정하는 등 계약변경의 자유가 완벽히 보장된다.", "다수 업체의 치열한 투찰 가격 경쟁을 통해 시장의 합리적이고 객관적인 시장 가격(Market Price)이 자연스럽게 형성되고, 결과적으로 국고 예산이 눈에 띄게 절감된다.", "다수의 예비 공급자 간의 선의의 기술 및 품질 경쟁을 유도하여, 더 뛰어난 기술력과 우수한 납품 역량을 갖춘 숨은 우량 공급자를 발굴하고 산업계 전반을 자극하고 촉진한다.", "입찰 공고부터 적격심사, 최종 낙찰자 선정까지의 전 과정이 시스템을 통해 외부로 명명백백히 공개되므로 공공조달 행정 전반의 객관성과 대국민 투명성이 강력하게 강화된다."], "answer": 1, "explanation": "* 정답 (①): 경쟁입찰은 사전에 확정하여 공고한 과업지시서와 계약 조건에 따라 투찰이 이루어지므로, 낙찰 후 기관이 임의로 과업을 변경하는 행위는 탈락한 타 업체의 기득권을 침해하는 위법 행위가 될 수 있어 오히려 계약 변경이 엄격히 통제됩니다.", "source": null}, {"num": 29, "category1": "3. 경쟁적 공공조달 방법", "category2": "1. 일반경쟁", "question": "누구나 참여할 수 있는 '일반경쟁입찰' 방식이 지니는 구조적 단점 및 위험 요소로 가장 타당한 것은?", "options": ["기회균등 원칙 탓에 행정의 공평성이 심각하게 저해된다.", "조달 절차가 투명하여 담당자의 통제력이 상실된다.", "부실업체의 참여로 과당경쟁 및 품질 저하가 우려된다.", "다수 업체 참여로 염가 계약이 체결되어 예산이 낭비된다."], "answer": 3, "explanation": "* 정답 (③): 일반경쟁은 무분별한 부실업자 진입으로 인한 품질 저하 및 과당경쟁 위험이 가장 큰 단점으로 지적됩니다.", "source": null}, {"num": 30, "category1": "3. 경쟁적 공공조달 방법", "category2": "1. 일반경쟁", "question": "국가계약법령에 따라 발주기관이 선택할 수 있는 합법적인 정규 '경쟁입찰의 방법(방식)'에 해당하지 않는 것은?", "options": ["능력이 검증된 5인 이상을 지명하는 지명경쟁입찰", "특정 객관적 실적으로 문턱을 높이는 제한경쟁입찰", "불특정 다수에게 기회를 개방하는 일반경쟁입찰", "온라인 경매로 실시간 최저가를 찾는 복수경쟁입찰"], "answer": 4, "explanation": "* 정답 (④): 국가계약법상의 원칙적인 입찰 방식은 일반경쟁, 제한경쟁, 지명경쟁 등이며 '복수경쟁입찰'이라는 법적 분류는 존재하지 않습니다.", "source": null}, {"num": 31, "category1": "3. 경쟁적 공공조달 방법", "category2": "1. 일반경쟁", "question": "공공조달의 원칙적 방법인 '일반경쟁입찰'이 지니는 장단점에 대한 객관적 평가로 부적절하게 서술된 것은?", "options": ["자격 미달 부실업체가 덤핑 투찰로 낙찰될 경우 심각한 계약 불이행 및 품질 저하 위험을 내포한다.", "복잡한 적격자 선별 절차가 생략되어 공고부터 낙찰까지 행정 절차가 간소화되고 업무 부담이 준다.", "다수 업체가 치열한 가격 경쟁을 벌여 예산 낭비를 막고 목적물을 염가에 구매할 가능성이 커진다.", "모든 입찰 희망자에게 참가 자격을 폭넓게 부여하므로 공평성이 보장되고 대국민 신뢰도가 높아진다."], "answer": 2, "explanation": "* 정답 (②): 일반경쟁은 제한이 없어 참가자가 폭증할 수 있으며, 이로 인해 제출된 서류 검토 및 심사 대상이 늘어나 오히려 행정 절차가 복잡해진다는 것이 큰 단점입니다.", "source": null}, {"num": 32, "category1": "3. 경쟁적 공공조달 방법", "category2": "1. 일반경쟁", "question": "공공계약의 일반 원칙 및 입찰 진행 절차에 대한 설명으로 가장 옳은 것은?", "options": ["청렴계약을 위반한 경우 국가 안보 등과 무관하게 모든 계약을 해제해야 한다.", "사업자등록증 등 고유번호증 서류 제출만으론 입찰참가자격이 자동 부여된다.", "국가계약법령상 공공계약 체결 시 기본적으로 적용해야 하는 방식은 일반경쟁이다.", "경쟁입찰은 단 1인의 유효한 입찰 참가자만 있어도 정상적으로 입찰이 성립된다."], "answer": 3, "explanation": "정답 (③) 일반경쟁입찰이 원칙임 / ① 국가안보 등 예외 시 유지 가능 / ② 추가 요건(면허 등) 필요 / ④ 2인 이상 유효입찰 필요", "source": "계약법 제7조"}, {"num": 33, "category1": "3. 경쟁적 공공조달 방법", "category2": "2. 제한경쟁", "question": "[상황] 계약담당공무원이 '평소 친분이 있는 업체와 계약하고 싶다'는 이유로 제한경쟁입찰의 참가자격을 좁게 설정하려 한다. 이 사유의 적법성에 대한 평가로 가장 적절한 것은?", "options": ["적법 여부는 계약금액에 따라 달라진다", "적법하다. 담당자의 재량으로 자유롭게 정할 수 있다", "적법하지 않다. 개인적 선호는 제한경쟁의 적법한 사유가 될 수 없으며 공정성을 해치는 행위이다", "적법하다. 특수 기술 요건과 동일하게 취급된다"], "answer": 3, "explanation": "* 정답 (③): 담당자의 개인적 선호는 제한경쟁의 적법한 사유가 될 수 없으며, 특수기술·설비 요구, 추정가격 기준 등 법령상 인정되는 사유만 정당함.", "source": "국가계약법 시행령 제21조"}, {"num": 34, "category1": "3. 경쟁적 공공조달 방법", "category2": "2. 제한경쟁", "question": "일반경쟁의 단점을 보완하기 위해 도입된 '제한경쟁입찰' 제도의 법적 기준과 운영 원칙에 대한 설명으로 올바른 것은?", "options": ["중소기업 보호를 위해 고시금액 이하일 때만 영업소 소재지로 지역제한을 적용할 수 있다.", "발주기관 임의로 2개 이상의 제한 기준(실적+지역 등)을 무제한으로 중복 적용할 수 있다.", "일반경쟁의 부실업자 진입 단점을 보완하고 우량 업체의 경쟁을 유도하기 위한 제도이다.", "특혜 시비를 차단하기 위해 실적 제한과 지역 제한을 동일 공고에 중복하는 것이 원칙이다."], "answer": 3, "explanation": "* 정답 (③): 실적 및 지역 제한은 원칙적으로 중복 금지되며(특수 예외 있음), 지역제한은 고시금액 '미만(이하 아님)'일 경우에만 적용할 수 있습니다.", "source": null}, {"num": 35, "category1": "3. 경쟁적 공공조달 방법", "category2": "2. 제한경쟁", "question": "일반경쟁 단점을 보완하기 위해 고안된 '제한경쟁입찰' 제도의 법적·실무적 의의를 가장 정확하게 서술한 것은?", "options": ["특정 업체 5인 이내만을 직접 지명하여 행정 소요일수를 획기적으로 단축하는 편의적 제도이다.", "전국 단위로 개방하되 지역 업체의 투찰 금액을 일정 비율 할인해 주는 지역 상생 유인 제도이다.", "신규 영세 업체의 진입을 유도하여 과당경쟁 부작용을 원천 해소하기 위한 특별 예외 제도이다.", "부실업자 진입을 막고 우량 업체의 경쟁을 유도하는 일반과 지명경쟁의 중간적 보완 제도이다."], "answer": 4, "explanation": "* 정답 (④): 제한경쟁입찰은 부실업체 진입(일반경쟁 단점)을 막고, 특혜 시비(지명경쟁 단점)를 줄이면서 일정 기준을 갖춘 다수의 경쟁을 유도하는 중간적 성격의 제도입니다.", "source": null}, {"num": 36, "category1": "3. 경쟁적 공공조달 방법", "category2": "2. 제한경쟁", "question": "지역제한 등 제한경쟁입찰의 적용 기준에 대한 설명으로 가장 옳은 것은?", "options": ["국가기관의 지역제한은 고시금액 이상인 대규모 계약에 한정하여 엄격히 적용한다.", "지자체가 물품제조실적으로 제한할 경우 그 기준은 행안부 고시금액 미만일 때이다.", "지역제한 참가자는 입찰 공고일 하루만 해당 본점소재지를 유지하면 자격이 인정된다.", "산업표준화법상 KS인증이나 우수단체표준인증 제품 등으로 입찰 참가자격을 제한할 수 있다."], "answer": 4, "explanation": "정답 (④) 품질 확보를 위해 인증 제품으로 제한 가능함 / ① 고시금액 미만 적용 / ② 고시금액 이상 / ③ 계약체결일까지 유지", "source": "계약법 시행령"}, {"num": 37, "category1": "3. 경쟁적 공공조달 방법", "category2": "2. 제한경쟁", "question": "정부계약 제한경쟁입찰의 실적 및 자격 제한에 대한 설명으로 가장 옳은 것은?", "options": ["국가기관이 실적으로 자격을 제한할 때는 계약목적물 규모의 1배 이내로 제한해야 한다.", "농공단지 입주업체가 생산한 물품으로 참가자격을 제한하는 것은 법령상 전면 금지된다.", "중소기업자간 제한경쟁 진행 시 타 법령에 명시된 제한 요건을 추가로 중복할 수 없다.", "지역제한 대상자의 본점소재지는 입찰 당일에만 요건을 충족하면 유효하게 인정받는다."], "answer": 1, "explanation": "정답 (①) 과도한 진입장벽 방지를 위해 실적 제한은 1배 이내로 함 / ② 제한 가능 / ③ 중복 제한 가능 / ④ 계약일까지 유지", "source": "계약법 시행령"}, {"num": 38, "category1": "3. 경쟁적 공공조달 방법", "category2": "3. 지명경쟁", "question": "[상황] 한 담당자가 '지명경쟁입찰은 담당자가 신뢰하는 업체를 미리 골라 부르는 방식이라 오히려 공정성 시비가 적다'고 주장했다. 이 주장에 대한 평가로 가장 적절한 것은?", "options": ["옳지 않다. 지명 과정에서 담당자의 주관이 개입될 소지가 있어 오히려 일반경쟁입찰보다 공정성 시비 가능성이 높다", "옳다. 지명경쟁은 원칙적 계약방법이라 문제되지 않는다", "지명경쟁과 공정성은 서로 무관한 개념이다", "옳다. 지명 절차가 있으므로 공정성 시비가 적다"], "answer": 1, "explanation": "* 정답 (①): 지명 과정에서 담당자의 주관이 개입될 소지가 있어, 지명경쟁은 오히려 일반경쟁입찰보다 공정성 시비 가능성이 높음.", "source": null}, {"num": 39, "category1": "3. 경쟁적 공공조달 방법", "category2": "3. 지명경쟁", "question": "발주기관이 특정 업체를 직접 지정하는 '지명경쟁입찰' 제도의 특징과 주의사항에 대한 설명으로 틀린 것은?", "options": ["유효 경쟁자가 10인 이내 소수일 경우 적용하는 등 제한경쟁입찰과는 뚜렷한 차이가 있다.", "수의계약 대상이라도 특혜 시비를 줄이기 위해 지명경쟁입찰로 전환하여 집행할 수 있다.", "특혜 시비를 없애기 위해 계약담당자는 사적 지인이 추천하는 업체를 우선적으로 지명해야 한다.", "원칙적으로 5인 이상을 지명해야 하며, 최소 2인 이상이 참가해야 유효한 입찰로 성립된다."], "answer": 3, "explanation": "* 정답 (③): 지명경쟁은 객관적인 기준과 협의를 통해 대상을 지명해야 하며, 사적 지인의 추천을 받아 지명하는 것은 심각한 특혜 및 유착 비리입니다.", "source": "국가계약법 시행령 제23조"}, {"num": 40, "category1": "3. 경쟁적 공공조달 방법", "category2": "3. 지명경쟁", "question": "지명경쟁입찰의 성립 요건 및 절차에 대한 설명으로 가장 옳은 것은?", "options": ["지명경쟁입찰은 5인 이상 지명하되 실제 입찰참가신청은 단 1인만 있어도 성립한다.", "수의계약 요건을 충족하는 대상 사업은 지명경쟁입찰 방식을 적용하는 것이 금지된다.", "관련 요건에 해당할 경우 입찰대상자가 10인 이내일 때 지명경쟁입찰에 부칠 수 있다.", "지명경쟁입찰로 체결한 모든 계약은 감사원에 대한 통지 의무가 완전히 면제되어 있다."], "answer": 3, "explanation": "정답 (③) 성질상 10인 이내인 경우 지명경쟁 가능 / ① 2인 이상 참가 필요 / ② 수의계약 대상도 지명 가능 / ④ 통지 의무 있음", "source": "국가계약법 시행령 제23조 및 제24조"}, {"num": 41, "category1": "4. 비경쟁적 공공조달 방법", "category2": "1. 수의계약", "question": "[상황] 예상치 못한 태풍으로 시설물이 붕괴되어 경쟁에 부칠 시간적 여유가 없이 즉시 복구가 필요한 상황이다. 이 경우 활용할 수 있는 계약방법으로 가장 적절한 것은?", "options": ["수의계약", "일반경쟁입찰", "지명경쟁입찰", "2단계 경쟁입찰"], "answer": 1, "explanation": "* 정답 (①): 천재지변 등으로 경쟁에 부칠 여유가 없는 긴급한 경우는 수의계약이 가능한 대표적 사유임.", "source": "국가계약법 시행령 제26조"}, {"num": 42, "category1": "4. 비경쟁적 공공조달 방법", "category2": "1. 수의계약", "question": "특허권 등 배타적 권리를 보유한 업체가 시장에 객관적으로 단 하나만 존재해 그 업체와 수의계약을 체결하는 경우를 가리키는 용어는?", "options": ["단독공급원(Sole Source) 조달", "일반경쟁 조달", "제한경쟁 조달", "단일공급원(Single Source) 조달"], "answer": 1, "explanation": "* 정답 (①): 단독공급원(Sole Source) 조달은 특허·저작권 등으로 공급 가능한 업체가 객관적으로 하나뿐인 경우를 말함.", "source": null}, {"num": 43, "category1": "4. 비경쟁적 공공조달 방법", "category2": "1. 수의계약", "question": "[상황] 시장에 여러 경쟁업체가 존재함에도, 시간적 여유가 없는 긴급한 재해 복구를 이유로 그중 한 업체를 선정해 수의계약을 체결했다. 이러한 조달방식을 가리키는 용어는?", "options": ["단일공급원(Single Source) 조달", "지명경쟁입찰", "단독공급원(Sole Source) 조달", "일반경쟁입찰"], "answer": 1, "explanation": "* 정답 (①): 단일공급원(Single Source) 조달은 경쟁자가 존재함에도 긴급성 등 특별한 사유로 특정 업체 하나를 선택하는 경우를 말하며, 공급자 자체가 하나뿐인 단독공급원과 구분됨.", "source": null}, {"num": 44, "category1": "4. 비경쟁적 공공조달 방법", "category2": "1. 수의계약", "question": "[상황] 발주기관이 '경쟁 절차 없이 특정 업체를 직접 선정해 계약을 체결'하려 한다. 이 방식이 속하는 범주로 옳은 것은?", "options": ["경쟁적 조달 방법(일반경쟁의 일종)", "경쟁적 조달 방법(제한경쟁의 일종)", "비경쟁적 조달 방법(수의계약)", "경쟁적 조달 방법(2단계 경쟁입찰의 일종)"], "answer": 3, "explanation": "* 정답 (③): 경쟁 절차 없이 특정 업체를 직접 선택하는 방식은 비경쟁적 조달 방법인 수의계약에 해당함.", "source": null}, {"num": 45, "category1": "4. 비경쟁적 공공조달 방법", "category2": "1. 수의계약", "question": "[상황] 발주기관이 총 2억원 규모의 사업을 5천만원짜리 계약 4건으로 나누어, 각각 수의계약 가능 금액 이하로 맞춰 체결하려 한다. 이 계획에 대한 평가로 가장 적절한 것은?", "options": ["적절하다. 기관장 승인만 받으면 항상 가능하다", "적절하다. 소액으로 나누면 예산 절감에 도움이 된다", "적절하지 않다. 수의계약 한도에 맞추기 위한 인위적 사업 분할은 관련 법령상 엄격히 금지된다", "적절하다. 소액 사업은 분할이 예외적으로 항상 허용된다"], "answer": 3, "explanation": "* 정답 (③): 수의계약 제도 남용을 막기 위해, 사업을 인위적으로 분할해 수의계약 한도에 맞추는 행위는 법령상 엄격히 금지됨.", "source": null}, {"num": 46, "category1": "4. 비경쟁적 공공조달 방법", "category2": "1. 수의계약", "question": "국가계약법 시행령에 근거할 때, 원칙적인 경쟁입찰을 배제하고 예외적으로 '수의계약(Private Contract)'을 합법적으로 체결할 수 있는 사유에 해당하는 것은?", "options": ["시중에서 쉽게 구할 수 있는 범용적이고 표준화된 규격의 일반 사무용품을 기관 운영을 위해 대량으로 일괄 구매하고자 하는 경우", "집중호우로 극심한 수해를 입은 지방자치단체가 이재민 구호와 무너진 제방의 긴급 복구를 위해 즉시 투입할 자재를 구매하는 경우", "규격과 품질이 확정된 단일 품목의 대규모 물량을 장기간에 걸쳐 정기적이고 반복적으로 특정 업체로부터 납품받아 구매해야 하는 경우", "조달 시장에 해당 품목을 전문적으로 취급하는 다수의 유력한 공급업체가 존재하여 업체 간 기술 및 가격 경쟁이 치열하게 벌어지는 경우"], "answer": 2, "explanation": "* 정답 (②): 천재지변, 감염병 확산, 긴급 재난 복구 등 시간적 여유가 없어 입찰 공고를 거칠 수 없는 긴박한 상황은 수의계약의 대표적인 합법적 사유입니다.", "source": null}, {"num": 47, "category1": "4. 비경쟁적 공공조달 방법", "category2": "1. 수의계약", "question": "비경쟁적 공공조달 방식인 '수의계약'이 지니는 장점과 단점에 대한 설명으로 가장 논리적이지 않은 것은?", "options": ["복잡한 입찰 공고 및 적격심사 절차가 생략되어 행정 소요 기간이 획기적으로 단축되므로, 국가적 비상사태 등 긴급한 상황에서 신속한 조달이 가능하다.", "다수 업체의 치열한 경쟁을 원천적으로 배제하므로 시장 가격 변동에 따른 과도한 비용 지불 가능성과 특정 기업에 대한 특혜 시비가 필연적으로 발생할 수 있다.", "다수의 유망한 예비 공급자 간의 기술 및 가격 경쟁을 자연스럽게 유도하여 공공서비스의 질을 단기간에 혁신적으로 대폭 끌어올릴 수 있는 긍정적 효과가 있다.", "국가 안보 등 보안이 강하게 요구되는 민감한 사안에 대해 외부로의 정보 유출을 막고, 사전에 철저히 검증된 업체와 안정적인 거래 관계를 유지할 수 있다."], "answer": 3, "explanation": "* 정답 (③): 다수 공급자 간의 기술 및 품질 경쟁을 유도하여 서비스의 질을 끌어올리는 것은 수의계약이 아닌 '경쟁입찰' 체제에서 기대할 수 있는 장점입니다.", "source": null}, {"num": 48, "category1": "4. 비경쟁적 공공조달 방법", "category2": "1. 수의계약", "question": "발주기관의 계약담당자가 경쟁입찰 대신 수의계약 방식으로 조달을 집행할 때, 훗날의 감사나 분쟁에 대비하여 법적·행정적으로 반드시 확보해 두어야 할 가장 중요한 사항은?", "options": ["수의계약을 통해 체결된 계약 단가가 시장 평균가 대비 명백히 저렴하여 예산 절감에 기여했음을 증명할 수 있는 타사 대비 최저가격 입증 서류", "과업 수행에 필요한 계약 기간이 적정하게 산정되었는지, 그리고 해당 업체가 기한 내에 과업을 완수할 물리적 능력이 있는지를 증명하는 서류", "수의계약 대상자로 선정된 특정 공급자가 관련 산업 및 조달 시장 내에서 독보적인 기술력과 우월적 지위를 차지하고 있음을 보여주는 실적 증명", "해당 조달 건을 경쟁입찰에 부치지 못하고 부득이하게 수의계약으로 진행해야만 했던 합법적인 적용 사유에 대한 객관적인 근거 자료 및 내부 기록"], "answer": 4, "explanation": "* 정답 (④): 수의계약은 원칙에 대한 중대한 예외 적용이므로, 반드시 해당 법령에 부합하는 명백한 사유와 객관적 증빙 서류를 남겨야 합니다.", "source": null}, {"num": 49, "category1": "4. 비경쟁적 공공조달 방법", "category2": "1. 수의계약", "question": "원칙적인 경쟁입찰의 틀을 깨고, 국가계약법 시행령에 근거하여 예외적으로 1인과의 '수의계약'을 합법적으로 집행할 수 있는 정당한 사유에 해당하지 않는 것은?", "options": ["조달 업무 담당자의 과도한 행정적 서류 부담을 일거에 해소하고, 과거에 여러 차례 문제없이 거래해 오던 익숙한 특정 업체와의 원활하고 지속적인 우호 협력 관계를 유지하고자 수의계약을 맺는 경우", "특정 기업이 조달 대상물에 대한 원천 특허, 실용신안 등 배타적 지식재산권을 온전히 보유하고 있어, 현실적으로 다른 대체 업체로부터 동일한 물품이나 기술을 조달받는 것이 원천적으로 불가능한 경우", "태풍, 지진 등 천재지변이나 국가적 감염병 확산 등 초유의 긴급한 재난 상황이 발생하여, 국민의 생명과 안전을 지키기 위해 신속한 구호 및 복구 물자가 즉각적으로 필요한 경우", "해당 조달 대상물을 생산하거나 공급할 수 있는 자격을 갖춘 조달기업이 시장에 단 하나만 존재하거나, 고도의 국방 안보상 기밀 유지를 위해 특정 업체와 수의계약을 맺는 것이 국가에 명백히 유리하다고 판단되는 경우"], "answer": 1, "explanation": "* 정답 (①): 담당자의 행정 편의주의나 특정 업체와의 친분, 거래 관행을 이유로 한 수의계약 체결은 관련 법규 위반이며 심각한 특혜 및 유착 비리로 처벌받을 수 있는 대표적 부적절 사례입니다.", "source": null}, {"num": 50, "category1": "4. 비경쟁적 공공조달 방법", "category2": "1. 수의계약", "question": "국가 재정을 집행함에 있어 수의계약 방식을 무리하게 적용하기에 가장 부적절하여, 훗날 특정 업체에 대한 감사 및 특혜 시비가 발생할 소지가 가장 다분한 사례는?", "options": ["집중호우로 크게 유실된 하천 제방을 장마철이 본격적으로 시작되기 전 신속히 원상 복구하기 위해 불가피하게 투입되는 긴급 재난 구호 건설 공사", "국가정보원이나 국방부 등에서 국가 안보와 직결되어 세부 제원이나 수량이 외부 적대 세력에게 절대 유출되어서는 안 되는 고도의 특수 방산장비 구매", "시장에 대체품이 존재하고 다수 업체의 경쟁이 충분히 가능한 범용 품목임에도 불구하고, 단지 발주 편의를 위해 과거 거래 실적이 있는 특정 기업과 체결하는 반복적 계약", "기관 내부의 핵심 행정망 서버 교체 시 기존 구축된 데이터베이스 시스템과의 호환성 문제로 인해 대체 기술이나 호환 가능 소프트웨어가 전혀 없는 독점 전문 시스템의 도입"], "answer": 3, "explanation": "* 정답 (③): 경쟁이 가능한 품목을 명확한 법적 사유 없이 행정 편의를 위해 특정 기업과 지속적으로 수의계약하는 것은 공정성을 크게 훼손하는 행위입니다.", "source": null}, {"num": 51, "category1": "4. 비경쟁적 공공조달 방법", "category2": "1. 수의계약", "question": "경쟁입찰을 실시하였으나 원활한 낙찰자가 선정되지 않아, 예외적으로 '수의계약'으로 전환할 수 있는 사유 중 틀린 것은?", "options": ["낙찰자가 결정되었으나 정당한 사유 없이 기일 내에 계약을 체결하지 않아 사업이 지연되는 경우", "1차 입찰자가 1인뿐이며, 재공고 시에도 참가 자격을 갖춘 자가 1인뿐임이 명백히 인정되는 경우", "1순위자가 적격심사 점수 미달로 탈락할 경우, 차순위자 심사를 생략하고 즉시 수의계약으로 전환하는 경우", "재공고 입찰에 부친 경우로서 입찰에 참여한 자가 없거나 조건을 만족하는 유효한 낙찰자가 없는 경우"], "answer": 3, "explanation": "* 정답 (③): 1순위자가 적격심사에서 탈락하면 즉시 수의계약으로 넘어가는 것이 아니라, 차순위자(2순위, 3순위 순)를 대상으로 적격심사를 계속 실시해야 합니다.", "source": null}, {"num": 52, "category1": "4. 비경쟁적 공공조달 방법", "category2": "1. 수의계약", "question": "국가계약법령에 따라 경쟁입찰의 예외로서 '수의계약'을 체결할 수 있는 법적 요건에 해당하지 않는 것은?", "options": ["물품 제조·구매 시 사전에 적절한 규격이나 과업지시서 작성이 곤란한 경우", "긴급 상황 등으로 인해 경쟁에 부칠 여유가 없거나 목적 달성이 곤란한 경우", "특정인의 기술이 필요하거나 물품 생산자가 단 1인뿐이라 경쟁이 불가한 경우", "중소기업자가 직접 생산한 제품을 해당 기업으로부터 예외적으로 구매하는 경우"], "answer": 1, "explanation": "* 정답 (①): '미리 적절한 규격 등의 작성이 곤란한 경우'는 수의계약이 아니라, 먼저 규격(제안)을 받아 심사하는 **'2단계 경쟁입찰'**의 적용 대상입니다. (나머지는 모두 수의계약 사유)", "source": null}, {"num": 53, "category1": "4. 비경쟁적 공공조달 방법", "category2": "1. 수의계약", "question": "수의계약 가능 대상 및 운영 규정에 대한 설명으로 가장 옳은 것은?", "options": ["소프트웨어 품질인증(GS)을 받은 중소기업 제품은 원칙적으로 수의계약 대상이 아니다.", "우수조달공동상표로 지정된 물품이라도 수의계약을 체결할 수 있는 금액 한도가 존재한다.", "수의계약을 체결하려 할 때 반드시 사전 경쟁입찰을 먼저 진행하여 2회 유찰되어야 한다.", "특허나 실용신안을 받은 물품은 별도 용도 검토 없이 무조건 수의계약으로만 체결한다."], "answer": 2, "explanation": "정답 (②) 지정 상표라도 금액 등에 따른 세부 제한이 있음 / ① GS인증 제품 수의 가능 / ③ 여유 없을 시 바로 가능 / ④ 대체 가능성 등 검토 필요", "source": "국가계약법 시행령 제26조"}, {"num": 54, "category1": "4. 비경쟁적 공공조달 방법", "category2": "1. 수의계약", "question": "특정 물품 및 대상자에 대한 수의계약 적용 기준 중 가장 옳은 것은?", "options": ["추정가격 1억 원 이하 물품 구매 시 소기업·소상공인 전용 수의계약을 진행할 수 있다.", "신기술 인증 물품의 수의계약은 연장 신청 없이도 최초 지정 후 최장 6년까지 자동으로 유효하다.", "국가유공자나 장애인 일자리 지원 목적의 계약은 수의계약 진행이 불가능하다.", "수의계약으로 체결한 사안은 감사원 통지 의무가 항상 면제된다."], "answer": 1, "explanation": "정답 (①) 소기업·소상공인 대상 특례 수의계약 가능 / ② 자동 연장이 아니라 별도 절차로 연장해야 최대 6년까지 인정됨 / ③ 지원 목적 수의 가능 / ④ 통지 의무는 항상 면제되지 않음", "source": "국가계약법 시행령 제26조"}, {"num": 55, "category1": "4. 비경쟁적 공공조달 방법", "category2": "1. 수의계약", "question": "유찰 등에 따른 수의계약 전환 요건으로 가장 옳은 것은?", "options": ["재공고입찰이 유찰된 경우에는 반드시 한 번 더 재공고를 한 후 수의계약으로 전환한다.", "경제위기 극복 특례 기간 내에는 최초 입찰에서 1인만 입찰한 경우에도 수의계약이 가능하다.", "입찰 실시 후 수의계약으로 전환할 때 최초 입찰에 정한 모든 조건을 자유롭게 변경할 수 있다.", "추정가격 1억 원 이하의 소액 수의계약은 사유서 등 수의계약 근거서류 비치 의무가 없다."], "answer": 2, "explanation": "정답 (②) 특례 적용 시 1인 입찰 단독 유찰이어도 재공고 없이 수의 전환 가능 / ① 재공고 유찰 시 바로 수의 가능 / ③ 조건 변경 금지 원칙 / ④ 근거 비치해야 함", "source": "국가계약법 시행령 제27조"}, {"num": 56, "category1": "4. 비경쟁적 공공조달 방법", "category2": "1. 수의계약", "question": "재입찰이나 수의계약 전환 시 최초 입찰 조건 중 예외적으로 변경이 허용되는 것은?", "options": ["과업 내용서 및 납품 일자", "입찰서 제출 기한 및 보증금", "입찰 참가 자격 면허 기준", "낙찰자 결정 및 평가 방식"], "answer": 2, "explanation": "정답 (②) 원칙적으로 조건 변경이 금지되나, 원활한 추진을 위해 '기한'과 '보증금'에 한해서만 변경이 허용됨", "source": "국가계약법 시행령 제27조"}, {"num": 57, "category1": "4. 비경쟁적 공공조달 방법", "category2": "2. 소액구매", "question": "[상황] 한 기관이 소모품 등 반복적인 소액 구매마다 정식 입찰 절차를 거치느라 행정 부담이 크다는 문제를 겪고 있다. 이 문제를 해결하기 위해 도입할 수 있는 제도로 가장 적절한 것은?", "options": ["모든 구매를 국제입찰로 전환", "정부구매카드를 활용한 소액구매 절차 도입", "대규모 공사 발주 절차 강화", "특정 대기업과의 장기 전속계약 체결"], "answer": 2, "explanation": "* 정답 (②): 정부구매카드를 활용한 소액구매 절차는 빈번한 소규모 구매의 행정비용·시간을 절감해 업무 효율성을 높이기 위해 도입됨.", "source": null}, {"num": 58, "category1": "4. 비경쟁적 공공조달 방법", "category2": "2. 소액구매", "question": "조달 행정의 효율성을 위해 운영되는 '소액수의계약' 제도의 구체적인 적용 기준 및 운영 방식에 대한 실무적 설명으로 가장 올바른 것은?", "options": ["소액수의계약 제도는 행정의 남용을 막기 위해 대상 물품이나 일반 용역의 추정가격이 1억 원 미만으로 산정된 경우에 한정하여 매우 엄격히 예외적으로만 적용된다.", "견적서 제출을 안내하는 공고문은 견적서 제출 마감일의 전일을 기준으로 기산하여 영업일 기준 최소 5일 이상 나라장터에 공고하여야 한다.", "추정가격이 2천만 원 이상 1억 원 미만이라도 2인 이상의 견적을 받는 다자간 입찰 방식은 원칙적으로 금지된다.", "대상 물품의 추정가격이 2천만 원 이하(특정 요건 충족 시 5천만 원 등 예외 있음)인 소액 조달 건의 경우에는, 지정정보처리장치를 통하지 않고 단일 공급자가 제출한 1인 수기 견적서만으로도 계약 체결이 가능하다."], "answer": 4, "explanation": "* 정답 (④): 소액수의 대상 금액 기준은 추정가격 1억 원 '이하'입니다. 2천만 원 이하는 1인 견적이 가능하지만, 2천만 원 초과~1억 원 이하는 다자간 전자 견적을 원칙으로 합니
