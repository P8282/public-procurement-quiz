<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>공공조달관리사 870제 · 2주 완성 퀴즈</title>
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon_192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon_512.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon_180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<meta name="theme-color" content="#1B2A47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="공공조달관리사">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F1E7;
    --paper-deep:#EDE7D6;
    --card:#FFFFFF;
    --ink:#232017;
    --ink-soft:#453F2E;
    --navy:#1B2A47;
    --navy-2:#2C3E63;
    --seal:#AE342A;
    --seal-deep:#8B2A22;
    --seal-tint:#F6E4E1;
    --gold:#B08A3E;
    --gold-tint:#F6EEDA;
    --gold-text:#8A6216;
    --gold-border:#E6D3A0;
    --num-tint:#E9F1FB;
    --num-text:#2C5C99;
    --num-border:#C7D9F0;
    --correct:#2E6B4F;
    --correct-tint:#E1EDE5;
    --wrong:#AE342A;
    --wrong-tint:#F6E4E1;
    --line:#D9D0B8;
    --line-strong:#C6BA97;
    --shadow: 0 1px 2px rgba(35,32,23,.06), 0 8px 24px -12px rgba(35,32,23,.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 10% -10%, #FBF8EF 0%, transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .bg-rule{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image: repeating-linear-gradient(180deg, transparent, transparent 37px, rgba(199,190,157,.35) 38px);
    opacity:.22;
  }
  #app{position:relative; z-index:1; max-width:560px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}

  /* ---------- Header ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 18px; position:sticky; top:0; z-index:20;
    background:rgba(245,241,231,.92); backdrop-filter:blur(6px);
  }
  /* 퀴즈 화면은 topbar+진행률바를 한 덩어리로 스크롤 고정한다(진행바가 topbar 아래 경계선처럼 항상 붙어있도록) */
  .quiz-header-sticky{ position:sticky; top:0; z-index:20; }
  .quiz-header-sticky .topbar{ position:static; z-index:auto; }
  .topbar-quiz{
    cursor:pointer; border-bottom:none; /* 진행률 바가 하단 경계선 역할을 대신한다 */
  }
  .topbar-quiz:active{ opacity:.8; }
  .topbar:not(.topbar-quiz){ border-bottom:1px solid var(--line); }
  .topbar .brand{
    display:flex; align-items:center; gap:8px; cursor:pointer;
    font-family:'Noto Serif KR', serif; font-weight:900; font-size:15px; color:var(--navy);
    letter-spacing:.2px;
  }
  .brand .mark{
    width:26px; height:26px; border-radius:8px; background:#1B2A47;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .brand .mark svg{ width:16px; height:16px; }
  .topbar .stats-chip{
    font-size:11.5px; color:var(--ink-soft); font-variant-numeric:tabular-nums;
    border:1px solid var(--line-strong); border-radius:999px; padding:4px 10px;
    background:var(--card);
  }
  /* 모바일: 퀴즈 화면 상단바는 앱 제목/로고를 숨기고 현재 챕터명만 표기해 세로 공간을 아낀다 */
  @media (max-width:767px){
    .topbar-quiz .brand{ display:none; }
    .topbar-quiz{ justify-content:center; }
    .topbar-quiz .stats-chip{ font-size:12.5px; font-weight:700; }
  }

  /* ---------- Hero / Cover ---------- */
  .hero{ padding:34px 24px 22px; text-align:center; }
  .hero .kicker{
    font-size:11.5px; letter-spacing:.16em; color:var(--seal); font-weight:700;
    margin-bottom:10px; text-transform:uppercase;
  }
  .hero h1{
    font-family:'Noto Serif KR', serif; font-weight:900; font-size:29px; line-height:1.28;
    margin:0 0 12px; color:var(--navy);
  }
  .hero h1 em{ font-style:normal; color:var(--seal); }

  .exam-schedule{
    display:inline-flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:center;
    background:rgba(27,42,71,.07); border:1.4px solid rgba(27,42,71,.18); border-radius:999px;
    padding:7px 14px; margin:0 0 18px; font-size:11.5px; font-weight:700; color:var(--navy);
  }
  .exam-schedule b{ font-weight:900; }
  .exam-schedule-item{ display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
  .dday-badge{
    background:#1D3154; color:#fff; font-weight:600; font-size:12px;
    border-radius:999px; padding:3px 10px; letter-spacing:.01em; border:none;
  }
  .dday-badge.urgent{ background:var(--seal-deep); }
  .dday-badge.active{ background:var(--correct); } /* 접수중 - 지금 진행 중인 상태를 초록으로 강조 */
  .dday-badge.gold{ background:#A97818; color:#fff; } /* 원서접수 예정 D-day - muted gold */
  .exam-schedule .divider{ width:1px; height:11px; background:rgba(27,42,71,.22); flex-shrink:0; }

  .hero p.sub{ color:var(--ink-soft); font-size:14px; line-height:1.6; margin:0 auto 22px; max-width:340px; }

  .stamp{
    width:104px; height:104px; margin:6px auto 24px; position:relative;
    border:3px solid var(--seal); border-radius:50%;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    transform:rotate(-8deg); color:var(--seal);
    font-family:'Noto Serif KR', serif;
    box-shadow: inset 0 0 0 3px rgba(174,52,42,.12);
  }
  .stamp::before{
    content:""; position:absolute; inset:8px; border:1px solid var(--seal); border-radius:50%; opacity:.55;
  }
  .stamp b{ font-size:22px; font-weight:900; line-height:1; }
  .stamp span{ font-size:9.5px; letter-spacing:.08em; margin-top:3px; font-weight:700; }

  .cover-facts{ display:flex; justify-content:center; gap:22px; margin-bottom:26px; }
  .cover-facts div{ text-align:center; }
  .cover-facts b{ display:block; font-family:'Noto Serif KR',serif; font-size:20px; color:var(--navy); font-weight:900; }
  .cover-facts span{ font-size:10.5px; color:var(--ink-soft); }

  /* ==== 홈 화면 hero 전용 여백 압축 ====
     .hero는 비밀번호/초대코드 화면과 공유하는 클래스라 그 자체는 건드리지 않고,
     .home-hero가 같이 붙어있을 때(홈 화면일 때)만 적용되도록 범위를 좁힌다.
     글자 크기는 그대로 두고 상하 패딩/마진만 줄여서, 브랜드 느낌(제목 존재감,
     시험 일정, D-day, 통계)은 그대로 유지하면서 "빠른 학습" 영역이 더 빨리 보이게 한다. */
  .hero.home-hero{ padding:27px 24px 18px; }
  .home-hero .kicker{ margin-bottom:7px; }
  .home-hero h1{ margin:0 0 9px; }
  .home-hero .exam-schedule{ padding:6px 16px; margin:0 0 13px; }
  .home-hero .cover-facts{ margin-bottom:20px; }

  .btn{
    appearance:none; border:none; cursor:pointer; font-family:'Noto Sans KR', sans-serif;
    font-weight:700; border-radius:10px; transition:transform .12s ease, opacity .12s ease, background .15s ease;
  }
  .btn:active{ transform:scale(.98); }
  .btn-primary{
    background:var(--navy); color:#F5F1E7; font-size:15px; padding:15px 22px; width:100%;
    box-shadow:var(--shadow); letter-spacing:.02em;
  }
  .btn-primary:hover{ background:var(--navy-2); }
  .btn-ghost{
    background:transparent; color:var(--navy); border:1.4px solid var(--line-strong);
    font-size:13px; padding:10px 16px;
  }
  .btn-ghost:hover{ border-color:var(--navy); }
  .btn-review{
    background:var(--seal-tint); color:var(--seal); font-size:12.5px; padding:10px 16px; width:100%;
    border:1.4px solid #E9C2BC; margin-top:10px; letter-spacing:.01em;
  }
  .btn-review:hover{ background:#F0D3CE; }
  .btn-num{
    background:var(--gold-tint); color:var(--gold-text); font-size:13.5px; padding:12px 18px; width:100%;
    border:1.4px solid var(--gold-border); margin-top:10px; letter-spacing:.01em;
  }
  .btn-num:hover{ filter:brightness(.97); }
  /* "⚡ 숫자 뽀개기 전체" / "🔴 취약만"을 세로로 2줄 쌓지 않고 한 줄에 나란히 배치해 공간을 아낀다. */
  .num-title{ margin:14px 0 6px; font-size:12px; font-weight:700; color:var(--ink-soft); text-align:center; }
  .num-title.num-accent{ color:var(--num-text); }
  .num-sub{ margin:-4px 0 8px; font-size:10.5px; color:var(--ink-soft); text-align:center; }
  .num-btn-row{ display:flex; gap:8px; margin-top:0; }
  .num-btn-row .btn-num{ margin-top:0; flex:1; min-width:0; padding:10px; font-size:12px; line-height:1.4; background:var(--num-tint); color:var(--num-text); border-color:var(--num-border); }
  .num-btn-row .btn-num b{ display:block; font-size:12.5px; }
  .review-today-row{ display:flex; gap:8px; }
  .review-today-tile{
    flex:1; border-radius:10px; padding:10px; text-align:center; border:1.4px solid var(--line-strong);
    display:flex; flex-direction:column; gap:2px; appearance:none; font-family:inherit; cursor:default;
  }
  .review-today-tile.weak{ background:var(--seal-tint); border-color:#E9C2BC; cursor:pointer; }
  .review-today-tile.weak:active{ transform:scale(.98); }
  .review-today-tile.review-info{ background:var(--gold-tint); border-color:var(--gold-border); }
  .review-today-tile .rt-icon{ font-size:15px; }
  .review-today-tile .rt-label{ font-size:11px; font-weight:700; color:var(--ink-soft); }
  .review-today-tile.weak .rt-label{ color:var(--seal); }
  .review-today-tile.review-info .rt-label{ color:var(--gold-text); }
  .review-today-tile .rt-count{ font-size:15px; font-weight:900; color:var(--ink); }

  /* ---------- 동기화(로그인/로그아웃) 상태 바 - 홈 화면 상단 상시 노출 ---------- */
  .sync-bar{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:9px 18px; border-bottom:1px solid var(--line); background:var(--paper-deep);
    font-size:11.5px;
  }
  .sync-desc{ color:var(--ink-soft); flex:1; min-width:0; }
  .sync-code-chip{
    color:var(--navy); background:var(--card); border:1px solid var(--line-strong);
    border-radius:999px; padding:5px 12px; font-variant-numeric:tabular-nums; letter-spacing:.02em;
  }
  .sync-code-chip b{ font-family:'Noto Serif KR',serif; }
  .sync-mini-btn{
    appearance:none; cursor:pointer; border-radius:999px; font-size:11px; font-weight:700;
    padding:6px 12px; border:1.2px solid var(--navy); background:var(--navy); color:#fff;
    flex-shrink:0;
  }
  .sync-mini-btn.ghost{ background:transparent; color:var(--ink-soft); border-color:var(--line-strong); }

  /* ---------- Chapter list ---------- */
  .section-wrap{ padding:6px 18px 100px; }
  .section-title{
    font-family:'Noto Serif KR', serif; font-weight:700; font-size:13.5px; color:var(--navy);
    margin:26px 2px 10px; padding-bottom:8px; border-bottom:1px solid var(--line-strong);
    display:flex; align-items:baseline; justify-content:space-between;
  }
  .section-title .cnt{ font-family:'Noto Sans KR',sans-serif; font-weight:500; font-size:11px; color:var(--ink-soft); }

  .chapter-card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; margin-bottom:8px; box-shadow:var(--shadow); cursor:pointer;
    display:flex; align-items:flex-start; gap:10px; text-align:left;
  }
  .chapter-card:active{ transform:scale(.99); }
  .chapter-num{
    font-family:'Noto Serif KR', serif; font-weight:900; font-size:12px; color:var(--navy);
    background:var(--paper-deep); border-radius:8px; min-width:36px; height:36px;
    padding:0 6px; display:flex; align-items:center; justify-content:center; flex-shrink:0; text-align:center;
    letter-spacing:.3px;
  }
  .chapter-info{ flex:1; min-width:0; }
  .chapter-info .name-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:5px; }
  .chapter-info .name{ font-weight:700; font-size:14.5px; color:var(--ink); letter-spacing:-.1px; min-width:0; }
  .expand-btn{
    flex-shrink:0; width:20px; height:20px; border-radius:50%; border:1.4px solid var(--line-strong);
    background:var(--card); color:var(--navy); font-size:13px; font-weight:900; line-height:1;
    display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;
  }
  .expand-btn:active{ transform:scale(.9); }
  .chapter-info .progress-row{ display:flex; align-items:center; gap:8px; }
  .progress-track{ flex:1; height:5px; border-radius:3px; background:var(--paper-deep); overflow:hidden; }
  .progress-fill{ height:100%; background:linear-gradient(90deg, var(--gold), var(--seal)); border-radius:3px; }
  .progress-fill.done{ background:var(--correct); }
  .chapter-info .pct{ font-size:10.5px; color:var(--ink-soft); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .chapter-badge{
    font-size:9.5px; font-weight:700; color:var(--correct); background:var(--correct-tint);
    border-radius:999px; padding:3px 8px; flex-shrink:0; white-space:nowrap;
  }
  .mastery-summary-row{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .mastery-mini{ font-size:10.5px; color:var(--ink-soft); font-weight:600; white-space:nowrap; }
  .subtopic-list{ margin-top:10px; display:flex; flex-direction:column; gap:6px; }
  .subtopic-item{
    display:flex; align-items:center; justify-content:space-between; gap:9px;
    background:var(--paper-deep); border:1px solid var(--line); border-radius:8px;
    padding:9px 11px; text-align:left; cursor:pointer;
  }
  .subtopic-item:active{ transform:scale(.98); }
  .subtopic-item.empty{ opacity:.55; }
  .subtopic-item.empty .subtopic-count{ color:var(--seal); font-weight:700; }
  .subtopic-name{ font-size:12.5px; color:var(--ink); word-break:keep-all; flex:1; min-width:0; }
  .subtopic-count{ font-size:11px; color:var(--ink-soft); white-space:nowrap; font-variant-numeric:tabular-nums; flex-shrink:0; }
  .toc-group{ margin-bottom:16px; }
  .toc-group:last-child{ margin-bottom:4px; }
  .toc-group-title{
    appearance:none; width:100%; background:transparent; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    font-weight:800; font-size:13.5px; color:var(--navy); font-family:'Noto Sans KR',sans-serif;
    margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid var(--line); text-align:left;
  }
  .toc-group-title:active{ opacity:.6; }
  .toc-group-title.empty{ opacity:.55; }
  .toc-group-title.empty .subtopic-count{ color:var(--seal); font-weight:700; }
  .toc-group-name{ flex:1; min-width:0; }

  /* ---------- Quiz screen ---------- */
  .quiz-wrap{ padding:10px 18px calc(40px + env(safe-area-inset-bottom)); flex:1; }
  .quiz-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .quiz-head .crumb{ font-size:12px; color:var(--ink-soft); line-height:1.6; word-break:keep-all; }
  .quiz-head .crumb b{ color:var(--navy); font-size:12.5px; }
  .quiz-head .qno{
    font-family:'Noto Serif KR', serif; font-weight:900; font-size:15px; color:var(--seal);
    white-space:nowrap; margin-left:10px;
  }

  /* 진행률 바: 상단바(topbar) 바로 아래 붙어 하단 경계선처럼 보이도록 한다. 모바일은 얇게, PC(768px+)는 굵게. */
  .progress-bar-top{
    height:3px; background:var(--paper-deep); overflow:hidden; margin:0;
  }
  .progress-bar-top > div{ height:100%; background:var(--seal); transition:width .25s ease; }

  .mastery-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:8px 0 18px; }
  .mastery-label{ font-size:11.5px; font-weight:700; color:var(--seal); white-space:nowrap; }
  .mastery-dots{ display:flex; gap:3.5px; }
  .mastery-dot{ width:8px; height:8px; border-radius:50%; background:var(--line-strong); flex-shrink:0; }
  .mastery-dot.filled{ background:var(--seal); }

  .quiz-split{ display:flex; flex-direction:column; }
  .qmain{ display:flex; flex-direction:column; }
  .qside{ display:flex; flex-direction:column; }
  .qside-placeholder{ display:none; } /* 모바일은 팝업 시트를 쓰므로 자리 표시자가 필요 없다 */
  .qcard{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    box-shadow:var(--shadow); padding:24px 20px 22px; margin-bottom:16px; position:relative;
  }
  .qcard::before{
    content:""; position:absolute; left:0; top:18px; bottom:18px; width:3px; border-radius:3px;
    background:var(--gold); opacity:.55;
  }
  .qtext{
    font-size:17.5px; line-height:1.78; font-weight:500; color:var(--ink);
    white-space:pre-wrap; letter-spacing:-.1px; word-break:keep-all;
  }

  .options{ display:flex; flex-direction:column; gap:12px; margin-top:22px; }
  .option{
    display:flex; align-items:flex-start; gap:12px; text-align:left;
    background:var(--card); border:1.4px solid var(--line-strong); border-radius:11px;
    padding:15px 15px; cursor:pointer; font-size:15.5px; line-height:1.66; color:var(--ink);
    letter-spacing:-.1px; word-break:keep-all;
    transition:border-color .12s ease, background .12s ease, transform .1s ease;
  }
  .option:active{ transform:scale(.96); } /* 요구4: 눌림 효과 강조 */
  .option .num{
    flex-shrink:0; width:24px; height:24px; border-radius:50%; border:1.4px solid var(--line-strong);
    display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; color:var(--ink-soft);
    font-family:'Noto Serif KR',serif; margin-top:1px; position:relative;
  }
  .option.selectable:hover{ border-color:var(--navy); }
  .option.correct{ border-color:var(--correct); background:var(--correct-tint); }
  .option.correct .num{ border-color:var(--correct); background:var(--correct); color:#fff; }
  /* 요구4: 정답 표시에 체크(✔) 가상요소 추가 */
  .option.correct .num::after{
    content:"✔"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:12px; color:#fff; background:var(--correct); border-radius:50%;
  }
  .option.wrong{ border-color:var(--wrong); background:var(--wrong-tint); }
  .option.wrong .num{ border-color:var(--wrong); background:var(--wrong); color:#fff; }
  .option.dim{ opacity:.62; }

  .feedback{
    margin-top:18px; border-radius:11px; padding:16px 16px; font-size:14.5px; line-height:1.8;
    display:none; animation:fadeIn .2s ease; letter-spacing:-.1px; word-break:keep-all;
  }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(-3px);} to{opacity:1; transform:translateY(0);} }
  .feedback.show{ display:block; }
  .feedback.ok{ background:var(--correct-tint); color:#204636; border:1px solid #BFDBCB; }
  .feedback.no{ background:var(--wrong-tint); color:#6E211A; border:1px solid #E9C2BC; }
  .feedback .fb-head{ font-weight:800; font-size:14px; margin-bottom:9px; display:flex; align-items:center; gap:6px; }
  .feedback .fb-body{ color:var(--ink); opacity:1; white-space:pre-wrap; }
  .feedback .fb-source{ margin-top:11px; font-size:12.5px; color:var(--ink-soft); border-top:1px dashed var(--line-strong); padding-top:9px; }

  .nav-row{ display:flex; gap:10px; margin-top:22px; }
  .nav-btn{
    flex:1; background:var(--card); border:1.4px solid var(--line-strong); border-radius:10px;
    padding:15px; font-size:15px; font-weight:700; color:var(--navy); cursor:pointer;
  }
  .nav-btn:disabled{ opacity:.35; cursor:default; }
  .nav-btn.primary{ background:var(--navy); color:#F5F1E7; border-color:var(--navy); }
  .nav-btn.primary:not(:disabled){ box-shadow:0 2px 10px -2px rgba(27,42,71,.45); }

  .inline-stats{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:16px; font-size:11.5px; color:var(--ink-soft); white-space:nowrap;
  }

  .keyhint{ text-align:center; font-size:10.5px; color:var(--ink-soft); margin-top:12px; letter-spacing:.02em; }

  /* ---------- 해설 하단 시트 ---------- */
  .sheet-dim{
    position:fixed; inset:0; z-index:40; background:rgba(35,32,23,.42);
    animation:dimIn .18s ease;
  }
  @keyframes dimIn{ from{opacity:0;} to{opacity:1;} }
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:41; max-width:560px; margin:0 auto;
    background:var(--card); border-top-left-radius:20px; border-top-right-radius:20px;
    box-shadow:0 -8px 30px -8px rgba(35,32,23,.35);
    display:flex; flex-direction:column; max-height:82vh;
    animation:sheetUp .22s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes sheetUp{ from{transform:translateY(100%);} to{transform:translateY(0);} }
  .sheet .grip{
    width:38px; height:4px; border-radius:3px; background:var(--line-strong);
    margin:7px auto 3px; flex-shrink:0;
  }
  .sheet .sheet-head{
    display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 14px 10px 20px;
    font-weight:800; font-size:18px; flex-shrink:0;
    border-bottom:1px solid var(--line);
  }
  .sheet .sheet-head.ok{ color:var(--correct); }
  .sheet .sheet-head.no{ color:var(--wrong); }
  .sheet-tip{ display:none; } /* 모바일은 패널 클릭 시 다음으로 넘어가는 기능이 없어 안내 자체가 불필요 */
  /* 요구4: 모바일 해설 시트 우측 상단 ✕ 닫기 버튼 */
  .sheet-close-x{
    appearance:none; border:none; background:var(--paper-deep); color:var(--ink-soft);
    width:30px; height:30px; border-radius:50%; font-size:14px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .sheet-close-x:active{ transform:scale(.9); }
  .sheet .sheet-body{
    padding:12px 20px 4px; overflow-y:auto; -webkit-overflow-scrolling:touch;
    font-size:17px; line-height:1.75; color:var(--ink);
    white-space:pre-wrap; word-break:keep-all; letter-spacing:-.1px;
    flex:1; min-height:0; /* flex 자식은 기본적으로 내용보다 안 작아지려 해서, 이게 없으면 overflow-y:auto가
                              카드 안에서 스크롤되는 대신 카드 자체가 늘어나 페이지 전체가 길어진다 */
  }
  .sheet .sheet-src{
    margin-top:8px; padding-top:8px; font-size:13.5px; color:var(--ink-soft);
    border-top:1px dashed var(--line-strong);
  }
  .sheet .sheet-foot{
    padding:12px 20px calc(16px + env(safe-area-inset-bottom));
    flex-shrink:0; display:flex; gap:10px; border-top:1px solid var(--line);
    background:var(--card);
  }
  .sheet .sheet-foot .nav-btn{ margin-top:0; }

  /* ---------- Complete screen ---------- */
  .complete-wrap{ padding:40px 24px 60px; text-align:center; }
  .complete-wrap .stamp{ margin-bottom:22px; }
  .complete-wrap h2{ font-family:'Noto Serif KR',serif; font-weight:900; font-size:22px; color:var(--navy); margin:0 0 8px; }
  .complete-wrap p{ color:var(--ink-soft); font-size:13.5px; margin:0 0 26px; }
  .score-row{ display:flex; justify-content:center; gap:26px; margin-bottom:30px; }
  .score-row div{ text-align:center; }
  .score-row b{ display:block; font-family:'Noto Serif KR',serif; font-size:26px; font-weight:900; color:var(--navy); }
  .score-row span{ font-size:10.5px; color:var(--ink-soft); }
  .score-row.wrong-num b{ color:var(--seal); }
  .score-row.correct-num b{ color:var(--correct); }

  ::selection{ background:#E7C9C4; }

  /* ---------- 태블릿/큰 화면: 본문 폭과 글자 크기 소폭 확대 ---------- */
  @media (min-width:820px){
    /* 고정값 대신 화면폭의 92%(상한 1400px)로 — 아이패드10 가로(1180px)든 갤럭시탭 S10+ 가로(1400px)든
       기기가 넓어지면 그만큼 콘텐츠도 같이 넓어져서 여백이 과도하게 남지 않는다. */
    #app{ max-width:min(1400px, 92vw); }
    .qtext{ font-size:19px; line-height:1.82; }
    .sheet-body{ font-size:17.5px; }
    .chapter-info .name{ font-size:16px; }

    /* 홈 화면 전용 반응형 대시보드 레이아웃은 .home-screen 네임스페이스 CSS 블록(파일 하단)에서
       별도로 처리한다. 예전에 여기 있던 "홈 화면도 560px로 고정" 규칙은 태블릿 가로/PC에서 넓은
       대시보드를 쓰기로 하면서 제거했다(문제풀이 화면 레이아웃은 이 블록 그대로 영향 없음). */

    /* 해설 카드 위아래 여백 축소 (태블릿/PC 전용 - 모바일 팝업 시트는 그대로 유지) */
    .sheet .sheet-head{ padding:10px 20px; }
    .sheet-inline-slot .sheet-tip{ padding:4px 20px 0; }
    .sheet-inline-slot .sheet .sheet-body{ padding-top:12px; padding-bottom:6px; line-height:1.7; flex:0 1 auto; }
    /* sheet-body의 flex:1(모바일에선 남는 공간을 채워 스크롤 영역을 만드는 용도)을 데스크톱에서는
       없앤다 - 안 없애면 카드 안에 있는 남는 세로 공간을 sheet-body가 그대로 흡수해서, 마지막
       내용(총 N회 풀이 · 정답률) 밑으로 불필요하게 큰 빈 공간이 생긴다(신고된 버그). */
    .sheet-inline-slot .sheet .sheet-stats-row{ margin-top:10px !important; padding-top:8px !important; }
    .sheet-inline-slot .sheet .sheet-src{ margin-top:8px; padding-top:8px; }
    /* 해설/출처 아래 버튼들(취약문제 지정, 취약문제에서 그만 보기, 오류 신고) 사이 여백도 축소 */
    .sheet-inline-slot #manualWeakBtn{ margin-top:8px !important; padding:8px !important; }
    .sheet-inline-slot #excludeBtn{ margin-top:6px !important; padding:8px !important; }
    .sheet-inline-slot #reportErrorBtn{ margin-top:6px !important; padding:7px !important; }

    /* 진행률 바를 더 굵게 */
    .progress-bar-top{ height:6px; }

    /* 태블릿/PC 듀얼 패널 — 좌(문제+선택지) 70% : 우(해설 전용) 30% (해설이 짧은 편이라 여백 절약)
       nav-row(이전/다음)는 quiz-split의 3번째 그리드 아이템으로 두고, 우측(30%) 컬럼 하단에
       배치해 화면을 스크롤해도 늘 보이는 고정 버튼처럼 만든다. */
    .quiz-split{
      display:grid; grid-template-columns:7fr 3fr; grid-template-rows:auto auto;
      column-gap:24px; align-items:start;
    }
    .qmain{ display:flex; flex-direction:column; grid-column:1; grid-row:1 / span 2; }
    .qside{ grid-column:2; grid-row:2; }

    /* 이전/다음 버튼: 우측 컬럼 맨 위(해설 패널 바로 위)에 고정 배치.
       그리드 안에서 sticky로 처리하니 폭 계산이 필요 없어 훨씬 단순해진다. */
    .quiz-split > .nav-row{
      grid-column:2; grid-row:1;
      position:sticky; top:76px; z-index:2;
      margin-top:0; margin-bottom:12px;
      background:var(--paper); padding:10px; border-radius:14px;
      box-shadow:0 4px 20px -6px rgba(27,42,71,.25);
    }

    /* 해설 다시 보기 버튼: 우측에 해설 패널이 항상 열려있으므로 데스크톱에서는 불필요 */
    #showSheetBtn{ display:none; }

    /* 선택지는 태블릿/PC에서도 항상 1열(세로 나열) 유지 — 절대 2×2로 쪼개지 않는다 */
    .options{ display:flex; flex-direction:column; gap:12px; margin-top:22px; }
    .option{ font-size:16px; padding:16px 17px; }

    /* 해설 전용 우측 사이드 패널: 이전/다음 버튼(우측 컬럼 맨 위) 바로 아래에서 시작한다.
       버튼 높이(약 74px)+간격(12px)만큼 sticky 시작점을 내린다. */
    .qside{
      position:sticky; top:calc(76px + 74px + 12px);
      max-height:calc(100vh - 96px - 74px - 12px);
    }
    .sheet-dim{ display:none !important; } /* 뒷배경 딤처리 없음 */
    .sheet-inline-slot .sheet{
      position:static; max-width:none; width:100%; margin:0; border-radius:14px;
      box-shadow:var(--shadow); max-height:calc(100vh - 96px - 74px - 12px); animation:none; transform:none;
      cursor:pointer; /* 패널 클릭 시 다음 문제로 넘어감을 시각적으로 알림 */
    }
    .sheet-inline-slot .grip{ display:none; }
    /* 태블릿/PC는 해설 패널이 늘 열려있는 고정 영역이라 "닫기" 자체가 불필요 — ✕ 버튼 제거 */
    .sheet-close-x{ display:none; }

    /* 아직 답을 안 골랐을 때, 우측 패널에 보여줄 안내 문구 */
    .qside-placeholder{
      display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
      min-height:220px; border:1.5px dashed var(--line-strong); border-radius:14px;
      color:var(--ink-soft); font-size:13.5px; line-height:1.8; padding:20px;
    }
    .qside-placeholder .tip-line{
      display:inline-block; margin-top:10px; font-size:11.5px; font-weight:700;
      color:var(--seal); background:var(--seal-tint); border-radius:999px; padding:5px 12px;
    }
    /* 태블릿/PC: 답을 이미 골랐는데 해설 패널을 닫아둔 상태일 때, 안내 문구 박스 안에서
       바로 다시 열 수 있도록 하는 버튼(모바일의 #showSheetBtn과 같은 역할, 위치만 다름) */
    .qside-placeholder #showSheetBtnSide{
      margin-top:14px; width:auto; padding:10px 20px; font-size:13px;
    }

    /* 해설 패널을 열었을 때도 상단에 재차 안내(정답/오답 표시 바로 아래) */
    .sheet-tip{
      display:block; padding:8px 20px 0; font-size:11.5px; color:var(--ink-soft);
      flex-shrink:0;
    }

    /* 해설 패널 하단의 "닫고 보기"/"다음 문제" 버튼은 데스크톱에서 중복이라 통째로 숨긴다.
       "닫기"는 위쪽 ✕ 버튼 하나로, "다음"은 좌측 이전 버튼과 짝을 이루는 원래 자리에서 처리한다. */
    /* 우선순위 주의: 기본 규칙이 .sheet .sheet-foot(클래스 2개)라 .sheet-foot(클래스 1개)만으로는
       display:none이 이기지 못했다. 반드시 같은 형태(.sheet .sheet-foot)로 맞춰서 덮어써야 한다. */
    .sheet .sheet-foot{ display:none !important; }

    /* 태블릿/PC에서는 이전·다음 버튼의 색 대비가 커 보인다는 피드백 반영 —
       "다음"의 진한 채움을 걷어내고 테두리+글자색만 네이비로 남겨 자연스러운 한 쌍으로 보이게 한다.
       모바일(768px 미만)은 기존 강조 스타일 그대로 유지. */
    .nav-row .nav-btn.primary{
      background:var(--card); color:var(--navy); border-color:var(--navy);
    }
    .nav-row .nav-btn.primary:not(:disabled){ box-shadow:none; }

    .quiz-wrap{ padding-top:20px; }
  }

  /* kbd-hint는 기본적으로 숨기고, "화면이 넓고(맥북에어 13인치 이상) + 실제 마우스/트랙패드가 있는" 진짜 PC에서만 노출한다.
     맥북에어 13인치(M2/M3) 기본 논리 해상도가 1470px이라 이 값을 기준으로 잡았다.
     아이패드10(가로모드 1180px)는 이 폭보다 좁아 애초에 여기 안 걸리고, 혹시 더 큰 태블릿이 있어도
     터치 전용(hover 없음)이라 결국 여기서 걸러진다.
     단, 아이패드에 블루투스 키보드+트랙패드를 연결하면 hover:hover가 참이 되어 자동으로 다시 뜬다. */
  .kbd-hint{ display:none; }

  /* ---------- PC 최적화 (맥북에어 13인치 기준, 요구6) ---------- */
  @media (min-width:1470px){
    /* 태블릿과 달리 화면비례(vw)를 쓰지 않고 완전 고정값으로 둔다.
       맥북에어 13인치(1470px)에서는 거의 꽉 채우면서(양쪽 여백 15px 수준),
       15인치 노트북이나 외장 모니터처럼 화면이 더 넓어져도 콘텐츠 폭은 여기서 멈춘다
       (본문 지문/선택지가 한없이 넓어지면 오히려 가독성이 떨어지므로). */
    #app{ max-width:1440px; }
  }
  @media (min-width:1470px) and (hover:hover) and (pointer:fine){
    .kbd-hint{
      display:flex; align-items:center; justify-content:center; gap:6px; flex-wrap:wrap;
      margin-top:22px; padding-top:16px; border-top:1px dashed var(--line-strong);
      font-size:12px; color:var(--ink-soft);
    }
    kbd{
      display:inline-block; min-width:22px; padding:3px 7px; text-align:center;
      background:var(--card); border:1px solid var(--line-strong); border-bottom-width:2px;
      border-radius:6px; font-family:'Noto Sans KR',sans-serif; font-size:11px; font-weight:700;
      color:var(--navy); box-shadow:0 1px 0 var(--line-strong);
    }
    /* 요구6: hover 피드백(터치 기기에서는 의미 없으므로 마우스 환경에서만 적용) */
    .chapter-card:hover{ border-color:var(--navy); box-shadow:0 4px 16px -6px rgba(27,42,71,.25); }
    .nav-btn:hover:not(:disabled){ border-color:var(--navy); }
    .nav-btn.primary:hover:not(:disabled){ background:var(--navy-2); }
    /* 이전/다음(nav-row)은 톤다운된 스타일이라 hover도 옅은 배경으로만 강조(진한 채움으로 안 돌아가게) */
    .nav-row .nav-btn.primary:hover:not(:disabled){ background:var(--paper-deep); }
    .btn-review:hover{ background:#F0D3CE; }
    .expand-btn:hover{ border-color:var(--navy); color:var(--navy); }
  }

  /* ================================================================
     홈 화면 전용 대시보드 레이아웃 (.home- 네임스페이스)
     이 블록의 클래스는 renderHome()에서만 쓰이므로 문제풀이 화면에는 영향이 없다.
     기존 .hero/.cover-facts/.chapter-card/.section-wrap 등 기존 클래스는 그대로 재사용하고,
     레이아웃 배치(순서·열 구성)만 이 네임스페이스로 감싸서 반응형으로 제어한다.
     ================================================================ */
  .home-screen{ padding-bottom:90px; }
  .home-sync-indicator{ display:none; }

  /* ---- Hero: 기본(모바일)은 기존 .hero 세로형 그대로, hero-right는 숨김(대신 cover-facts 노출) ---- */
  .home-hero-right{ display:none; }
  .qc-position{ display:block; font-size:10px; color:var(--ink-soft); margin-top:8px; }

  /* ---- 오늘 학습 ---- */
  .home-today{ padding:0 18px 14px; }
  .home-today-card{
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px 16px;
    /* 빠른 학습(클릭해서 행동하는 영역)과 구분되도록, 그림자 없이 얇은 테두리만 사용해서
       "지금 상태를 확인하는 영역"이라는 낮은 위계를 자연스럽게 나타낸다. */
  }
  .home-today-title{ font-size:11px; font-weight:600; color:var(--ink-soft); margin:0 0 8px; }
  .home-today-row{ display:flex; gap:14px; }
  .home-today-row .stat{ flex:1; text-align:center; }
  .home-today-row .stat b{ display:block; font-family:'Noto Serif KR',serif; font-size:19px; font-weight:900; color:var(--navy); line-height:1; }
  .home-today-row .stat span{ font-size:10px; color:var(--ink-soft); display:block; margin-top:4px; }
  .home-today-row .stat.weak b{ color:var(--seal); }
  .home-today-row .stat.review b{ color:var(--gold-text); }
  .home-today-row .stat.num b{ color:var(--navy); }

  /* ---- 빠른 학습 ---- */
  .home-quick{ padding:0 18px 14px; }
  .home-quick-title{ font-size:12px; font-weight:700; color:var(--ink-soft); margin:0 0 10px; }
  .home-quick-grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
  .home-quick-card{
    background:var(--card); border:1.4px solid var(--line); border-radius:13px; padding:13px;
    text-align:left; cursor:pointer; appearance:none; font-family:inherit;
    display:flex; flex-direction:column; gap:3px; box-sizing:border-box;
    box-shadow:var(--shadow);
    min-height:138px; /* 4장 모두 이 높이로 통일 - 숫자 뽀개기 카드(버튼 2개짜리 줄이 추가로 붙음)의
                          실제 필요 높이 기준(재계산). 다른 카드는 이 높이만큼 하단에 여백이 생기는
                          대신 4장이 정확히 동일한 높이가 된다(A안). 그리드 auto-height 특성상 fr
                          트랙으로는 행끼리 높이가 안 맞춰져서 직접 지정한다. */
  }
  .home-quick-card:active{ transform:scale(.98); }
  .home-quick-card .qc-icon{ font-size:17px; line-height:1; }
  .home-quick-card .qc-title{ font-size:13px; font-weight:700; color:var(--ink); }
  .home-quick-card .qc-sub{ font-size:10px; color:var(--ink-soft); }
  /* 팔레트 단순화: 네이비(기본/CTA) + 버건디(취약·경고) 2가지로 제한. 복습/숫자뽀개기는 옐로우/블루
     계열을 없애고 네이비 텍스트로 통일해 "지금 해야 할 행동"이라는 같은 성격을 같은 색으로 표현한다. */
  .home-quick-card.primary{ border-color:var(--navy); border-width:1.8px; }
  .home-quick-card.primary .qc-icon, .home-quick-card.primary .qc-title{ color:var(--navy); }
  .home-quick-card.weak .qc-icon, .home-quick-card.weak .qc-title{ color:var(--seal-deep); }
  .home-quick-card.review .qc-icon, .home-quick-card.review .qc-title{ color:var(--navy); }
  .home-quick-card.num .qc-icon, .home-quick-card.num .qc-title{ color:var(--navy); }
  /* margin-top:auto였던 걸 고정 padding-top으로 바꿈 - auto는 카드가 min-height로 인해 실제
     콘텐츠보다 커지면 그 남는 공간이 전부 이 버튼 줄 "위쪽"으로 몰려서 간격이 벌어져 보이는
     부작용이 있었다. 고정값으로 바꾸면 카드 높이가 얼마든 이 버튼 줄 위 간격은 항상 8px로 일정하고,
     남는 여백은 카드 맨 아래로 자연스럽게 내려간다. */
  .home-quick-card .qc-split{ display:flex; gap:6px; margin-top:8px; }
  .home-quick-card .qc-split button{
    flex:1; appearance:none; border:1px solid var(--line-strong); background:var(--paper); color:var(--navy);
    border-radius:8px; font-size:10.5px; font-weight:700; padding:6px 3px; cursor:pointer; font-family:inherit;
    line-height:1.15; white-space:normal; word-break:keep-all;
  }
  .home-quick-card .qc-split button b{ display:block; font-size:10.5px; }
  .home-quick-card .qc-split button .qc-split-sub{ display:block; font-size:9px; opacity:.8; font-weight:600; margin-top:1px; line-height:1.15; }

  /* ---- 과목별 학습 ---- */
  .home-subjects{ padding:0 18px; display:flex; flex-direction:column; gap:12px; }
  .home-subject-card{
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow);
  }
  .home-subject-head{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:8px; }
  .home-subject-head .title{ font-weight:800; font-size:13px; color:var(--navy); font-family:'Noto Serif KR',serif; min-width:0; }
  .home-subject-head .cnt{ font-size:11px; color:var(--ink-soft); font-weight:500; flex-shrink:0; }
  .home-subject-progress{ height:5px; border-radius:3px; background:var(--paper-deep); overflow:hidden; margin-bottom:10px; }
  .home-subject-progress > div{ height:100%; background:linear-gradient(90deg, var(--gold), var(--seal)); border-radius:3px; }
  .home-subject-chapters{ display:flex; flex-direction:column; gap:8px; }

  /* ==== 태블릿 세로(768px~) : 여백/카드 확대 ==== */
  @media (min-width:768px){
    .home-hero{ padding:24px 40px 14px; }
    .home-today{ padding:0 40px 18px; }
    .home-quick{ padding:0 40px 18px; }
    .home-subjects{ padding:0 40px; }
    .home-quick-grid{ grid-template-columns:repeat(4, 1fr); }
  }

  /* ==== 태블릿 가로 / 작은 데스크톱(1024px~) : 가로형 대시보드로 전환 ==== */
  @media (min-width:1024px){
    #app{ max-width:min(1400px, 92vw); } /* 퀴즈 화면과 동일한 폭 상한(820px 규칙 재사용) */
    .home-hero{
      display:grid; grid-template-columns:1fr auto; align-items:center; gap:28px;
      padding:22px 44px 15px;
    }
    .home-hero-left{ text-align:left; }
    .home-hero-left h1{ font-size:27px; }
    .home-hero-left .exam-schedule{ justify-content:flex-start; margin-left:0; }
    .home-hero-left .btn-primary{ width:auto; padding:15px 34px; }
    /* 아이패드 가로/PC는 화면이 넓어 모바일과 같은 크기면 상대적으로 작아 보이므로 한 단계 더 키운다. */
    .dday-badge{ font-size:15px; padding:5px 14px; }
    .home-hero-right{
      display:flex; flex-direction:column; align-items:flex-end; gap:2px; flex-shrink:0;
    }
    .home-hero-right .big-pct{ font-family:'Noto Serif KR',serif; font-size:42px; font-weight:900; color:var(--navy); line-height:1; }
    .home-hero-right .big-pct-label{ font-size:11.5px; color:var(--ink-soft); font-weight:700; }
    .home-hero-right .big-total{ font-size:12.5px; color:var(--ink-soft); margin-top:6px; }
    .home-hero-right .big-today{ font-size:11px; color:var(--navy); font-weight:700; margin-top:4px; padding-top:6px; border-top:1px solid var(--line); }
    .home-hero .cover-facts{ display:none; } /* 큰 퍼센트(home-hero-right)로 대체 */

    /* 태블릿 가로 전용: 과목 카드 길이가 서로 크게 다르면(예: 1과목만 유독 김) grid의 "같은 행은
       무조건 같은 높이" 특성 때문에 옆 칸(2과목)이 강제로 늘어나고, 그 아래 3과목 이하가 전부
       밀려 내려가면서 오른쪽에 거대한 빈 공간이 생기는 문제가 있었다(신고된 버그).
       이 앱은 과목이 정확히 3개뿐이므로(1/2/3과목 고정), 자동 밸런싱형(column-count) 대신
       "1과목은 왼쪽 전체(위아래 두 칸 차지), 2·3과목은 오른쪽에 위아래로 쌓임"을 명시적으로
       지정한다 - 자동 밸런싱은 브라우저마다(특히 사파리) 결과가 달라져서 "1과목+2과목이 왼쪽,
       3과목만 오른쪽"처럼 의도와 다르게 배치되는 문제가 있었다. align-items:start라서 2·3과목이
       자기 칸보다 짧아도 억지로 안 늘어나고 그냥 위쪽에 붙는다(빈 공간이 생겨도 아래로 밀리지 않음).
       PC(1280px+)는 아래 블록에서 3열로 되돌리며 이 명시적 위치 지정도 함께 초기화한다. */
    .home-subjects{ display:grid; grid-template-columns:1fr 1fr; grid-auto-flow:row; align-items:start; gap:14px; }
    .home-subjects .home-subject-card:nth-child(1){ grid-column:1; grid-row:1 / span 2; }
    .home-subjects .home-subject-card:nth-child(2){ grid-column:2; grid-row:1; }
    .home-subjects .home-subject-card:nth-child(3){ grid-column:2; grid-row:2; }
    .home-subjects .subtopic-list{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }

    /* 동기화 상태: 헤더 우측에 작은 표시를 추가로 보여주되, 복사/로그아웃 버튼이 있는 sync-bar
       자체는 숨기지 않고(기능 접근성 유지) 크기만 줄여 시각적 비중을 낮춘다. */
    .home-sync-indicator{ display:inline-flex; align-items:center; gap:4px; font-size:11.5px; color:var(--correct); font-weight:700; }
    .sync-bar{ padding:6px 44px; font-size:10.5px; }
  }

  /* ==== 데스크톱(1280px+) : 과목 3열 카드 (태블릿 가로의 column-count를 되돌리고 grid로 복원) ==== */
  @media (min-width:1280px){
    .home-subjects{ display:grid; grid-template-columns:repeat(3, 1fr); column-count:auto; align-items:start; gap:14px; }
    .home-subjects .home-subject-card{ break-inside:auto; margin-bottom:0; }
    /* 태블릿 가로의 명시적 위치 지정(1번=왼쪽 전체, 2/3번=오른쪽 위아래)을 되돌려서 3열 자동 배치로 */
    .home-subjects .home-subject-card:nth-child(1),
    .home-subjects .home-subject-card:nth-child(2),
    .home-subjects .home-subject-card:nth-child(3){ grid-column:auto; grid-row:auto; }
    .home-subjects .subtopic-list{ grid-template-columns:repeat(3, 1fr); }
  }

  /* ---------- 다크모드: 기기 설정을 따라감 (야간 학습 시 눈부심 완화) ---------- */
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#15161A;
      --paper-deep:#22242A;
      --card:#1D1F25;
      --ink:#E8E4DA;
      --ink-soft:#B8B3A3;
      --navy:#C7D4EC;
      --navy-2:#9FB2D6;
      --seal:#E0857A;
      --seal-tint:#3A2320;
      --gold:#C9A45C;
      --gold-tint:#332B1A;
      --gold-text:#E3C583;
      --gold-border:#5C4C2A;
      --num-tint:#1B2A3D;
      --num-text:#8FC1F2;
      --num-border:#3A5578;
      --correct:#6FCB9A;
      --correct-tint:#1E3329;
      --wrong:#E0857A;
      --wrong-tint:#3A2320;
      --line:#33363E;
      --line-strong:#454A55;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    }
    body{
      background:
        radial-gradient(1200px 600px at 10% -10%, #1D1F25 0%, transparent 60%),
        var(--paper);
    }
    .bg-rule{ opacity:.06; }
    .topbar{ background:rgba(21,22,26,.92); }
    .btn-primary{ background:var(--navy); color:#15161A; }
    .btn-primary:hover{ background:var(--navy-2); }
    .nav-btn.primary{ background:var(--navy); color:#15161A; border-color:var(--navy); }
    .feedback.ok{ color:#C6E8D5; border-color:#2E5643; }
    .feedback.no{ color:#F0C4BE; border-color:#5C332E; }
    .stamp{ box-shadow: inset 0 0 0 3px rgba(224,133,122,.15); }
    .sheet-dim{ background:rgba(0,0,0,.6); }
    .sheet{ box-shadow:0 -8px 30px -8px rgba(0,0,0,.7); }
    ::selection{ background:#4A2F2B; }
  }
  a{ color:inherit; }
</style>

<!-- ====== 학습기록 동기화 ======
     예전엔 Firebase Firestore SDK로 브라우저가 직접 데이터베이스에 붙었지만, 이제는 그러지 않는다.
     Firestore 보안규칙이 완전히 잠겨있고(브라우저에서 직접 오는 요청은 전부 거부됨), 모든 읽기/쓰기는
     아래 CF_API_BASE(Cloudflare Worker)의 /sync/* 엔드포인트를 거쳐 서버 쪽 서비스 계정으로만
     이뤄진다. Firebase 프로젝트 설정값을 이 파일에 둘 필요 자체가 없어졌다. -->

<script>
  // window.storage는 Claude 아티팩트 미리보기 안에서만 기본 제공되는 API다.
  // GitHub Pages 등 실제 웹사이트로 배포했을 때는 window.storage가 존재하지 않으므로,
  // 동일한 인터페이스를 localStorage 기반으로 대체 구현해 학습 진행률·회독수·시트 캐시가 실제로 저장되게 한다.
  if (!window.storage) {
    window.storage = {
      async get(key){
        try{
          const v = localStorage.getItem('gpm:'+key);
          return v===null ? null : {key, value:v};
        }catch(e){ return null; }
      },
      async set(key, value){
        try{ localStorage.setItem('gpm:'+key, value); return {key, value}; }
        catch(e){ return null; }
      },
      async delete(key){
        try{ localStorage.removeItem('gpm:'+key); return {key, deleted:true}; }
        catch(e){ return null; }
      },
      async list(prefix){
        try{
          const p = 'gpm:' + (prefix||'');
          const keys = Object.keys(localStorage).filter(k=>k.startsWith(p)).map(k=>k.slice(4));
          return {keys};
        }catch(e){ return {keys:[]}; }
      }
    };
  }
</script>

(function(){
  let QUIZ = JSON.parse(document.getElementById('quiz-data').textContent);

  // ====== 구글 시트 연동 설정 ======
  // "웹에 게시" 대신 탭 이름으로 직접 CSV를 가져오는 방식(gviz)을 사용합니다.
  // → 엑셀로 "가져오기(현재 시트 바꾸기)"를 해도 탭 이름만 유지되면 링크가 깨지지 않습니다.
  //   ("웹에 게시" 방식은 탭의 내부 고유번호(gid)를 가리키는데, 가져오기로 탭을 새로 만들면 gid가 바뀌어 링크가 죽습니다.)
  // 전제조건: 시트 공유 설정이 "링크가 있는 모든 사용자 - 뷰어"로 되어 있어야 합니다.
  //   (파일 → 공유 → 일반 액세스, "웹에 게시"와는 다른 메뉴입니다.)
  // 비워둔(빈 문자열) 챕터는 기존 내장 문제를 그대로 사용합니다. 일부만 채워도 됩니다.
  //
  // 시트 형식(고정, 열 순서로 읽으므로 헤더 문구 자체는 안 봄):
  //   1행 헤더(번호,세부항목,세세항목,문제 내용,보기①~④,정답 번호,해설 및 오답노트,출처,구분,숫자문제분류) → 2행부터 바로 데이터
  //   A:번호  B:세부항목  C:세세항목  D:문제 내용  E~H:보기①~④  I:정답 번호(1~4)  J:해설 및 오답노트  K:출처  L:구분(미사용)
  //   M:숫자문제 분류코드("NUM"이면 홈 화면 "⚡ 숫자 뽀개기.zip" 모아풀기 대상에 포함됨)
  // ====== Cloudflare Worker 기반 배치 로딩 (자료 보호용, 선택적) ======
  // CF_API_BASE가 자리표값 그대로면 이 기능은 조용히 비활성화되고, 기존 구글시트 방식이 그대로 사용된다.
  // 실제 Worker를 배포한 뒤 아래 주소를 교체하면, "앱 켜자마자 935문제 전부 받기" 대신
  // "챕터를 열 때 5문제씩만 받고, 진도 나갈 때마다 다음 5개를 미리 받아두는" 방식으로 전환된다.
  //
  // Worker가 구현해야 하는 API 계약(가정):
  //   GET {CF_API_BASE}/meta?code={동기화코드}
  //     -> { "1-1_공공조달개요": { count: 119, categories: [["세부1","세세1"], ["세부1","세세2"], ...] }, ... }
  //        (문제 내용 없이 "개수"와 "인덱스별 세부/세세항목"만 - 목차 표시용, 노출 최소화)
  //   GET {CF_API_BASE}/questions?chapter={키}&offset={N}&count={M}&code={동기화코드}
  //     -> [ {question, category1, category2, options, answer, explanation, source, rev}, ... ] (M개, 인증 필요)
  const CF_API_BASE = "https://quiz-api.puhahal.workers.dev";
  const CF_BATCH_SIZE = 5;
  const CF_MAX_INDEX_BATCH = 20; // 서버(worker.js)의 MAX_BATCH와 맞춤 - indices 모드 한 번 요청당 최대 개수
  function cfEnabled(){
    return !!CF_API_BASE && CF_API_BASE.indexOf('여기에') !== 0;
  }
  let CF_META = {};              // { chapterKey: { count, categories: [[c1,c2], ...], nums: [bool,...], revs: [rev|null,...] } }
  const CF_LOADED = {};          // { chapterKey: Set(불러온 인덱스) } - 중복 요청 방지용(일시 상태)
  const CF_PENDING = {};         // { chapterKey: { batchStartIndex: Promise } } - 동시에 같은 배치를 두 번 요청하지 않기 위함

  let CF_DAILY_LIMIT_ALERTED = false; // 하루 상한 알림은 이 페이지가 떠 있는 동안 한 번만 띄운다(배치마다 뜨면 스팸이 됨)

  // 하루 누적 상한(daily)에 도달했음을 사용자에게 알린다 - burst와 달리 몇 초 기다린다고 풀리지
  // 않고 그날 안엔 계속 막히므로, 조용히 재시도만 반복하지 않고 명확하게 알려준다.
  function notifyDailyLimitReached(){
    if(CF_DAILY_LIMIT_ALERTED) return;
    CF_DAILY_LIMIT_ALERTED = true;
    alert('오늘 받아갈 수 있는 학습 데이터 상한에 도달했습니다.\n내일 다시 시도해주세요.');
  }

  // 순간 속도 제한(burst)에 걸려 잠시 대기 중임을 알린다. alert처럼 화면을 막지 않고, 로딩 화면
  // ("문제를 불러오는 중...")의 안내 문구만 바꿔서 "멈춘 게 아니라 잠시 기다리는 중"임을 보여준다.
  function notifyBurstLimitWaiting(waiting){
    state.cfBurstWaiting = waiting;
    if(state.view === 'quiz') render(true);
  }

  async function cfFetchWithRetry(url, tries){
    tries = tries || 3;
    for(let attempt=0; attempt<=tries; attempt++){
      try{
        const res = await fetch(url, {cache:'no-store'});
        if(!res.ok){
          const err = new Error('HTTP ' + res.status);
          err.status = res.status;
          if(res.status === 429){
            try{
              const body = await res.json();
              err.limitReason = body && body.limitReason; // 'burst' | 'daily'
            }catch(e2){ /* 응답 본문이 JSON이 아니면 그냥 무시하고 burst로 취급 */ }
          }
          throw err;
        }
        return await res.json();
      }catch(e){
        // 하루 누적 상한(daily)은 그날 안엔 절대 안 풀리므로, 재시도해봐야 시간과 요청만 더 쓸 뿐이다.
        // 남은 재시도 횟수와 무관하게 즉시 포기하고, 사용자에게 한 번은 명확히 알린다.
        if(e && e.limitReason === 'daily'){
          notifyDailyLimitReached();
          throw e;
        }
        if(attempt === tries) throw e;
        if(e && e.status === 429){
          // 순간 속도 제한(burst - 10초에 30건)에 걸린 경우다. "전체 취약 문제 복습"처럼 여러
          // 챕터를 빠르게 이어서 넘어가면, 아직 이번 세션에 한 번도 안 열어본 챕터들의 문제를
          // 짧은 시간에 연달아 받아와야 해서 이 제한에 걸리기 쉽다. 짧게 재시도하면 아직 같은
          // 창(10초) 안이라 계속 막히므로, 그 창이 넘어갈 만큼(10.2초) 확실히 기다렸다가
          // 재시도한다. 기다리는 동안 로딩 화면에 안내 문구를 띄워 멈춘 게 아님을 보여준다.
          notifyBurstLimitWaiting(true);
          await new Promise(r=> setTimeout(r, 10200));
          notifyBurstLimitWaiting(false);
        } else {
          await new Promise(r=> setTimeout(r, 400 * (attempt+1))); // 살짝 텀을 두고 재시도
        }
      }
    }
  }

  // 목차 표시용 가벼운 메타데이터(문제 내용 없이 개수+분류만)를 불러온다. 앱 시작 시 한 번 호출.
  async function cfLoadMeta(){
    if(!cfEnabled() || !state.syncCode) return;
    try{
      CF_META = await cfFetchWithRetry(`${CF_API_BASE}/meta?code=${encodeURIComponent(state.syncCode)}`);
      // 메타 기준으로 QUIZ[key]를 정확한 길이의 빈 배열(구멍 있는 상태)로 미리 잡아둔다.
      Object.keys(CF_META).forEach(key=>{
        QUIZ[key] = new Array(CF_META[key].count);
        CF_LOADED[key] = new Set();
        CF_PENDING[key] = {};
      });
    }catch(e){ console.warn('[Cloudflare] 메타 로드 실패:', e); }
  }

  // 특정 챕터의 offset부터 CF_BATCH_SIZE개를 받아와 QUIZ[key]의 그 구간을 채운다.
  async function cfFetchBatch(key, offset){
    if(!cfEnabled()) return;
    const batchStart = Math.floor(offset / CF_BATCH_SIZE) * CF_BATCH_SIZE; // 배치 경계로 정렬
    if(CF_PENDING[key][batchStart]) return CF_PENDING[key][batchStart]; // 이미 요청 중이면 그 요청을 같이 기다림
    const promise = (async ()=>{
      try{
        const url = `${CF_API_BASE}/questions?chapter=${encodeURIComponent(key)}&offset=${batchStart}&count=${CF_BATCH_SIZE}&code=${encodeURIComponent(state.syncCode)}`;
        const items = await cfFetchWithRetry(url);
        items.forEach((item, i)=>{
          QUIZ[key][batchStart + i] = item;
          CF_LOADED[key].add(batchStart + i);
        });
        invalidateChangedAnswers(key); // 방금 받은 문제들 중 개정일자가 바뀐 게 있으면 조용히 초기화
      }catch(e){
        console.warn('[Cloudflare] 배치 로드 실패:', key, batchStart, e);
        // 홈 화면 챕터 카드에 경고 표시가 뜨도록 기록해둔다(hasError) - 알림(alert)은 하루 상한처럼
        // 확실히 알려야 할 때만 따로 뜨고, 여기서는 "이 챕터에 문제가 있었다"는 조용한 표시만 남긴다.
        state.remoteErrors[key] = true;
      }finally{
        delete CF_PENDING[key][batchStart];
      }
    })();
    CF_PENDING[key][batchStart] = promise;
    return promise;
  }

  // 취약/복습 다시풀기(filterKind==='wrong') 세션 전용: 배치(offset+count) 경계와 무관하게,
  // 지정한 인덱스들만 콕 집어서 한 번에 받아온다(worker.js의 indices 모드). 문제가 챕터 안에
  // 띄엄띄엄 흩어져 있을 때, 5개 단위 배치로 여러 번 나눠 받는 대신 필요한 만큼만 요청 1(~2)번으로
  // 끝내기 위함이다. 응답은 {"3":{...}, "12":{...}} 형태(요청 인덱스를 키로 하는 객체)로 온다.
  async function cfFetchIndicesBatch(key, indices){
    if(!cfEnabled() || !indices.length) return;
    const pendingKey = 'idx:' + indices.join(',');
    if(CF_PENDING[key][pendingKey]) return CF_PENDING[key][pendingKey]; // 이미 같은 조합으로 요청 중이면 같이 기다림
    const promise = (async ()=>{
      try{
        const url = `${CF_API_BASE}/questions?chapter=${encodeURIComponent(key)}&indices=${indices.join(',')}&code=${encodeURIComponent(state.syncCode)}`;
        const map = await cfFetchWithRetry(url);
        Object.keys(map || {}).forEach(k=>{
          const i = parseInt(k, 10);
          QUIZ[key][i] = map[k];
          CF_LOADED[key].add(i);
        });
        invalidateChangedAnswers(key); // 방금 받은 문제들 중 개정일자가 바뀐 게 있으면 조용히 초기화
      }catch(e){
        console.warn('[Cloudflare] 인덱스 지정 로드 실패:', key, indices, e);
        state.remoteErrors[key] = true; // cfFetchBatch와 동일하게, 홈 화면 경고 표시용
      }finally{
        delete CF_PENDING[key][pendingKey];
      }
    })();
    CF_PENDING[key][pendingKey] = promise;
    return promise;
  }

  // 특정 인덱스가 아직 안 왔으면 받아올 때까지 기다린다. 이미 있으면 즉시 반환.
  // 받아온 김에, 다음 배치도 미리(백그라운드로, 기다리지 않고) 당겨놓는다.
  async function cfEnsureLoaded(key, index){
    if(!cfEnabled()) return;

    // 취약/복습 다시풀기 세션은 보는 인덱스가 순서대로가 아니라 띄엄띄엄 골라져 있어서(state.filterIndices),
    // 5개 단위 배치로 받으면 실제로 안 보는 이웃 문제까지 같이 받아오는 낭비가 생기고, "다음 배치" 프리페치도
    // 거의 안 맞는다. 그래서 이 세션에서는 지금 필요한 것 하나만 보지 않고, 이 세션에서 필요한 인덱스
    // 전체 중 아직 안 받은 것을 한 번에(indices 모드로) 모아서 요청한다 - 챕터당 요청을 1~2번으로 줄인다.
    if(state.filterKind === 'wrong'){
      if(CF_LOADED[key] && CF_LOADED[key].has(index)) return;
      const needed = (state.filterIndices || [index]).filter(i => !CF_LOADED[key] || !CF_LOADED[key].has(i));
      if(!needed.length) return;
      const chunks = [];
      for(let i=0; i<needed.length; i+=CF_MAX_INDEX_BATCH) chunks.push(needed.slice(i, i+CF_MAX_INDEX_BATCH));
      await Promise.all(chunks.map(chunk => cfFetchIndicesBatch(key, chunk)));
      return;
    }

    if(!CF_LOADED[key] || !CF_LOADED[key].has(index)){
      await cfFetchBatch(key, index);
    }
    // 프리페치: 다음 배치를 미리 백그라운드로 받아둔다(실패해도 나중에 필요할 때 다시 시도되므로 무시).
    const meta = CF_META[key];
    if(meta){
      const nextBatchStart = (Math.floor(index / CF_BATCH_SIZE) + 1) * CF_BATCH_SIZE;
      if(nextBatchStart < meta.count && (!CF_LOADED[key] || !CF_LOADED[key].has(nextBatchStart))){
        cfFetchBatch(key, nextBatchStart); // await 안 함 - 백그라운드
      }
    }
  }

  // ====== 임시 테스트용 "Temp" 시트 (숨겨진 모드) ======
  // 정식 13개 챕터와 완전히 분리된 임시 확인용 시트. 일반 사용자에게는 어떤 화면에도 노출되지 않고,
  // 주소 뒤에 ?temp=1 을 붙였을 때만 홈 화면에 나타난다. 진행률/오답노트/목차 청사진 등은 전혀 안 쓰고
  // "문제를 쭉 넘겨보기"만 되는 가벼운 화면이다. Cloudflare Worker의 /temp 엔드포인트에서 받아온다.
  function isTempMode(){
    try{ return new URLSearchParams(location.search).get('temp') === '1'; }
    catch(e){ return false; }
  }

  // ====== 비밀번호(가벼운 접근 제한) 설정 ======
  // 별도 구글시트를 하나 만들고 A1 셀에 비밀번호만 적은 뒤, 웹에 게시(CSV)한 링크를 넣으세요.
  // 비워두면 비밀번호 화면 없이 바로 앱이 열립니다.
  // ※ 정적 파일 특성상 완전한 보안은 아니며, 가벼운 접근 제한 용도입니다.
  const PASSWORD_CSV_URL = "";
  const PASSWORD_STORAGE_KEY = "app-unlocked";

  // CSV 파싱 유틸. 실제 컬럼 매핑은 위쪽 COL/DATA_START_ROW 정의를 따른다(csvRowsToItems 참고).
  function parseCSV(text){
    const rows = []; let row = []; let field = ''; let inQuotes = false;
    for(let i=0;i<text.length;i++){
      const c = text[i], next = text[i+1];
      if(inQuotes){
        if(c === '"' && next === '"'){ field += '"'; i++; }
        else if(c === '"'){ inQuotes = false; }
        else field += c;
      } else {
        if(c === '"') inQuotes = true;
        else if(c === ','){ row.push(field); field=''; }
        else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
        else if(c === '\r'){ /* skip */ }
        else field += c;
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(r => r.length>1 || (r[0]||'').trim()!=='');
  }

  // 시트 컬럼 순서(고정, A~L열): 번호, 세부항목, 세세항목, 문제 내용, 보기①, 보기②, 보기③, 보기④, 정답 번호, 해설 및 오답노트, 출처, 구분
  // 실제 CSV 구조: 0행(헤더 1줄, A열엔 시트 제목이 병합되어 같이 붙어나오지만 위치만 보므로 무해함) → 1행부터 바로 데이터.
  // 헤더 문구가 시트마다 살짝 달라도(예: 공백 차이) 깨지지 않도록 이름이 아닌 '열 위치'로 읽는다.
  const DATA_START_ROW = 1; // 0-based 인덱스. 1 = 2번째 행(헤더 다음)부터 데이터.
  const COL = { num:0, c1:1, c2:2, q:3, o1:4, o2:5, o3:6, o4:7, ans:8, exp:9, src:10, rev:11 };

  function csvRowsToItems(rows){
    if(!rows.length) return null;
    const items = [];
    for(let r=DATA_START_ROW; r<rows.length; r++){
      const row = rows[r];
      if(!row || !row[COL.q] || !row[COL.q].trim()) continue; // 문제 내용이 빈 행은 건너뜀(여백행 등)
      items.push({
        num: Number(row[COL.num]) || items.length+1,
        category1: (row[COL.c1]||'').trim(),
        category2: (row[COL.c2]||'').trim(),
        question: (row[COL.q]||'').trim(),
        options: [row[COL.o1], row[COL.o2], row[COL.o3], row[COL.o4]].map(o=>(o||'').trim()),
        answer: Number(row[COL.ans]) || 1,
        explanation: (row[COL.exp]||'').trim(),
        source: (row[COL.src]||'').trim() || null,
        rev: (row[COL.rev]||'').trim() || null // L열(구분): 문제를 유의미하게 수정했을 때만 채우는 개정일자(예: "260827"). 비어있으면 null.
      });
    }
    return items;
  }

  // 챕터마다 개별 CSV를 불러온다. 챕터별로 성공/실패가 독립적이며,
  // 특정 챕터 요청이 실패하면 그 챕터에 한해 이전 캐시(오프라인) → 그것도 없으면 내장 데이터로 대체된다.

  // 구글시트 L열(구분)에 개정일자(예: "260827")가 채워진 문제 중, 사용자가 답했을 때와 지금 개정일자가
  // 다른 문제는 "안 푼 것"으로 조용히 되돌린다. 별도 안내 없이 진행률/오답노트 기록만 지운다.
  // (개정일자가 비어있는 문제는 대상이 아니다 - 평소 오탈자 수정 등은 초기화를 안 원할 수 있어서,
  //  작성자가 "이건 다시 풀어봐야 함"이라고 명시적으로 표시했을 때만 작동)
  function invalidateChangedAnswers(key){
    const list = QUIZ[key];
    if(!list || !state.progress[key]) return;
    let changed = false;
    Object.keys(state.progress[key]).forEach(idxStr=>{
      const idx = Number(idxStr);
      const q = list[idx];
      const rec = state.progress[key][idx];
      if(!q || !rec) return;
      const currentRev = q.rev || null;
      const answeredRev = rec.rev || null;
      if(currentRev && currentRev !== answeredRev){
        delete state.progress[key][idx];
        // 오답노트 대상에 들어가 있었다면 그것도 같이 정리(더 이상 유효한 기록이 아니므로)
        if(state.wrongMastery.pool[key]) delete state.wrongMastery.pool[key][idx];
        if(state.wrongMastery.streak[key]) delete state.wrongMastery.streak[key][idx];
        changed = true;
      }
    });
    if(changed){ saveProgress(); saveWrongMastery(); }
  }

  // 이 챕터 안에서 "개정일자(rev)가 찍혀있고 + 지금 개정판을 아직 안 푼" 문제들의 인덱스.
  // "안 푼"의 기준: 한 번도 안 푼 경우뿐 아니라, 예전에 답했지만 그때의 개정일자(rec.rev)가
  // 지금 개정일자(rev)와 다른 경우도 포함한다. invalidateChangedAnswers()가 이런 문제를 결국
  // "안 푼 것"으로 되돌려주긴 하지만, 그건 그 챕터의 문제 본문을 실제로 다시 받아와야만(그 챕터를
  // 열어봐야만) 실행된다 - 그래서 rec.rev 비교를 여기서 직접 하면, 챕터를 안 열어봐도(메타데이터만
  // 으로도) "예전에 풀었는데 그 뒤 개정된 문제"까지 정확히 잡아낼 수 있다(신고된 버그: "안 뜨는데" -
  // 이미 답했던 문제가 개정된 경우가 누락되고 있었음).
  // numIndicesOf()와 동일한 패턴: Cloudflare 모드에서는 문제 본문을 안 받아도 되는 /meta의
  // revs(챕터별 개정일자 배열)로 판단한다. 그 외(구글시트/내장 데이터)에서는 QUIZ[key] 항목에
  // 직접 담긴 rev로 판단한다.
  function updatedUnansweredIndicesOf(key){
    const out = [];
    if(cfEnabled() && CF_META[key]){
      (CF_META[key].revs || []).forEach((rev, i)=>{
        if(!rev) return;
        const rec = state.progress[key] && state.progress[key][i];
        if(rec && rec.rev === rev) return; // 이미 이 개정판 그대로 정상 답변함 - 대상 아님
        out.push(i);
      });
    } else {
      (QUIZ[key] || []).forEach((q, i)=>{
        if(!q || !q.rev) return;
        const rec = state.progress[key] && state.progress[key][i];
        if(rec && rec.rev === q.rev) return;
        out.push(i);
      });
    }
    return out;
  }
  // 챕터 단위 집계: { count, latestRev } 또는 없으면 null. rev는 "260830" 같은 YYMMDD 문자열이라
  // 자리수가 같으면 문자열 비교만으로도 날짜 순서가 정확히 맞는다. 개정일자 자체도 문제 본문 없이
  // CF_META[key].revs에서 바로 읽는다(updatedUnansweredIndicesOf와 동일한 이유).
  function chapterUpdateInfo(key){
    const idxs = updatedUnansweredIndicesOf(key);
    if(!idxs.length) return null;
    const revsFromMeta = (cfEnabled() && CF_META[key]) ? CF_META[key].revs : null;
    let latestRev = null;
    idxs.forEach(i=>{
      const r = revsFromMeta ? revsFromMeta[i] : (QUIZ[key] && QUIZ[key][i] && QUIZ[key][i].rev);
      if(r && (!latestRev || r > latestRev)) latestRev = r;
    });
    return { count: idxs.length, latestRev };
  }
  // 과목 단위 집계: 그 과목에 속한 모든 챕터를 합산.
  function subjectUpdateInfo(subj){
    let count = 0, latestRev = null;
    (subj.chapters || []).forEach(key=>{
      const info = chapterUpdateInfo(key);
      if(info){
        count += info.count;
        if(info.latestRev && (!latestRev || info.latestRev > latestRev)) latestRev = info.latestRev;
      }
    });
    if(!count) return null;
    return { count, latestRev };
  }
  // "260830" 같은 YYMMDD 개정일자를 화면 배지용 "0830"(월일만)으로 잘라준다.
  // 형식이 예상과 다르면(자리수가 6이 아니면) 안전하게 원본 그대로 보여준다.
  function formatRevMMDD(rev){
    if(!rev) return '';
    return rev.length===6 ? rev.slice(2) : rev;
  }

  // 임시 테스트용 "Temp" 시트를 불러온다. 정식 챕터들의 QUIZ 객체와는 완전히 분리된 별도 변수(TEMP_QUIZ)에 담아서,
  // 진행률/오답노트/전체 문항수 통계 등 정식 데이터 흐름에 전혀 섞이지 않게 한다.
  // Cloudflare Worker의 /temp 엔드포인트(동기화 코드로 인증)에서 받아온다 - 배치 없이 전체를 한 번에.
  let TEMP_QUIZ = [];
  async function loadTempQuiz(){
    if(!cfEnabled() || !state.syncCode){ TEMP_QUIZ = []; return; }
    try{
      const items = await cfFetchWithRetry(`${CF_API_BASE}/temp?code=${encodeURIComponent(state.syncCode)}`);
      TEMP_QUIZ = items || [];
    }catch(e){
      console.warn('[Temp] 불러오기 실패:', e);
      TEMP_QUIZ = [];
    }
  }

  const META = JSON.parse(document.getElementById('quiz-meta').textContent);
  // 내장 문제 데이터를 완전히 제거하고 구글시트로만 문제를 채우는 구조이므로,
  // 아직 시트에서 데이터를 못 받아온 챕터도 QUIZ[key]가 undefined가 되지 않도록 최소 빈 배열로 초기화한다.
  // (이렇게 안 하면 시트 연동에 실패한 챕터를 열 때 QUIZ[key].length 등에서 그대로 오류가 난다)
  (META.subjects || []).forEach(subj=>{
    (subj.chapters || []).forEach(k=>{
      if(!QUIZ[k]) QUIZ[k] = [];
    });
  });
  // 출제기준 목차 청사진: 챕터별 { name(세부항목), subs(세세항목 목록) } 순서 배열.
  // 실제 문제가 없는 세세항목도 여기 있으면 목차에 항상 노출된다(0/0으로 표시).
  const TOC_BLUEPRINT = JSON.parse(document.getElementById('toc-blueprint').textContent);
  const app = document.getElementById('app');

  // 구글시트로 문제 수가 바뀌면 이 값도 다시 계산해야 하므로 let으로 둔다.
  let TOTAL_ALL = Object.values(QUIZ).reduce((a,b)=>a+b.length,0);

  let state = {
    view: 'home', // home | quiz | complete
    chapter: null,
    lastNormalChapter: null, // "이어서 학습"이 기준으로 삼는 값. state.chapter와 달리 🔴 취약 집중공략/
                              // 🟡 복습 다시풀기/⚡ 숫자 뽀개기 세션 중에는 갱신되지 않고, 챕터를 직접
                              // 눌러 들어가거나 "이어서 학습"으로 들어간 "일반 학습"일 때만 갱신된다.
                              // 그래야 방금 취약 문제만 풀었어도 "이어서 학습"이 그 챕터로 안 끌려간다.
                              // (영구 저장 - progress와 함께 저장/로드)
    index: 0,
    progress: {},   // { chapterKey: { qIndexAsStr: {selected, correct} } }
    reviewCounts: {}, // { chapterKey: number } - 단원별 완주(회독) 횟수. progress와 별개로 영구 보존.
    numReviewRound: 0, // "⚡ 숫자 뽀개기.zip · 전체"를 1번~마지막 번호까지 완주한 횟수(영구 저장).
                        // 🔴 취약만 모드는 이 값을 증가시키지 않는다(전체를 다 훑었을 때만 +1).
    todayCount: { date: null, total: 0, num: 0, weak: 0, review: 0 }, // 오늘(로컬 날짜 기준) 답을
                        // 고른 횟수를 카테고리별로 센다(영구 저장). total=전체, num=숫자문제,
                        // weak=답을 고르던 시점 상태가 '취약'이었던 것, review=그 시점 '복습'이었던 것.
                        // 날짜가 바뀌면 전부 0부터 다시 센다. 홈 화면 "오늘 학습" 표시용.
    sheetOpen: false, // 해설 시트 표시 여부(일시 상태, 저장하지 않음)
    reviewAnsweredKeys: new Set(), // 🔴 취약 집중공략/🟡 복습 다시풀기/🔴 숫자 취약만에서 "오늘(로컬 날짜
                        // 기준) 다시 답을 고른 문제들"의 집합("챕터키:문제인덱스" 문자열로 저장, 영구 저장).
                        // isReviewAnsweredToday()/markReviewAnsweredToday()를 통해서만 읽고 쓴다 - 그
                        // 함수들이 날짜가 바뀌면 자동으로 이 Set을 비운다. 문제별로 기억하므로 "이전"으로
                        // 다른 문제를 거쳐 왔다가 되돌아와도, 또 세션을 나갔다 오늘 중 다시 열어도 유지된다.
    reviewAnsweredDate: null, // 위 Set이 어느 날짜 기준으로 채워진 것인지(영구 저장) - 오늘과 다르면 비운다.
    remoteErrors: {},  // { chapterKey: true } - 구글시트 URL은 설정됐지만 로드도/캐시도 실패한 챕터(진단용, 저장하지 않음)
    cfBurstWaiting: false, // Cloudflare 순간 속도 제한에 걸려 재시도 대기 중인지(일시 상태, 저장하지 않음) - 로딩 화면 문구 전환용
    storageOk: null,   // true/false/null(테스트 전) - 저장소(window.storage) 실제 동작 여부 자체진단 결과
    expandedChapter: null, // 홈 화면에서 목차(대분류>세세항목)를 카드 안에 펼쳐놓은 챕터키(일시 상태, 저장하지 않음)
    filterIndices: null, // 세세항목 등 부분 학습 세션에서 사용할 QUIZ[key] 안의 인덱스 목록(일시 상태, 저장하지 않음)
    filterKind: null,    // 'wrong' | 'subtopic' | 'num' | 'weaknum' | null - 현재 부분 학습 세션의 종류(일시 상태, 저장하지 않음)
    excluded: {},          // { chapterKey: { idx: true } } - 오답노트 대상에서 수동으로 뺀 문제 목록(영구 저장)
    wrongMastery: { pool: {}, streak: {} }, // pool: 한 번이라도 틀려서 오답노트 대상에 들어간 문제, streak: 그 문제의 현재 연속 정답 횟수(둘 다 영구 저장)
    globalWeakReview: false, // 메인화면 "전체 취약 문제 복습" 진입 여부(일시 상태, 저장하지 않음) - 챕터를 순차로 이어가는 데 사용
    globalWeakQueue: [],     // 전체 취약 문제 복습을 시작한 시점에 취약 문제가 있던 챕터 목록(일시 상태) - 한 번 정한 순서를 그대로 순회
    globalWeakQueueIndex: 0, // globalWeakQueue 안에서 지금 몇 번째 챕터를 보고 있는지(일시 상태)
    globalWeakCounts: [],    // globalWeakQueue와 짝을 이루는, 시작 시점의 챕터별 취약 문제 개수 스냅샷(일시 상태) - 진행률 "N/전체" 표시용
    globalReviewOnlyReview: false, // 메인화면 "🟡 복습 다시풀기" 진입 여부(일시 상태, 저장하지 않음) - globalWeakReview와 동일한 패턴
    globalReviewOnlyQueue: [],      // 복습 문제가 있던 챕터 목록 스냅샷(일시 상태)
    globalReviewOnlyQueueIndex: 0,  // 위 큐에서 지금 몇 번째 챕터를 보고 있는지(일시 상태)
    globalReviewOnlyCounts: [],     // 시작 시점의 챕터별 복습 문제 개수 스냅샷(일시 상태)
    globalNumReview: false, // 메인화면 "⚡ 숫자 뽀개기.zip · 전체" 진입 여부(일시 상태, 저장하지 않음) - 챕터를 순차로 이어가는 데 사용
    globalWeakNumReview: false, // 메인화면 "🔴 숫자 뽀개기.zip · 취약만" 진입 여부(일시 상태, 저장하지 않음) - globalWeakReview와 동일한 패턴
    globalWeakNumQueue: [],      // 취약 NUM이 있던 챕터 목록 스냅샷(일시 상태) - globalWeakQueue와 동일한 역할
    globalWeakNumQueueIndex: 0,  // 위 큐에서 지금 몇 번째 챕터를 보고 있는지(일시 상태)
    globalWeakNumCounts: [],     // 시작 시점의 챕터별 취약 NUM 개수 스냅샷(일시 상태) - globalWeakCounts와 동일한 역할
    updateAvailable: false, // 앱 코드(GitHub 배포본) 새 버전이 감지됐는지 여부(일시 상태, 저장하지 않음)
    syncCode: null,     // 클라우드 동기화 코드(예: "A7K9-2XQP"). 연결돼 있으면 값이 있고, 아니면 null (영구 저장)
    syncing: false,     // 지금 동기화 요청이 진행 중인지(중복 클릭 방지용, 일시 상태)
    myReports: {},      // 내가 신고한 문제 오류 목록 {신고ID: {chapterKey, questionIndex, questionText, content, createdAt}} (클라우드에서 받아옴)
    bestAnswered: {},    // { chapterKey: 역대 최고 학습완료 수 } - "처음부터 다시 풀기"로 progress가 지워져도 이 값은 안 지워짐(영구 저장)
    roundArmed: {},      // { chapterKey: true|false } - 이 챕터를 "완주하면 회독수가 올라갈 자격"이 있는지.
                          // 완주하는 순간 false로 소진되고, "처음부터 다시 풀기"를 눌러야 다시 true로 충전된다.
                          // 이게 없으면, 이미 완주한 챕터에 문제가 나중에 추가됐을 때 그 몇 문제만 마저 풀어도
                          // 매번 회독수가 올라가버리는 문제가 생긴다. (영구 저장)
    tempIndex: 0,        // 임시 테스트 화면(?temp=1)에서 지금 몇 번째 문제를 보고 있는지 (일시 상태, 저장 안 함)
    dataSource: null,    // 'cloudflare' | 'error' - 지금 문제를 정상적으로 받아왔는지(홈 화면 표시용, 일시 상태)
    questionReviewCounts: {}, // { chapterKey: { questionIndex: 누적 풀이횟수 } } - "처음부터 다시 풀기"를 해도 안 지워지는
                              // 문제별 누적 풀이 횟수. 답을 고를 때마다(재도전 포함) +1. (영구 저장)
    manualWeak: {},          // { chapterKey: { questionIndex: true|false } } - 사용자가 해설 화면에서 수동으로
                              // 취약문제 지정/해제한 기록. 명시적으로 true/false를 저장(키를 지우지 않음)해서
                              // 클라우드 병합 시 "지정 해제"도 정확히 동기화되도록 한다. (영구 저장)
    questionCorrectCounts: {} // { chapterKey: { questionIndex: 누적 정답횟수 } } - questionReviewCounts와 짝을 이루는
                              // 문제별 누적 "정답" 횟수. 정답률(=correctCounts/reviewCounts) 산출용. (영구 저장)
  };

  // 앱 실행 시 저장소가 실제로 쓰기/읽기 가능한지 스스로 테스트한다.
  // (사파리 프라이빗 모드, 저장소 차단 설정 등에서는 조용히 실패하므로 화면에 바로 보여주기 위함)
  async function testStorage(){
    try{
      const mark = 'ok-' + Date.now();
      await window.storage.set('__diag__', mark, false);
      const r = await window.storage.get('__diag__');
      state.storageOk = !!(r && r.value === mark);

  // 로컬(기기) 날짜 기준 "오늘" 문자열(YYYY-MM-DD). UTC 변환 없이 로컬 자정을 기준으로 삼는다.
  function todayDateStr(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  // 필기시험(2026-10-03)까지 D-day 정보를 만든다. todayDateStr()와 동일하게 로컬 자정 기준으로
  // 날짜만 비교해서, 시:분:초나 시간대 오차로 하루가 밀리거나 당겨지지 않게 한다.
  // urgent: D-14 이하(당일 포함)로 가까워지면 true - 배지 색을 바꿔 긴박감을 준다.
  // passed: 시험 다음날(D+1)부터 true - 이땐 배지를 아예 표시하지 않는다(시험이 이미 끝났으므로).
  function examDdayInfo(){
    const today = new Date();
    const todayMid = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const examMid = new Date(2026, 9, 3); // JS month는 0-based라 10월은 9
    const diffDays = Math.round((examMid - todayMid) / 86400000);
    const label = diffDays > 0 ? `D-${diffDays}` : (diffDays === 0 ? 'D-DAY' : `D+${-diffDays}`);
    return { label, urgent: diffDays <= 14, passed: diffDays < 0 };
  }
  // 원서접수(9.14~9.17) 상태를 판정한다 - todayDateStr()와 동일하게 로컬 자정 기준으로 날짜만
  // 비교한다. 세 단계: 시작 전(D-day 표시) / 접수 기간 중("접수중" 표시) / 마감 후(show:false,
  // 문구 자체를 화면에서 숨김 - 더 이상 접수할 수 없는 지난 일정이므로).
  function examRegistrationInfo(){
    const today = new Date();
    const todayMid = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const regStart = new Date(2026, 8, 14); // 9월 14일, month 0-based라 9월은 8
    const regEnd = new Date(2026, 8, 17);   // 9월 17일
    if(todayMid > regEnd) return { show: false };
    if(todayMid >= regStart) return { show: true, active: true, label: '접수중' };
    const diffDays = Math.round((regStart - todayMid) / 86400000);
    return { show: true, active: false, label: diffDays === 0 ? 'D-DAY' : `D-${diffDays}` };
  }
  // selectAnswer()에서 답을 고를 때마다 호출한다. 날짜가 바뀌었으면 전부 0부터 다시 센다(다시 풀기
  // 포함, questionReviewCounts와 동일하게 "풀이 행위" 자체를 센다).
  // opts.isNum: 이 문제가 숫자(NUM) 태그 문제인지. opts.statusBefore: 답을 고르기 "직전" 이 문제의
  // getQuestionStatus 값('weak'|'review'|'mastered'|'none') - 답을 고른 뒤가 아니라 고르기 전 상태를

  // 활성화되면: 코드 하나로 여러 기기·여러 사람이 각자 자기 기록만 클라우드에 백업/복원할 수 있다.

  // /sync/* 호출용 - cfFetchWithRetry는 GET 전용(재시도 포함)이라, 부수효과가 있는 POST(진행기록
  // 업로드·신고 등)는 재시도 없이 한 번만 시도한다(재시도하면 신고가 중복 접수될 수 있어서).
  async function cfPostJson(url, body){
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {}),
    });
    const data = await res.json().catch(()=> ({}));
    if(!res.ok){
      const err = new Error(data.error || ('HTTP ' + res.status));
      err.status = res.status;
      throw err;
    }
    return data;
  }

  // 새 동기화 코드를 하나 만든다. 예: "A7K9-2XQP" (헷갈리기 쉬운 0/O, 1/I 등은 제외)
  function generateSyncCode(){
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
