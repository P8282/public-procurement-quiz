stion": "동일한 소액 계약 건에 대해 같은 업체와 반복적으로 수의계약을 체결하는 것을 일정 횟수 이상 제한하는 취지로 가장 적절한 것은?", "options": ["특정 업체를 퇴출시키기 위해", "해당 업체의 매출을 늘려주기 위해", "행정 절차를 늘리기 위해", "특정 업체와의 유착이나 경쟁 회피를 방지하기 위해"], "answer": 4, "explanation": "* 정답 (④): 동일 업체와 소액수의계약을 반복적으로 체결하는 것을 제한하는 것은 특정 업체와의 유착이나 경쟁 회피를 방지하기 위함임.", "source": "국가계약법 시행령 제26조(수의계약 사유)"}, {"num": 35, "category1": "1. 물품계약 일반절차 관리", "category2": "4. 소액수의계약 절차", "question": "소액수의계약 대상에 해당할 가능성이 높은 경우로 가장 적절한 것은?", "options": ["추정가격이 정해진 소액 기준 이하인 물품 구매", "국제입찰 대상 물품 구매", "다수공급자계약 대상 물품의 대량 구매", "추정가격이 매우 큰 대형 장비 구매"], "answer": 1, "explanation": "* 정답 (①): 소액수의계약은 추정가격이 일정 소액 기준 이하인 경우에 활용되는 것이 원칙임.", "source": "국가계약법 시행령 제26조(수의계약 사유)"}, {"num": 36, "category1": "1. 물품계약 일반절차 관리", "category2": "4. 소액수의계약 절차", "question": "[상황] 계약담당자가 소액수의계약을 체결하면서 견적 비교 없이 평소 친분이 있는 업체와 곧바로 계약했다. 이 처리방식의 문제점으로 가장 적절한 것은?", "options": ["소액계약은 원래 견적 비교가 불필요하다", "오히려 예산이 절감되므로 권장된다", "최소한의 가격 비교 절차를 생략해 계약의 적정성·공정성이 저하될 수 있다", "상호 합의가 있다면 계약조건 위반으로 간주하지 않는다"], "answer": 3, "explanation": "* 정답 (③): 소액수의계약이라도 최소한의 견적 비교 절차를 생략하면 계약의 공정성·적정성이 훼손될 수 있음.", "source": "국가계약법 시행령 제26조(수의계약 사유)"}, {"num": 37, "category1": "1. 물품계약 일반절차 관리", "category2": "4. 소액수의계약 절차", "question": "소액수의계약과 일반경쟁입찰의 가장 근본적인 차이점으로 가장 적절한 것은?", "options": ["계약상대자의 국적", "경쟁의 범위와 절차의 복잡성 정도", "계약이행 기간의 유무", "계약서 양식"], "answer": 2, "explanation": "* 정답 (②): 두 방식의 핵심적 차이는 경쟁의 범위(다수 vs 소수 견적비교)와 절차의 복잡성 정도에 있음.", "source": "국가계약법 시행령 제26조(수의계약 사유)"}, {"num": 38, "category1": "1. 물품계약 일반절차 관리", "category2": "4. 소액수의계약 절차", "question": "소액수의계약 체결 후에도 계약담당자가 유의해야 할 사항으로 가장 적절한 것은?", "options": ["소액계약은 계약서 작성 자체가 필요 없다", "계약금액이 소액이라 하더라도 이행관리·검사 등 일반적인 계약관리 절차는 동일하게 적용된다", "소액계약은 검사·검수를 생략해도 무방하다", "소액계약은 대금지급기한 규정이 적용되지 않는다"], "answer": 2, "explanation": "* 정답 (②): 계약금액의 규모와 무관하게 검사·대금지급 등 기본적인 계약관리 절차는 준수해야 함.", "source": "국가계약법 시행령 제26조(수의계약 사유)"}, {"num": 39, "category1": "1. 물품계약 일반절차 관리", "category2": "4. 소액수의계약 절차", "question": "특정 물품에 대해 조달청장 등이 지정·고시한 품목을 중소기업자로부터 소액으로 구매하는 경우처럼, 특별한 정책적 고려에 따라 수의계약이 허용되는 사례로 가장 적절한 것은?", "options": ["중소기업 지원 등 정책목적에 따른 수의계약 허용 사유", "무작위로 선정된 사유", "담당자의 개인적 편의", "유사한 용역을 반복적으로 수행하여 기존 업체가 수행하는 것이 효율적인 경우"], "answer": 1, "explanation": "* 정답 (①): 중소기업 지원 등 정책적 목적에 따라 법령에서 별도로 정한 수의계약 허용 사유가 존재함.", "source": "국가계약법 시행령 제26조(수의계약 사유)"}, {"num": 40, "category1": "1. 물품계약 일반절차 관리", "category2": "4. 소액수의계약 절차", "question": "소액수의계약의 견적서 비교 절차를 통해 발주기관이 궁극적으로 확보하고자 하는 가치로 가장 적절한 것은?", "options": ["최대한 복잡한 행정절차", "계약상대자와의 친분", "특정 업체의 이익 극대화", "최소한의 가격 적정성과 절차적 공정성"], "answer": 4, "explanation": "* 정답 (④): 견적 비교는 절차를 간소화하면서도 최소한의 가격 적정성과 공정성을 확보하기 위한 장치임.", "source": "국가계약법 시행령 제26조(수의계약 사유)"}, {"num": 41, "category1": "1. 물품계약 일반절차 관리", "category2": "4. 소액수의계약 절차", "question": "소액수의계약 관련 법령·예규가 규정하는 목적으로 가장 적절한 것은?", "options": ["대기업의 참여를 제한하기 위해", "경쟁입찰 제도를 폐지하기 위해", "모든 계약을 수의계약으로 전환하기 위해", "소규모 조달의 신속성과 효율성을 높이면서도 최소한의 공정성을 유지하기 위해"], "answer": 4, "explanation": "* 정답 (④): 소액수의계약 제도는 신속성·효율성과 최소한의 공정성 확보라는 두 가지 가치를 균형 있게 달성하려는 취지임.", "source": "국가계약법 시행령 제26조(수의계약 사유)"}, {"num": 42, "category1": "1. 물품계약 일반절차 관리", "category2": "5. 외자구매계약 절차", "question": "국제 무역거래에서 매도인과 매수인의 비용·위험 분담 기준을 정한 국제상업회의소(ICC)의 표준 규칙을 무엇이라 하는가?", "options": ["신용장통일규칙", "인코텀즈(Incoterms)", "관세평가협정", "비엔나협약"], "answer": 2, "explanation": "* 정답 (②): 인코텀즈는 국제 물품매매에서 매도인·매수인 간 비용과 위험의 분기점을 정형화한 국제상업회의소의 무역조건 규칙임.", "source": "※ 국제상업회의소(ICC) Incoterms"}, {"num": 43, "category1": "1. 물품계약 일반절차 관리", "category2": "5. 외자구매계약 절차", "question": "인코텀즈 조건 중, 매도인이 자신의 공장·창고에서 물품을 인도하는 시점에 모든 의무가 끝나 매도인에게 가장 적은 부담을, 매수인에게 가장 큰 부담을 지우는 조건은?", "options": ["CIF(운임·보험료포함인도조건)", "EXW(공장인도조건)", "DDP(관세지급인도조건)", "FOB(본선인도조건)"], "answer": 2, "explanation": "* 정답 (②): EXW는 매도인이 자신의 시설에서 물품을 인도하면 의무가 끝나는 조건으로, 매도인에게 최소 의무, 매수인에게 최대 의무가 부여됨.", "source": "※ ICC Incoterms"}, {"num": 44, "category1": "1. 물품계약 일반절차 관리", "category2": "5. 외자구매계약 절차", "question": "매도인이 물품의 선적항 본선 적재 시점까지 위험을 부담하고, 그 이후의 목적항까지의 운임·보험료도 매도인이 부담하는 조건은?", "options": ["DDP(관세지급인도조건)", "CIF(운임·보험료포함인도조건)", "FOB(본선인도조건)", "EXW(공장인도조건)"], "answer": 2, "explanation": "* 정답 (②): CIF는 위험 이전 시점(선적항 본선 적재)과 비용 부담 범위(목적항까지의 운임·보험료)가 다른 것이 특징적인 조건임.", "source": "※ ICC Incoterms"}, {"num": 45, "category1": "1. 물품계약 일반절차 관리", "category2": "5. 외자구매계약 절차", "question": "매도인이 관세까지 지급하고 목적지에서 물품을 인도하여, 매도인에게 가장 큰 부담을 지우는 인코텀즈 조건은?", "options": ["DDP(관세지급인도조건)", "FCA(운송인인도조건)", "FOB(본선인도조건)", "EXW(공장인도조건)"], "answer": 1, "explanation": "* 정답 (①): DDP는 매도인이 목적지까지의 운송·통관·관세납부까지 모두 책임지는 조건으로 매도인의 의무가 가장 큰 조건에 해당함.", "source": "※ ICC Incoterms"}, {"num": 46, "category1": "1. 물품계약 일반절차 관리", "category2": "5. 외자구매계약 절차", "question": "외자구매계약의 대금결제 방식으로 국제무역에서 널리 사용되는 수단으로, 은행이 서류의 일치 여부만을 확인하여 대금 지급을 보장하는 것은?", "options": ["약속어음", "가계수표", "전자상거래 간편결제", "신용장(L/C)"], "answer": 4, "explanation": "* 정답 (④): 신용장(L/C) 거래는 '서류 거래의 원칙'에 기반해, 은행이 실제 물품이 아닌 제시된 서류의 일치 여부만을 확인하여 대금을 지급함.", "source": null}, {"num": 47, "category1": "1. 물품계약 일반절차 관리", "category2": "5. 외자구매계약 절차", "question": "신용장(L/C) 거래에서 은행이 대금 지급 여부를 판단하는 핵심 기준으로 가장 적절한 것은?", "options": ["매수인의 개인적 신뢰도", "제시된 서류가 신용장 조건과 일치하는지 여부", "매도인의 평판", "실제 물품의 품질 상태"], "answer": 2, "explanation": "* 정답 (②): 신용장 거래는 서류 거래의 원칙에 따라, 은행은 실물이 아니라 서류의 신용장 조건 일치 여부만을 심사해 지급 여부를 결정함.", "source": null}, {"num": 48, "category1": "1. 물품계약 일반절차 관리", "category2": "5. 외자구매계약 절차", "question": "국내 물품구매계약과 외자구매계약을 비교한 설명으로 가장 옳은 것은?", "options": ["국내 물품구매계약에도 인코텀즈가 항상 적용된다", "두 계약 유형은 적용 법규가 완전히 동일하다", "국내 물품구매는 국내 법령이 단독으로 적용되는 반면, 외자구매는 국내 법령과 인코텀즈 등 국제 무역규범이 함께 적용되는 경우가 많다", "외자구매계약에는 어떠한 국내 법령도 적용되지 않는다"], "answer": 3, "explanation": "* 정답 (③): 외자구매계약은 국내 계약법령과 인코텀즈 등 국제 무역규범이 함께 적용되는 영역인 반면, 순수 국내 물품구매는 국내 법령 위주로 적용됨.", "source": null}, {"num": 49, "category1": "1. 물품계약 일반절차 관리", "category2": "5. 외자구매계약 절차", "question": "외자구매계약에서 계약상대자가 될 수 있는 자로 가장 적절한 것은?", "options": ["국내 업체는 외자구매계약의 당사자가 될 수 없다", "반드시 조달청 소속 공무원만 계약상대자가 될 수 있다", "국내 오퍼상(수입대행업체) 또는 해외 수출자가 직접 계약상대자가 될 수 있다", "계약상대자는 항상 정부기관이어야 한다"], "answer": 3, "explanation": "* 정답 (③): 외자구매계약은 국내 오퍼상이나 해외 수출자가 직접 계약상대자가 되어 체결될 수 있음.", "source": null}, {"num": 50, "category1": "1. 물품계약 일반절차 관리", "category2": "5. 외자구매계약 절차", "question": "외자구매계약과 국내 물품구매계약을 비교했을 때, 외자구매계약에서 특히 고려해야 할 요소로 가장 거리가 먼 것은?", "options": ["국제 운송·보험 관련 위험 분담", "국내 소액수의계약 가능 금액 기준", "통관 및 관세 관련 절차", "환율 변동에 따른 계약금액 산정"], "answer": 2, "explanation": "* 정답 (②): 국내 소액수의계약 금액 기준은 외자구매계약에 특별히 고려할 요소라기보다 국내 계약 전반에 공통되는 기준임. 외자구매는 환율, 통관·관세, 국제운송·보험 등이 특히 중요함.", "source": null}, {"num": 51, "category1": "1. 물품계약 일반절차 관리", "category2": "5. 외자구매계약 절차", "question": "[상황] 국내 업체가 해외 제조사의 장비를 수입해 정부기관에 납품하는 계약을 체결하려 한다. 이 계약에서 특히 검토해야 할 사항으로 가장 적절한 것은?", "options": ["국내 하도급 승인 절차만", "국내 소액수의계약 가능 여부만", "계약해당 기관의 과거 관행 및 내부 지침을 우선 적용한다", "인코텀즈에 따른 위험·비용 분기점과 결제방식(신용장 등)"], "answer": 4, "explanation": "* 정답 (④): 외자구매계약에서는 인코텀즈에 따른 위험·비용 분담 기준과 신용장 등 결제방식을 특히 꼼꼼히 검토해야 함.", "source": null}, {"num": 52, "category1": "2. 물품계약 이행관리", "category2": "1. 공정, 품질 및 안전관리", "question": "계약상대자가 납품을 완료했을 때, 발주기관이 계약서·규격서대로 이행되었는지 확인하는 절차를 무엇이라 하는가?", "options": ["검사", "등록", "협상", "공고"], "answer": 1, "explanation": "* 정답 (①): 검사는 계약목적물이 계약서·규격서 등에서 정한 대로 이행되었는지 품질·규격·성능 등을 확인하는 절차임.", "source": "국가계약법 시행령 제55조"}, {"num": 53, "category1": "2. 물품계약 이행관리", "category2": "1. 공정, 품질 및 안전관리", "question": "발주기관은 계약상대자로부터 대금 청구를 받은 날부터(공휴일·토요일 제외) 며칠 이내에 대가를 지급해야 하는가?", "options": ["5일", "14일", "3일", "7일"], "answer": 1, "explanation": "* 정답 (①): 발주기관은 대금 청구를 받은 날부터 5일(공휴일·토요일 제외) 이내에 대가를 지급해야 함.", "source": "국가계약법 시행령 제58조"}, {"num": 54, "category1": "2. 물품계약 이행관리", "category2": "1. 공정, 품질 및 안전관리", "question": "물품 납품 후 일정 기간 내 발생한 하자에 대해 계약상대자가 무상으로 보수할 책임을 지는 것을 무엇이라 하는가?", "options": ["하자담보책임", "제조물책임", "채무불이행책임", "불법행위책임"], "answer": 1, "explanation": "* 정답 (①): 하자담보책임은 납품 후 일정 기간(하자담보책임기간) 내 발생한 하자에 대해 계약상대자가 무상 보수 등의 책임을 지는 것을 말하며, 물품의 종류에 따라 책임기간이 다르게 정해짐.", "source": "국가계약법 시행령 제55조·제58조"}, {"num": 55, "category1": "2. 물품계약 이행관리", "category2": "1. 공정, 품질 및 안전관리", "question": "계약상대자가 정당한 이유 없이 납품기한을 지체했을 때 부과되는 금전적 제재는?", "options": ["이행강제금", "위약벌", "지체상금", "과징금"], "answer": 3, "explanation": "* 정답 (③): 지체상금은 정당한 사유 없는 납품 지연에 대해 지체일수에 비례하여 부과하는 금전적 제재임.", "source": "국가계약법 시행령 제74조"}, {"num": 56, "category1": "2. 물품계약 이행관리", "category2": "1. 공정, 품질 및 안전관리", "question": "계약이행 과정에서 계약목적물의 품질을 확인하기 위한 절차로, 검사와 함께 행정적 확인 절차를 의미하는 것은?", "options": ["검수", "공고", "협상", "등록"], "answer": 1, "explanation": "* 정답 (①): 검사가 기술적 적합성 확인이라면, 검수는 이를 바탕으로 한 행정적 확인 절차로 이해되며, 검사·검수를 모두 통과해야 대금지급 절차로 이어질 수 있음.", "source": "국가계약법 시행령 제55조·제58조"}, {"num": 57, "category1": "2. 물품계약 이행관리", "category2": "1. 공정, 품질 및 안전관리", "question": "물품계약 이행 중 안전관리와 관련해 계약상대자가 부담하는 일반적인 의무로 가장 적절한 것은?", "options": ["안전기준은 계약상대자가 임의로 정할 수 있다", "안전관리는 발주기관이 전적으로 대행할 의무", "관계 법령에 따른 안전기준을 준수하며 이행할 의무", "안전관리는 계약과 무관한 사항이다"], "answer": 3, "explanation": "* 정답 (③): 계약상대자는 계약이행 과정에서 관계 법령상의 안전기준을 준수할 의무가 있음.", "source": "국가계약법 시행령 제55조·제58조"}, {"num": 58, "category1": "2. 물품계약 이행관리", "category2": "1. 공정, 품질 및 안전관리", "question": "검사에 불합격한 물품에 대해 계약상대자가 취해야 할 조치로 가장 적절한 것은?", "options": ["계약을 임의로 포기한다", "불합격 사실을 무시하고 대금을 청구한다", "지체 없이 대체품 납품 또는 보완 조치를 한다", "이의신청만 하고 아무 조치도 하지 않는다"], "answer": 3, "explanation": "* 정답 (③): 불합격 시 계약상대자는 지체 없이 보완·재이행 등의 조치를 취해야 함.", "source": "국가계약법 시행령 제55조·제58조"}, {"num": 59, "category1": "2. 물품계약 이행관리", "category2": "1. 공정, 품질 및 안전관리", "question": "계약이행 중 품질 저하나 안전사고 발생 위험이 확인된 경우 계약담당자가 취할 수 있는 조치로 가장 적절한 것은?", "options": ["즉시 아무 조치 없이 방치한다", "계약상대자에게 책임을 전가하고 손을 뗀다", "계약보증금을 국고에 귀속시키고 즉시 부정당업자 제재 처분을 한다", "시정을 요구하고 필요시 이행상황을 강화하여 점검한다"], "answer": 4, "explanation": "* 정답 (④): 품질·안전상 문제가 확인되면 시정요구 및 점검 강화 등 단계적 조치를 취하는 것이 합리적임.", "source": "국가계약법 시행령 제55조·제58조"}, {"num": 60, "category1": "2. 물품계약 이행관리", "category2": "1. 공정, 품질 및 안전관리", "question": "계약이행 완료에 따라 검사·검수 및 대금 청구 등 계약 종결 처리와 관련해 계약담당자가 준비해야 할 서류로 가장 거리가 먼 것은?", "options": ["납품 관련 확인서류", "물가변동으로 인한 계약금액 조정 내역", "대가지급 청구서 관련 서류", "검사조서"], "answer": 2, "explanation": "* 정답 (②): 경쟁사의 납품 단가 정보는 계약 종결 처리와 무관함.", "source": "국가계약법 시행령 제55조·제58조"}, {"num": 61, "category1": "2. 물품계약 이행관리", "category2": "1. 공정, 품질 및 안전관리", "question": "[상황] 계약상대자가 하자보수를 요청받았음에도 정당한 사유 없이 이를 거부하고 있다. 발주기관이 취할 수 있는 조치로 가장 적절한 것은?", "options": ["계약상대자의 자발적 이행을 촉구하는 공문만 발송할 수 있다", "경찰에 고발 조치하고 민사 소송을 청구한다", "계약금액을 즉시 증액해준다", "하자보수보증금을 활용하는 등 필요한 조치를 취할 수 있다"], "answer": 4, "explanation": "* 정답 (④): 계약상대자가 정당한 사유 없이 하자보수를 거부하면, 발주기관은 하자보수보증금을 활용하는 등 필요한 조치를 취할 수 있음.", "source": "국가계약법 시행령 제55조·제58조"}, {"num": 62, "category1": "2. 물품계약 이행관리", "category2": "2. 설계변경 및 계약금액 조정", "question": "물품계약에서 설계(규격)변경이 발생하는 사유로 가장 거리가 먼 것은?", "options": ["계약상대자의 신기술 제안 채택", "계약수요기관 장의 재량에 따라 별도의 지침을 적용한다", "발주기관의 필요에 따른 규격 변경 요청", "규격서 내용의 불분명 또는 오류"], "answer": 2, "explanation": "* 정답 (②): 개인적 취향 변화는 정당한 설계(규격)변경 사유가 될 수 없음. 규격서 오류, 발주기관의 필요, 신기술 제안 채택 등이 일반적 사유임.", "source": "국가계약법 시행령 제65조"}, {"num": 63, "category1": "2. 물품계약 이행관리", "category2": "2. 설계변경 및 계약금액 조정", "question": "설계(규격)변경으로 물량이 증가한 기존 비목의 단가 산정 기준으로 가장 적절한 것은?", "options": ["계약상대자가 임의로 정한다", "단가 산정 없이 발주기관이 임의로 결정한다", "기존 계약단가를 적용한다", "무조건 시장 최고가를 적용한다"], "answer": 3, "explanation": "* 정답 (③): 설계변경으로 증감된 물량 중 기존에 계약서에 있던 비목은 원칙적으로 계약단가를 적용함.", "source": "국가계약법 시행령 제65조"}, {"num": 64, "category1": "2. 물품계약 이행관리", "category2": "2. 설계변경 및 계약금액 조정", "question": "설계(규격)변경으로 계약서에 없던 신규 비목이 발생한 경우 단가 산정 기준으로 가장 적절한 것은?", "options": ["예정가격을 그대로 적용한다", "계약체결 당시의 단가를 그대로 적용한다", "계약상대자가 요구하는 금액을 그대로 인정한다", "설계변경 당시를 기준으로 산정한 단가를 적용한다"], "answer": 4, "explanation": "* 정답 (④): 계약서에 없던 신규 비목의 단가는 계약체결 당시가 아니라 설계변경 당시를 기준으로 새로 산정하는 것이 원칙임.", "source": "국가계약법 시행령 제65조"}, {"num": 65, "category1": "2. 물품계약 이행관리", "category2": "2. 설계변경 및 계약금액 조정", "question": "물가변동으로 인한 계약금액 조정(Escalation)을 신청하기 위해 충족해야 할 요건으로 옳은 것은?", "options": ["계약체결 후 60일 이상 경과, 등락률 5% 이상", "계약체결 후 30일 이상 경과, 등락률과 무관하게 신청 가능", "기간 요건 없이 등락률 1% 이상", "계약체결 후 90일 이상 경과, 품목조정률 또는 지수조정률 3% 이상 증감"], "answer": 4, "explanation": "* 정답 (④): 물가변동으로 인한 계약금액 조정은 계약체결일로부터 90일 이상 경과하고, 품목조정률 또는 지수조정률이 3% 이상 증감해야 신청할 수 있음.", "source": "국가계약법 시행령 제64조"}, {"num": 66, "category1": "2. 물품계약 이행관리", "category2": "2. 설계변경 및 계약금액 조정", "question": "다음 계약금액 조정 사유 중 나머지 셋과 성격이 다른 하나는?", "options": ["계약상대자의 신기술 제안이 채택되어 일부 부품이 변경되었다", "발주기관의 요청으로 사양을 한 단계 상향 조정하였다", "규격서 내용이 불분명하여 새로운 부품이 추가되었다", "계약체결 후 90일이 지나 원자재 가격이 상승하였다"], "answer": 4, "explanation": "* 정답 (④): 90일 경과 후 원자재 가격 상승은 물가변동(Escalation)에 의한 조정 사유이고, 나머지 셋(규격 불분명, 발주기관 요청, 신기술 제안)은 모두 설계(규격)변경에 의한 조정 사유임.", "source": "국가계약법 시행령 제64조·제65조"}, {"num": 67, "category1": "2. 물품계약 이행관리", "category2": "2. 설계변경 및 계약금액 조정", "question": "설계(규격)변경으로 계약금액이 증액될 때 일반관리비·이윤 적용 원칙으로 가장 적절한 것은?", "options": ["기존 산출내역서상의 비율을 적용하되 법정 요율을 초과할 수 없다", "무조건 법정 최고 요율을 적용한다", "적용하지 않는다", "발주기관이 매번 임의로 새로 정한다"], "answer": 1, "explanation": "* 정답 (①): 계약금액 증액 시 일반관리비·이윤은 기존 계약의 비율을 따르되 법정 상한을 넘을 수 없음.", "source": "국가계약법 시행령 제65조"}, {"num": 68, "category1": "2. 물품계약 이행관리", "category2": "2. 설계변경 및 계약금액 조정", "question": "신기술 적용으로 계약상대자가 자발적으로 비용을 절감·제안한 경우, 설계(규격)변경 관련 계약금액 조정에 대한 설명으로 가장 적절한 것은?", "options": ["신기술 제안은 설계변경 사유가 될 수 없다", "절감액과 무관하게 계약금액은 그대로 유지된다", "절감액 전부를 반드시 감액해야 한다", "절감액의 일부만 감액하여 기술 개발 유인을 유지하는 방식으로 처리될 수 있다"], "answer": 4, "explanation": "* 정답 (④): 계약상대자의 자발적 기술개선으로 비용이 절감된 경우, 절감액 전부가 아니라 일부만 감액하여 기술개발 유인을 유지하는 방식이 일반적임.", "source": "국가계약법 시행령 제64조·제65조"}, {"num": 69, "category1": "2. 물품계약 이행관리", "category2": "2. 설계변경 및 계약금액 조정", "question": "[상황] 계약체결 후 65일이 경과한 시점에 품목조정률이 4% 상승했다며 계약상대자가 물가변동에 따른 계약금액 조정을 신청했다. 이 신청에 대한 판단으로 가장 적절한 것은?", "options": ["등락률 요건은 충족했으나 기간 요건(90일)을 충족하지 못해 조정 대상이 아니다", "두 요건을 모두 충족했으므로 즉시 조정해야 한다", "조정 신청 자체가 금지되어 있다", "기간과 무관하게 등락률만 넘으면 조정된다"], "answer": 1, "explanation": "* 정답 (①): 90일 기간 요건을 충족하지 못했으므로, 등락률이 3%를 넘었더라도 조정 대상이 되지 않음.", "source": "국가계약법 시행령 제64조"}, {"num": 70, "category1": "2. 물품계약 이행관리", "category2": "2. 설계변경 및 계약금액 조정", "question": "계약금액 조정과 관련해 발주기관이 계약상대자의 청구를 받은 경우, 조정 관련 서류 심사·처리 시 유의할 사항으로 가장 적절한 것은?", "options": ["계약상대자가 요구하는 금액을 임의로 절반만 인정한다", "서류 없이 구두 요청만으로 처리한다", "조정 요건(기간·비율 등) 충족 여부와 산정 근거를 꼼꼼히 확인한다", "청구가 들어오면 무조건 그대로 승인한다"], "answer": 3, "explanation": "* 정답 (③): 계약금액 조정 청구는 요건 충족 여부와 산정 근거를 확인한 뒤 처리하는 것이 원칙임.", "source": "국가계약법 시행령 제64조·제65조"}, {"num": 71, "category1": "2. 물품계약 이행관리", "category2": "2. 설계변경 및 계약금액 조정", "question": "설계(규격)변경 및 계약금액 조정 전반에 대한 설명으로 가장 적절한 것은?", "options": ["설계변경은 계약금액에 전혀 영향을 주지 않는다", "계약금액 조정은 계약서 변경 없이 구두로만 처리해도 무방하다", "계약금액 조정은 준공 이후에만 가능하다", "변경 사유·근거를 문서화하고, 조정 요건에 따라 계약금액·계약서를 함께 변경 관리해야 한다"], "answer": 4, "explanation": "* 정답 (④): 설계변경·계약금액 조정은 사유와 근거를 문서화하고, 조정요건에 따라 계약서 등 관련 문서를 함께 변경 관리하는 것이 원칙임.", "source": "국가계약법 시행령 제64조·제65조"}], "3-3_용역다수공급자계약관리": [{"num": 1, "category1": "1. 용역계약 절차 및 이행관리", "category2": "1. 용역 입찰공고문 검토", "question": "용역계약 중 설계·감리처럼 기술적 전문성을 바탕으로 하는 용역을 무엇이라 하는가?", "options": ["일반용역", "소액용역", "단순노무용역", "기술용역"], "answer": 4, "explanation": "* 정답 (④): 기술용역은 설계, 감리 등 전문 기술력을 바탕으로 이행되는 용역을 말함.", "source": null}, {"num": 2, "category1": "1. 용역계약 절차 및 이행관리", "category2": "1. 용역 입찰공고문 검토", "question": "청소, 경비 등 주로 인력의 노무 제공을 통해 계약목적을 달성하는 용역을 무엇이라 하는가?", "options": ["일반용역", "기술용역", "시설공사", "연구용역"], "answer": 1, "explanation": "* 정답 (①): 일반용역은 청소·경비 등 노무 제공을 중심으로 하는 용역을 말하며, 기술적 전문성이 핵심인 기술용역과 구분됨.", "source": null}, {"num": 3, "category1": "1. 용역계약 절차 및 이행관리", "category2": "1. 용역 입찰공고문 검토", "question": "다음 중 통상 '기술용역'으로 분류되기 어려운 것은?", "options": ["단순 폐기물 수거·운반 용역", "시설물 안전진단 용역", "정보시스템 개발 용역", "건설공사 설계 용역"], "answer": 1, "explanation": "* 정답 (①): 단순 폐기물 수거·운반처럼 노무 제공이 중심인 용역은 일반용역으로 분류되는 것이 일반적이며, 설계·정보시스템개발·안전진단 등은 기술적 전문성이 핵심인 기술용역에 해당함.", "source": null}, {"num": 4, "category1": "1. 용역계약 절차 및 이행관리", "category2": "1. 용역 입찰공고문 검토", "question": "발주기관이 필요한 용역의 과업 내용, 요구사항, 평가 기준 등을 구체적으로 기술하여 입찰참가자에게 제안서 제출을 요청하는 문서는?", "options": ["제안요청서(RFP)", "계약특수조건", "입찰유의서", "과업지시서"], "answer": 1, "explanation": "* 정답 (①): 제안요청서(RFP, Request for Proposal)는 과업 내용·요구사항·평가기준 등을 상세히 기술해 제안서 제출을 요청하는 문서임.", "source": null}, {"num": 5, "category1": "1. 용역계약 절차 및 이행관리", "category2": "1. 용역 입찰공고문 검토", "   //   A:번호  B:세부항목  C:세세항목  D:문제 내용  E~H:보기①~④  I:정답 번호(1~4)  J:해설 및 오답노트  K:출처  L:구분(미사용)
  const SHEET_CSV_URLS = {
    "1-1_공공조달개요": "https://docs.google.com/spreadsheets/d/16U3qDyhbrGmIYDL38iB4Dcm-HPw0Q5aPy3KH1eFu6tU/gviz/tq?tqx=out:csv&sheet=1-1_%EA%B3%B5%EA%B3%B5%EC%A1%B0%EB%8B%AC%EA%B0%9C%EC%9A%94",
    "1-2_원칙및방법": "https://docs.google.com/spreadsheets/d/16U3qDyhbrGmIYDL38iB4Dcm-HPw0Q5aPy3KH1eFu6tU/gviz/tq?tqx=out:csv&sheet=1-2_%EC%9B%90%EC%B9%99%EB%B0%8F%EB%B0%A9%EB%B2%95",
    "1-3_전자조달시스템": "https://docs.google.com/spreadsheets/d/16U3qDyhbrGmIYDL38iB4Dcm-HPw0Q5aPy3KH1eFu6tU/gviz/tq?tqx=out:csv&sheet=1-3_%EC%A0%84%EC%9E%90%EC%A1%B0%EB%8B%AC%EC%8B%9C%EC%8A%A4%ED%85%9C",
    "1-4_전략적공공조달": "https://docs.google.com/spreadsheets/d/16U3qDyhbrGmIYDL38iB4Dcm-HPw0Q5aPy3KH1eFu6tU/gviz/tq?tqx=out:csv&sheet=1-4_%EC%A0%84%EB%9E%B5%EC%A0%81%EA%B3%B5%EA%B3%B5%EC%A1%B0%EB%8B%AC",
    "1-5_공공조달법률이해": "https://docs.google.com/spreadsheets/d/16U3qDyhbrGmIYDL38iB4Dcm-HPw0Q5aPy3KH1eFu6tU/gviz/tq?tqx=out:csv&sheet=1-5_%EA%B3%B5%EA%B3%B5%EC%A1%B0%EB%8B%AC%EB%B2%95%EB%A5%A0%EC%9D%B4%ED%95%B4",
    "1-6_공정조달관리": "https://docs.google.com/spreadsheets/d/16U3qDyhbrGmIYDL38iB4Dcm-HPw0Q5aPy3KH1eFu6tU/gviz/tq?tqx=out:csv&sheet=1-6_%EA%B3%B5%EC%A0%95%EC%A1%B0%EB%8B%AC%EA%B4%80%EB%A6%AC",
    "2-1_공공조달계획": "https://docs.google.com/spreadsheets/d/16U3qDyhbrGmIYDL38iB4Dcm-HPw0Q5aPy3KH1eFu6tU/gviz/tq?tqx=out:csv&sheet=2-1_%EA%B3%B5%EA%B3%B5%EC%A1%B0%EB%8B%AC%EA%B3%84%ED%9A%8D",
    "2-2_조달요구응대및제안": "https://docs.google.com/spreadsheets/d/16U3qDyhbrGmIYDL38iB4Dcm-HPw0Q5aPy3KH1eFu6tU/gviz/tq?tqx=out:csv&sheet=2-2_%EC%A1%B0%EB%8B%AC%EC%9A%94%EA%B5%AC%EC%9D%91%EB%8C%80%EB%B0%8F%EC%A0%9C%EC%95%88",
    "2-3_입찰제안평가및계약체결": "https://docs.google.com/spreadsheets/d/16U3qDyhbrGmIYDL38iB4Dcm-HPw0Q5aPy3KH1eFu6tU/gviz/tq?tqx=out:csv&sheet=2-3_%EC%9E%85%EC%B0%B0%EC%A0%9C%EC%95%88%ED%8F%89%EA%B0%80%EB%B0%8F%EA%B3%84%EC%95%BD%EC%B2%B4%EA%B2%B0",
    "3-1_계약관리일반절차": "https://docs.google.com/spreadsheets/d/16U3qDyhbrGmIYDL38iB4Dcm-HPw0Q5aPy3KH1eFu6tU/gviz/tq?tqx=out:csv&sheet=3-1_%EA%B3%84%EC%95%BD%EA%B4%80%EB%A6%AC%EC%9D%BC%EB%B0%98%EC%A0%88%EC%B0%A8",
    "3-2_물품계약관리": "https://docs.google.com/spreadsheets/d/16U3qDyhbrGmIYDL38iB4Dcm-HPw0Q5aPy3KH1eFu6tU/gviz/tq?tqx=out:csv&sheet=3-2_%EB%AC%BC%ED%92%88%EA%B3%84%EC%95%BD%EA%B4%80%EB%A6%AC",
    "3-3_용역다수공급자계약관리": "https://docs.google.com/spreadsheets/d/16U3qDyhbrGmIYDL38iB4Dcm-HPw0Q5aPy3KH1eFu6tU/gviz/tq?tqx=out:csv&sheet=3-3_%EC%9A%A9%EC%97%AD%EB%8B%A4%EC%88%98%EA%B3%B5%EA%B8%89%EC%9E%90%EA%B3%84%EC%95%BD%EA%B4%80%EB%A6%AC",
    "3-4_공사계약관리": "https://docs.google.com/spreadsheets/d/16U3qDyhbrGmIYDL38iB4Dcm-HPw0Q5aPy3KH1eFu6tU/gviz/tq?tqx=out:csv&sheet=3-4_%EA%B3%B5%EC%82%AC%EA%B3%84%EC%95%BD%EA%B4%80%EB%A6%AC"
  };

  // ====== 비밀번호(가벼운 접근 제한) 설정 ======
  // 별도 구글시트를 하나 만들고 A1 셀에 비밀번호만 적은 뒤, 웹에 게시(CSV)한 링크를 넣으세요.
  // 비워두면 비밀번호 화면 없이 바로 앱이 열립니다.
  // ※ 정적 파일 특성상 완전한 보안은 아니며, 가벼운 접근 제한 용도입니다.
  const PASSWORD_CSV_URL = "";
  const PASSWORD_STORAGE_KEY = "app-unlocked";

  // CSV 파싱 유틸. 실제 컬럼 매핑은 위쪽 COL/DATA_START_ROW 정의를 따른다(csvRowsToItems 참고).
  function parseCSV(text){
    const rows = []; let row = []; let field = ''; let inQuotes = false;
    for(let i=0;i<text.length;i++){
      const c = text[i], next = text[i+1];
      if(inQuotes){
        if(c === '"' && next === '"'){ field += '"'; i++; }
        else if(c === '"'){ inQuotes = false; }
        else field += c;
      } else {
        if(c === '"') inQuotes = true;
        else if(c === ','){ row.push(field); field=''; }
        else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
        else if(c === '\r'){ /* skip */ }
        else field += c;
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(r => r.length>1 || (r[0]||'').trim()!=='');
  }

  // 시트 컬럼 순서(고정, A~L열): 번호, 세부항목, 세세항목, 문제 내용, 보기①, 보기②, 보기③, 보기④, 정답 번호, 해설 및 오답노트, 출처, 구분
  // 실제 CSV 구조: 0행(헤더 1줄, A열엔 시트 제목이 병합되어 같이 붙어나오지만 위치만 보므로 무해함) → 1행부터 바로 데이터.
  // 헤더 문구가 시트마다 살짝 달라도(예: 공백 차이) 깨지지 않도록 이름이 아닌 '열 위치'로 읽는다.
  const DATA_START_ROW = 1; // 0-based 인덱스. 1 = 2번째 행(헤더 다음)부터 데이터.
  const COL = { num:0, c1:1, c2:2, q:3, o1:4, o2:5, o3:6, o4:7, ans:8, exp:9, src:10 };

  function csvRowsToItems(rows){
    if(!rows.length) return null;
    const items = [];
    for(let r=DATA_START_ROW; r<rows.length; r++){
      const row = rows[r];
      if(!row || !row[COL.q] || !row[COL.q].trim()) continue; // 문제 내용이 빈 행은 건너뜀(여백행 등)
      items.push({
        num: Number(row[COL.num]) || items.length+1,
        category1: (row[COL.c1]||'').trim(),
        category2: (row[COL.c2]||'').trim(),
        question: (row[COL.q]||'').trim(),
        options: [row[COL.o1], row[COL.o2], row[COL.o3], row[COL.o4]].map(o=>(o||'').trim()),
        answer: Number(row[COL.ans]) || 1,
        explanation: (row[COL.exp]||'').trim(),
        source: (row[COL.src]||'').trim() || null
      });
    }
    return items;
  }

  // 챕터마다 개별 CSV를 불러온다. 챕터별로 성공/실패가 독립적이며,
  // 특정 챕터 요청이 실패하면 그 챕터에 한해 이전 캐시(오프라인) → 그것도 없으면 내장 데이터로 대체된다.
  async function loadRemoteQuiz(){
    const entries = Object.entries(SHEET_CSV_URLS).filter(([,url])=>url);
    if(!entries.length) return; // 설정된 링크가 하나도 없으면 내장 데이터만 사용

    await Promise.all(entries.map(async ([key, url])=>{
      try{
        const res = await fetch(url, {cache:'no-store'});
        if(!res.ok) throw new Error('HTTP ' + res.status);
        const text = await res.text();
        const items = csvRowsToItems(parseCSV(text));
        if(items && items.length){
          QUIZ[key] = items;
          delete state.remoteErrors[key];
          try{ await window.storage.set('remote-quiz-cache:'+key, JSON.stringify(items), false); }
          catch(e2){ console.warn('[구글시트] 캐시 저장 실패:', key, e2); }
          return;
        } else {
          console.warn('[구글시트] 헤더가 맞지 않거나 데이터가 없습니다(챕터 유지됨):', key, url);
        }
      }catch(e){ console.warn('[구글시트] 불러오기 실패, 캐시로 대체 시도:', key, e); }

      try{
        const cached = await window.storage.get('remote-quiz-cache:'+key);
        if(cached && cached.value){
          QUIZ[key] = JSON.parse(cached.value);
          delete state.remoteErrors[key];
        } else {
          state.remoteErrors[key] = true; // 실시간 로드도 캐시도 없음 → 내장 데이터 사용 중
        }
      }catch(e){ state.remoteErrors[key] = true; }
    }));
  }
  const META = JSON.parse(document.getElementById('quiz-meta').textContent);
  // 출제기준 목차 청사진: 챕터별 { name(세부항목), subs(세세항목 목록) } 순서 배열.
  // 실제 문제가 없는 세세항목도 여기 있으면 목차에 항상 노출된다(0/0으로 표시).
  const TOC_BLUEPRINT = JSON.parse(document.getElementById('toc-blueprint').textContent);
  const app = document.getElementById('app');

  // 구글시트로 문제 수가 바뀌면 이 값도 다시 계산해야 하므로 let으로 둔다.
  let TOTAL_ALL = Object.values(QUIZ).reduce((a,b)=>a+b.length,0);

  let state = {
    view: 'home', // home | quiz | complete
    chapter: null,
    index: 0,
    progress: {},   // { chapterKey: { qIndexAsStr: {selected, correct} } }
    reviewCounts: {}, // { chapterKey: number } - 단원별 완주(회독) 횟수. progress와 별개로 영구 보존.
    sheetOpen: false, // 해설 시트 표시 여부(일시 상태, 저장하지 않음)
    remoteErrors: {},  // { chapterKey: true } - 구글시트 URL은 설정됐지만 로드도/캐시도 실패한 챕터(진단용, 저장하지 않음)
    storageOk: null,   // true/false/null(테스트 전) - 저장소(window.storage) 실제 동작 여부 자체진단 결과
    expandedChapter: null, // 홈 화면에서 목차(대분류>세세항목)를 카드 안에 펼쳐놓은 챕터키(일시 상태, 저장하지 않음)
    filterIndices: null, // 세세항목 등 부분 학습 세션에서 사용할 QUIZ[key] 안의 인덱스 목록(일시 상태, 저장하지 않음)
    filterKind: null,    // 'wrong' | 'subtopic' | null - 현재 부분 학습 세션의 종류(일시 상태, 저장하지 않음)
    excluded: {},          // { chapterKey: { idx: true } } - 오답노트 대상에서 수동으로 뺀 문제 목록(영구 저장)
    wrongMastery: { pool: {}, streak: {} }, // pool: 한 번이라도 틀려서 오답노트 대상에 들어간 문제, streak: 그 문제의 현재 연속 정답 횟수(둘 다 영구 저장)
    globalWrongReview: false, // 메인화면 "전체 오답 복습" 진입 여부(일시 상태, 저장하지 않음) - 챕터를 순차로 이어가는 데 사용
    updateAvailable: false // 앱 코드(GitHub 배포본) 새 버전이 감지됐는지 여부(일시 상태, 저장하지 않음)
  };

  // 앱 실행 시 저장소가 실제로 쓰기/읽기 가능한지 스스로 테스트한다.
  // (사파리 프라이빗 모드, 저장소 차단 설정 등에서는 조용히 실패하므로 화면에 바로 보여주기 위함)
  async function testStorage(){
    try{
      const mark = 'ok-' + Date.now();
      await window.storage.set('__diag__', mark, false);
      const r = await window.storage.get('__diag__');
      state.storageOk = !!(r && r.value === mark);
    }catch(e){
      state.storageOk = false;
    }
  }

  // ---------- persistence ----------
  async function loadProgress(){
    await loadRemoteQuiz();
    await testStorage();
    // 구글시트로 챕터별 문제 수가 바뀌었을 수 있으므로 여기서 다시 집계한다.
    TOTAL_ALL = allChapterKeys().reduce((sum,k)=> sum + (QUIZ[k] ? QUIZ[k].length : 0), 0);
    document.title = `공공조달관리사 ${TOTAL_ALL}제 · 2주 완성 퀴즈`;
    try{
      const res = await window.storage.get('progress');
      if(res && res.value){
        const parsed = JSON.parse(res.value);
        state.progress = parsed.progress || {};
        if(parsed.lastChapter) state.chapter = parsed.lastChapter;
      }
    }catch(e){ /* no saved progress yet */ }
    try{
      const rc = await window.storage.get('review-counts');
      if(rc && rc.value){ state.reviewCounts = JSON.parse(rc.value) || {}; }
    }catch(e){ /* no saved review counts yet */ }
    try{
      const ex = await window.storage.get('excluded-wrong');
      if(ex && ex.value){ state.excluded = JSON.parse(ex.value) || {}; }
    }catch(e){ /* no saved exclusions yet */ }
    try{
      const wm = await window.storage.get('wrong-mastery');
      if(wm && wm.value){
        const parsed = JSON.parse(wm.value);
        state.wrongMastery = { pool: parsed.pool || {}, streak: parsed.streak || {} };
      }
    }catch(e){ /* no saved mastery data yet */ }
    // 하위호환: 숙달도 기능 도입 전에 기록된 오답은 wrongMastery 개념이 없었으므로,
    // 이미 progress에 correct:false로 남아있는 문제를 최초 실행 시 자동으로 풀에 편입시킨다(데이터 유실 방지).
    Object.keys(state.progress).forEach(key=>{
      Object.keys(state.progress[key]).forEach(idxStr=>{
        const i = Number(idxStr);
        const rec = state.progress[key][i];
        if(rec && rec.correct===false){
          if(!state.wrongMastery.pool[key]) state.wrongMastery.pool[key] = {};
          if(state.wrongMastery.pool[key][i] === undefined) state.wrongMastery.pool[key][i] = true;
        }
      });
    });
    render();
  }
  async function saveProgress(){
    try{
      await window.storage.set('progress', JSON.stringify({progress: state.progress, lastChapter: state.chapter}));
    }catch(e){ /* best effort */ }
  }
  async function saveReviewCounts(){
    try{
      await window.storage.set('review-counts', JSON.stringify(state.reviewCounts));
    }catch(e){ /* best effort */ }
  }
  async function saveExcluded(){
    try{
      await window.storage.set('excluded-wrong', JSON.stringify(state.excluded));
    }catch(e){ /* best effort */ }
  }
  async function saveWrongMastery(){
    try{
      await window.storage.set('wrong-mastery', JSON.stringify(state.wrongMastery));
    }catch(e){ /* best effort */ }
  }
  function reviewCount(key){
    return state.reviewCounts[key] || 0;
  }
  function markChapterCompleted(key){
    state.reviewCounts[key] = reviewCount(key) + 1;
    saveReviewCounts();
  }

  function chapterStats(key){
    const total = QUIZ[key].length;
    const answered = state.progress[key] ? Object.keys(state.progress[key]).length : 0;
    const correct = state.progress[key] ? Object.values(state.progress[key]).filter(a=>a.correct).length : 0;
    return {total, answered, correct};
  }

  const MASTERY_TARGET = 10; // 오답노트에서 완전히 빠지려면 필요한 "연속 정답" 횟수

  function isExcludedFromWrong(key, idx){
    return !!(state.excluded[key] && state.excluded[key][idx]);
  }

  // 특정 문제의 현재 연속 정답 스트릭(0~10). 오답노트 화면의 숙달도 점 표시에 쓰인다.
  function masteryStreak(key, idx){
    return (state.wrongMastery.streak[key] && state.wrongMastery.streak[key][idx]) || 0;
  }

  // "오답노트 대상 풀"에 들어있고, 아직 연속 정답 10회를 못 채웠고, 수동 제외도 안 된 문제만 남긴다.
  // 풀에 들어가는 시점은 한 번이라도 틀렸을 때(selectAnswer에서 등록)이며,
  // 이후 맞히면 스트릭 +1, 틀리면 스트릭이 0으로 리셋된다(연속으로 10번 맞혀야 함).
  function wrongIndices(key){
    const pool = state.wrongMastery.pool[key] || {};
    return Object.keys(pool)
      .map(Number)
      .filter(i => !isExcludedFromWrong(key, i) && masteryStreak(key, i) < MASTERY_TARGET)
      .sort((a,b)=>a-b);
  }
  function wrongCount(key){ return wrongIndices(key).length; }

  // 오답노트 대상에서 특정 문제를 수동으로 제외한다. 숙달도(연속 정답 횟수)와 무관하게,
  // 사용자가 "이제 이 문제는 그만 보고 싶다"고 판단했을 때 누르는 버튼용.
  // 이후 이 문제를 다시 틀리더라도 제외 상태는 풀리지 않는다(직접 해제하기 전까지 유지).
  function excludeFromWrong(key, idx){
    if(!state.excluded[key]) state.excluded[key] = {};
    state.excluded[key][idx] = true;
    saveExcluded();
  }

  // 챕터 안의 문제들을 세부항목(category1) > 세세항목(category2) 2단 구조로 묶는다.
  // 시트에 등장하는 순서가 아니라, 출제기준(TOC_BLUEPRINT)의 순서를 그대로 따른다.
  // 문제가 아직 하나도 없는 세세항목도 0/0으로 목차에 표시된다.
  // 반환 형식: [{ num:'1', name:'공공조달의 정의 및 목적', subs:[{ num:'1-1', name:'공공조달의 정의', total, answered }, ...] }, ...]
  function getChapterToc(key){
    const blueprint = TOC_BLUEPRINT[key] || [];
    const list = QUIZ[key] || [];

    // 문제들을 (세부항목, 세세항목) 이름 기준으로 미리 묶어둔다. 원본에 붙은 "1. " 같은 번호는
    // 출제기준 쪽과 표기가 다를 수 있어 매칭에서 제외하고, 순수 이름으로만 비교한다.
    const qMap = {}; // "세부항목||세세항목" -> {total, answered}
    list.forEach((q, i)=>{
      const c1 = (q.category1 || '').trim().replace(/^\d+\.\s*/, '') || '(세부항목 없음)';
      const c2 = (q.category2 || '').trim().replace(/^\d+\.\s*/, '') || '(세세항목 없음)';
      const mk = c1 + '||' + c2;
      if(!qMap[mk]) qMap[mk] = { total: 0, answered: 0 };
      qMap[mk].total++;
      if(state.progress[key] && state.progress[key][i]) qMap[mk].answered++;
    });

    return blueprint.map((g, gi)=>({
      num: String(gi+1),
      name: g.name,
      subs: g.subs.map((subName, si)=>{
        const stat = qMap[g.name + '||' + subName] || { total: 0, answered: 0 };
        return {
          num: `${gi+1}-${si+1}`,
          name: subName,
          total: stat.total,
          answered: stat.answered
        };
      })
    }));
  }

  function allChapterKeys(){
    return META.subjects.reduce((acc, subj)=>acc.concat(subj.chapters), []);
  }

  // 챕터키의 "과목 안에서의" 순번(1부터 시작). 과목이 바뀌면 다시 1부터 매긴다.
  function chapterNumber(key){
    for(const subj of META.subjects){
      const idx = subj.chapters.indexOf(key);
      if(idx >= 0) return idx + 1;
    }
    return 1;
  }

  // 1~13 같은 숫자를 로마숫자 문자열로 변환한다(주요항목 말머리용).
  function toRoman(num){
    const table = [[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],
      [50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
    let n = num, out = '';
    for(const [v, s] of table){ while(n>=v){ out += s; n -= v; } }
    return out || String(num);
  }

  // META.names에는 "I. 공공조달 개요"처럼 로마숫자 접두사가 그대로 들어있다.
  // 홈 화면 카드처럼 옆에 번호 배지가 이미 따로 있는 자리에서는 이 접두사를 빼서
  // "Ⅰ  I. 공공조달 개요" 같은 중복 표기를 막는다(배지 없는 화면에서는 원문 그대로 사용).
  function stripLeadingNumber(str){
    return (str || '').replace(/^[IVXLCDM]+\.\s*/, '');
  }

  function overallStats(){
    let answered=0, correct=0;
    allChapterKeys().forEach(k=>{
      const s = chapterStats(k);
      answered += s.answered; correct += s.correct;
    });
    return {answered, correct, total: TOTAL_ALL};
  }

  function escapeHtml(str){
    if(str===null || str===undefined) return '';
    return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  // ---------- render router ----------
  // keepScroll이 true면 현재 스크롤 위치를 유지한다(해설 시트 토글 등 화면 전환이 아닌 경우).
  function render(keepScroll){
    const y = window.scrollY;
    if(state.view==='home') renderHome();
    else if(state.view==='quiz') renderQuiz();
    else if(state.view==='complete') renderComplete();
    if(keepScroll) window.scrollTo(0, y);
    else window.scrollTo(0,0);
  }

  function renderHome(){
    const os = overallStats();
    const totalWrong = totalWrongCount();
    let chaptersHtml = '';
    META.subjects.forEach(subj=>{
      const subjTotal = subj.chapters.reduce((a,k)=>a+QUIZ[k].length,0);
      const subjAnswered = subj.chapters.reduce((a,k)=>a+chapterStats(k).answered,0);
      chaptersHtml += `<div class="section-title"><span>${escapeHtml(subj.title)}</span><span class="cnt">${subjAnswered}/${subjTotal}</span></div>`;
      subj.chapters.forEach(key=>{
        const s = chapterStats(key);
        const pct = s.total ? Math.round(s.answered/s.total*100) : 0;
        const done = s.answered>=s.total && s.total>0;
        const rc = reviewCount(key);
        const wc = wrongCount(key);
        const hasError = !!state.remoteErrors[key];
        const num = chapterNumber(key); // 전체 순번(1~13)
        const toc = getChapterToc(key);
        const subCount = toc.reduce((a,g)=>a+g.subs.length, 0);
        const expanded = state.expandedChapter === key;
        let tocInlineHtml = '';
        if(expanded){
          tocInlineHtml = toc.map(g => `
            <div class="toc-group">
              <div class="toc-group-title">${g.num}. ${escapeHtml(g.name)}</div>
              <div class="subtopic-list">
                ${g.subs.map(s => `
                  <button class="subtopic-item${s.total===0?' empty':''}" data-key="${key}" data-raw="${escapeHtml(s.name)}">
                    <span class="subtopic-name">${s.num}. ${escapeHtml(s.name)}</span>
                    <span class="subtopic-count">${s.total===0? '준비중' : s.answered+'/'+s.total}</span>
                  </button>`).join('')}
              </div>
            </div>`).join('');
        }
        chaptersHtml += `
          <div class="chapter-card" data-key="${key}">
            <div class="chapter-num">${toRoman(num)}</div>
            <div class="chapter-info">
              <div class="name-row">
                <div class="name">${escapeHtml(stripLeadingNumber(META.names[key]))}</div>
                ${subCount>1? `<button class="expand-btn" data-key="${key}">${expanded?'−':'+'}</button>` : ''}
              </div>
              <div class="progress-row">
                <div class="progress-track"><div class="progress-fill ${done?'done':''}" style="width:${pct}%"></div></div>
                <div class="pct">${s.answered}/${s.total}</div>
              </div>
              ${wc>0? `<button class="wrong-btn" data-key="${key}" style="margin-top:7px;font-size:11px;font-weight:700;color:var(--seal);background:var(--seal-tint);border:1px solid #E9C2BC;border-radius:999px;padding:3px 10px;">✕ 틀린문제 ${wc}개 다시풀기</button>` : ''}
              ${hasError? `<div style="margin-top:7px;font-size:10.5px;color:var(--wrong);">⚠ 시트 연동 실패 — 내장 문제로 표시 중</div>` : ''}
              ${tocInlineHtml}
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;">
              <div class="chapter-badge" style="background:var(--paper-deep);color:var(--navy);">${rc}회독</div>
              ${done?'<div class="chapter-badge">완료</div>':''}
            </div>
          </div>`;
      });
    });

    app.innerHTML = `
      <div class="topbar">
        <div class="brand"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#F5F1E7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v4h4"/><path d="M9 13l2 2 4-4"/></svg></span>공공조달관리사</div>
        <div style="display:flex; align-items:center; gap:6px;">
          <button id="manualRefreshBtn" title="문제/앱 새로고침" style="background:var(--card); border:1px solid var(--line-strong); border-radius:999px; width:28px; height:28px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:13px; color:var(--ink-soft); flex-shrink:0;">🔄</button>
          <div class="stats-chip">전체 ${os.answered}/${os.total}</div>
        </div>
      </div>
      ${state.updateAvailable? `
      <div style="background:var(--correct-tint);color:#204636;border-bottom:1px solid #BFDBCB;padding:10px 18px;font-size:12.5px;line-height:1.6;display:flex;align-items:center;justify-content:space-between;gap:10px;">
        <span>🆕 <b>새 버전이 있습니다.</b> 새로고침하면 최신 앱으로 업데이트돼요.</span>
        <button id="reloadAppBtn" style="background:#204636;color:#fff;border:none;border-radius:7px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;">새로고침</button>
      </div>` : ''}
      ${state.storageOk===false? `
      <div style="background:var(--wrong-tint);color:#6E211A;border-bottom:1px solid #E9C2BC;padding:10px 18px;font-size:12.5px;line-height:1.6;">
        ⚠️ <b>이 브라우저에서는 학습 기록이 저장되지 않습니다.</b><br>
        사파리 프라이빗(비공개) 브라우징 모드이거나, 설정에서 웹사이트 데이터 저장이 차단되어 있을 수 있어요. 일반 브라우징 모드로 열어주세요.
      </div>` : ''}
      <div class="hero">
        <div class="kicker">14일이면 확실하게 끝낸다</div>
        <h1>공공조달관리사<br><em>${os.total}제</em> 2주 완성</h1>
        <p class="sub">실전 문제 ${os.total}개로 꿰뚫는 공공조달 실무.<br>출퇴근길에도, 화장실에서도 — 끝없이 도는 회독 머신.</p>
        <div class="cover-facts">
          <div><b>${os.total}</b><span>총 문항</span></div>
          <div><b>${os.answered}</b><span>학습 완료</span></div>
        </div>
        <button class="btn btn-primary" id="resumeBtn">${os.answered>0? '이어서 풀기' : '지금 바로 풀어보기'}</button>
        ${totalWrong>0? `<button class="btn btn-review" id="globalWrongBtn">🔁 전체 틀린 문제 ${totalWrong}개 복습하기</button>` : ''}
      </div>
      <div class="section-wrap">${chaptersHtml}</div>
    `;

    document.getElementById('resumeBtn').onclick = ()=>{
      let key = state.chapter;
      if(!key || !QUIZ[key]) key = META.subjects[0].chapters[0];
      openChapter(key, true);
    };
    const globalWrongBtn = document.getElementById('globalWrongBtn');
    if(globalWrongBtn) globalWrongBtn.onclick = ()=> startGlobalWrongReview();
    document.querySelectorAll('.chapter-card').forEach(el=>{
      el.onclick = ()=> openChapter(el.dataset.key, true);
    });
    document.querySelectorAll('.wrong-btn').forEach(el=>{
      el.onclick = (e)=>{ e.stopPropagation(); startWrongReview(el.dataset.key); };
    });
    document.querySelectorAll('.expand-btn').forEach(el=>{
      el.onclick = (e)=>{
        e.stopPropagation();
        const key = el.dataset.key;
        state.expandedChapter = (state.expandedChapter === key) ? null : key;
        render(true); // 펼침/접힘은 화면 전환이 아니므로 스크롤 위치 유지
      };
    });
    document.querySelectorAll('.subtopic-item[data-raw]').forEach(el=>{
      el.onclick = (e)=>{
        e.stopPropagation();
        const key = el.dataset.key;
        const raw = el.dataset.raw;
        startSubTopic(key, raw);
      };
    });
  }

  // filterIndices를 넘기면 QUIZ[key] 중 해당 인덱스들만으로 구성된 '부분 학습' 세션이 시작된다.
  // 답변은 항상 진짜 인덱스(state.index)로 QUIZ[key]/state.progress[key]에 기록되므로,
  // 세세항목만 따로 풀어도 실제 챕터 진행률에 그대로 반영된다.
  function openChapter(key, resume, filterIndices, filterKind){
    state.chapter = key;
    state.filterIndices = filterIndices || null;
    state.filterKind = state.filterIndices ? (filterKind || null) : null;
    const indices = state.filterIndices || QUIZ[key].map((_,i)=>i);
    if(resume){
      let pos = 0;
      for(let p=0; p<indices.length; p++){
        const realIdx = indices[p];
        const answered = state.progress[key] && state.progress[key][realIdx];
        if(!answered){ pos = p; break; }
        if(p === indices.length-1) pos = indices.length-1;
      }
      state.index = indices[pos];
    } else {
      state.index = indices[0];
    }
    state.view = 'quiz';
    saveProgress();
    render();
  }

  // 이전에 틀린 문제만 골라 이어서 풀도록 연다. 세세항목 학습과 동일하게 실제 key의 인덱스만
  // 필터링하므로, 여기서 맞히면 그 챕터의 진짜 진행률에 바로 반영되어 다음부터 자동으로 목록에서 빠진다.
  function startWrongReview(key){
    const idxs = wrongIndices(key);
    if(!idxs.length) return;
    openChapter(key, true, idxs, 'wrong');
  }

  // 전체 13개 챕터에 걸친 오답 총 개수(메인화면 "전체 오답 복습" UI에 표시).
  function totalWrongCount(){
    return allChapterKeys().reduce((sum, k) => sum + wrongCount(k), 0);
  }

  // 메인화면에서 "전체 오답 복습"을 눌렀을 때 진입점. 오답이 있는 첫 챕터부터 시작하고,
  // 완료 화면에서 다음 챕터로 자동으로 이어간다(goHomeOrContinueGlobalReview 참고).
  // 기존 startWrongReview/openChapter 로직을 그대로 재사용할 뿐, 별도의 새 퀴즈 진행 로직은 만들지 않는다.
  function startGlobalWrongReview(){
    const key = allChapterKeys().find(k => wrongCount(k) > 0);
    if(!key){ alert('현재 틀린 문제가 없습니다! 🎉'); return; }
    state.globalWrongReview = true;
    startWrongReview(key);
  }

  // 챕터 안에서 특정 세세항목(category2)에 해당하는 문제만 골라 이어서 풀도록 연다.
  // 번호("1. " 등) 접두사는 무시하고 순수 이름으로 매칭한다(출제기준 청사진과 표기 방식이 다를 수 있어서).
  // 별도의 가상 챕터를 만들지 않고 실제 key의 인덱스만 필터링하므로,
  // 여기서 푼 답은 그 챕터의 진짜 진행률(state.progress[key])에 그대로 기록·누적된다.
  function startSubTopic(key, topicName){
    const indices = [];
    (QUIZ[key] || []).forEach((q, i)=>{
      const name = (q.category2 || '').trim().replace(/^\d+\.\s*/, '') || '(세세항목 없음)';
      if(name === topicName) indices.push(i);
    });
    if(!indices.length){
      alert('이 세세항목은 아직 등록된 문제가 없습니다.\n출제기준에는 있지만 구글시트에 문제가 추가되지 않은 상태예요.');
      return;
    }
    openChapter(key, true, indices, 'subtopic'); // resume=true: 이 세세항목 안에서 이미 푼 문제는 건너뛰고 이어서 시작
  }

  function renderQuiz(){
    const key = state.chapter;
    // filterIndices가 있으면 세세항목 등 '부분 학습' 세션이다. state.index는 항상 QUIZ[key] 안의 진짜 인덱스이고,
    // pos는 현재 세션(전체 또는 필터된 목록) 안에서의 표시 위치(1/N, 진행바 등)이다.
    const indices = state.filterIndices || QUIZ[key].map((_,i)=>i);
    const idx = state.index; // 진짜 배열 인덱스 (진행률 저장 키로 사용)
    const pos = indices.indexOf(idx); // 이 세션에서의 표시 순번
    const q = QUIZ[key][idx];
    const saved = state.progress[key] && state.progress[key][idx];
    const total = indices.length;
    const os = overallStats();
    const isFiltered = !!state.filterIndices;
    const isWrongSession = state.filterKind === 'wrong';
    const streak = masteryStreak(key, idx);

    const letters = ['①','②','③','④'];
    let optionsHtml = '';
    q.options.forEach((opt, i)=>{
      let cls = 'option selectable';
      if(saved){
        cls = 'option';
        if(i===q.answer-1) cls += ' correct';
        else if(i===saved.selected) cls += ' wrong';
        else cls += ' dim';
      }
      optionsHtml += `<div class="${cls}" data-i="${i}"><div class="num">${letters[i]}</div><div>${escapeHtml(opt)}</div></div>`;
    });

    // 해설은 모바일에서는 하단 시트(모달)로, 태블릿/PC(768px+)에서는 CSS로 우측 패널에 인라인 표시된다.
    // state.sheetOpen이 true일 때만 뜨며, 답을 고른 직후 자동으로 열린다.
    let sheetHtml = '';
    if(saved && state.sheetOpen){
      const ok = saved.correct;
      const isLast = pos===total-1;
      const justMastered = isWrongSession && ok && streak>=MASTERY_TARGET;
      sheetHtml = `
        <div class="sheet-dim" id="sheetDim"></div>
        <div class="sheet" role="dialog" aria-modal="true">
          <div class="grip"></div>
          <div class="sheet-head ${ok?'ok':'no'}">
            <span>${ok? '⭕ 정답입니다!' : '❌ 오답입니다'}</span>
            <button id="sheetCloseX" class="sheet-close-x" aria-label="닫기">✕</button>
          </div>
          <div class="sheet-body">
            ${justMastered? `<div style="background:var(--correct-tint);color:#204636;border:1px solid #BFDBCB;border-radius:9px;padding:12px 14px;margin-bottom:14px;font-weight:700;font-size:13.5px;">🎉 연속 정답 ${MASTERY_TARGET}회 달성! 이 문제는 오답노트에서 제외됩니다.</div>` : ''}
            ${escapeHtml(q.explanation||'해설이 제공되지 않았습니다.')}${q.source? `<div class="sheet-src">§ 출처: ${escapeHtml(q.source)}</div>` : ''}
            ${isWrongSession? `<button id="excludeBtn" style="margin-top:14px;width:100%;background:var(--paper-deep);border:1px solid var(--line-strong);border-radius:9px;padding:10px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;">✕ 이 문제는 오답노트에서 그만 보기</button>` : ''}
          </div>
          <div class="sheet-foot">
            <button class="nav-btn" id="sheetClose">닫고 보기</button>
            <button class="nav-btn primary" id="sheetNext">${isLast? (isFiltered? '학습 완료 →' : '단원 완료 →') : '다음 문제 →'}</button>
          </div>
        </div>`;
    }

    app.innerHTML = `
      <div class="quiz-header-sticky">
        <div class="topbar topbar-quiz" id="quizTopbar">
          <div class="brand"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#F5F1E7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v4h4"/><path d="M9 13l2 2 4-4"/></svg></span>공공조달관리사</div>
          <div class="stats-chip">${isFiltered? `📎 ${escapeHtml(q.category2||'')}` : escapeHtml(META.names[key])}</div>
        </div>
        <div class="progress-bar-top"><div style="width:${(pos)/total*100}%"></div></div>
      </div>
      <div class="quiz-wrap">
        <div class="quiz-head">
          <div class="crumb"><b>${escapeHtml(q.category1||'')}</b><br>${escapeHtml(q.category2||'')}</div>
          <div class="qno">${pos+1} / ${total}</div>
        </div>
        ${isWrongSession? `
        <div class="mastery-row">
          <span class="mastery-label">🔥 숙달도 ${streak}/${MASTERY_TARGET}${streak>=MASTERY_TARGET? ' · 완료!' : ''}</span>
          <span class="mastery-dots">${Array.from({length:MASTERY_TARGET},(_,di)=>`<span class="mastery-dot${di<streak?' filled':''}"></span>`).join('')}</span>
        </div>` : ''}
        <div class="quiz-split">
          <div class="qmain">
            <div class="qcard">
              <div class="qtext">${escapeHtml(q.question)}</div>
            </div>
            <div class="options">${optionsHtml}</div>
            ${saved? `<button class="nav-btn" id="showSheetBtn" style="width:100%;margin-top:18px;font-size:14px;padding:12px;">📖 해설 다시 보기</button>` : ''}
            <div class="nav-row">
              <button class="nav-btn" id="prevBtn" ${pos===0?'disabled':''}>← 이전</button>
              <button class="nav-btn primary" id="nextBtn" ${saved? '' : 'disabled'}>${pos===total-1? (isFiltered? '학습 완료 →' : '단원 완료 →') : '다음 →'}</button>
            </div>
          </div>
          <div class="qside">
            <div class="sheet-inline-slot">${sheetHtml}</div>
            ${(!saved || !state.sheetOpen)? `<div class="qside-placeholder">정답을 선택하면<br>여기에 해설이 표시됩니다.</div>` : ''}
          </div>
        </div>
        <div class="inline-stats">
          <span>전체 진행 ${os.answered}/${os.total}</span>
          <span>이 단원 정답률 ${(()=>{const s=chapterStats(key); return s.answered? Math.round(s.correct/s.answered*100):0;})()}%</span>
        </div>
        <div class="kbd-hint"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd> 답 선택 &nbsp; <kbd>Enter</kbd> 다음 &nbsp; <kbd>PgUp</kbd>/<kbd>PgDn</kbd> 이동</div>
      </div>
    `;

    document.getElementById('quizTopbar').onclick = ()=>{ state.view='home'; saveProgress(); render(); };

    document.getElementById('prevBtn').onclick = ()=> goto(pos-1);
    document.getElementById('nextBtn').onclick = ()=> {
      if(!saved) return;
      if(pos===total-1){ if(!isFiltered) markChapterCompleted(key); state.view='complete'; render(); }
      else goto(pos+1);
    };
    if(!saved){
      document.querySelectorAll('.option.selectable').forEach(el=>{
        el.onclick = ()=> selectAnswer(Number(el.dataset.i));
      });
    }

    // ----- 해설 시트 관련 -----
    const goNext = ()=>{
      state.sheetOpen = false;
      if(pos===total-1){ if(!isFiltered) markChapterCompleted(key); state.view='complete'; render(); }
      else goto(pos+1);
    };
    const showBtn = document.getElementById('showSheetBtn');
    if(showBtn) showBtn.onclick = ()=>{ state.sheetOpen = true; render(true); };
    const sheetNext = document.getElementById('sheetNext');
    if(sheetNext) sheetNext.onclick = goNext;
    const sheetClose = document.getElementById('sheetClose');
    if(sheetClose) sheetClose.onclick = ()=>{ state.sheetOpen = false; render(true); };
    const sheetCloseX = document.getElementById('sheetCloseX');
    if(sheetCloseX) sheetCloseX.onclick = ()=>{ state.sheetOpen = false; render(true); };
    const sheetDim = document.getElementById('sheetDim');
    if(sheetDim) sheetDim.onclick = ()=>{ state.sheetOpen = false; render(true); };
    const excludeBtn = document.getElementById('excludeBtn');
    if(excludeBtn) excludeBtn.onclick = ()=>{
      excludeFromWrong(key, idx);
      goNext(); // 제외 후 바로 다음 문제로 넘어간다
    };
  }

  // newPos는 '이 세션 안에서의 표시 순번'이다(필터 세션이면 필터 목록 안 순번, 아니면 챕터 내 순번).
  function goto(newPos){
    const key = state.chapter;
    const indices = state.filterIndices || QUIZ[key].map((_,i)=>i);
    if(newPos<0 || newPos>=indices.length) return;
    state.index = indices[newPos];
    state.sheetOpen = false; // 문제를 옮기면 해설 시트는 닫는다
    render();
  }

  function selectAnswer(i){
    const key = state.chapter, idx = state.index;
    const q = QUIZ[key][idx];
    const correct = (i === q.answer-1);
    if(!state.progress[key]) state.progress[key] = {};
    state.progress[key][idx] = {selected:i, correct};

    // 오답노트 숙달도 갱신: 틀리면 풀에 등록하고 스트릭 리셋, 이미 풀에 있는 문제를 맞히면 스트릭 +1.
    // (어느 화면에서 풀든 동일하게 적용 — 전체 챕터 풀이 중에 맞혀도 숙달도에 반영된다)
    if(!state.wrongMastery.pool[key]) state.wrongMastery.pool[key] = {};
    if(!state.wrongMastery.streak[key]) state.wrongMastery.streak[key] = {};
    if(correct){
      if(state.wrongMastery.pool[key][idx]){
        state.wrongMastery.streak[key][idx] = (state.wrongMastery.streak[key][idx] || 0) + 1;
      }
    } else {
      state.wrongMastery.pool[key][idx] = true;
      state.wrongMastery.streak[key][idx] = 0;
    }
    saveWrongMastery();

    state.sheetOpen = true; // 정답/오답 상관없이 해설 시트를 띄운다
    saveProgress();
    render(true);
  }

  function renderComplete(){
    const key = state.chapter;
    const filtered = state.filterIndices;
    const filterKind = state.filterKind;
    let s, topicLabel = '';
    if(filtered){
      // 부분 학습(세세항목 등) 세션: 챕터 전체가 아니라 이번에 실제로 푼 범위 기준으로 통계를 낸다.
      let answered=0, correct=0;
      filtered.forEach(i=>{
        const a = state.progress[key] && state.progress[key][i];
        if(a){ answered++; if(a.correct) correct++; }
      });
      s = { total: filtered.length, answered, correct };
      const first = QUIZ[key][filtered[0]];
      topicLabel = first ? (first.category2 || '') : '';
    } else {
      s = chapterStats(key);
    }
    const pct = s.answered? Math.round(s.correct/s.answered*100) : 0;
    app.innerHTML = `
      <div class="topbar">
        <div class="brand" id="homeBtn2"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#F5F1E7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v4h4"/><path d="M9 13l2 2 4-4"/></svg></span>공공조달관리사</div>
        <div class="stats-chip">${filtered? `📎 ${escapeHtml(topicLabel)}` : escapeHtml(META.names[key])}</div>
      </div>
      <div class="complete-wrap">
        <div class="stamp"><b>${pct}%</b><span>정답률</span></div>
        <h2>${filtered? escapeHtml(topicLabel) : escapeHtml(META.names[key])} 완료</h2>
        <p>총 ${s.total}문항 중 ${s.answered}문항을 풀었습니다.</p>
        ${filtered? '' : `<p style="color:var(--seal);font-weight:700;font-size:13px;margin-top:-14px;">🔁 이 단원 누적 ${reviewCount(key)}회독</p>`}
        <div class="score-row">
          <div class="correct-num"><b>${s.correct}</b><span>정답</span></div>
          <div class="wrong-num"><b>${s.answered-s.correct}</b><span>오답</span></div>
          <div><b>${s.total}</b><span>총 문항</span></div>
        </div>
        <button class="btn btn-primary" id="retryBtn">처음부터 다시 풀기</button>
        <div style="height:10px"></div>
        <button class="btn btn-ghost" id="backHomeBtn">단원 목록으로</button>
      </div>
    `;
    document.getElementById('homeBtn2').onclick = ()=>{ goHomeOrContinueGlobalReview(); };
    document.getElementById('backHomeBtn').onclick = ()=>{ goHomeOrContinueGlobalReview(); };
    document.getElementById('retryBtn').onclick = ()=>{
      if(filtered){
        // 필터 범위(예: 이 세세항목)에 해당하는 기록만 지우고, 챕터의 다른 문제 기록은 건드리지 않는다.
        filtered.forEach(i=>{ if(state.progress[key]) delete state.progress[key][i]; });
      } else {
        delete state.progress[key];
      }
      saveProgress();
      openChapter(key, false, filtered, filterKind);
    };
  }

  // 전체 오답 복습(state.globalWrongReview) 중일 때만 다음 챕터의 오답으로 자동 이어간다.
  // 일반 완료 화면(단일 챕터/세세항목)에서는 기존 그대로 홈으로 이동한다.
  function goHomeOrContinueGlobalReview(){
    if(state.globalWrongReview){
      const nextKey = allChapterKeys().find(k => wrongCount(k) > 0);
      if(nextKey){
        startWrongReview(nextKey); // 기존 startWrongReview 로직 그대로 재사용
        return;
      }
      state.globalWrongReview = false;
      alert('🎉 전체 오답 복습을 모두 마쳤습니다!');
    }
    state.view = 'home';
    render();
  }

  // ---------- keyboard shortcuts (mirrors original VBA quiz mode) ----------
  document.addEventListener('keydown', (e)=>{
    if(state.view!=='quiz') return;
    const key = state.chapter, idx = state.index;
    const indices = state.filterIndices || QUIZ[key].map((_,i)=>i);
    const pos = indices.indexOf(idx);
    const total = indices.length;
    const saved = state.progress[key] && state.progress[key][idx];
    if(['1','2','3','4'].includes(e.key) && !saved){
      selectAnswer(Number(e.key)-1);
    } else if(e.key==='Escape' && state.sheetOpen){
      state.sheetOpen = false; render(true);
    } else if((e.key==='Enter' || e.key==='PageDown') && saved){
      state.sheetOpen = false;
      if(pos===total-1){ if(!state.filterIndices) markChapterCompleted(key); state.view='complete'; render(); }
      else goto(pos+1);
    } else if(e.key==='PageUp'){
      goto(pos-1);
    }
  });

  // ====== 비밀번호 게이트 ======
  async function fetchExpectedPassword(){
    const res = await fetch(PASSWORD_CSV_URL, {cache:'no-store'});
    if(!res.ok) throw new Error('fetch failed');
    const text = await res.text();
    const rows = parseCSV(text);
    const first = rows[0] && rows[0][0] ? rows[0][0].trim() : '';
    return first;
  }

  function renderLock(errorMsg){
    app.innerHTML = `
      <div class="hero">
        <div class="kicker">비공개 학습 자료</div>
        <h1>비밀번호를<br>입력해주세요</h1>
        <p class="sub">공유받은 비밀번호를 입력하면 계속 이용하실 수 있습니다.</p>
        <div style="max-width:280px;margin:0 auto;">
          <input id="pwInput" type="password" inputmode="text" placeholder="비밀번호"
            style="width:100%;padding:13px 14px;border:1.4px solid var(--line-strong);border-radius:11px;font-size:15px;margin-bottom:10px;box-sizing:border-box;">
          ${errorMsg? `<div style="color:var(--wrong);font-size:12.5px;margin-bottom:10px;">${escapeHtml(errorMsg)}</div>` : ''}
          <button class="btn btn-primary" id="pwSubmit" style="width:100%;">확인</button>
        </div>
      </div>
    `;
    const submit = async ()=>{
      const val = document.getElementById('pwInput').value.trim();
      const btn = document.getElementById('pwSubmit');
      btn.textContent = '확인 중...'; btn.disabled = true;
      try{
        const expected = await fetchExpectedPassword();
        if(expected && val === expected){
          await window.storage.set(PASSWORD_STORAGE_KEY, '1', false);
          boot(true);
        } else {
          renderLock('비밀번호가 올바르지 않습니다.');
        }
      }catch(e){
        renderLock('확인 중 오류가 발생했습니다. 인터넷 연결을 확인해주세요.');
      }
    };
    document.getElementById('pwSubmit').onclick = submit;
    document.getElementById('pwInput').addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
    document.getElementById('pwInput').focus();
  }

  async function boot(alreadyUnlocked){
    if(!PASSWORD_CSV_URL){ loadProgress(); return; } // 비밀번호 미설정 시 바로 시작
    if(alreadyUnlocked){ loadProgress(); return; }
    try{
      const saved = await window.storage.get(PASSWORD_STORAGE_KEY);
      if(saved && saved.value === '1'){ loadProgress(); return; }
    }catch(e){ /* 저장 기록 없으면 잠금화면 표시 */ }
    renderLock();
  }

  boot(false);

  // ---------- 자동/수동 새로고침 (구글시트 데이터 + 앱 코드 업데이트 감지) ----------
  const AUTO_REFRESH_INTERVAL = 60 * 60 * 1000; // 1시간
  let lastAutoRefresh = Date.now();
  let appSourceBaseline = null; // 최초 로드 시점의 원본 HTML 텍스트(코드 변경 비교 기준)

  // 지금 배포된 index.html 원문을 받아와 최초 로드 시점과 다른지 비교한다.
  // (라이브 DOM은 JS가 계속 바꾸므로 비교 기준이 될 수 없어, 서버의 "원본 파일 텍스트"끼리 비교한다)
  async function checkForAppUpdate(){
    try{
      const res = await fetch(location.href, {cache:'no-store'});
      const latest = await res.text();
      if(appSourceBaseline === null){ appSourceBaseline = latest; return; } // 최초 1회는 기준값만 저장
      if(latest !== appSourceBaseline){ state.updateAvailable = true; }
    }catch(e){ /* 오프라인 등으로 실패하면 조용히 무시 */ }
  }

  // 구글시트 문제 데이터 + 앱 코드 업데이트를 함께 확인한다.
  // force=true면 1시간 쓰로틀을 무시하고 즉시 실행한다(수동 새로고침 버튼용).
  async function refreshAll(force){
    const now = Date.now();
    if(!force && now - lastAutoRefresh < AUTO_REFRESH_INTERVAL) return;
    lastAutoRefresh = now;
    await Promise.all([ loadRemoteQuiz(), checkForAppUpdate() ]);
    TOTAL_ALL = allChapterKeys().reduce((sum,k)=> sum + (QUIZ[k] ? QUIZ[k].length : 0), 0);
    document.title = `공공조달관리사 ${TOTAL_ALL}제 · 2주 완성 퀴즈`;
    // 문제를 푸는 도중에는 화면을 건드리지 않는다(스크롤/시트 상태 방해 방지). 홈 화면에서만 다시 그린다.
    if(state.view === 'home') render(true);
  }

  // 홈화면 추가 앱(스탠드얼론)은 접었다 펼쳐도 페이지가 다시 로드되지 않아 자동 재조회가 안 일어난다.
  // visibilitychange는 사파리 일반 탭/홈화면 앱 모두에서 동작하는 표준 이벤트라 여기서 보완하고,
  // 앱을 계속 켜놓고 있는 경우까지 커버하기 위해 setInterval도 함께 둔다. 둘 다 1시간 쓰로틀을 공유한다.
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible') refreshAll(false);
  });
  setInterval(()=> refreshAll(false), AUTO_REFRESH_INTERVAL);

  // 홈 화면 상단 🔄 버튼: 쓰로틀 무시하고 즉시 새로고침
  document.addEventListener('click', (e)=>{
    if(e.target && e.target.id === 'manualRefreshBtn'){
      const btn = e.target;
      const original = btn.textContent;
      btn.textContent = '⏳';
      btn.disabled = true;
      refreshAll(true).finally(()=>{
        btn.textContent = original;
        btn.disabled = false;
      });
    }
    if(e.target && e.target.id === 'reloadAppBtn'){
      location.reload();
    }
  });
})();
</script>

<script>
  // window.storage는 Claude 아티팩트 미리보기 안에서만 기본 제공되는 API다.
  // GitHub Pages 등 실제 웹사이트로 배포했을 때는 window.storage가 존재하지 않으므로,
  // 동일한 인터페이스를 localStorage 기반으로 대체 구현해 학습 진행률·회독수·시트 캐시가 실제로 저장되게 한다.
  if (!window.storage) {
    window.storage = {
      async get(key){
        try{
          const v = localStorage.getItem('gpm:'+key);
          return v===null ? null : {key, value:v};
        }catch(e){ return null; }
      },
      async set(key, value){
        try{ localStorage.setItem('gpm:'+key, value); return {key, value}; }
        catch(e){ return null; }
      },
      async delete(key){
        try{ localStorage.removeItem('gpm:'+key); return {key, deleted:true}; }
        catch(e){ return null; }
      },
      async list(prefix){
        try{
          const p = 'gpm:' + (prefix||'');
          const keys = Object.keys(localStorage).filter(k=>k.startsWith(p)).map(k=>k.slice(4));
          return {keys};
        }catch(e){ return {keys:[]}; }
      }
    };
  }
</script>
</body>
