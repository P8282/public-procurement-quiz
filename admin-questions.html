<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문제 관리 - 공공조달관리사 퀴즈</title>
<style>
  :root{
    --paper:#F5F1E7; --card:#FFFDF7; --ink:#2A2620; --ink-soft:#453F2E;
    --navy:#1B2A47; --navy-2:#2C3E63; --seal:#AE342A; --seal-tint:#F6E4E1;
    --wrong:#AE342A; --correct:#2E6B4F; --line:#E4DCC9; --line-strong:#D8CDB0;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Noto Sans KR', -apple-system, sans-serif; min-height:100vh;
  }
  .topbar{
    background:var(--navy); color:#F5F1E7; padding:16px 20px;
    font-weight:800; font-size:16px; letter-spacing:.02em;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    position:sticky; top:0; z-index:10;
  }
  .topbar select{
    padding:8px 12px; border-radius:8px; border:none; font-size:13px; font-weight:700;
  }
  .wrap{ max-width:760px; margin:0 auto; padding:20px; }
  .keygate{ max-width:320px; margin:80px auto; text-align:center; }
  .keygate input{
    width:100%; padding:13px 14px; border:1.4px solid var(--line-strong); border-radius:11px;
    font-size:15px; margin-bottom:10px; box-sizing:border-box; background:var(--card); color:var(--ink);
  }
  .btn{
    appearance:none; border:none; cursor:pointer; font-family:inherit; font-weight:700;
    border-radius:10px; padding:12px 18px; font-size:14px;
  }
  .btn-primary{ background:var(--navy); color:#F5F1E7; }
  .btn-primary:hover{ background:var(--navy-2); }
  .btn-ghost{ background:transparent; border:1.4px solid var(--line-strong); color:var(--ink); }
  .err{ color:var(--wrong); font-size:12.5px; margin-bottom:10px; }
  #status{ color:var(--ink-soft); font-size:13px; margin-bottom:14px; }

  .q-card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; margin-bottom:12px;
  }
  .q-meta{ font-size:11.5px; color:var(--ink-soft); margin-bottom:6px; }
  .q-text{ font-size:14px; line-height:1.6; margin-bottom:8px; word-break:keep-all; }
  .q-actions{ display:flex; gap:8px; }
  .mini-btn{
    appearance:none; cursor:pointer; border-radius:8px; font-size:12px; font-weight:700;
    padding:7px 12px; border:1.4px solid var(--line-strong); background:var(--card); color:var(--ink);
  }
  .mini-btn.danger{ color:var(--wrong); border-color:var(--wrong); }

  .fab{
    position:fixed; right:20px; bottom:20px; z-index:20;
    background:var(--navy); color:#fff; border:none; border-radius:999px;
    width:56px; height:56px; font-size:26px; cursor:pointer; box-shadow:0 6px 20px -4px rgba(0,0,0,.4);
  }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,18,12,.6); z-index:50;
    display:flex; align-items:flex-start; justify-content:center; padding:20px; overflow-y:auto;
  }
  .modal{
    background:var(--card); border-radius:16px; padding:20px; max-width:520px; width:100%; margin:20px 0;
  }
  .modal h3{ margin:0 0 16px; font-size:16px; color:var(--navy); }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:4px; }
  .field input, .field textarea, .field select{
    width:100%; padding:10px 12px; border:1.4px solid var(--line-strong); border-radius:8px;
    font-size:13.5px; font-family:inherit; background:var(--paper); color:var(--ink); box-sizing:border-box;
  }
  .field textarea{ resize:vertical; min-height:60px; }
  .opt-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .opt-row input[type=radio]{ flex-shrink:0; width:18px; height:18px; }
  .opt-row input[type=text]{ flex:1; }
  .modal-actions{ display:flex; gap:8px; margin-top:16px; }
  .modal-actions .btn{ flex:1; }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
  // ====== ⚠️ 이 파일은 절대 GitHub Pages 등 공개 저장소에 올리지 마세요 ======
  // 아래 ADMIN_KEY가 그대로 텍스트로 들어있어서, 공개되면 누구나 소스보기로 이 키를 알아내
  // 화면을 거치지 않고 Worker의 /admin/chapter를 직접 호출해 전체 문제를 읽거나 덮어쓸 수 있습니다.
  // 이 파일은 다운로드해서 내 컴퓨터에만 저장해두고 로컬 파일로 열어서 사용하세요.

  // ====== 설정 ======
  // Cloudflare Worker 배포 후 나온 주소로 교체하세요. index.html의 CF_API_BASE와 동일한 값입니다.
  const API_BASE = "https://quiz-api.puhahal.workers.dev";
  const ADMIN_KEY = "460215park"; // worker.js의 ADMIN_KEY와 반드시 동일해야 함

  const CHAPTER_KEYS = [
    "1-1_공공조달개요", "1-2_원칙및방법", "1-3_전자조달시스템", "1-4_전략적공공조달",
    "1-5_공공조달법률이해", "1-6_공정조달관리", "2-1_공공조달계획", "2-2_조달요구응대및제안",
    "2-3_입찰제안평가및계약체결", "3-1_계약관리일반절차", "3-2_물품계약관리",
    "3-3_용역다수공급자계약관리", "3-4_공사계약관리"
  ];

  const root = document.getElementById('app');
  let currentChapter = null;
  let currentItems = []; // 지금 화면에 로드된 챕터의 전체 문제 배열 (편집은 전부 이 배열 위에서 이루어짐)

  function escapeHtml(s){
    return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function apiEnabled(){
    return !!API_BASE && API_BASE.indexOf('여기에') !== 0;
  }

  async function apiGet(path){
    const res = await fetch(`${API_BASE}${path}${path.includes('?')?'&':'?'}adminKey=${encodeURIComponent(ADMIN_KEY)}`);
    if(!res.ok) throw new Error('요청 실패: ' + res.status);
    return res.json();
  }
  async function apiSaveChapter(chapter, items){
    const res = await fetch(`${API_BASE}/admin/chapter?chapter=${encodeURIComponent(chapter)}&adminKey=${encodeURIComponent(ADMIN_KEY)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(items),
    });
    if(!res.ok) throw new Error('저장 실패: ' + res.status);
    return res.json();
  }

  // ---------- 화면 ----------
  function renderKeyGate(errorMsg){
    root.innerHTML = `
      <div class="topbar">📝 문제 관리</div>
      <div class="keygate">
        <p style="color:var(--ink-soft);font-size:13.5px;margin-bottom:16px;">관리자 키를 입력하세요</p>
        <input id="keyInput" type="password" placeholder="관리자 키">
        ${errorMsg? `<div class="err">${escapeHtml(errorMsg)}</div>` : ''}
        <button class="btn btn-primary" id="keySubmit" style="width:100%;">확인</button>
      </div>
    `;
    const submit = ()=>{
      const val = document.getElementById('keyInput').value.trim();
      if(val === ADMIN_KEY){
        sessionStorage.setItem('qadmin-key-ok', '1');
        renderChapterPicker();
      } else {
        renderKeyGate('키가 올바르지 않습니다.');
      }
    };
    document.getElementById('keySubmit').onclick = submit;
    document.getElementById('keyInput').addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
    document.getElementById('keyInput').focus();
  }

  let validChapterKeys = []; // /admin/chapters로 받아온 실제 챕터 키 목록(Temp 포함) - 일괄 업로드 시 시트명 매칭용

  async function renderChapterPicker(){
    if(!apiEnabled()){
      root.innerHTML = `
        <div class="topbar">📝 문제 관리</div>
        <div class="wrap"><div class="err">API_BASE가 아직 설정되지 않았습니다. Worker 배포 후 주소를 코드 상단에 넣어주세요.</div></div>
      `;
      return;
    }
    root.innerHTML = `
      <div class="topbar">📝 문제 관리</div>
      <div class="wrap">
        <div class="field">
          <label>챕터 선택</label>
          <select id="chapterSelect">
            <option value="">불러오는 중...</option>
          </select>
        </div>
        <button class="btn btn-ghost" id="bulkUploadBtn" style="width:100%;margin-bottom:16px;">📦 엑셀 일괄 업로드 (여러 챕터 시트 한 번에)</button>
        <input type="file" id="bulkFileInput" accept=".xlsx,.xls" style="display:none;">
        <div id="status"></div>
      </div>
    `;
    document.getElementById('bulkUploadBtn').onclick = ()=> document.getElementById('bulkFileInput').click();
    document.getElementById('bulkFileInput').onchange = handleBulkExcelUpload;
    try{
      const chapters = await apiGet('/admin/chapters');
      validChapterKeys = chapters.map(c=>c.key);
      const sel = document.getElementById('chapterSelect');
      sel.innerHTML = chapters.map(c => `<option value="${escapeHtml(c.key)}">${escapeHtml(c.key)} (${c.count}문제)</option>`).join('');
      sel.onchange = ()=> loadChapter(sel.value);
      if(chapters.length) loadChapter(chapters[0].key);
    }catch(e){
      document.getElementById('status').innerHTML = `<div class="err">챕터 목록을 못 불러왔습니다: ${escapeHtml(e.message)}</div>`;
    }
  }

  async function loadChapter(chapter){
    currentChapter = chapter;
    const statusEl = document.getElementById('status');
    statusEl.innerHTML = '불러오는 중...';
    try{
      currentItems = await apiGet(`/admin/chapter?chapter=${encodeURIComponent(chapter)}`);
      renderQuestionList();
    }catch(e){
      statusEl.innerHTML = `<div class="err">문제를 못 불러왔습니다: ${escapeHtml(e.message)}</div>`;
    }
  }

  function renderQuestionList(){
    const statusEl = document.getElementById('status');
    statusEl.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px; flex-wrap:wrap;">
        <span>${currentItems.length}문제</span>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-ghost" id="excelUploadBtn">📄 엑셀 업로드</button>
          <button class="btn btn-ghost" id="saveAllBtn">💾 전체 저장</button>
        </div>
      </div>
      <input type="file" id="excelFileInput" accept=".xlsx,.xls" style="display:none;">
      <div id="questionList"></div>
    `;
    document.getElementById('saveAllBtn').onclick = saveCurrentChapter;
    document.getElementById('excelUploadBtn').onclick = ()=> document.getElementById('excelFileInput').click();
    document.getElementById('excelFileInput').onchange = handleExcelUpload;
    const listEl = document.getElementById('questionList');
    listEl.innerHTML = currentItems.map((q, i) => `
      <div class="q-card">
        <div class="q-meta">#${i+1} · ${escapeHtml(q.category1||'')} > ${escapeHtml(q.category2||'')}${q.rev? ` · 개정:${escapeHtml(q.rev)}` : ''}</div>
        <div class="q-text">${escapeHtml((q.question||'').slice(0,90))}${(q.question||'').length>90?'...':''}</div>
        <div class="q-actions">
          <button class="mini-btn edit-btn" data-i="${i}">수정</button>
          <button class="mini-btn danger delete-btn" data-i="${i}">삭제</button>
        </div>
      </div>
    `).join('');
    listEl.querySelectorAll('.edit-btn').forEach(btn=>{
      btn.onclick = ()=> openEditModal(Number(btn.dataset.i));
    });
    listEl.querySelectorAll('.delete-btn').forEach(btn=>{
      btn.onclick = ()=>{
        const i = Number(btn.dataset.i);
        if(!confirm(`#${i+1} 문제를 삭제할까요? (저장 버튼을 눌러야 실제 반영됩니다)`)) return;
        currentItems.splice(i, 1);
        renderQuestionList();
      };
    });

    // 상단바에 챕터 선택 + 새 문제 추가 fab 버튼도 다시 붙여둔다.
    ensureTopControls();
  }

  function ensureTopControls(){
    if(!document.getElementById('addFab')){
      const fab = document.createElement('button');
      fab.className = 'fab';
      fab.id = 'addFab';
      fab.textContent = '+';
      fab.title = '새 문제 추가';
      fab.onclick = ()=> openEditModal(null);
      document.body.appendChild(fab);
    }
    if(!document.getElementById('backBtn')){
      const topbar = document.querySelector('.topbar');
      const backBtn = document.createElement('button');
      backBtn.id = 'backBtn';
      backBtn.className = 'mini-btn';
      backBtn.style.cssText = 'background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;';
      backBtn.textContent = '챕터 목록';
      backBtn.onclick = ()=>{ document.getElementById('addFab')?.remove(); backBtn.remove(); renderChapterPicker(); };
      topbar.appendChild(backBtn);
    }
  }

  // index가 null이면 "새 문제 추가", 숫자면 그 인덱스 "수정"
  function openEditModal(index){
    const isNew = index === null;
    const q = isNew ? { category1:'', category2:'', question:'', options:['','','',''], answer:1, explanation:'', source:'', rev:'' } : currentItems[index];
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal">
        <h3>${isNew? '새 문제 추가' : `#${index+1} 문제 수정`}</h3>
        <div class="field"><label>세부항목 (category1)</label><input id="f_c1" value="${escapeHtml(q.category1)}"></div>
        <div class="field"><label>세세항목 (category2)</label><input id="f_c2" value="${escapeHtml(q.category2)}"></div>
        <div class="field"><label>문제 지문</label><textarea id="f_q">${escapeHtml(q.question)}</textarea></div>
        <div class="field">
          <label>보기 (왼쪽 라디오 = 정답)</label>
          ${[0,1,2,3].map(i=>`
            <div class="opt-row">
              <input type="radio" name="f_answer" value="${i+1}" ${q.answer===i+1?'checked':''}>
              <input type="text" id="f_opt${i}" value="${escapeHtml(q.options[i]||'')}" placeholder="보기 ${i+1}">
            </div>
          `).join('')}
        </div>
        <div class="field"><label>해설</label><textarea id="f_exp">${escapeHtml(q.explanation)}</textarea></div>
        <div class="field"><label>출처 (선택)</label><input id="f_src" value="${escapeHtml(q.source||'')}"></div>
        <div class="field"><label>개정일자 (선택, 예: 260827 - 채우면 이미 푼 사용자는 다시 풀어야 함)</label><input id="f_rev" value="${escapeHtml(q.rev||'')}"></div>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="cancelBtn">취소</button>
          <button class="btn btn-primary" id="okBtn">${isNew? '추가' : '수정 완료'}</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
    document.getElementById('cancelBtn').onclick = ()=> overlay.remove();
    document.getElementById('okBtn').onclick = ()=>{
      const newQ = {
        category1: document.getElementById('f_c1').value.trim(),
        category2: document.getElementById('f_c2').value.trim(),
        question: document.getElementById('f_q').value.trim(),
        options: [0,1,2,3].map(i => document.getElementById(`f_opt${i}`).value.trim()),
        answer: Number((overlay.querySelector('input[name=f_answer]:checked')||{}).value) || 1,
        explanation: document.getElementById('f_exp').value.trim(),
        source: document.getElementById('f_src').value.trim() || null,
        rev: document.getElementById('f_rev').value.trim() || null,
      };
      if(!newQ.question){ alert('문제 지문을 입력해주세요.'); return; }
      if(newQ.options.some(o=>!o)){ alert('보기 4개를 모두 입력해주세요.'); return; }
      if(isNew) currentItems.push(newQ);
      else currentItems[index] = newQ;
      overlay.remove();
      renderQuestionList();
    };
  }

  // 챕터 선택 화면에서 바로 엑셀 파일 하나를 올리면, 파일 안의 시트 이름들 중 실제 챕터 키와
  // 일치하는 것만 찾아서 한꺼번에 파싱하고, 각 챕터에 바로 Worker로 저장한다(검토 단계 없이 즉시 반영).
  async function handleBulkExcelUpload(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async (ev)=>{
      const statusEl = document.getElementById('status');
      try{
        const wb = XLSX.read(ev.target.result, { type: 'array' });
        // 파일 안 시트 이름 중, 실제 존재하는 챕터 키와 일치하는 것만 골라서 파싱한다.
        const matched = [];
        wb.SheetNames.forEach(sheetName=>{
          if(!validChapterKeys.includes(sheetName)) return; // 표지/목차 등 무관한 시트는 자동으로 건너뜀
          const items = parseSheetToItems(wb.Sheets[sheetName]);
          if(items.length) matched.push({ chapter: sheetName, items });
        });

        if(!matched.length){
          alert('파일 안에서 일치하는 챕터 시트를 찾지 못했습니다.\n시트 이름이 챕터 키(예: "1-1_공공조달개요")와 정확히 같아야 합니다.');
          return;
        }

        const summary = matched.map(m => `· ${m.chapter}: ${m.items.length}문제`).join('\n');
        const mode = confirm(
          `${matched.length}개 챕터에서 데이터를 찾았습니다:\n\n${summary}\n\n` +
          `[확인] = 각 챕터마다 기존 문제 뒤에 이어붙이기\n` +
          `[취소] = 각 챕터마다 기존 문제를 전부 지우고 이걸로 교체하기`
        );
        if(!mode && !confirm(`정말로 위 ${matched.length}개 챕터의 기존 문제를 전부 지우고 교체할까요?`)) return;

        statusEl.innerHTML = `<div>0 / ${matched.length}개 챕터 처리 중...</div>`;
        let done = 0, failed = [];
        for(const m of matched){
          try{
            let finalItems = m.items;
            if(mode){ // 이어붙이기 - 기존 데이터를 먼저 받아와야 함
              const existing = await apiGet(`/admin/chapter?chapter=${encodeURIComponent(m.chapter)}`);
              finalItems = (existing || []).concat(m.items);
            }
            await apiSaveChapter(m.chapter, finalItems);
            done++;
          }catch(err){
            failed.push(`${m.chapter}: ${err.message}`);
          }
          statusEl.innerHTML = `<div>${done + failed.length} / ${matched.length}개 챕터 처리 중...</div>`;
        }

        alert(
          `일괄 업로드 완료.\n\n성공: ${done}개\n실패: ${failed.length}개` +
          (failed.length ? `\n\n실패 목록:\n${failed.join('\n')}` : '')
        );
        renderChapterPicker(); // 최신 개수 반영해서 목록 다시 그리기
      }catch(err){
        alert('엑셀 파일을 읽는 중 오류가 발생했습니다: ' + err.message);
      }finally{
        e.target.value = '';
      }
    };
    reader.readAsArrayBuffer(file);
  }

  async function saveCurrentChapter(){
    const btn = document.getElementById('saveAllBtn');
    const original = btn.textContent;
    btn.textContent = '저장 중...'; btn.disabled = true;
    try{
      await apiSaveChapter(currentChapter, currentItems);
      btn.textContent = '✓ 저장됨';
      setTimeout(()=>{ btn.textContent = original; btn.disabled = false; }, 1500);
    }catch(e){
      alert('저장 실패: ' + e.message);
      btn.textContent = original; btn.disabled = false;
    }
  }

  // 시트 하나(worksheet)를 문제 배열로 파싱한다. 열 구조(A~L, 헤더는 보통 3행):
  // 번호, 세부항목, 세세항목, 문제 내용, 보기①~④, 정답 번호, 해설, 출처, 구분(개정일자)
  // 헤더행을 못 찾거나 문제가 하나도 없으면 빈 배열을 반환한다(에러를 던지지 않음 - 일괄 업로드에서 시트별로 조용히 건너뛰기 위함).
  function parseSheetToItems(ws){
    const rows = XLSX.utils.sheet_to_json(ws, { header:1, raw:false, defval:'' });
    let headerRow = -1;
    for(let r=0; r<Math.min(rows.length, 6); r++){
      if((rows[r][0]||'').toString().trim() === '번호'){ headerRow = r; break; }
    }
    if(headerRow === -1) return [];
    const parsed = [];
    for(let r=headerRow+1; r<rows.length; r++){
      const row = rows[r];
      const question = (row[3]||'').toString().trim();
      if(!question) continue;
      parsed.push({
        category1: (row[1]||'').toString().trim(),
        category2: (row[2]||'').toString().trim(),
        question,
        options: [row[4], row[5], row[6], row[7]].map(o=>(o||'').toString().trim()),
        answer: Number(row[8]) || 1,
        explanation: (row[9]||'').toString().trim(),
        source: (row[10]||'').toString().trim() || null,
        rev: (row[11]||'').toString().trim() || null,
      });
    }
    return parsed;
  }

  // 엑셀 파일(.xlsx)을 업로드하면, 기존 앱과 동일한 열 구조로 해석해서 문제 목록에 반영한다.
  // 실제 저장(Worker 반영)은 이 단계에서 안 하고, "전체 저장" 버튼을 눌러야 확정되므로 업로드 후 검토/수정 가능하다.
  function handleExcelUpload(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const wb = XLSX.read(ev.target.result, { type: 'array' });
        // 시트 이름이 지금 선택된 챕터와 같으면 그 시트를, 아니면 첫 번째 시트를 사용한다.
        const sheetName = wb.SheetNames.includes(currentChapter) ? currentChapter : wb.SheetNames[0];
        const parsed = parseSheetToItems(wb.Sheets[sheetName]);

        if(!parsed.length){ alert('파싱된 문제가 없습니다. 시트 내용을 확인해주세요.'); return; }

        const mode = confirm(
          `${parsed.length}문제를 찾았습니다.\n\n` +
          `[확인] = 기존 ${currentItems.length}문제 뒤에 이어붙이기\n` +
          `[취소] = 기존 문제를 전부 지우고 이걸로 교체하기`
        );
        if(mode){
          currentItems = currentItems.concat(parsed);
        } else {
          if(!confirm('정말로 기존 문제를 전부 지우고 교체할까요?')) return;
          currentItems = parsed;
        }
        renderQuestionList();
        alert(`${parsed.length}문제가 반영됐습니다. 확인 후 "💾 전체 저장"을 눌러 확정해주세요.`);
      }catch(err){
        alert('엑셀 파일을 읽는 중 오류가 발생했습니다: ' + err.message);
      }finally{
        e.target.value = ''; // 같은 파일을 다시 선택해도 change 이벤트가 발생하도록 초기화
      }
    };
    reader.readAsArrayBuffer(file);
  }

  if(sessionStorage.getItem('qadmin-key-ok') === '1'){
    renderChapterPicker();
  } else {
    renderKeyGate();
  }
</script>
