<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 - 공공조달관리사 퀴즈</title>
<style>
  :root{
    --paper:#F5F1E7; --card:#FFFDF7; --ink:#2A2620; --ink-soft:#453F2E;
    --navy:#1B2A47; --navy-2:#2C3E63; --seal:#AE342A; --seal-tint:#F6E4E1;
    --wrong:#AE342A; --line:#E4DCC9; --line-strong:#D8CDB0;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Noto Sans KR', -apple-system, sans-serif; min-height:100vh;
  }
  .topbar{
    background:var(--navy); color:#F5F1E7; padding:16px 20px;
    font-weight:800; font-size:16px; letter-spacing:.02em;
  }
  .wrap{ max-width:640px; margin:0 auto; padding:20px; }
  .keygate{ max-width:320px; margin:80px auto; text-align:center; }
  .keygate input{
    width:100%; padding:13px 14px; border:1.4px solid var(--line-strong); border-radius:11px;
    font-size:15px; margin-bottom:10px; box-sizing:border-box; background:var(--card); color:var(--ink);
  }
  .btn{
    appearance:none; border:none; cursor:pointer; font-family:inherit; font-weight:700;
    border-radius:10px; padding:13px 18px; font-size:14px;
  }
  .btn-primary{ background:var(--navy); color:#F5F1E7; width:100%; }
  .btn-primary:hover{ background:var(--navy-2); }
  .row{ display:flex; gap:8px; margin-bottom:20px; }
  .row input{
    flex:1; padding:11px 14px; border:1.4px solid var(--line-strong); border-radius:9px;
    font-size:14px; background:var(--card); color:var(--ink);
  }
  .row button{ flex-shrink:0; }
  .list-item{
    display:flex; align-items:center; gap:8px; padding:12px 0; border-bottom:1px solid var(--line);
  }
  .list-item .info{ flex:1; min-width:0; }
  .list-item .name{ font-weight:700; color:var(--navy); font-size:13.5px; }
  .list-item .meta{ font-family:'Noto Serif KR',serif; font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .mini-btn{
    appearance:none; cursor:pointer; border-radius:8px; font-size:12px; font-weight:700;
    padding:8px 12px; border:1.4px solid var(--line-strong); background:var(--card); color:var(--ink);
    flex-shrink:0;
  }
  .mini-btn.danger{ color:var(--wrong); border-color:var(--wrong); }
  #status{ color:var(--ink-soft); font-size:13px; }
  .err{ color:var(--wrong); font-size:12.5px; margin-bottom:10px; }
  .tabs{ display:flex; gap:8px; margin-bottom:18px; }
  .tab-btn{
    flex:1; appearance:none; cursor:pointer; border-radius:9px; font-weight:700; font-size:13.5px;
    padding:11px; border:1.4px solid var(--line-strong); background:var(--card); color:var(--ink-soft);
  }
  .tab-btn.active{ background:var(--navy); color:#fff; border-color:var(--navy); }
  .report-item{ border:1px solid var(--line-strong); border-radius:11px; padding:12px; margin-bottom:10px; }
  .report-item.resolved{ opacity:.5; }
  .report-item .chapter{ font-size:11px; color:var(--ink-soft); margin-bottom:4px; }
  .report-item .qtext{ font-size:12.5px; color:var(--ink); line-height:1.6; margin-bottom:6px; word-break:keep-all; }
  .report-item .content{ font-size:12.5px; color:var(--seal); background:var(--seal-tint); border-radius:7px; padding:8px 10px; margin-bottom:8px; line-height:1.6; word-break:keep-all; }
  .report-item .footer{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .report-item .code{ font-family:'Noto Serif KR',serif; font-size:11px; color:var(--ink-soft); }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
  // index.html과 동일한 Firebase 프로젝트를 가리킨다.
  const firebaseConfig = {
    apiKey: "AIzaSyD4kazCr7UAkM9xX7rAkvNHtJVhHHY1weY",
    authDomain: "quiz8282-79d39.firebaseapp.com",
    projectId: "quiz8282-79d39",
    storageBucket: "quiz8282-79d39.firebasestorage.app",
    messagingSenderId: "528916742960",
    appId: "1:528916742960:web:408d5888bfc5512f9efef5"
  };
  const app = firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore(app);

  const ADMIN_KEY = '460215park';
  const root = document.getElementById('app');

  function escapeHtml(s){
    return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function generateSyncCode(){
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    const part = ()=> Array.from({length:4}, ()=> chars[Math.floor(Math.random()*chars.length)]).join('');
    return part() + '-' + part();
  }

  function totalAnsweredOf(data){
    return Object.values(data.progress||{}).reduce((sum,ch)=> sum + Object.keys(ch).length, 0);
  }

  async function createCode(name){
    const code = generateSyncCode();
    await db.collection('syncCodes').doc(code).set({
      name: name || '',
      progress: {}, reviewCounts: {}, excluded: {}, wrongMastery: { pool:{}, streak:{} },
      updatedAt: Date.now(), createdByAdmin: true
    });
    return code;
  }

  async function listCodes(){
    const snap = await db.collection('syncCodes').get();
    const list = [];
    snap.forEach(doc=>{
      const d = doc.data();
      list.push({ code: doc.id, name: d.name || '', total: totalAnsweredOf(d), updatedAt: d.updatedAt || 0 });
    });
    list.sort((a,b)=> (b.updatedAt||0) - (a.updatedAt||0));
    return list;
  }

  async function renameCode(code, newName){
    await db.collection('syncCodes').doc(code).set({ name: newName }, { merge: true });
  }

  async function deleteCode(code){
    await db.collection('syncCodes').doc(code).delete();
  }

  async function listReports(){
    const snap = await db.collection('reports').get();
    const list = [];
    snap.forEach(doc=> list.push({ id: doc.id, ...doc.data() }));
    list.sort((a,b)=> (b.createdAt||0) - (a.createdAt||0));
    return list;
  }

  async function toggleReportStatus(reportId, newStatus){
    await db.collection('reports').doc(reportId).set({ status: newStatus }, { merge: true });
  }

  async function deleteReport(reportId){
    await db.collection('reports').doc(reportId).delete();
  }

  // ---------- 렌더링 ----------
  function renderKeyGate(errorMsg){
    root.innerHTML = `
      <div class="topbar">🔐 관리자</div>
      <div class="keygate">
        <p style="color:var(--ink-soft);font-size:13.5px;margin-bottom:16px;">관리자 키를 입력하세요</p>
        <input id="keyInput" type="password" placeholder="관리자 키">
        ${errorMsg? `<div class="err">${escapeHtml(errorMsg)}</div>` : ''}
        <button class="btn btn-primary" id="keySubmit">확인</button>
      </div>
    `;
    const submit = ()=>{
      const val = document.getElementById('keyInput').value.trim();
      if(val === ADMIN_KEY){
        sessionStorage.setItem('admin-key-ok', '1');
        renderPanel();
      } else {
        renderKeyGate('키가 올바르지 않습니다.');
      }
    };
    document.getElementById('keySubmit').onclick = submit;
    document.getElementById('keyInput').addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
    document.getElementById('keyInput').focus();
  }

  function renderPanel(tab){
    tab = tab || 'codes';
    root.innerHTML = `
      <div class="topbar">🔐 관리자</div>
      <div class="wrap">
        <div class="tabs">
          <button class="tab-btn ${tab==='codes'?'active':''}" id="tabCodes">동기화 코드</button>
          <button class="tab-btn ${tab==='reports'?'active':''}" id="tabReports">오류 신고</button>
        </div>
        <div id="panelBody"></div>
      </div>
    `;
    document.getElementById('tabCodes').onclick = ()=> renderPanel('codes');
    document.getElementById('tabReports').onclick = ()=> renderPanel('reports');
    if(tab === 'codes') renderCodesTab();
    else renderReportsTab();
  }

  function renderCodesTab(){
    const body = document.getElementById('panelBody');
    body.innerHTML = `
      <div class="row">
        <input id="nameInput" placeholder="이름 입력 (예: 홍길동)">
        <button class="btn btn-primary" id="createBtn" style="width:auto;">+ 코드 생성</button>
      </div>
      <div id="status">불러오는 중...</div>
    `;
    document.getElementById('createBtn').onclick = async ()=>{
      const nameInput = document.getElementById('nameInput');
      const name = nameInput.value.trim();
      if(!name){ alert('이름을 입력해주세요.'); return; }
      const code = await createCode(name);
      alert(`발급 완료!\n\n이름: ${name}\n코드: ${code}`);
      nameInput.value = '';
      renderList();
    };
    renderList();
  }

  function renderReportsTab(){
    const body = document.getElementById('panelBody');
    body.innerHTML = `<div id="reportStatus" style="color:var(--ink-soft);font-size:13px;">불러오는 중...</div>`;
    renderReportList();
  }

  async function renderReportList(){
    const el = document.getElementById('reportStatus');
    if(!el) return;
    try{
      const reports = await listReports();
      if(!reports.length){ el.innerHTML = '아직 접수된 신고가 없습니다.'; return; }
      el.innerHTML = reports.map(r => `
        <div class="report-item ${r.status==='resolved'?'resolved':''}">
          <div class="chapter">${escapeHtml(r.chapterKey)} · 문제 #${r.questionIndex}</div>
          <div class="qtext">${escapeHtml((r.questionText||'').slice(0,80))}${(r.questionText||'').length>80?'...':''}</div>
          <div class="content">${escapeHtml(r.content)}</div>
          <div class="footer">
            <span class="code">${escapeHtml(r.syncCode||'')} · ${new Date(r.createdAt||0).toLocaleString('ko-KR')}</span>
            <div style="display:flex;gap:6px;">
              <button class="mini-btn toggle-status-btn" data-id="${escapeHtml(r.id)}" data-status="${r.status}">
                ${r.status==='resolved' ? '↺ 처리취소' : '✓ 처리완료'}
              </button>
              <button class="mini-btn danger delete-report-btn" data-id="${escapeHtml(r.id)}" ${r.status==='resolved' ? '' : 'disabled style="opacity:.35;cursor:not-allowed;"'}>삭제</button>
            </div>
          </div>
        </div>
      `).join('');
      document.querySelectorAll('.toggle-status-btn').forEach(btn=>{
        btn.onclick = async ()=>{
          const newStatus = btn.dataset.status === 'resolved' ? 'open' : 'resolved';
          await toggleReportStatus(btn.dataset.id, newStatus);
          renderReportList();
        };
      });
      document.querySelectorAll('.delete-report-btn').forEach(btn=>{
        if(btn.disabled) return; // 처리완료 전에는 삭제 자체를 막아둠(실수 방지)
        btn.onclick = async ()=>{
          if(!confirm('이 신고 내역을 완전히 삭제할까요?\n(신고자 개인 목록에는 계속 남아있을 수 있습니다)')) return;
          await deleteReport(btn.dataset.id);
          renderReportList();
        };
      });
    }catch(e){
      el.innerHTML = '목록을 불러오지 못했습니다. (Firestore 규칙 또는 네트워크 확인 필요)';
    }
  }

  async function renderList(){
    const statusEl = document.getElementById('status');
    if(!statusEl) return;
    try{
      const codes = await listCodes();
      if(!codes.length){ statusEl.innerHTML = '아직 발급된 코드가 없습니다.'; return; }
      statusEl.innerHTML = codes.map(c => `
        <div class="list-item">
          <div class="info">
            <div class="name">${escapeHtml(c.name || '(이름 없음)')}</div>
            <div class="meta">${escapeHtml(c.code)} · ${c.total}문제</div>
            <div class="meta" style="margin-top:1px;">${c.updatedAt? '마지막 동기화: ' + new Date(c.updatedAt).toLocaleString('ko-KR') : '동기화 기록 없음'}</div>
          </div>
          <button class="mini-btn copy-btn" data-code="${escapeHtml(c.code)}">복사</button>
          <button class="mini-btn rename-btn" data-code="${escapeHtml(c.code)}" data-name="${escapeHtml(c.name)}">이름변경</button>
          <button class="mini-btn danger delete-btn" data-code="${escapeHtml(c.code)}" data-name="${escapeHtml(c.name)}">삭제</button>
        </div>
      `).join('');
      document.querySelectorAll('.copy-btn').forEach(btn=>{
        btn.onclick = ()=>{
          navigator.clipboard.writeText(btn.dataset.code);
          const original = btn.textContent;
          btn.textContent = '✓ 복사됨';
          setTimeout(()=>{ btn.textContent = original; }, 1500);
        };
      });
      document.querySelectorAll('.rename-btn').forEach(btn=>{
        btn.onclick = async ()=>{
          const newName = prompt('새 이름을 입력하세요', btn.dataset.name || '');
          if(newName === null) return;
          await renameCode(btn.dataset.code, newName.trim());
          renderList();
        };
      });
      document.querySelectorAll('.delete-btn').forEach(btn=>{
        btn.onclick = ()=> openDeleteCodeModal(btn.dataset.code, btn.dataset.name);
      });
    }catch(e){
      statusEl.innerHTML = '목록을 불러오지 못했습니다. (Firestore 규칙 또는 네트워크 확인 필요)';
    }
  }

  // 동기화 코드 삭제 확인 모달 - 이름/코드를 보여주고, 코드를 정확히 다시 입력해야 삭제 버튼이 눌린다(실수 방지).
  function openDeleteCodeModal(code, name){
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(20,18,12,.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;';
    overlay.innerHTML = `
      <div style="background:var(--card);border-radius:16px;padding:20px;max-width:340px;width:100%;">
        <div style="font-weight:800;font-size:15px;color:var(--wrong);margin-bottom:10px;">⚠️ 코드 삭제</div>
        <div style="font-size:13px;color:var(--ink-soft);line-height:1.7;margin-bottom:14px;">
          이름: <b style="color:var(--ink);">${escapeHtml(name || '(이름 없음)')}</b><br>
          코드: <b style="color:var(--ink);font-family:'Noto Serif KR',serif;">${escapeHtml(code)}</b>
          <br><br>삭제하려면 아래에 <b>코드를 정확히</b> 입력하세요.
        </div>
        <input id="deleteConfirmInput" placeholder="${escapeHtml(code)}"
          style="width:100%;padding:11px 13px;border:1.4px solid var(--line-strong);border-radius:9px;font-size:14px;margin-bottom:14px;box-sizing:border-box;background:var(--paper);color:var(--ink);letter-spacing:.03em;">
        <div style="display:flex;gap:8px;">
          <button id="deleteCancelBtn" class="mini-btn" style="flex:1;padding:11px;">취소</button>
          <button id="deleteConfirmBtn" class="mini-btn danger" style="flex:1;padding:11px;opacity:.4;" disabled>삭제</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const close = ()=> overlay.remove();
    overlay.addEventListener('click', e=>{ if(e.target === overlay) close(); });
    document.getElementById('deleteCancelBtn').onclick = close;
    const input = document.getElementById('deleteConfirmInput');
    const confirmBtn = document.getElementById('deleteConfirmBtn');
    input.addEventListener('input', ()=>{
      const match = input.value.trim().toUpperCase() === code.toUpperCase();
      confirmBtn.disabled = !match;
      confirmBtn.style.opacity = match ? '1' : '.4';
    });
    confirmBtn.onclick = async ()=>{
      if(confirmBtn.disabled) return;
      await deleteCode(code);
      close();
      renderList();
    };
    input.focus();
  }

  // 이 브라우저 탭에서 이미 키를 확인했으면(세션 동안) 다시 안 물어봄
  if(sessionStorage.getItem('admin-key-ok') === '1'){
    renderPanel();
  } else {
    renderKeyGate();
  }
</script>
</body>
</html>
